openapi: 3.1.0
info:
  title: Messenger API
  version: 1.0.0
  description: |
    Контракт REST первой версии. Из него генерируется клиент на TypeScript,
    поэтому расхождение фронта и бэкенда становится ошибкой сборки,
    а не находкой в проде.

    Проверка обратной совместимости (CTR-001) блокирует слияние: удалить поле
    или сузить тип нельзя, добавить необязательное - можно.

servers:
  - url: https://app.finops.local/api/v1
    description: Локальное окружение

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: conversations
  - name: messages
  - name: attachments
  - name: sessions
  - name: telemetry
  - name: push
  - name: calls

paths:
  /auth/callback:
    post:
      tags: [auth]
      summary: Обмен кода авторизации на токены
      description: |
        Обмен делает сервер, а не браузер. Токен обновления уходит в cookie
        `HttpOnly`, то есть недоступен скрипту на странице: межсайтовый
        скрипт остаётся опасным, пока вкладка открыта, но не может унести
        удостоверение наружу (ADR 0005).

        Точка не аутентифицирована и потому ограничена по частоте: она
        становится целью перебора.
      operationId: exchangeAuthorizationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationCode' }
      responses:
        '200':
          description: Вход выполнен, токен обновления установлен в cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Новый токен доступа по cookie
      description: |
        Токен доступа живёт в памяти вкладки и исчезает при перезагрузке,
        поэтому клиент при старте обменивает cookie на новый. Несколько
        вкладок обменивают каждая свой, и одновременные запросы - норма,
        а не признак подбора.
      operationId: refreshAccessToken
      security: []
      responses:
        '200':
          description: Выдан новый токен доступа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Отправить письмо о подтверждении ещё раз
      description: |
        Под лимитом. Точка, рассылающая письмо по указанному адресу без
        ограничения, — готовый инструмент травли: адрес указывает
        регистрирующийся, а письма приходят владельцу адреса.
      operationId: resendVerificationEmail
      responses:
        '202': { description: Письмо отправлено }
        '409':
          description: Адрес уже подтверждён
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Слишком часто
          headers:
            Retry-After:
              schema: { type: integer }
              description: Секунды до следующей попытки.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [auth]
      summary: Кто я и что мне доступно
      description: |
        Возможности отдаются списком, а не выводятся клиентом из
        `email_verified`: правило живёт на сервере, и продублированное
        в интерфейсе оно однажды разойдётся — человек увидит доступную
        кнопку, которая отвечает отказом.
      operationId: whoAmI
      responses:
        '200':
          description: Профиль и текущие возможности
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /push/vapid-public-key:
    get:
      tags: [push]
      summary: Открытый ключ VAPID для оформления подписки
      description: |
        Браузер оформляет подписку Web Push на **наш** сервер по этому ключу
        (`applicationServerKey`). Ключ не секрет, но отдаётся только вошедшему:
        потребитель один — клиент после входа. Закрытого ключа у API нет вовсе.
      operationId: getPushPublicKey
      responses:
        '200':
          description: Ключ в base64url (несжатая точка P-256)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PushPublicKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Уведомления выключены или не настроены (`push_unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /me/push-subscription:
    put:
      tags: [push]
      summary: Подписка Web Push этого устройства
      description: |
        Подписка идёт на **устройство** входа, а не на пользователя: у человека
        ноутбук может быть открыт, а телефон спать, и уведомление нужно только
        телефону. Повтор заменяет подписку (браузер сменил её — `NTF-007`).

        Адрес подписки — это то, куда **сервер** отправит запрос по просьбе
        клиента, поэтому принимаются только адреса известных служб push
        браузеров (FCM, Mozilla, Apple, Windows), по `https`, без учётных
        данных и нестандартных портов. Остальное — `400 invalid_subscription`.
      operationId: putPushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscription' }
      responses:
        '204': { description: Подписка принята }
        '400':
          description: Подписке нельзя верить (`invalid_subscription`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503':
          description: Уведомления выключены или не настроены (`push_unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
    delete:
      tags: [push]
      summary: Снять подписку этого устройства
      description: Повтор и «подписки не было» — тоже `204`.
      operationId: deletePushSubscription
      responses:
        '204': { description: Подписки на устройстве нет }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /calls:
    post:
      tags: [calls]
      summary: Начать звонок в беседе один-на-один
      description: |
        Звонящий — вошедший; вызываемого сервер находит по беседе. Звонок,
        закончившийся, не начавшись (`busy` — у собеседника уже идёт звонок,
        `unavailable` — собеседник не в сети), тоже `201`: он записан, итог
        в ленте, причина — в `end_reason`.

        **Встречный звонок** (собеседник уже звонит мне) не создаёт второго:
        принимается существующий, состояние — `accepted`.

        Блокировок и лимита частоты в этой версии нет (`CALL-017`): включать
        звонки для людей — после них.
      operationId: startCall
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartCall' }
      responses:
        '201':
          description: Звонок создан (или принят встречный)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Call' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Действие недоступно
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Беседа не найдена или вы не её участник
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: У вас уже идёт звонок (`already_in_call`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Звонки выключены (`calls_unavailable`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /calls/current:
    get:
      tags: [calls]
      summary: Мой живой звонок
      description: Нужен после перезагрузки вкладки и вкладке, открытой посреди звонка.
      operationId: getCurrentCall
      responses:
        '200':
          description: Звонок или `null`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentCall' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /calls/{call_id}/accept:
    post:
      tags: [calls]
      summary: Принять входящий звонок
      description: |
        Побеждает первый запрос; повтор **той же вкладки** — тот же ответ. Остальные
        вкладки вызываемого получают `call.state` с `reason: accepted_elsewhere`, а
        вкладка, нажавшая позже первой, — `409 call_taken`: иначе обе подняли бы медиа
        и обе ответили бы на `offer`.
      operationId: acceptCall
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptCall' }
      responses:
        '200': { $ref: '#/components/responses/CallState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }
        '409':
          description: Звонок завершён (`call_ended`) или принят другой вкладкой (`call_taken`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /calls/{call_id}/decline:
    post:
      tags: [calls]
      summary: Отклонить входящий звонок
      operationId: declineCall
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      responses:
        '200': { $ref: '#/components/responses/CallState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }
        '409': { $ref: '#/components/responses/CallEnded' }

  /calls/{call_id}/hangup:
    post:
      tags: [calls]
      summary: Повесить трубку (или отменить исходящий)
      description: Повтор безопасен — итог в ленте записывается один раз.
      operationId: hangupCall
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      responses:
        '200': { $ref: '#/components/responses/CallState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }

  /calls/{call_id}/fail:
    post:
      tags: [calls]
      summary: Соединение не состоялось или оборвалось насовсем
      description: |
        Итог `failed`, а не `completed`: «трубка» в активном звонке — это
        состоявшийся разговор, и обрыв сети записывался бы им. Допустимо, когда
        звонок принят; повтор безопасен.
      operationId: failCall
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      responses:
        '200': { $ref: '#/components/responses/CallState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }
        '409': { $ref: '#/components/responses/CallEnded' }

  /calls/{call_id}/connected:
    post:
      tags: [calls]
      summary: Медиа пошло
      description: |
        Звонок становится `active`. Путь соединения (`direct` или `relay`) идёт в
        метрику доли релея — на ней держится допущение о стоимости.
      operationId: reportCallConnected
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallConnected' }
      responses:
        '200': { $ref: '#/components/responses/CallState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }
        '409': { $ref: '#/components/responses/CallEnded' }

  /calls/{call_id}/keepalive:
    post:
      tags: [calls]
      summary: Звонок жив
      description: |
        Клиент шлёт раз в 30 с. Тишина дольше 90 с — звонок завершает сервер
        (`failed`). Ответ несёт состояние: так клиент узнаёт, что звонок уже
        завершён, даже если событие потерялось.
      operationId: keepAliveCall
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      responses:
        '200': { $ref: '#/components/responses/CallState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }

  /calls/{call_id}/signals:
    post:
      tags: [calls]
      summary: Сигнал собеседнику (offer, answer, кандидаты ICE)
      description: |
        Клиент **не публикует в Centrifugo сам**: сервер проверяет участие,
        ставит номер (`seq`) и передаёт собеседнику то, что **понял**, а не то, что
        прислали. Сигналы начинаются после принятия. Размер — до 16 КБ, кандидатов
        в пачке — до 40, частота — до 120 в минуту на звонок.
      operationId: sendCallSignal
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CallSignal' }
      responses:
        '204': { description: Сигнал передан }
        '400':
          description: Сигнал не принят (`invalid_signal`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }
        '409':
          description: Звонок завершён (`call_ended`) или ещё не принят (`call_not_ready`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Слишком часто
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /calls/{call_id}/ice-servers:
    get:
      tags: [calls]
      summary: Краткоживущий доступ к STUN/TURN
      description: |
        Только участнику **принятого** звонка (`accepted`, `active`): пока звонок
        звонит, релей не нужен, а данные, выданные на этой стадии, позволяли бы
        копить их, начиная и бросая звонки (`409 call_not_ready`). Данные живут
        **минуты** (`ttl_seconds`, 300–600): coturn ничего не знает о таблице
        звонков, и данные на часы пережили бы звонок. Долгий звонок обновляет их
        сам — клиент берёт новые за минуту до конца срока и ставит в соединение
        (`RTCPeerConnection.setConfiguration`).

        Имя пользователя стабильно для **человека** внутри окна срока: повторные
        запросы возвращают то же имя, и квота TURN на пользователя ограничивает
        человека, а не сбрасывается новым запросом или звонком. Запросы
        ограничены по частоте (`429`). Недоступный TURN — пустой список, а не
        ошибка: прямое соединение работает и без него.
      operationId: getCallIceServers
      parameters:
        - { $ref: '#/components/parameters/CallId' }
      responses:
        '200':
          description: Список для `RTCConfiguration.iceServers`
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IceServers' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/CallNotFound' }
        '409':
          description: Звонок завершён (`call_ended`) или ещё не принят (`call_not_ready`)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Слишком часто
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /users:
    get:
      tags: [users]
      summary: Найти человека по адресу
      description: |
        Точное совпадение адреса, и только оно. Поиск по префиксу, по имени
        и список пользователей отвергнуты: они отдают людей, которых
        спрашивающий не называл, — то есть превращают справочник в канал
        знакомств, которого никто не просил.

        Ответ — **не** `UserSummary`: в нём присутствие
        (`online`, `last_seen_at`), и отдать его человеку, который ещё даже
        не собеседник, значило бы открыть наблюдение за любым, чей адрес
        известен. Здесь два поля, и адреса среди них нет: его ввёл
        спрашивающий, и повторять его обратно незачем.

        «Не найден» отвечает **тем же телом**, что несуществующая беседа
        (`resource_not_found`), и это не украшение. Отличать «адрес свободен»
        от «адрес есть, но человек не отвечает» — значит отвечать на вопрос,
        которого спрашивающий не задавал, и делать поиск каналом переписки.
        Свободный адрес, стёртая учётная запись, заблокированный и сам
        спрашивающий отвечают одинаково.

        Точное совпадение **удорожает** перебор, но не закрывает его: пока
        ответы для занятого и свободного адреса различаются, enumeration
        возможен — он лишь требует знания полного адреса. Поэтому рядом
        стоят аутентификация и лимит, а не одна надежда на точность.
      operationId: findUserByEmail
      parameters:
        - name: email
          in: query
          required: true
          description: |
            Адрес для поиска. Приводится к нижнему регистру тем же
            правилом, что и при регистрации (`domain/user.py`): иначе
            поиск по собственному адресу в другом регистре не нашёл бы
            себя. Пустой после нормализации — `400` с кодом
            `invalid_email`: это запрос без предмета, и попыткой он
            не считается — лимит на него не тратится.
          schema: { type: string }
      responses:
        '200':
          description: Человек найден
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserLookup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: |
            Адрес свободен, либо человек недоступен (стёрт, заблокирован,
            это сам спрашивающий). Тело одно на все случаи — см. описание
            выше.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: |
            Слишком часто. `Retry-After` несёт число секунд из решения
            лимитера.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Секунды до следующей попытки.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /conversations:
    get:
      tags: [conversations]
      summary: Список бесед пользователя
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: before_activity_at
          in: query
          description: |
            Первый компонент курсора. Вместе с `before_conversation_id`
            задаёт границу страницы: отдаются беседы, у которых пара
            `(updated_at, conversation_id)` строго меньше заданной.
            Пагинация по ключу, а не по смещению.

            **Курсор задаётся только парой.** Один `before_activity_at`
            без `before_conversation_id` (и наоборот) — `400` с кодом
            `invalid_cursor`, а не более слабая граница. Отметка
            активности не уникальна: беседы, изменённые одной
            транзакцией, получают одинаковую, и предикат «строго старше
            отметки» вычитает всю такую группу целиком — то есть отдаёт
            неполный список, не сообщая об этом. Пустая страница на
            месте отказа выглядела бы как конец списка.
          schema: { type: string, format: date-time }
        - name: before_conversation_id
          in: query
          description: |
            Второй компонент курсора, обязательный вместе с
            `before_activity_at`. Одного времени мало: отметка активности
            не уникальна — беседы, изменённые одной транзакцией, получают
            одинаковую, — и стык страниц по ней терял бы беседы.
            Одиночным этот параметр не принимается: `400 invalid_cursor`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Беседы, свежие первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationListPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [conversations]
      summary: Создать беседу один-на-один
      description: |
        Операция идемпотентна по составу участников. Встречный запрос
        от собеседника в тот же момент обязан вернуть **ту же** беседу
        с тем же `conversation_id`, а не создать вторую (CONV-001).
      operationId: createDirectConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_id]
              properties:
                participant_id: { type: string, format: uuid }
      responses:
        '200':
          description: Беседа уже существовала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Беседа создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403':
          description: "Действие недоступно: блокировка, неподтверждённый адрес или свой ID"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Участник не найден или недоступен
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{conversation_id}/messages:
    # Держится для `post`: он своего `parameters` не объявляет и получает
    # `conversation_id` отсюда. У `get` параметр продублирован по причине
    # выше. Удалять уровень пути нельзя, пока `post` на него опирается.
    parameters:
      - $ref: '#/components/parameters/ConversationId'

    get:
      tags: [messages]
      summary: История беседы
      description: |
        Пагинация по `before_seq`, а не по смещению: на миллионах сообщений
        `OFFSET` деградирует линейно, причём именно на старых беседах.

        `before_seq` и `after_seq` взаимно исключающие, и обе границы
        строгие: `before_seq=100` — это `seq < 100`, `after_seq=100` —
        `seq > 100`. Строгие именно потому, что клиент передаёт номер,
        который у него уже есть, и повторная выдача его же создала бы
        дубль на стыке страниц (`HIST-001`).

        Направление ответа разное, и это не деталь. Листание назад отдаёт
        новые первыми — так их показывает интерфейс. Догрузка вперёд
        (`after_seq`) отдаёт по возрастанию: это синхронизация
        пропущенного, а не листание, и клиенту нужен порядок применения.

        **Синхронизация идёт до неподвижной точки.** Голова беседы движется:
        пока клиент листает 101–150, приходят 201–300 и часть из них уже
        несёт поток. Догонять движущуюся голову по REST и одновременно
        принимать те же номера по WebSocket — гонка, которую клиент не может
        выиграть: он не знает, где кончается снимок и начинается поток.
        Поэтому первый запрос без `through_seq` замораживает границу:
        сервер берёт голову на момент чтения и возвращает её как
        `sync_to_seq`. Все следующие страницы идут с `through_seq`,
        равным этой границе, и не видят ничего выше неё.

        Диапазон страницы: `after_seq < seq <= through_seq`. Когда снимок
        исчерпан, `has_more` становится `false`, а `next_after_seq` —
        `null`: клиент синхронизирован до неподвижной точки, и всё, что
        выше неё, приходит только потоком. Без этой границы `has_more`
        оставался бы `true` вечно на живой беседе, и клиент не смог бы
        отличить «я догнал» от «я отстаю».

        Границы сравниваются строго, поэтому два случая с `through_seq`
        расходятся, и это расхождение намеренное:

        - `through_seq` **равен** `after_seq` — законный пустой снимок:
          `200`, `items` пуст, `has_more` — `false`, `next_after_seq` —
          `null`, синхронизация завершена. Так выглядит повтор запроса,
          который клиент уже выполнил: ответить на него ошибкой значило бы
          наказать за повтор, а повтор после обрыва связи — обычное дело,
          не сбой клиента;
        - `through_seq` **меньше** `after_seq` — `400`: такого диапазона
          не существует, и получить его можно только ошибкой в клиенте.
          Отдать здесь пустую страницу было бы хуже отказа: клиент прочёл
          бы её как «синхронизация завершена» и молча потерял бы всё,
          что пропустил.
      operationId: listMessages
      parameters:
        # CODEGEN COMPATIBILITY:
        # openapi-generator 7.10.0 теряет path-level parameter,
        # когда operation объявляет собственный parameters.
        # Семантически это тот же параметр; operation-level
        # запись перекрывает одноимённый path-level parameter.
        # Дубль сторожат `ListMessagesHasConversationId` и проверка
        # URL в apps/web/src/api/contract.test.ts: без него запрос
        # уходит на литеральный `{conversation_id}`.
        - $ref: '#/components/parameters/ConversationId'

        - name: before_seq
          in: query
          description: Строго меньше указанного номера. Взаимно исключим с `after_seq`.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: after_seq
          in: query
          description: |
            Строго больше указанного номера. Ответ идёт по возрастанию.
            Без `through_seq` граница снимка берётся заново — так начинается
            синхронизация; с ним продолжается уже начатая.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: through_seq
          in: query
          description: |
            Верхняя граница снимка, включительно. Только вместе с
            `after_seq`: у листания назад снимка нет. Значение — `sync_to_seq`
            из первого ответа, и менять его по дороге нельзя, иначе снимок
            поедет и граница перестанет что-либо значить.

            Строго `after_seq < through_seq` не требуется. Равенство —
            законный пустой снимок и ожидаемый ответ на повтор запроса;
            ошибка только при `through_seq < after_seq`.
          schema: { type: integer, format: int64, minimum: 0 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more, sync_to_seq]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more:
                    type: boolean
                    description: |
                      Есть ли ещё записи в том же направлении в пределах
                      снимка. Без этого признака «пропустил 50» работает,
                      а «пропустил 50 000» превращается в угадывание
                      следующего запроса. При синхронизации вперёд считается
                      только до `sync_to_seq`: сообщения выше границы
                      приходят потоком, и обещать их здесь значило бы
                      обещать то, чего в ответе не будет.
                  next_before_seq:
                    type: [integer, 'null']
                    format: int64
                  next_after_seq:
                    type: [integer, 'null']
                    format: int64
                    description: |
                      Продолжение догрузки: `after_seq` следующего запроса.
                      `null` — снимок исчерпан.
                  sync_to_seq:
                    type: [integer, 'null']
                    format: int64
                    description: |
                      Неподвижная точка синхронизации. На первом запросе —
                      голова беседы на момент чтения, дальше — неизменная
                      граница снимка. Выше неё клиент не запрашивает: этот
                      участок идёт потоком, и смешивать два источника в
                      одном диапазоне нельзя. `null` при листании назад:
                      листание не синхронизация, и границы у него нет.
                      `0` — другое значение: снимок есть, и он пуст.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [messages]
      summary: Отправить сообщение
      description: |
        Идемпотентно по `client_message_id`. Повтор после таймаута обязан
        вернуть **то же** сообщение с тем же `message_id` и `seq` и кодом
        `200`, а не создать второе.
      operationId: sendMessage
      # своего parameters нет: conversation_id продолжает наследоваться
      # с path-level. Именно поэтому параметр остаётся и там.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id, type, payload]
              properties:
                client_message_id:
                  type: string
                  format: uuid
                  description: Генерируется клиентом и переиспользуется при повторе.
                type:
                  type: string
                  enum: [text, image, file, voice]
                payload: { $ref: '#/components/schemas/MessagePayload' }
                attachment_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Повтор — сообщение уже было принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Сообщение принято и зафиксировано в базе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Содержимое превышает предел
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /conversations/{conversation_id}/receipts:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [messages]
      summary: Квитанция о доставке и прочтении
      description: |
        Одна запись несёт оба номера, потому что это одно состояние. Веди их
        двумя запросами — и появится положение «прочитано больше, чем
        доставлено», запрещённое `RCP-004`.

        Обе величины идут **только вперёд**: пришедшая с опозданием квитанция
        не откатывает счётчик, и ответ всё равно `200` с текущим значением
        (`RCP-003`). Обе **отвергаются**, если выше максимума беседы, — `400`
        с кодом `invalid_receipt`: объявить прочитанным то, чего не
        существует, нельзя (`RCP-005`). Отвергаются, а не ограничиваются
        максимумом молча, потому что ограничение выглядело бы для клиента
        применённой квитанцией: он никогда не узнал бы, что прислал
        невозможный номер.

        Чтение подразумевает получение, поэтому `delivered_seq` поднимается
        до `read_seq`, если клиент сообщил больше, чем доставил: прочитать
        неполученное невозможно.

        Несколько устройств одного пользователя: доставлено, если хотя бы
        одно получило; прочитано, если хотя бы одно прочитало до этого
        номера. Хранится максимум, поэтому отдельного сведения по каждому
        устройству не требуется (`RCP-001`).

        Батчится по номеру, а не отправляется на каждое сообщение: квитанция
        на сообщение удваивает трафик чата.
      operationId: setReceipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              # Ссылка, а не встроенная схема, — и это не стилистика.
              #
              # Встроенная схема с `additionalProperties: false` рендерится
              # генератором как свободная форма: в модель приезжает индексная
              # подпись `[key: string]: any`, а в `toJSON` — `...value`. Тело
              # запроса тогда несёт и `read_seq`/`delivered_seq`, и рядом с ними
              # camelCase-дубли `readSeq`/`deliveredSeq`; сервер отвечает `422`
              # (`extra="forbid"`), вкладка не сообщает квитанцию вовсе, а тип
              # объекта пропускает опечатку в имени поля молча — ровно потому,
              # что индексная подпись разрешает любое имя.
              #
              # Поднятая в `components/schemas` схема рендерится поимённо.
              # Проверено прогоном генератора на закреплённом digest'е:
              # у поднятой схемы нет ни подписи, ни `...value`, а лишний
              # camelCase-ключ становится ошибкой `tsc`, а не отказом сервера.
              $ref: '#/components/schemas/SetReceiptsRequest'
      responses:
        '200':
          description: Состояние после применения, а не присланное клиентом
          content:
            application/json:
              schema:
                type: object
                required: [delivered_seq, read_seq]
                properties:
                  delivered_seq: { type: integer, format: int64 }
                  read_seq: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments:
    post:
      tags: [attachments]
      summary: Запросить ссылку на загрузку
      description: |
        Файл загружается браузером напрямую в объектное хранилище по
        предподписанной ссылке. Через API он не идёт: иначе весь трафик
        вложений прошёл бы через приложение.
      operationId: createAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type: { type: string }
                size_bytes: { type: integer, format: int64, minimum: 1 }
                file_name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: >-
                    Исходное имя файла для показа. На ключ объекта не влияет:
                    ключ строит сервер, и имя от клиента в него не попадает.
                duration_ms:
                  type: integer
                  minimum: 1
                  description: >-
                    Длительность голосового, мс; обязательна для `audio/*` и
                    запрещена для остальных (`400 invalid_voice`). От 0,5 до
                    300 секунд; битрейт, выведенный из длительности и размера,
                    должен лежать в пределах 4–512 кбит/с — иначе `400` при
                    инициации или отклонение `invalid_audio` при завершении.
      responses:
        '201':
          description: Ссылка на загрузку выдана
          content:
            application/json:
              schema:
                type: object
                required: [attachment_id, upload_url, expires_at]
                properties:
                  attachment_id: { type: string, format: uuid }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
                  upload_headers:
                    type: object
                    additionalProperties: { type: string }
                    description: >-
                      Заголовки, которые клиент обязан передать в `PUT` как
                      есть: они входят в подпись, и любое расхождение
                      хранилище отвергнет.
        '400': { $ref: '#/components/responses/BadRequest' }
        '413':
          description: Размер выше предела для этого типа — ссылка не выдана
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '415':
          description: Тип содержимого не разрешён — ссылка не выдана
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Слишком много инициаций за единицу времени
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attachments/{attachment_id}/complete:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [attachments]
      summary: Сообщить, что файл загружен
      description: |
        Вызывается браузером после успешного `PUT`. Сервер проверяет, что
        объект действительно лёг и его размер совпал с заявленным, и ставит
        вложение в очередь обработки (`processing`). Ответ `202`: обработка
        идёт в фоне, и готовность клиент узнаёт чтением вложения, а не из
        этого ответа.

        Повторный вызов безопасен: уже принятое вложение возвращает то же
        состояние. Чужое и несуществующее вложение неразличимы (`404`).
      operationId: completeAttachment
      responses:
        '202':
          description: Принято к обработке (или уже обрабатывается)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Объект в хранилище не найден или размер не совпал
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /attachments/{attachment_id}:
    parameters:
      - name: attachment_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [attachments]
      summary: Состояние вложения
      description: |
        Клиент опрашивает его после `complete`, пока оно `processing`.
        `ready` — можно прикрепить к сообщению; `rejected` — файл не принят,
        `rejection_code` называет причину для человека.
      operationId: getAttachmentStatus
      responses:
        '200':
          description: Текущее состояние
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentStatus' }
        '404': { $ref: '#/components/responses/NotFound' }

  /realtime/token:
    post:
      tags: [sessions]
      summary: Токен подключения к Centrifugo
      description: |
        Сервер выдаёт короткий подписанный ticket. Клиент передаёт его как
        `data.ticket` команды connect; connect-proxy проверяет живую сессию
        и сам возвращает Centrifugo настоящий user и разрешённые каналы.
        Отозванный ticket нельзя повторно использовать для подключения.

        `scope=calls` — билет **только** на личный канал звонков (`call:{user_id}`).
        У звонка своё соединение: оно живёт дольше открытой беседы и не должно
        переподключаться при её смене, потому что потерянный при этом сигнал ломает
        установку звонка, а истории у канала нет.
      operationId: issueRealtimeToken
      parameters:
        - name: scope
          in: query
          required: false
          schema: { type: string, enum: [calls] }
      responses:
        '200':
          description: Токен и его срок
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /realtime/connections:
    post:
      tags: [sessions]
      deprecated: true
      summary: Привязать открытое соединение Centrifugo к сессии
      description: |
        Совместимый путь для предыдущей сборки клиента. Новые подключения
        регистрирует connect-proxy до допуска WebSocket; отдельный вызов
        клиента больше не нужен.
      operationId: registerRealtimeConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '204': { description: Соединение привязано к сессии }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /sessions:
    get:
      tags: [sessions]
      summary: Активные сессии пользователя
      operationId: listSessions
      responses:
        '200':
          description: Сессии по устройствам
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [sessions]
      summary: Выйти на всех устройствах
      description: |
        Отзыв немедленный, а не по истечении токена: событие доходит
        до Centrifugo и рвёт открытые соединения.
      operationId: revokeAllSessions
      responses:
        '204': { description: Все сессии отозваны }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [sessions]
      summary: Выйти на выбранном устройстве
      description: |
        Отзывает ровно одну принадлежащую пользователю сессию. Чужая,
        отсутствующая и уже отозванная сессии неразличимы и дают `204`:
        UUID не должен позволять перечислять чужие входы. Если закрывается
        текущая сессия, сервер также удаляет refresh-cookie.
      operationId: revokeSession
      responses:
        '204': { description: Сессия отозвана или уже не была активной }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /telemetry/browser:
    post:
      tags: [telemetry]
      summary: Пачка клиентских событий доставки (G3-008)
      description: |
        Best-effort и `sampled` (`06-observability.md`, "Телеметрия браузера
        обязательна"): отказ этой точки не должен быть виден пользователю
        и не влияет на отправку/доставку сообщений, которые идут своим,
        независимым путём. Поэтому `202`, а не `200`/`204` с гарантией
        записи — тело принято, учёт best-effort.

        `delivery_ack` с `message_id` — то, из чего считается настоящий
        `T_delivery` (`t7 − t1`, где `t1` — момент коммита в Postgres,
        уже известный сообщению): сервер смотрит `created_at` у
        `message_id` и сравнивает с `occurred_at` события. Запись без
        `message_id` на `delivery_ack` отвергается — без него не с чем
        сверить `t1`.
      operationId: ingestBrowserTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserTelemetryBatch'
      responses:
        '202': { description: Пачка принята к учёту (best-effort) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа, выданный Keycloak.

  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CallId:
      name: call_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    CallState:
      description: Состояние звонка после действия
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Call' }
    CallNotFound:
      description: Звонка нет или вы в нём не участвуете — это неотличимо
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    CallEnded:
      description: Звонок уже завершён (`call_ended`)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Токен отсутствует, просрочен или отозван
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: |
        Запрос неверен. Например, переданы оба курсора сразу: `before_seq`
        и `after_seq` описывают разные направления, и один запрос не может
        означать оба. Или `through_seq` пришёл без `after_seq`. Или
        `through_seq` меньше `after_seq` — такого диапазона не существует,
        и получить его можно только ошибкой в клиенте. Равенство `after_seq`
        и `through_seq` ошибкой не считается: это пустой снимок и обычный
        ответ на повтор.

        У списка бесед свои правила того же кода: `limit` вне объявленного
        диапазона; курсор, заданный наполовину, — то есть
        `before_conversation_id` без `before_activity_at` **или**
        `before_activity_at` без `before_conversation_id` (по отдельности
        они задают границу, про которую известно, что она теряет беседы
        с равной отметкой активности); и `before_activity_at` без смещения
        часового пояса — по такой отметке непонятно, с какой зоной её
        сравнивать. Все три — `400` с кодом `invalid_cursor`.

        У квитанций свои правила того же кода: `delivered_seq` или
        `read_seq` выше головы беседы — то есть такого сообщения ещё нет, —
        либо выше предела `int64`, за которым номер не может принадлежать
        ни одному сообщению. И то и другое — `400` с кодом
        `invalid_receipt`. Код отдельный, а не `invalid_cursor`: у квитанции
        курсора нет, и по общему коду клиент поправил бы не то поле.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpstreamUnavailable:
      description: Зависимость недоступна — повторить позже
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Пользователь не участник беседы
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Беседа не найдена
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Превышен предел частоты
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    StartCall:
      type: object
      required: [conversation_id, kind]
      additionalProperties: false
      properties:
        conversation_id: { type: string, format: uuid }
        kind: { type: string, enum: [audio, video] }

    AcceptCall:
      type: object
      additionalProperties: false
      properties:
        tab_id:
          type: string
          minLength: 1
          maxLength: 64
          description: Метка вкладки, нажавшей «принять».

    CallConnected:
      type: object
      required: [connection_type]
      additionalProperties: false
      properties:
        connection_type:
          type: string
          enum: [direct, relay]
          description: Путь медиа по `getStats()`; из него считается доля релея.

    Call:
      type: object
      required: [call_id, conversation_id, kind, state, end_reason, version, role, peer_user_id]
      properties:
        call_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        kind: { type: string, enum: [audio, video] }
        state: { type: string, enum: [ringing, accepted, active, ended] }
        end_reason:
          type: string
          nullable: true
          enum: [completed, declined, missed, cancelled, busy, unavailable, failed, null]
        version:
          type: integer
          description: Монотонный номер состояния; событие с номером не больше виденного отбрасывается.
        role: { type: string, enum: [caller, callee] }
        peer_user_id: { type: string, format: uuid }

    CurrentCall:
      type: object
      required: [call]
      properties:
        call:
          nullable: true
          allOf:
            - { $ref: '#/components/schemas/Call' }

    IceServers:
      type: object
      required: [ice_servers, ttl_seconds]
      properties:
        ice_servers:
          type: array
          items:
            type: object
            required: [urls]
            properties:
              urls: { type: array, items: { type: string } }
              username: { type: string }
              credential: { type: string }
        ttl_seconds: { type: integer }

    CallSignal:
      type: object
      description: |
        `offer`/`answer` несут `sdp`, `ice` — пачку `candidates`. Лишние поля не
        передаются собеседнику.
      required: [type]
      properties:
        type: { type: string, enum: [offer, answer, ice] }
        sdp: { type: string, maxLength: 16384 }
        candidates:
          type: array
          minItems: 1
          maxItems: 40
          items:
            type: object
            required: [candidate]
            properties:
              candidate: { type: string, maxLength: 1024 }
              sdpMid: { type: string, nullable: true }
              sdpMLineIndex: { type: integer, nullable: true }

    BrowserTelemetryEvent:
      type: object
      additionalProperties: false
      required: [type, occurred_at]
      properties:
        type:
          type: string
          enum:
            - ws_connected
            - ws_disconnected
            - ws_reconnected
            - gap_detected
            - message_received
            - message_rendered
            - delivery_ack
            - recovery_success
            - recovery_failed
            - sync_started
            - sync_finished
            - js_error
        occurred_at:
          type: string
          format: date-time
          description: Момент на клиентских часах — не серверное время.
        message_id:
          type: string
          format: uuid
          description: Обязателен у message_received/message_rendered/delivery_ack.
        conversation_id:
          type: string
          format: uuid
        detail:
          type: string
          maxLength: 200
          description: >-
            Короткий контекст (код разрыва WS, имя ошибки) — не стектрейс
            и не текст, введённый пользователем.
    BrowserTelemetryBatch:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          # Верхняя граница пачки — часть контракта, а не детали реализации
          # сервера: без неё "best-effort, sampled" (06-observability.md)
          # превращается в обещание, которое нечем ограничить на входе.
          maxItems: 50
          items: { $ref: '#/components/schemas/BrowserTelemetryEvent' }
    SetReceiptsRequest:
      type: object
      additionalProperties: false
      properties:
        delivered_seq:
          type: integer
          format: int64
          minimum: 0
          description: Номер, до которого сообщения получены на устройстве.
        read_seq:
          type: integer
          format: int64
          minimum: 0
          description: Номер, до которого сообщения показаны пользователю.
      anyOf:
        - required: [delivered_seq]
        - required: [read_seq]
      description: |
        Хотя бы один номер обязателен. `minProperties: 1` здесь
        недостаточно: он требует любое одно свойство, а не одно из
        двух названных, и опечатка в имени поля прошла бы как
        валидный запрос, ничего не изменив. Лишние поля отвергаются
        поимённо — `additionalProperties: false`, — а не игнорируются
        молча: клиент, считающий, что отправил квитанцию, обязан
        получить отказ, а не тишину.

        Схема живёт здесь, а не встроена в `requestBody`, потому что
        встроенная с `additionalProperties: false` рендерится генератором
        как свободная форма: модель получает индексную подпись, а клиент —
        `422` на каждом запросе. Довод целиком — у ссылки в `setReceipts`.
    Me:
      type: object
      required: [user_id, display_name, email_verified, capabilities]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email, nullable: true }
        email_verified: { type: boolean }
        capabilities:
          type: array
          description: |
            Что доступно сейчас. До подтверждения адреса нельзя начинать
            беседы: учётная запись с выдуманным адресом заводится
            за секунду, и без ограничения она сразу пишет посторонним.
            Чтение и ответ в существующей беседе остаются.

            `calls` — не право, а **включённость** звонков на этом окружении
            (`calls_enabled`): интерфейс не показывает кнопку, которая ответит
            `503`.
          items:
            type: string
            enum: [read, send_message, start_conversation, calls]

    AuthorizationCode:
      type: object
      required: [code, code_verifier, redirect_uri]
      properties:
        code:
          type: string
          description: Код авторизации, полученный браузером от Keycloak.
        code_verifier:
          type: string
          description: |
            Секрет PKCE, который браузер сгенерировал перед началом входа.
            Без него перехваченный код обменивается на токен кем угодно.
        redirect_uri:
          type: string
          format: uri
          description: Тот же адрес, что был указан при выдаче кода.
        device_id:
          type: string
          format: uuid
          description: |
            Устройство, с которого входят. Необязателен: если его нет
            или он занят другим человеком, сервер выдаёт новый.

    AccessToken:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: |
            Хранится только в памяти вкладки. `localStorage` для
            удостоверений не используется никогда (ADR 0005).
        expires_in:
          type: integer
          description: Секунды до истечения.
        device_id:
          type: string
          format: uuid
          description: Устройство, к которому привязан этот вход.

    Problem:
      description: RFC 9457. Один формат ошибки на весь API, а не свой на каждый метод.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id:
          type: string
          description: Идентификатор трассировки — по нему ищут этот запрос в журналах.

    Conversation:
      type: object
      required: [conversation_id, type, participants, created_at]
      properties:
        conversation_id: { type: string, format: uuid }
        type: { type: string, enum: [direct, group] }
        participants:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        last_message: { $ref: '#/components/schemas/Message' }
        unread_count:
          type: integer
          minimum: 0
          description: |
            Производное от `messages` и `last_read_seq`, а не факт о беседе:
            хранится ради дешевизны чтения и может быть потеряно без
            последствий — число восстанавливается из источника истины
            в момент запроса. Отсутствие ключа означает «источник истины
            не даёт числа этому читателю», а не ноль: ноль — уверенное
            «всё прочитано», и подставлять его вместо отсутствия нельзя.
        read_states:
          type: array
          description: |
            Состояние чтения участников — то, что сообщили их устройства.
            Здесь, а не в `UserSummary`: номер прочтения — факт беседы,
            вне неё он смысла не имеет, тогда как участник описывает
            человека.

            Массив **разреженный**: элемента нет у того, кто квитанции
            не присылал. Это то же правило «отсутствие — не ноль», что
            у `unread_count`, `last_seen_at` и самого `last_read_seq`
            (обе колонки допускают ноль): пустая запись и отсутствие
            записи — разные ответы.

            Массив маскируется блокировкой — и это **новое** правило,
            а не исполнение записанного `BLK-002`: тот требует лишь,
            чтобы заблокированный не видел присутствия заблокировавшего,
            и о квитанциях не говорит ничего. Здесь принимается
            симметричная маска метаданных активности: у участника, с
            которым у зрителя есть блокировка в **любую** сторону,
            элемента нет вовсе. Движение `last_read_seq` — метаданные
            активности того же рода, что `last_seen_at`: по нему видно,
            когда человек открыл беседу, и в обратную сторону это такой
            же канал наблюдения — ради него симметрия и берётся. Своя
            запись при этом остаётся: это собственные данные зрителя.

            Необязательное: обязательное поле сломало бы совместимость
            со старым клиентом, которому оно незнакомо. Отсутствие ключа
            означает «сервер этой версии состояния не отдаёт», а не
            «состояний нет».
          items:
            type: object
            required: [user_id, last_read_seq, last_delivered_seq]
            properties:
              user_id: { type: string, format: uuid }
              last_read_seq:
                type: integer
                format: int64
                minimum: 0
                description: Максимум сообщённого устройствами прочтения.
              last_delivered_seq:
                type: integer
                format: int64
                minimum: 0
                description: |
                  Максимум сообщённой доставки. Не меньше `last_read_seq`
                  по построению: прочитать неполученное нельзя, и пара
                  нормализуется на входе, а не проверяется на выходе.
        created_at: { type: string, format: date-time }

    ConversationListPage:
      type: object
      description: |
        Страница списка бесед. Оба поля продолжения **обязательны** и
        присутствуют всегда, включая `null`. Инвариант: либо оба `null`
        (страниц больше нет), либо оба непусты (продолжение адресуемо) —
        `null` в одном и непустое значение в другом не встречается.

        Почему обязательны, а не необязательны: сервер отдаёт их всегда,
        и `null`-в-`null` — единственный признак конца списка. Пока поля
        были необязательными, сгенерированный клиент получал бы
        `next_before_activity_at?: string | null` и проверял бы наличие
        ключа там, где протокол обещает значение. Отдельного `has_more`
        нет намеренно: он был бы вторым описанием того же правила,
        и расхождение двух описаний обнаружилось бы только у клиента.
      required: [items, next_before_activity_at, next_before_conversation_id]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_before_activity_at:
          type: [string, 'null']
          format: date-time
          description: |
            Первый компонент курсора продолжения — отметка активности
            последней беседы страницы. Ключ присутствует всегда: конец
            списка — это `null` в обоих полях, а не отсутствие поля.
        next_before_conversation_id:
          type: [string, 'null']
          format: uuid
          description: |
            Второй компонент курсора продолжения. Ключ присутствует
            всегда и всегда сопровождает `next_before_activity_at`:
            либо оба непусты, либо оба равны `null`. Пропажи ключа
            не бывает — иначе конец списка приходилось бы отличать
            от отсутствия поля, а это два разных признака для одного
            состояния.

    UserLookup:
      type: object
      description: |
        Человек, найденный по точному адресу. Два поля и ни одного лишнего.

        **Не `UserSummary` намеренно.** Тот несёт `online` и `last_seen_at`,
        то есть наблюдение за активностью. Участнику беседы оно отдаётся
        с маской блокировки (`G3-007`); человеку, который собеседником ещё
        не стал, — не отдаётся вовсе, и «почти тот же тип, только без
        двух полей» здесь был бы типом, который однажды расширят обратно.
        Отдельная схема — отдельный повод её не расширять.

        Адреса в ответе нет: он и так известен — его ввёл спрашивающий,
        а эхо чужого адреса в ответе это то, что поиск и без того знает.
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }

    UserSummary:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        online:
          type: boolean
          description: |
            Подтверждённая активность внутри окна — тот же предикат по
            времени, которым пользуется сервер (`domain/presence.py`,
            180 секунд), а не отдельное наблюдение. Считает его сервер:
            клиент не знает ни окна, ни часов сервера, и «сейчас» у него
            своё.

            Событие смены присутствия не публикуется: значение верно на
            момент ответа, а не на текущую секунду, и синхронизировать
            его нечем. Поэтому поле читается из ответа REST, а не ждётся
            потоком.

            Необязательное — по той же причине, что `last_seen_at`:
            обязательное поле сломало бы совместимость со старым клиентом,
            которому имя незнакомо. Отсутствие ключа означает «значение
            не отдаётся этому зрителю» (блокировка) либо «сервер его не
            считает», и подменять отсутствие значением нельзя: `false` —
            уверенное «активности не было», `null` — утверждение о человеке
            в третьей форме, которой контракт не объявляет.
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: |
            Последнее подтверждённое соединение человека — отметка
            времени из Postgres, записанная при подключении и при каждом
            продлении. Отметка переживает и потерю realtime-слоя, и
            перезапуск Centrifugo: это факт, а не состояние сокета.

            Необязательное: ключа нет у того, кто не был в сети ни разу.
            Это отсутствие отметки, а не отметка времени, и `null` на её
            месте сервер не присылает. `null` в типе допущен, но не
            производится — сужение типа было бы изменением совместимости,
            а не правкой описания.

            Ключа нет и у того, с кем у зрителя есть блокировка в любую
            сторону: отметка времени — метаданные активности того же рода,
            что `online`, и по ней видно, когда человек был у устройства
            (`BLK-002`). Отсутствие, а не значение: `null` сказал бы
            «отметки нет» — утверждение о человеке, которого сервер
            не делал.

    Message:
      type: object
      required: [message_id, conversation_id, seq, sender_id, type, created_at]
      properties:
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
          description: Порядок внутри беседы. Не время создания.
        sender_id: { type: string, format: uuid }
        client_message_id: { type: string, format: uuid }
        type: { type: string, enum: [text, image, file, voice, system] }
        payload: { $ref: '#/components/schemas/MessagePayload' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        reply_to_message_id:
          type: [string, 'null']
          format: uuid
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted_at:
          type: [string, 'null']
          format: date-time
          description: |
            Надгробие. Запись остаётся, содержимое стёрто — иначе
            ломается нумерация и восстановление при переподключении.

    MessagePayload:
      type: object
      properties:
        text: { type: string, maxLength: 4096 }
        duration_ms:
          type: integer
          description: Длительность голосового сообщения.

    Attachment:
      type: object
      required: [attachment_id, content_type, size_bytes]
      properties:
        attachment_id: { type: string, format: uuid }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        file_name:
          type: string
          description: Исходное имя файла; необязательно у вложений без имени.
        duration_ms:
          type: integer
          description: Длительность голосового, мс.
        width:
          type: integer
          description: >-
            Ширина изображения как оно показывается (после поворота по EXIF),
            пикселей. Есть у изображений, прошедших обработку.
        height:
          type: integer
          description: Высота изображения как оно показывается, пикселей.
        thumbnail_url:
          type: string
          format: uri
          description: >-
            Предподписанная ссылка на миниатюру (WebP, большая сторона до 480
            пикселей, без метаданных). Нет у изображений, обработанных до
            появления миниатюр, — тогда показывается оригинал.
        download_url:
          type: string
          format: uri
          description: Предподписанная ссылка с ограниченным сроком.

    PushPublicKey:
      type: object
      required: [public_key]
      properties:
        public_key: { type: string, description: Открытый ключ VAPID, base64url }

    PushSubscription:
      type: object
      description: >-
        `PushSubscription.toJSON()` браузера. Лишние поля (`expirationTime`)
        допускаются и игнорируются.
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, format: uri, maxLength: 2048 }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, description: Открытый ключ получателя, base64url }
            auth: { type: string, description: Секрет аутентификации, base64url }
        expirationTime: { type: number, nullable: true }

    AttachmentStatus:
      type: object
      required: [attachment_id, state]
      properties:
        attachment_id: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, processing, ready, rejected, failed, attached]
          description: >-
            `orphaned` и `erased` наружу не отдаются: для клиента такого
            вложения уже нет.
        rejection_code:
          type: string
          enum: [type_mismatch, malware, too_large, storage_error, invalid_audio, invalid_image]
          description: Только у `rejected`/`failed`.

    Session:
      type: object
      required: [session_id, device_id, created_at]
      properties:
        session_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Сессия, из которой сделан этот запрос.
