openapi: 3.1.0
info:
  title: Messenger API
  version: 1.0.0
  description: |
    Контракт REST первой версии. Из него генерируется клиент на TypeScript,
    поэтому расхождение фронта и бэкенда становится ошибкой сборки,
    а не находкой в проде.

    Проверка обратной совместимости (CTR-001) блокирует слияние: удалить поле
    или сузить тип нельзя, добавить необязательное - можно.

servers:
  - url: https://app.finops.local/api/v1
    description: Локальное окружение

security:
  - bearerAuth: []

tags:
  - name: auth
  - name: conversations
  - name: messages
  - name: attachments
  - name: sessions

paths:
  /auth/callback:
    post:
      tags: [auth]
      summary: Обмен кода авторизации на токены
      description: |
        Обмен делает сервер, а не браузер. Токен обновления уходит в cookie
        `HttpOnly`, то есть недоступен скрипту на странице: межсайтовый
        скрипт остаётся опасным, пока вкладка открыта, но не может унести
        удостоверение наружу (ADR 0005).

        Точка не аутентифицирована и потому ограничена по частоте: она
        становится целью перебора.
      operationId: exchangeAuthorizationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthorizationCode' }
      responses:
        '200':
          description: Вход выполнен, токен обновления установлен в cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Новый токен доступа по cookie
      description: |
        Токен доступа живёт в памяти вкладки и исчезает при перезагрузке,
        поэтому клиент при старте обменивает cookie на новый. Несколько
        вкладок обменивают каждая свой, и одновременные запросы - норма,
        а не признак подбора.
      operationId: refreshAccessToken
      security: []
      responses:
        '200':
          description: Выдан новый токен доступа
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessToken' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Отправить письмо о подтверждении ещё раз
      description: |
        Под лимитом. Точка, рассылающая письмо по указанному адресу без
        ограничения, — готовый инструмент травли: адрес указывает
        регистрирующийся, а письма приходят владельцу адреса.
      operationId: resendVerificationEmail
      responses:
        '202': { description: Письмо отправлено }
        '409':
          description: Адрес уже подтверждён
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Слишком часто
          headers:
            Retry-After:
              schema: { type: integer }
              description: Секунды до следующей попытки.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me:
    get:
      tags: [auth]
      summary: Кто я и что мне доступно
      description: |
        Возможности отдаются списком, а не выводятся клиентом из
        `email_verified`: правило живёт на сервере, и продублированное
        в интерфейсе оно однажды разойдётся — человек увидит доступную
        кнопку, которая отвечает отказом.
      operationId: whoAmI
      responses:
        '200':
          description: Профиль и текущие возможности
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations:
    get:
      tags: [conversations]
      summary: Список бесед пользователя
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - name: before_activity_at
          in: query
          description: |
            Первый компонент курсора. Вместе с `before_conversation_id`
            задаёт границу страницы: отдаются беседы, у которых пара
            `(updated_at, conversation_id)` строго меньше заданной.
            Пагинация по ключу, а не по смещению.

            **Курсор задаётся только парой.** Один `before_activity_at`
            без `before_conversation_id` (и наоборот) — `400` с кодом
            `invalid_cursor`, а не более слабая граница. Отметка
            активности не уникальна: беседы, изменённые одной
            транзакцией, получают одинаковую, и предикат «строго старше
            отметки» вычитает всю такую группу целиком — то есть отдаёт
            неполный список, не сообщая об этом. Пустая страница на
            месте отказа выглядела бы как конец списка.
          schema: { type: string, format: date-time }
        - name: before_conversation_id
          in: query
          description: |
            Второй компонент курсора, обязательный вместе с
            `before_activity_at`. Одного времени мало: отметка активности
            не уникальна — беседы, изменённые одной транзакцией, получают
            одинаковую, — и стык страниц по ней терял бы беседы.
            Одиночным этот параметр не принимается: `400 invalid_cursor`.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Беседы, свежие первыми
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationListPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

    post:
      tags: [conversations]
      summary: Создать беседу один-на-один
      description: |
        Операция идемпотентна по составу участников. Встречный запрос
        от собеседника в тот же момент обязан вернуть **ту же** беседу
        с тем же `conversation_id`, а не создать вторую (CONV-001).
      operationId: createDirectConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participant_id]
              properties:
                participant_id: { type: string, format: uuid }
      responses:
        '200':
          description: Беседа уже существовала
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Беседа создана
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403':
          description: "Действие недоступно: блокировка, неподтверждённый адрес или свой ID"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404':
          description: Участник не найден или недоступен
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'

    get:
      tags: [messages]
      summary: История беседы
      description: |
        Пагинация по `before_seq`, а не по смещению: на миллионах сообщений
        `OFFSET` деградирует линейно, причём именно на старых беседах.

        `before_seq` и `after_seq` взаимно исключающие, и обе границы
        строгие: `before_seq=100` — это `seq < 100`, `after_seq=100` —
        `seq > 100`. Строгие именно потому, что клиент передаёт номер,
        который у него уже есть, и повторная выдача его же создала бы
        дубль на стыке страниц (`HIST-001`).

        Направление ответа разное, и это не деталь. Листание назад отдаёт
        новые первыми — так их показывает интерфейс. Догрузка вперёд
        (`after_seq`) отдаёт по возрастанию: это синхронизация
        пропущенного, а не листание, и клиенту нужен порядок применения.

        **Синхронизация идёт до неподвижной точки.** Голова беседы движется:
        пока клиент листает 101–150, приходят 201–300 и часть из них уже
        несёт поток. Догонять движущуюся голову по REST и одновременно
        принимать те же номера по WebSocket — гонка, которую клиент не может
        выиграть: он не знает, где кончается снимок и начинается поток.
        Поэтому первый запрос без `through_seq` замораживает границу:
        сервер берёт голову на момент чтения и возвращает её как
        `sync_to_seq`. Все следующие страницы идут с `through_seq`,
        равным этой границе, и не видят ничего выше неё.

        Диапазон страницы: `after_seq < seq <= through_seq`. Когда снимок
        исчерпан, `has_more` становится `false`, а `next_after_seq` —
        `null`: клиент синхронизирован до неподвижной точки, и всё, что
        выше неё, приходит только потоком. Без этой границы `has_more`
        оставался бы `true` вечно на живой беседе, и клиент не смог бы
        отличить «я догнал» от «я отстаю».

        Границы сравниваются строго, поэтому два случая с `through_seq`
        расходятся, и это расхождение намеренное:

        - `through_seq` **равен** `after_seq` — законный пустой снимок:
          `200`, `items` пуст, `has_more` — `false`, `next_after_seq` —
          `null`, синхронизация завершена. Так выглядит повтор запроса,
          который клиент уже выполнил: ответить на него ошибкой значило бы
          наказать за повтор, а повтор после обрыва связи — обычное дело,
          не сбой клиента;
        - `through_seq` **меньше** `after_seq` — `400`: такого диапазона
          не существует, и получить его можно только ошибкой в клиенте.
          Отдать здесь пустую страницу было бы хуже отказа: клиент прочёл
          бы её как «синхронизация завершена» и молча потерял бы всё,
          что пропустил.
      operationId: listMessages
      parameters:
        - name: before_seq
          in: query
          description: Строго меньше указанного номера. Взаимно исключим с `after_seq`.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: after_seq
          in: query
          description: |
            Строго больше указанного номера. Ответ идёт по возрастанию.
            Без `through_seq` граница снимка берётся заново — так начинается
            синхронизация; с ним продолжается уже начатая.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: through_seq
          in: query
          description: |
            Верхняя граница снимка, включительно. Только вместе с
            `after_seq`: у листания назад снимка нет. Значение — `sync_to_seq`
            из первого ответа, и менять его по дороге нельзя, иначе снимок
            поедет и граница перестанет что-либо значить.

            Строго `after_seq < through_seq` не требуется. Равенство —
            законный пустой снимок и ожидаемый ответ на повтор запроса;
            ошибка только при `through_seq < after_seq`.
          schema: { type: integer, format: int64, minimum: 0 }
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Страница истории
          content:
            application/json:
              schema:
                type: object
                required: [items, has_more, sync_to_seq]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  has_more:
                    type: boolean
                    description: |
                      Есть ли ещё записи в том же направлении в пределах
                      снимка. Без этого признака «пропустил 50» работает,
                      а «пропустил 50 000» превращается в угадывание
                      следующего запроса. При синхронизации вперёд считается
                      только до `sync_to_seq`: сообщения выше границы
                      приходят потоком, и обещать их здесь значило бы
                      обещать то, чего в ответе не будет.
                  next_before_seq:
                    type: [integer, 'null']
                    format: int64
                  next_after_seq:
                    type: [integer, 'null']
                    format: int64
                    description: |
                      Продолжение догрузки: `after_seq` следующего запроса.
                      `null` — снимок исчерпан.
                  sync_to_seq:
                    type: [integer, 'null']
                    format: int64
                    description: |
                      Неподвижная точка синхронизации. На первом запросе —
                      голова беседы на момент чтения, дальше — неизменная
                      граница снимка. Выше неё клиент не запрашивает: этот
                      участок идёт потоком, и смешивать два источника в
                      одном диапазоне нельзя. `null` при листании назад:
                      листание не синхронизация, и границы у него нет.
                      `0` — другое значение: снимок есть, и он пуст.
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    post:
      tags: [messages]
      summary: Отправить сообщение
      description: |
        Идемпотентно по `client_message_id`. Повтор после таймаута обязан
        вернуть **то же** сообщение с тем же `message_id` и `seq` и кодом
        `200`, а не создать второе.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_message_id, type, payload]
              properties:
                client_message_id:
                  type: string
                  format: uuid
                  description: Генерируется клиентом и переиспользуется при повторе.
                type:
                  type: string
                  enum: [text, image, file, voice]
                payload: { $ref: '#/components/schemas/MessagePayload' }
                attachment_ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Повтор — сообщение уже было принято
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Сообщение принято и зафиксировано в базе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Содержимое превышает предел
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /conversations/{conversation_id}/receipts:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [messages]
      summary: Квитанция о доставке и прочтении
      description: |
        Одна запись несёт оба номера, потому что это одно состояние. Веди их
        двумя запросами — и появится положение «прочитано больше, чем
        доставлено», запрещённое `RCP-004`.

        Обе величины идут **только вперёд**: пришедшая с опозданием квитанция
        не откатывает счётчик, и ответ всё равно `200` с текущим значением
        (`RCP-003`). Обе **отвергаются**, если выше максимума беседы, — `400`
        с кодом `invalid_receipt`: объявить прочитанным то, чего не
        существует, нельзя (`RCP-005`). Отвергаются, а не ограничиваются
        максимумом молча, потому что ограничение выглядело бы для клиента
        применённой квитанцией: он никогда не узнал бы, что прислал
        невозможный номер.

        Чтение подразумевает получение, поэтому `delivered_seq` поднимается
        до `read_seq`, если клиент сообщил больше, чем доставил: прочитать
        неполученное невозможно.

        Несколько устройств одного пользователя: доставлено, если хотя бы
        одно получило; прочитано, если хотя бы одно прочитало до этого
        номера. Хранится максимум, поэтому отдельного сведения по каждому
        устройству не требуется (`RCP-001`).

        Батчится по номеру, а не отправляется на каждое сообщение: квитанция
        на сообщение удваивает трафик чата.
      operationId: setReceipts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                delivered_seq:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Номер, до которого сообщения получены на устройстве.
                read_seq:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Номер, до которого сообщения показаны пользователю.
              anyOf:
                - required: [delivered_seq]
                - required: [read_seq]
              description: |
                Хотя бы один номер обязателен. `minProperties: 1` здесь
                недостаточно: он требует любое одно свойство, а не одно из
                двух названных, и опечатка в имени поля прошла бы как
                валидный запрос, ничего не изменив. Лишние поля отвергаются
                поимённо — `additionalProperties: false`, — а не игнорируются
                молча: клиент, считающий, что отправил квитанцию, обязан
                получить отказ, а не тишину.
      responses:
        '200':
          description: Состояние после применения, а не присланное клиентом
          content:
            application/json:
              schema:
                type: object
                required: [delivered_seq, read_seq]
                properties:
                  delivered_seq: { type: integer, format: int64 }
                  read_seq: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attachments:
    post:
      tags: [attachments]
      summary: Запросить ссылку на загрузку
      description: |
        Файл загружается браузером напрямую в объектное хранилище по
        предподписанной ссылке. Через API он не идёт: иначе весь трафик
        вложений прошёл бы через приложение.
      operationId: createAttachment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_type, size_bytes]
              properties:
                content_type: { type: string }
                size_bytes: { type: integer, format: int64, minimum: 1 }
      responses:
        '201':
          description: Ссылка на загрузку выдана
          content:
            application/json:
              schema:
                type: object
                required: [attachment_id, upload_url, expires_at]
                properties:
                  attachment_id: { type: string, format: uuid }
                  upload_url: { type: string, format: uri }
                  expires_at: { type: string, format: date-time }
        '415':
          description: Тип содержимого не разрешён
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /realtime/token:
    post:
      tags: [sessions]
      summary: Токен подключения к Centrifugo
      description: |
        Сервер выдаёт короткий подписанный ticket. Клиент передаёт его как
        `data.ticket` команды connect; connect-proxy проверяет живую сессию
        и сам возвращает Centrifugo настоящий user и разрешённые каналы.
        Отозванный ticket нельзя повторно использовать для подключения.
      operationId: issueRealtimeToken
      responses:
        '200':
          description: Токен и его срок
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: { type: string }
                  expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /realtime/connections:
    post:
      tags: [sessions]
      deprecated: true
      summary: Привязать открытое соединение Centrifugo к сессии
      description: |
        Совместимый путь для предыдущей сборки клиента. Новые подключения
        регистрирует connect-proxy до допуска WebSocket; отдельный вызов
        клиента больше не нужен.
      operationId: registerRealtimeConnection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, minLength: 1, maxLength: 128 }
      responses:
        '204': { description: Соединение привязано к сессии }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/UpstreamUnavailable' }

  /sessions:
    get:
      tags: [sessions]
      summary: Активные сессии пользователя
      operationId: listSessions
      responses:
        '200':
          description: Сессии по устройствам
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [sessions]
      summary: Выйти на всех устройствах
      description: |
        Отзыв немедленный, а не по истечении токена: событие доходит
        до Centrifugo и рвёт открытые соединения.
      operationId: revokeAllSessions
      responses:
        '204': { description: Все сессии отозваны }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sessions/{session_id}:
    parameters:
      - name: session_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [sessions]
      summary: Выйти на выбранном устройстве
      description: |
        Отзывает ровно одну принадлежащую пользователю сессию. Чужая,
        отсутствующая и уже отозванная сессии неразличимы и дают `204`:
        UUID не должен позволять перечислять чужие входы. Если закрывается
        текущая сессия, сервер также удаляет refresh-cookie.
      operationId: revokeSession
      responses:
        '204': { description: Сессия отозвана или уже не была активной }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен доступа, выданный Keycloak.

  parameters:
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Unauthorized:
      description: Токен отсутствует, просрочен или отозван
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    BadRequest:
      description: |
        Запрос неверен. Например, переданы оба курсора сразу: `before_seq`
        и `after_seq` описывают разные направления, и один запрос не может
        означать оба. Или `through_seq` пришёл без `after_seq`. Или
        `through_seq` меньше `after_seq` — такого диапазона не существует,
        и получить его можно только ошибкой в клиенте. Равенство `after_seq`
        и `through_seq` ошибкой не считается: это пустой снимок и обычный
        ответ на повтор.

        У списка бесед свои правила того же кода: `limit` вне объявленного
        диапазона; курсор, заданный наполовину, — то есть
        `before_conversation_id` без `before_activity_at` **или**
        `before_activity_at` без `before_conversation_id` (по отдельности
        они задают границу, про которую известно, что она теряет беседы
        с равной отметкой активности); и `before_activity_at` без смещения
        часового пояса — по такой отметке непонятно, с какой зоной её
        сравнивать. Все три — `400` с кодом `invalid_cursor`.

        У квитанций свои правила того же кода: `delivered_seq` или
        `read_seq` выше головы беседы — то есть такого сообщения ещё нет, —
        либо выше предела `int64`, за которым номер не может принадлежать
        ни одному сообщению. И то и другое — `400` с кодом
        `invalid_receipt`. Код отдельный, а не `invalid_cursor`: у квитанции
        курсора нет, и по общему коду клиент поправил бы не то поле.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UpstreamUnavailable:
      description: Зависимость недоступна — повторить позже
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Пользователь не участник беседы
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Беседа не найдена
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: Превышен предел частоты
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Me:
      type: object
      required: [user_id, display_name, email_verified, capabilities]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        email: { type: string, format: email, nullable: true }
        email_verified: { type: boolean }
        capabilities:
          type: array
          description: |
            Что доступно сейчас. До подтверждения адреса нельзя начинать
            беседы: учётная запись с выдуманным адресом заводится
            за секунду, и без ограничения она сразу пишет посторонним.
            Чтение и ответ в существующей беседе остаются.
          items:
            type: string
            enum: [read, send_message, start_conversation]

    AuthorizationCode:
      type: object
      required: [code, code_verifier, redirect_uri]
      properties:
        code:
          type: string
          description: Код авторизации, полученный браузером от Keycloak.
        code_verifier:
          type: string
          description: |
            Секрет PKCE, который браузер сгенерировал перед началом входа.
            Без него перехваченный код обменивается на токен кем угодно.
        redirect_uri:
          type: string
          format: uri
          description: Тот же адрес, что был указан при выдаче кода.
        device_id:
          type: string
          format: uuid
          description: |
            Устройство, с которого входят. Необязателен: если его нет
            или он занят другим человеком, сервер выдаёт новый.

    AccessToken:
      type: object
      required: [access_token, expires_in]
      properties:
        access_token:
          type: string
          description: |
            Хранится только в памяти вкладки. `localStorage` для
            удостоверений не используется никогда (ADR 0005).
        expires_in:
          type: integer
          description: Секунды до истечения.
        device_id:
          type: string
          format: uuid
          description: Устройство, к которому привязан этот вход.

    Problem:
      description: RFC 9457. Один формат ошибки на весь API, а не свой на каждый метод.
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        trace_id:
          type: string
          description: Идентификатор трассировки — по нему ищут этот запрос в журналах.

    Conversation:
      type: object
      required: [conversation_id, type, participants, created_at]
      properties:
        conversation_id: { type: string, format: uuid }
        type: { type: string, enum: [direct, group] }
        participants:
          type: array
          items: { $ref: '#/components/schemas/UserSummary' }
        last_message: { $ref: '#/components/schemas/Message' }
        unread_count:
          type: integer
          minimum: 0
          description: |
            Производное от `messages` и `last_read_seq`, а не факт о беседе:
            хранится ради дешевизны чтения и может быть потеряно без
            последствий — число восстанавливается из источника истины
            в момент запроса. Отсутствие ключа означает «источник истины
            не даёт числа этому читателю», а не ноль: ноль — уверенное
            «всё прочитано», и подставлять его вместо отсутствия нельзя.
        created_at: { type: string, format: date-time }

    ConversationListPage:
      type: object
      description: |
        Страница списка бесед. Оба поля продолжения **обязательны** и
        присутствуют всегда, включая `null`. Инвариант: либо оба `null`
        (страниц больше нет), либо оба непусты (продолжение адресуемо) —
        `null` в одном и непустое значение в другом не встречается.

        Почему обязательны, а не необязательны: сервер отдаёт их всегда,
        и `null`-в-`null` — единственный признак конца списка. Пока поля
        были необязательными, сгенерированный клиент получал бы
        `next_before_activity_at?: string | null` и проверял бы наличие
        ключа там, где протокол обещает значение. Отдельного `has_more`
        нет намеренно: он был бы вторым описанием того же правила,
        и расхождение двух описаний обнаружилось бы только у клиента.
      required: [items, next_before_activity_at, next_before_conversation_id]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        next_before_activity_at:
          type: [string, 'null']
          format: date-time
          description: |
            Первый компонент курсора продолжения — отметка активности
            последней беседы страницы. Ключ присутствует всегда: конец
            списка — это `null` в обоих полях, а не отсутствие поля.
        next_before_conversation_id:
          type: [string, 'null']
          format: uuid
          description: |
            Второй компонент курсора продолжения. Ключ присутствует
            всегда и всегда сопровождает `next_before_activity_at`:
            либо оба непусты, либо оба равны `null`. Пропажи ключа
            не бывает — иначе конец списка приходилось бы отличать
            от отсутствия поля, а это два разных признака для одного
            состояния.

    UserSummary:
      type: object
      required: [user_id, display_name]
      properties:
        user_id: { type: string, format: uuid }
        display_name: { type: string }
        last_seen_at:
          type: [string, 'null']
          format: date-time
          description: |
            Отметка времени из Postgres, а не presence. «Онлайн» живёт
            в Redis и приходит по realtime — это разные механизмы.

    Message:
      type: object
      required: [message_id, conversation_id, seq, sender_id, type, created_at]
      properties:
        message_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        seq:
          type: integer
          format: int64
          description: Порядок внутри беседы. Не время создания.
        sender_id: { type: string, format: uuid }
        client_message_id: { type: string, format: uuid }
        type: { type: string, enum: [text, image, file, voice, system] }
        payload: { $ref: '#/components/schemas/MessagePayload' }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/Attachment' }
        reply_to_message_id:
          type: [string, 'null']
          format: uuid
        created_at: { type: string, format: date-time }
        edited_at: { type: [string, 'null'], format: date-time }
        deleted_at:
          type: [string, 'null']
          format: date-time
          description: |
            Надгробие. Запись остаётся, содержимое стёрто — иначе
            ломается нумерация и восстановление при переподключении.

    MessagePayload:
      type: object
      properties:
        text: { type: string, maxLength: 4096 }
        duration_ms:
          type: integer
          description: Длительность голосового сообщения.

    Attachment:
      type: object
      required: [attachment_id, content_type, size_bytes]
      properties:
        attachment_id: { type: string, format: uuid }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        download_url:
          type: string
          format: uri
          description: Предподписанная ссылка с ограниченным сроком.

    Session:
      type: object
      required: [session_id, device_id, created_at]
      properties:
        session_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        user_agent: { type: string }
        created_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        current:
          type: boolean
          description: Сессия, из которой сделан этот запрос.
