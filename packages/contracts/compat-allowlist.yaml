# Осознанные разрывы совместимости (CTR-001…003).
#
# Прошлый разрыв прошёл молча: `CTR-001…003` на сломавшем коммите был красным,
# и это никого не остановило. Поэтому разрыв теперь вносится не ослаблением
# проверки, а записью здесь — поимённо, с датой и причиной. Всё, чего в этом
# файле нет, остаётся ошибкой, как и раньше.
#
# СПИСОК ЗАКРЫТ И НЕ РАСШИРЯЕТСЯ.
#
# Это не «список исключений, куда можно дописать ещё». Так устроен
# GRANDFATHERED в scripts/check-migrations.py: перечень того, что случилось
# до появления правила, а не разрешение нарушать его дальше. Запись попадает
# сюда один раз — в том коммите, который ломает совместимость, — и живёт
# ровно один PR. След остаётся в истории коммитов, где рядом видны и разрыв,
# и причина, а не в файле: файл, переживший свой разрыв, — это уже не след,
# а разрешение.
#
# Сопоставление идёт по паре (вид, имя), а не по тексту сообщения: текст
# можно переформулировать, а разрешение обязано остаться привязанным к самому
# элементу контракта.
#
# ЗАПИСЬ, НЕ СОВПАВШАЯ НИ С ОДНИМ РАЗРЫВОМ, — ЭТО ОШИБКА, А НЕ ЗАМЕЧАНИЕ.
#
# Иначе одноразовость держалась бы обещанием. Пока разрыв есть, запись
# совпадает с ним и разрешает ровно его. Как только разрыв попал в базу
# сравнения, совпадать перестаёт — и следующий запуск требует её удалить.
# Забытая запись поэтому не переживёт ни одного коммита, а именно этим она
# и опасна: сопоставление идёт по имени, и оставленная запись однажды
# разрешила бы новое удаление маршрута с тем же именем.
#
# Порядок работы отсюда такой: сломать совместимость и добавить запись —
# одним коммитом (проверка зелёная, разрыв назван), убрать запись —
# следующим (разрыв уже в базе, запись стала лишней).
#
# ПРИЗНАК ЧИСТОГО BASELINE — ФАЙЛ ПУСТ ИЛИ ОТСУТСТВУЕТ.
#
# Пустой `allowed: []` и отсутствие файла равнозначны: load_allowlist
# в обоих случаях возвращает пустой список, то есть «разрешено ничего»,
# а не «проверка не выполнялась». Пока в файле что-то лежит, следующий
# разрыв опирался бы на исключение, оставленное предыдущим.

allowed:
  # Первый и единственный разрыв до появления клиента.
  #
  # Маршрут заменён на POST /conversations/{conversation_id}/receipts. Старое
  # состояние `read` годилось, пока доставка не отличалась от прочтения:
  # клиент сообщал один номер. Квитанция несёт два — `delivered_seq` и
  # `read_seq` — и записывает их одной операцией, потому что `read ≤ delivered`
  # нельзя удержать, если каждый номер меняется своим запросом: между двумя
  # запросами состояние успевает стать невозможным.
  #
  # Разрыв вносится сейчас, а не после первого клиента, ровно потому, что
  # клиента ещё нет: apps/web не существует, JS-тулчейна нет, ни одна строка
  # не зовёт этот маршрут. Ломать совместимость с несуществующим кодом дешевле
  # всего; сделав это позже, мы бы ломали её с живым.
  - path: openapi.yaml
    kind: route
    name: /conversations/{conversation_id}/read
    since: "2026-09-19"
    reason: заменён на POST /conversations/{conversation_id}/receipts (G3-000)
