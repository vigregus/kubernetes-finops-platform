<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vector — Messenger</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Конфигурация окружения — обычным скриптом, а не модулем, и держит это
      **вид** тега, а не место в файле.

      Место в файле не держит ничего, и это измерено, а не выведено: сборщик
      переносит модуль приложения в `<head>`, и в собранной странице он стоит
      ВЫШЕ этих строк — проверено на `dist/index.html`. Работает это потому,
      что обычный скрипт исполняется сразу при разборе, а модуль отложен до
      конца разбора. Стоит дописать этому тегу `type="module"` или `defer` —
      и обе части станут отложенными, пойдут в порядке документа, и точка
      входа приложения выполнится первой, прочитав конфигурацию, которой ещё
      нет. Стережёт это `scripts/check-runtime-config.py`, и стережёт на
      собранном дереве: на исходнике он не увидел бы ни переноса в `<head>`,
      ни этой разницы.

      Файла этого в образе нет: его подставляет том из ConfigMap окружения,
      потому что имя источника идентичности обязано приходить снаружи сборки —
      иначе один и тот же digest не обслужит два стенда с разными IdP
      (`DEP-001`). Подробности — в `src/runtime-config.ts`.

      Путь — `/runtime/runtime-config.js`, а не `/runtime-config.js`: том
      монтируется **каталогом** (файл, зафиксированный `subPath`, не обновляется
      у работающего пода), и каталог этот свой, внутри корня статики, — иначе он
      накрыл бы этот самый index.html. Оба имени выведены из одного значения
      `services.web.runtimeConfig.mountPath`.
    -->
    <script src="/runtime/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
