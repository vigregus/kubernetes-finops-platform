# Закреплённые основания сборки веба. Ни одного тега: тег — это подвижная
# ссылка, и «пересобрали из того же коммита» перестало бы означать «то же
# самое» (DEP-001).
#
# Файл растёт по мере появления оснований: GENERATOR_DIGEST нужен уже на
# первом срезе, потому что генерация идёт закреплённым образом генератора;
# NODE_DIGEST, NODE_MAJOR и NGINX_DIGEST дописаны вместе с Dockerfile.
#
# Значений по умолчанию нет ни у одного: сборка без них падает, а не
# подставляет «что-нибудь похожее».
#
# NODE_MAJOR лежит здесь, а не в YAML конвейера, намеренно: `setup-node` в CI
# и `node@$NODE_DIGEST` в образе — два разных места, и разойтись они могут
# молча. Разные мажоры дают разные результаты одной и той же сборки: tsc,
# vitest и минификация Vite расходятся, и «зелено на CI, сломано в образе»
# перестаёт быть фигурой речи. Конвейер читает мажор из этого же файла и
# сверяет фактический — так источник мажора один (B32).

GENERATOR_DIGEST=sha256:f2054a5a7908ad81017d0f0839514ba5eab06ae628914ff71554d46fac1bcf7a
NODE_DIGEST=sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
NODE_MAJOR=24
NGINX_DIGEST=sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
