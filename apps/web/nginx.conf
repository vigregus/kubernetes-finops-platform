# Конфигурация nginx для статики веб-клиента.
#
# Она отличается от штатной ровно там, где штатная не работает под тем
# режимом, который объявлен в чарте: пользователь 10001 и корень только для
# чтения. Штатный nginx пишет pid в /var/run и временные файлы в /var/cache —
# оба пути при таком режиме недоступны, и падение выглядит как ошибка тома,
# а не как следствие прав.
#
# Отсюда четыре отличия, и каждое обязательно:
#   * pid и все временные каталоги — в /tmp (единственное место, куда можно
#     писать; чарт даёт его томом);
#   * логи — в stdout/stderr: /var/log/nginx при корне только для чтения
#     недоступен, а молча терять логи нельзя тем более;
#   * директива `user` отсутствует вовсе: под non-root она только ругается;
#   * порт 8080, а не 80: непривилегированный процесс не может слушать 80.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
               image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # /healthz отвечает сам nginx — статическим ответом, не файлом и не
        # проксированием. Пробы пода смотрят сюда (B30): здоровье статики не
        # зависит от backend, и связать их значило бы гасить web при
        # недоступном API.
        #
        # Точное совпадение (`=`) выводит путь из SPA-fallback — иначе
        # /healthz отдавал бы index.html с кодом 200, и проба «прошла бы» на
        # сломанном файле тоже.
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Конфигурация окружения: файл рядом со статикой, который подставляет
        # том из ConfigMap стенда, — и без кэша. Закэшированная, она пережила бы
        # перевод стенда на другой источник идентичности, и человек уходил бы
        # входить на прежний.
        #
        # Точное совпадение (`=`) и `try_files $uri =404` здесь оба обязательны.
        # Под SPA-fallback этот путь отдал бы index.html — то есть HTML вместо
        # скрипта: браузер молча получил бы страницу вместо конфигурации, вход
        # падал бы на «конфигурация окружения не загружена», и искать пришлось бы
        # в томе, тогда как причина в отдаче. Отсутствующий файл обязан быть
        # виден как 404.
        location = /runtime/runtime-config.js {
            add_header Cache-Control "no-store" always;
            try_files $uri =404;
        }

        # index.html не кэшируется: он ссылается на хэшированные ассеты, и
        # именно он должен поехать в браузер после выката. Ассеты, наоборот,
        # неизменяемы — имя меняется вместе с содержимым.
        location = /index.html {
            add_header Cache-Control "no-store" always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # SPA-fallback: /callback — это тот же index.html, а не 404. Роутера в
        # G3-005 нет; ветку по адресу разбирает main.tsx (B11).
        location / {
            try_files $uri /index.html;
        }
    }
}
