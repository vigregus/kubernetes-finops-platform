apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-finops-platform-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
    targetRevision: HEAD
    path: clusters/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
