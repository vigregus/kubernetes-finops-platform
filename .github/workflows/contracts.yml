name: Контракты и миграции

# Блокирует слияние. Смысл в одном: несовместимое изменение контракта
# и неприменимая миграция обязаны падать здесь, а не у того, кто выкатывает.
#
# Фильтра по путям у pull_request намеренно нет. Он был, и вместе с
# обязательными проверками это несовместимо: PR, не трогающий перечисленные
# пути, не запустил бы workflow вовсе, обязательная проверка осталась бы
# в состоянии «ожидание», и такой PR не смёржился бы никогда. Проверка,
# которая иногда не выполняется, не может быть условием слияния. Пути
# перечислены в push, где они ничего не ломают, — но и там от них толку
# мало: на push сравнивать не с чем, кроме предыдущего коммита.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: CTR-001..003
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история: совместимость проверяется против базовой ветки,
          # а на мелкой копии её просто нет.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pyyaml

      - name: Сама проверка ловит то, что обязана
        # Проверка, которую нельзя проверить, краснеет так же редко, как
        # ничего не проверяющая: сломанное сравнение параметров прошло бы
        # молча и в этот раз, и во все следующие.
        run: python3 packages/contracts/test_validate.py

      - name: Схемы связны
        run: python3 packages/contracts/validate.py

      - name: Изменения обратно совместимы
        # Для push в main базой служит предыдущий коммит: так изменение,
        # попавшее в main мимо PR, тоже не проходит молча.
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          echo "база сравнения: $BASE"
          python3 packages/contracts/validate.py "$BASE"

      - name: SEC-010 — содержимое доступно только нужным потребителям
        run: python3 scripts/check-kafka-security.py

  code:
    name: Слои и модульные тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Зависимости идут только вниз
        run: python3 scripts/check-layers.py
      - name: Миграции без запрещённых операторов
        run: python3 scripts/check-migrations.py
      - name: У каждой записи журнала есть событие и поток
        run: python3 scripts/check-log-streams.py
      - name: Зависимости
        run: |
          pip install --quiet \
            -r apps/messenger/requirements.txt \
            -r apps/messenger/requirements-dev.txt
      - name: Линтер
        run: cd apps/messenger && python3 -m ruff check messenger tests
      - name: Модульные тесты
        run: cd apps/messenger && python3 -m pytest tests -q

  image:
    name: DEP-001 — образ по digest
    needs: code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Базовый образ закреплён
        # Сборка от подвижного тега означает, что пересборка из того же
        # коммита даёт другие байты — и digest перестаёт что-либо значить.
        run: |
          test -s apps/messenger/base-image.lock \
            || { echo "нет apps/messenger/base-image.lock" >&2; exit 1; }
          grep -q '^sha256:' apps/messenger/base-image.lock \
            || { echo "в base-image.lock не digest" >&2; exit 1; }

      - name: Сборка
        run: |
          docker build \
            --build-arg "BASE_DIGEST=$(cat apps/messenger/base-image.lock)" \
            -t messenger-api:ci apps/messenger

      - name: Образ запускается и отвечает на пробы
        # Собранный образ, который не стартует, — обычный способ узнать
        # об ошибке только на выкатке.
        run: |
          docker run -d --name api -p 8080:8080 messenger-api:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/livez >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8080/livez
          curl -sf http://localhost:8080/metrics | grep -q messenger_build_info
          echo "образ отвечает"

      - name: Тот же контейнер под непривилегированным пользователем
        # Чарт объявляет runAsNonRoot и uid 10001. Образ, собранный под
        # root, поднимется локально и не поднимется в кластере.
        run: |
          test "$(docker exec api id -u)" = "10001" \
            || { echo "контейнер работает не под 10001" >&2; exit 1; }

      - name: Digest собранного образа
        run: |
          docker inspect --format 'digest {{.Id}}' messenger-api:ci

  web:
    name: CTR-004 — клиент из контракта, сборка и образ
    # Фильтра по путям у этого джоба нет — и здесь это записано ещё раз,
    # потому что соблазн велик: он самый долгий. Проверка, которая иногда не
    # выполняется, не может быть условием слияния (см. шапку файла).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Нужна история целиком: render-regression сравнивает вывод с базой
          # PR (B25), а на копии `fetch-depth: 1` базового коммита просто нет.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Питон-зависимости проверок
        run: pip install --quiet pyyaml

      - name: Helm для рендера чарта
        # Явно, а не «на раннере он есть»: render-regression обязан падать на
        # своей причине, а не на отсутствии инструмента. Версия закреплена —
        # проверка, меняющая вердикт от обновления инструмента, ничего не
        # значит.
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Мажор Node — из того же файла, где лежит digest образа
        # Второй константы в этом workflow нет намеренно (B32): setup-node с
        # одним мажором и node@$NODE_DIGEST в образе с другим дают разные
        # результаты одной и той же сборки. Мажор читается оттуда же, где
        # лежит digest, — обновление базового образа тянет за собой CI.
        id: nodelock
        run: |
          LOCK=apps/web/base-image.lock
          MAJOR="$(grep '^NODE_MAJOR=' "$LOCK" | cut -d= -f2)"
          case "$MAJOR" in
            [0-9]*) ;;
            *) echo "в $LOCK нет NODE_MAJOR: ${MAJOR:-пусто}" >&2; exit 1 ;;
          esac
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.nodelock.outputs.major }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Фактический мажор совпал с закреплённым
        # Инвариант не записан комментарием, а исполняется. Без этого шага
        # расхождение не видно ни здесь, ни в образе: tsc, vitest и
        # минификация Vite расходятся молча.
        run: |
          ACTUAL="$(node -p 'process.versions.node.split(".")[0]')"
          test "$ACTUAL" = "${{ steps.nodelock.outputs.major }}" || {
            echo "мажор Node разошёлся: фактический $ACTUAL," \
                 "в base-image.lock ${{ steps.nodelock.outputs.major }}" >&2
            exit 1
          }

      - name: Зависимости
        working-directory: apps/web
        run: npm ci

      - name: Браузер для обоих прогонов
        # `npm ci` браузеры не скачивает, а Chromium нужен не только спеке:
        # @vitest/browser-playwright гоняет его и в модульных прогонах
        # Storybook. Один шаг на джоб, до обоих прогонов.
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Клиент из контракта
        working-directory: apps/web
        run: npm run api:generate

      - name: Сборка
        # Здесь же компилируются утверждения на форму сгенерированных типов:
        # они типовые, и падает на них `tsc -b`, а не vitest. Если красный
        # прогон искать в выводе тестов, его там не найдётся — это сказано
        # явно, чтобы «красного не было» не смешалось с «искали не там».
        working-directory: apps/web
        run: npm run build:app

      - name: Модульные тесты
        # Число собранных тестов печатает сам vitest, и оно обязано быть
        # ненулевым: прогон, не собравший ни одного `*.test.ts`, неотличим от
        # отсутствия дефекта, а весь mutation-подход гейта стоит на том, что
        # красный прогон действительно красный. Ноль файлов vitest завершает
        # ненулевым кодом — то есть это исполняется, а не подразумевается.
        working-directory: apps/web
        run: npm test

      - name: Линтер
        working-directory: apps/web
        run: npm run lint

      - name: Презентационный слой
        # Собирается и в PR: правка рантайма, сломавшая stories, — регрессия
        # дизайна, а не «доработка».
        working-directory: apps/web
        run: npm run build-storybook

      - name: Production-путь без фикстур
        # Граф импортов от `main.tsx` не достигает ни фикстур, ни закрытого
        # списка. Статически, а не прогоном: фикстура, до которой не дошло
        # исполнение, всё равно остаётся в бандле.
        run: python3 scripts/check-web-purge.py

      - name: Один образ веба на оба окружения (DEP-001)
        # Смотрит с двух сторон: в собранном `dist` нет ни имени источника
        # идентичности, ни файла конфигурации, а читатель конфигурации в
        # бандле есть; чарт рендерит два окружения одним digest'ом, и
        # Deployment у них побайтово один — различается ровно ConfigMap.
        # Ни сборка, ни прогон тестов, ни пробы этого не видят: образ
        # собирается, чарт рендерится, статика отвечает — а второй стенд
        # требует второй сборки.
        run: python3 scripts/check-runtime-config.py

      - name: Окружение, скрейпы и образы шести нагрузок
        run: python3 scripts/check-chart-env.py

      - name: Метрики панелей и применённые манифесты
        # Джоба `web`, а не `code`: проверке нужен `pyyaml`, и он
        # установлен только здесь. В `code` намеренно живут проверки на
        # одном `ast`/stdlib, и переезд сюда сломал бы это разделение.
        run: python3 scripts/check-dashboards.py

      - name: Общий шаблон не изменил вывод пяти работающих
        # База — неподвижный SHA базовой ветки PR, а не `origin/main`: он
        # движется, и сравнение с ним краснело бы от чужого слияния и зеленело
        # от своего. На push в main базы PR нет, и берётся предыдущий коммит —
        # так же, как в джобе `contracts`.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
        run: |
          echo "база сравнения: $BASE_SHA"
          python3 scripts/check-chart-render.py

      - name: Дымовая сборка образа
        # Собирается, но не публикуется: ловит сломанный Dockerfile до
        # слияния и никуда ничего не отправляет. Тот же путь, что у конвейера
        # публикации, — scripts/build-web.sh и три `--build-arg` из
        # base-image.lock.
        run: IMAGE=messenger-web TAG=ci bash scripts/build-web.sh

      - name: Образ запускается под uid 10001 и корнем только для чтения
        # Те же флаги, что у чарта (runAsNonRoot, readOnlyRootFilesystem,
        # tmp emptyDir в /tmp). Собранный образ, который не стартует в
        # кластере, — обычный способ узнать об этом только на выкатке.
        run: |
          docker run -d --name web \
            --read-only --tmpfs /tmp --user 10001 \
            -p 8080:8080 messenger-web:ci
          for _ in $(seq 1 30); do
            curl -sf http://localhost:8080/healthz >/dev/null && break
            sleep 1
          done

          test "$(docker exec web id -u)" = "10001" \
            || { echo "контейнер работает не под 10001" >&2; exit 1; }

          # /healthz отвечает сам nginx статическим ответом — на него смотрят
          # все три пробы пода, и ни одна не ходит в /api (B30).
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/healthz)" = "200"
          # SPA-fallback: неизвестный путь отдаёт index.html, иначе
          # возврат из Keycloak на /callback даёт 404.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/callback)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "200"
          echo "образ отвечает: / , /callback , /healthz"

  migrations:
    name: Миграции применяются с нуля
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: messenger
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Установить psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Применить на чистую базу
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/messenger
        run: ./db/migrate.sh

      - name: Повторный запуск ничего не меняет
        # Идемпотентность - не деталь удобства: джоб миграции запускается
        # при каждой выкатке, в том числе при откате и при повторе упавшего.
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/messenger
        run: |
          out=$(./db/migrate.sh)
          echo "$out"
          echo "$out" | grep -q "применено новых: 0" || {
            echo "повторный запуск применил миграции заново" >&2
            exit 1
          }

      - name: Изменение применённой миграции - ошибка
        # Схема в базе и схема в git обязаны совпадать. Молча разошедшиеся
        # окружения - это отладка того, чего нет в коде.
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/messenger
        run: |
          echo "-- посторонняя строка" >> db/migrations/0001_init.sql
          if ./db/migrate.sh; then
            echo "изменённая миграция прошла незамеченной" >&2
            exit 1
          fi
          git checkout -- db/migrations/0001_init.sql
          echo "изменение обнаружено, как и требуется"
