name: Образ мессенджера

# Сборка и публикация в GitHub Container Registry.
#
# Отсюда digest становится настоящим: у образа в реестре есть манифест,
# поэтому `repo@sha256:…` — работающая ссылка, а не суррогат. Локально этого
# нет и быть не может (см. scripts/build-messenger.sh), поэтому именно здесь
# DEP-001 выполняется полностью.

on:
  push:
    # Любая ветка, а не только main: образ нужен и до слияния — из PR его взять
    # больше негде (`workflow_dispatch` не заменяет push-событие, см.
    # web-image.yml). Из main он при этом не пропадает: там ветка та же самая.
    #
    # Цена названа: тег одинаков по форме у любой ветки (см. `tags` ниже), а
    # выкатка берёт образ, опубликованный позже всех, — значит по тегу ветку не
    # отличить, и на стенд может уехать образ из незамерженной ветки. Это
    # принято сознательно; кому нужен стенд только на main, тому нужен признак
    # ветки в теге, а он отвергнут.
    branches: ["**"]
    paths:
      - 'apps/messenger/**'
      # Не входят в образ (Dockerfile копирует только `messenger/` и requirements.txt):
      # тесты, документы, dev-зависимости и конфигурация линтера не меняют того, что едет в
      # кластер, и пересборка ради них только расходует раннеры.
      - '!apps/messenger/tests/**'
      - '!apps/messenger/**/*.md'
      - '!apps/messenger/requirements-dev.txt'
      - '!apps/messenger/pyproject.toml'
      - '!apps/messenger/.env.example'
      - '!apps/messenger/.gitignore'
      - '.github/workflows/image.yml'
  workflow_dispatch:

# Новый push в ту же ветку отменяет сборку предыдущего: образ нужен для последнего коммита, а
# выкатка берёт опубликованный позже всех. Сборки main до конца не отменяются.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # Право на публикацию пакета. Отдельного секрета не нужно: GITHUB_TOKEN
  # выдаётся заданию и живёт только пока оно идёт.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/messenger-api

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Базовый образ закреплён
        # Сборка от подвижного тега означает, что пересборка из того же
        # коммита даёт другие байты — и digest перестаёт что-либо значить.
        id: base
        run: |
          LOCK=apps/messenger/base-image.lock
          test -s "$LOCK" || { echo "нет $LOCK" >&2; exit 1; }
          DIGEST="$(cat "$LOCK")"
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "в $LOCK не digest: $DIGEST" >&2; exit 1 ;;
          esac
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Две архитектуры. amd64 — то, на чём собирают; arm64 — то, на чём
      # считается модель затрат: в ней узлы Graviton, и образ под них нужен
      # раньше, чем узлы. Собрать позже значит один раз обнаружить
      # «exec format error» на выкатке.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        id: push
        uses: docker/build-push-action@v6
        with:
          context: apps/messenger
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_DIGEST=${{ steps.base.outputs.digest }}
          # Тег — только идентификатор коммита и ничего больше: ни `latest`,
          # ни имени ветки. Подвижный тег возвращает ровно ту проблему, ради
          # которой всё это и делается, а имя ветки в теге — это ограничение
          # выкатки, которого никто не просил: апдейтер берёт последний
          # опубликованный образ, из какой бы ветки он ни был.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что опубликовано
        # Digest печатается и остаётся настоящим: он — путь выкатки по умолчанию
        # (`values.yaml`) и то, чем меряется неизменность. Но выкатку двигает не
        # он: апдейтер берёт тег по времени публикации, а диджест записать в
        # `Application` не умеет вовсе — `spec` получает `репозиторий:тег`.
        run: |
          {
            echo "### Образ опубликован"
            echo
            echo '```'
            echo "образ:  ${{ env.IMAGE }}"
            echo "тег:    ${{ github.sha }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo '```'
            echo
            echo "Выкатка коммита не требует: \`argocd-image-updater\` следит за"
            echo "тегами в реестре и патчит живой \`Application messenger-services\`"
            echo "(\`gitops/02-infra/argocd-image-updater\`). Ручной путь — подставить"
            echo "digest в \`gitops/04-messenger/messenger-services/values.yaml\`."
          } >> "$GITHUB_STEP_SUMMARY"
