name: Образ веб-клиента

# Отдельный конвейер, а не шаг в image.yml. Причина не в удобстве: у статики
# свой репозиторий, свой конвейер и свой digest, и общий workflow означал бы,
# что правка веба выпускает новый digest API — то есть что «выкатили версию»
# больше ничего не значит. `image.yml` этим PR не трогается вовсе.

on:
  push:
    # Публикация из любой ветки: образ нужен и до слияния, а `workflow_dispatch`
    # не заменяет push-событие — он требует, чтобы кто-то нажал кнопку.
    #
    # Имени ветки в теге при этом нет (см. `tags` ниже): тег — просто sha, один
    # и тот же по форме у любой ветки. Цена названа: выкатка берёт образ,
    # опубликованный позже всех, и по тегу ветку не отличить — значит на стенд
    # может уехать образ из незамерженной ветки. Это принято сознательно.
    #
    # В PR по-прежнему работает web-джоб contracts.yml: он собирает образ
    # дымом и никуда ничего не отправляет.
    branches: ["**"]
    #
    # Фильтр обязан покрывать ВСЕ настоящие входы сборки, а не только
    # приложение. scripts/build-web.sh и scripts/generate-web-client.sh лежат
    # вне apps/web/**, читают base-image.lock и передают digest'ы в сборку:
    # без этих строк правка скрипта не выпустила бы новый образ, и в кластере
    # остался бы прежний. Правило общее — любой shared-скрипт генерации или
    # сборки, от которого зависит образ, входит в фильтр.
    paths:
      - 'apps/web/**'
      # Не входят в собираемое приложение (`vite build` берёт только то, что импортирует
      # точка входа): документы, Storybook и его MDX, тесты и их поддержка, конфигурация
      # приёмки. Их правка не меняет образа, а проверяется джобой web в contracts.yml.
      - '!apps/web/**/*.md'
      - '!apps/web/**/*.mdx'
      - '!apps/web/**/*.stories.*'
      - '!apps/web/**/*.test.*'
      - '!apps/web/src/test-support/**'
      - '!apps/web/src/design-system/**'
      - '!apps/web/.storybook/**'
      - '!apps/web/playwright.config.ts'
      - 'packages/contracts/openapi.yaml'
      - 'scripts/build-web.sh'
      - 'scripts/generate-web-client.sh'
      - '.github/workflows/web-image.yml'
  # Пересобрать артефакт без пустого коммита.
  workflow_dispatch:

# Новый push в ту же ветку отменяет сборку предыдущего: образ нужен для последнего коммита, а
# выкатка берёт опубликованный позже всех. Сборки main до конца не отменяются.
concurrency:
  group: web-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  # Право на публикацию пакета. Отдельного секрета не нужно: GITHUB_TOKEN
  # выдаётся заданию и живёт только пока оно идёт.
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/messenger-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Основания закреплены
        # Значения читаются из того же файла, что и локальной сборкой
        # (scripts/build-web.sh): один источник для человека и конвейера, а
        # не две константы, которые разойдутся молча. Значения по умолчанию
        # нет ни у одного основания — голый docker build падает.
        id: lock
        run: |
          LOCK=apps/web/base-image.lock
          test -s "$LOCK" || { echo "нет $LOCK" >&2; exit 1; }
          for name in GENERATOR_DIGEST NODE_DIGEST NGINX_DIGEST; do
            value="$(grep "^${name}=" "$LOCK" | cut -d= -f2-)"
            case "$value" in
              sha256:*) ;;
              *) echo "в $LOCK нет digest у ${name}: ${value:-пусто}" >&2; exit 1 ;;
            esac
            echo "${name}=${value}" >> "$GITHUB_OUTPUT"
          done

      # Две архитектуры. amd64 — то, на чём собирают; arm64 — то, на чём
      # считается модель затрат: в ней узлы Graviton, и образ под них нужен
      # раньше, чем узлы. Статике nginx это стоит копейки, а перевод нагрузки
      # на ARM потом не потребует внезапно чинить frontend.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        id: push
        uses: docker/build-push-action@v6
        with:
          # Контекст — корень репозитория: контракт лежит в
          # packages/contracts/, то есть выше приложения. Ту же формулировку
          # использует scripts/build-web.sh; «..» здесь не годится — она
          # читается по-разному из apps/web, из корня и из CI.
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GENERATOR_DIGEST=${{ steps.lock.outputs.GENERATOR_DIGEST }}
            NODE_DIGEST=${{ steps.lock.outputs.NODE_DIGEST }}
            NGINX_DIGEST=${{ steps.lock.outputs.NGINX_DIGEST }}
          # Тег — только идентификатор коммита и ничего больше: ни `latest`, ни
          # имени ветки. Та же формулировка и тот же довод, что в image.yml.
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Что опубликовано
        # Digest остаётся настоящим артефактом и остаётся путём выкатки по
        # умолчанию, но выкатку теперь двигает не он: апдейтер берёт тег по
        # времени публикации и диджест записать не умеет — см. image.yml.
        # Место рядом со временем старта шага: закреплённое время рядом с
        # событиями нужно, чтобы ожидание в журнале не совпало с событием
        # прошлого прогона.
        run: |
          {
            echo "### Образ веба опубликован"
            echo
            echo '```'
            echo "образ:  ${{ env.IMAGE }}"
            echo "тег:    ${{ github.sha }}"
            echo "digest: ${{ steps.push.outputs.digest }}"
            echo "время:  $(date -u +%Y-%m-%dT%H:%M:%SZ) (UTC), старт шага"
            echo '```'
            echo
            echo 'Выкатка коммита не требует: `argocd-image-updater` патчит живой'
            echo '`Application messenger-services`. Ручной путь: `scripts/promote-image.sh'
            echo 'sha256:W web` (без имён — пять backend-нагрузок, как и раньше).'
          } >> "$GITHUB_STEP_SUMMARY"
