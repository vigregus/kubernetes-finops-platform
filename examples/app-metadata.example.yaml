apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: prod
  labels:
    app.kubernetes.io/name: checkout
    app.kubernetes.io/component: api
    finops.internal/product: commerce
    finops.internal/team: payments
    finops.internal/environment: prod
    finops.internal/component: application
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
        app.kubernetes.io/component: api
        finops.internal/product: commerce
        finops.internal/team: payments
        finops.internal/environment: prod
        finops.internal/component: application
    spec:
      containers:
        - name: checkout
          image: example.local/checkout:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

