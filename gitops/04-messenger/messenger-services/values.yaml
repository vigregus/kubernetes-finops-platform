namespace: messenger

ownership:
  team: platform-engineering
  environment: local

image:
  registry: ghcr.io/vigregus
  # Один образ на все нагрузки мессенджера и один тег на весь набор:
  # API, отправитель outbox и потребители собраны из одного коммита,
  # и разные теги у них означали бы, что «выкатили версию» больше
  # ничего не значит. Тег обновляет scripts/build-messenger.sh.
  repository: ghcr.io/vigregus/messenger-api
  tag: "local-c14d6b6bdf1d"
  pullPolicy: IfNotPresent
  # Локально образ адресуется тегом, и это не послабление, а следствие.
  # `repo@sha256:…` — ссылка на манифест в реестре; у образа, собранного
  # локально и загруженного в minikube, RepoDigests пуст, и kubelet
  # попытается его скачать. Без своего реестра digest здесь недостижим.
  #
  # Взамен тег выведен из содержимого образа (local-<первые 12 знаков Id>):
  # формально тег, по сути неподвижный — другое содержимое даёт другой тег,
  # и ссылка снова означает конкретные байты.
  #
  # В stage и проде образ проходит через реестр, digest настоящий,
  # и это значение остаётся false — чарт откажется собраться без digest.
  allowMutableTag: false

telemetry:
  # Через коллектор, а не напрямую в Tempo: иначе адрес хранилища зашит
  # в каждый сервис, и сменить его можно только выкаткой всех сразу.
  otlpEndpoint: http://otel-opentelemetry-collector.observability.svc.cluster.local:4317
  # Сервис отправляет всё. Доля хранения задаётся хвостовой политикой
  # коллектора: головная выборка решает до того, как ошибка случилась,
  # и потому не может знать, что трассу надо сохранить. Дисциплина объёма
  # (единицы процентов обычного трафика при целевых 2 500 отправках
  # в секунду) осталась, но переехала в вероятностную политику там же.
  tracesSampler: always_on

dependencies:
  postgres:
    # Через пул, а не напрямую в primary: приложение обязано работать
    # в транзакционном режиме с первого дня.
    host: messenger-db-pool
    database: messenger
    secret: messenger-db-app
  redis:
    # БД 1 - роль app-cache. Realtime (0) принадлежит Centrifugo,
    # security (2) - ограничителям частоты.
    url: redis://messenger-redis.messenger.svc.cluster.local:6379/1
    # БД 2 - роль security: счётчики лимитов. Отдельно от кеша приложения,
    # потому что вымывание кеша не должно обнулять лимиты.
    securityUrl: redis://messenger-redis.messenger.svc.cluster.local:6379/2
  kafka:
    bootstrap: messenger-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  keycloak:
    # Внешний адрес: ровно то, что стоит в `iss` выданного токена.
    # Проверено запросом к discovery - Keycloak отдаёт свой hostname
    # независимо от того, каким путём пришёл запрос. Внутренний адрес
    # здесь означал бы, что ни один браузерный токен не проходит проверку.
    issuer: https://idp.finops.local/realms/messenger
    # Внутренний адрес: ровно то, что достижимо из пода.
    jwksUrl: http://messenger-idp-service.keycloak.svc.cluster.local:8080/realms/messenger/protocol/openid-connect/certs
    audience: messenger-api
    # Внутренний адрес, как и у ключей: обмен идёт из пода.
    tokenUrl: http://messenger-idp-service.keycloak.svc.cluster.local:8080/realms/messenger/protocol/openid-connect/token
    # Браузерный клиент. Секрета у него нет и быть не может - он живёт
    # в странице; вместо секрета PKCE.
    clientId: messenger-web
    # Корень Keycloak и реалм отдельно: административное API адресуется
    # от корня, а не от реалма.
    baseUrl: http://messenger-idp-service.keycloak.svc.cluster.local:8080
    realm: messenger
    # Secret, который заполняет сверка реалма. Значение выдал Keycloak.
    clientSecret: messenger-api-client
  centrifugo:
    apiUrl: http://messenger-centrifugo.messenger.svc.cluster.local:9000/api
    secret: messenger-centrifugo

web:
  # Откуда приходит страница. Проверяется на точках обмена: cookie
  # браузер прикладывает сам, и без этой проверки чужая страница
  # инициирует обновление токена от имени вошедшего.
  origin: https://app.finops.local
  # Путь cookie обновления. Узкий намеренно: на обычные запросы API
  # браузер её не приложит, и подделка межсайтового запроса на них
  # не работает в принципе.
  authCookiePath: /api/v1/auth

priorityClasses:
  create: true
  classes:
    messenger-critical:
      value: 100000
      description: API, outbox-relay и realtime - путь сообщения
    messenger-standard:
      value: 50000
      description: уведомления, непрочитанное, веб
    messenger-background:
      value: 10000
      description: фоновая обработка, уборка, аналитика

services:
  api:
    enabled: true
    component: api
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-critical
    preStopSeconds: 5
    terminationGracePeriodSeconds: 30
    startupProbe:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 60
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 60
      failureThreshold: 3
    http:
      port: 8080
    image:
      digest: sha256:681073522465c2436a25894c7e84fa00b5158a1c3070da2e2210eab1273efa8c
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  web:
    enabled: false
    component: web
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-standard
    preStopSeconds: 5
    terminationGracePeriodSeconds: 30
    http:
      port: 8080
    image: {}
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

  outbox-relay:
    enabled: true
    component: worker
    # Учётная запись Kafka: только запись в оба потока и IdempotentWrite.
    # Читать relay не умеет и не должен.
    kafkaUser: messenger-outbox
    # Метрики есть, входящих запросов нет - поэтому порт только для них.
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.outbox_relay"]
    # Без http: у него нет входящих запросов, поэтому нет ни службы,
    # ни проб готовности. Живость проверяется иначе - по возрасту
    # самой старой необработанной записи, а это метрика, не проба.
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-critical
    preStopSeconds: 0
    terminationGracePeriodSeconds: 60
    image:
      digest: sha256:681073522465c2436a25894c7e84fa00b5158a1c3070da2e2210eab1273efa8c
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  consumer-realtime:
    enabled: true
    # Единственная учётная запись с правом на оба потока: собрать факт
    # и содержимое обратно может только тот, кому положены обе половины.
    kafkaUser: messenger-realtime
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.consumer_realtime"]
    component: worker
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-critical
    preStopSeconds: 0
    # Дольше, чем у API: потребитель обязан успеть дообработать пачку
    # и зафиксировать смещение, иначе после перезапуска будет повтор.
    terminationGracePeriodSeconds: 60
    image:
      digest: sha256:681073522465c2436a25894c7e84fa00b5158a1c3070da2e2210eab1273efa8c
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  consumer-unread:
    # Включена коммитом продвижения, и порядок тут был не формальностью:
    # образ адресуется дайджестом, дайджест появляется только после сборки
    # этого коммита в CI, а прежний дайджест отдал бы нагрузку, в которой
    # потребителя непрочитанного ещё нет, — то есть падающую на импорте
    # модуля. Поэтому `enabled` и дайджест ставятся одним коммитом, и
    # включённой нагрузка бывает только при дайджесте, где потребитель есть.
    enabled: true
    # Учётная запись без права на содержимое: проекции непрочитанного
    # нужен факт появления сообщения, и SEC-010 держится её правами,
    # а не дисциплиной кода.
    kafkaUser: messenger-unread
    # Метрики есть, входящих запросов нет - поэтому порт только для них,
    # а пробы готовности не нужны: ради них нечего ответить.
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.consumer_unread"]
    component: worker
    replicas: 1
    minAvailable: 1
    # Не `critical`, хотя соседи по потоку им помечены. Смещение
    # потребителя лежит в Kafka, проекция производная, и потеря пода
    # стоит секунд лага, а не сообщения. Класс заведён под эти самые
    # слова в описании (`priorityClasses`, выше).
    priorityClass: messenger-standard
    preStopSeconds: 0
    # Как у соседей: потребитель обязан успеть дообработать пачку
    # и зафиксировать смещение, иначе после перезапуска будет повтор.
    terminationGracePeriodSeconds: 60
    image:
      digest: sha256:681073522465c2436a25894c7e84fa00b5158a1c3070da2e2210eab1273efa8c
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  presence-sweeper:
    # Включена коммитом продвижения, и порядок тут был не формальностью —
    # по той же причине, что у соседа выше: прежний дайджест отдал бы
    # нагрузку, падающую на импорте `messenger.workers.presence_sweeper`,
    # которого в том образе нет.
    enabled: true
    # Учётной записи Kafka нет, и это единственная такая нагрузка
    # мессенджера. В шину она не ходит: уборщик смотрит на собственную
    # таблицу `realtime_connections`, а не читает поток. Поэтому `SEC-010`
    # её не касается — по той же причине, по которой не касается уборки
    # мусора.
    #
    # Метрики есть, входящих запросов нет - поэтому порт только для них,
    # а пробы готовности не нужны: ради них нечего ответить.
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.presence_sweeper"]
    component: worker
    replicas: 1
    minAvailable: 1
    # `background`, а не `standard`, как у соседей: класс заведён каркасом
    # ровно под эти слова — «фоновая обработка, уборка, аналитика» — и до
    # сих пор не имел ни одного потребителя. По существу это верно, а не
    # только по названию: уборщик не влияет на корректность присутствия
    # (оба ответа считаются по времени, а «был в сети» лежит в Postgres),
    # поэтому под нехваткой места на узле он обязан уходить первым —
    # отставшая уборка стоит лишних строк в реестре, а не статуса.
    priorityClass: messenger-background
    preStopSeconds: 0
    # Не как у потребителей: обработки пачки, которую надо доиграть,
    # у уборщика нет, и такт короче (15 с), а прерывается он по сигналу
    # (`_sleep`), а не добивается по сроку.
    terminationGracePeriodSeconds: 30
    image:
      digest: sha256:681073522465c2436a25894c7e84fa00b5158a1c3070da2e2210eab1273efa8c
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

config: {}
