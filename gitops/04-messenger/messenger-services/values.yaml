namespace: messenger

ownership:
  team: platform-engineering
  environment: local

image:
  registry: ghcr.io/vigregus
  # Один образ на все нагрузки мессенджера и один тег на весь набор:
  # API, отправитель outbox и потребители собраны из одного коммита,
  # и разные теги у них означали бы, что «выкатили версию» больше
  # ничего не значит. Тег обновляет scripts/build-messenger.sh.
  repository: ghcr.io/vigregus/messenger-api
  tag: "local-c14d6b6bdf1d"
  pullPolicy: IfNotPresent
  # Локально образ адресуется тегом, и это не послабление, а следствие.
  # `repo@sha256:…` — ссылка на манифест в реестре; у образа, собранного
  # локально и загруженного в minikube, RepoDigests пуст, и kubelet
  # попытается его скачать. Без своего реестра digest здесь недостижим.
  #
  # Взамен тег выведен из содержимого образа (local-<первые 12 знаков Id>):
  # формально тег, по сути неподвижный — другое содержимое даёт другой тег,
  # и ссылка снова означает конкретные байты.
  #
  # В stage и проде образ проходит через реестр, digest настоящий,
  # и это значение остаётся false — чарт откажется собраться без digest.
  allowMutableTag: false

telemetry:
  # Через коллектор, а не напрямую в Tempo: иначе адрес хранилища зашит
  # в каждый сервис, и сменить его можно только выкаткой всех сразу.
  otlpEndpoint: http://otel-opentelemetry-collector.observability.svc.cluster.local:4317
  # Сервис отправляет всё. Доля хранения задаётся хвостовой политикой
  # коллектора: головная выборка решает до того, как ошибка случилась,
  # и потому не может знать, что трассу надо сохранить. Дисциплина объёма
  # (единицы процентов обычного трафика при целевых 2 500 отправках
  # в секунду) осталась, но переехала в вероятностную политику там же.
  tracesSampler: always_on

dependencies:
  postgres:
    # Через пул, а не напрямую в primary: приложение обязано работать
    # в транзакционном режиме с первого дня.
    host: messenger-db-pool
    database: messenger
    secret: messenger-db-app
  redis:
    # БД 1 - роль app-cache. Realtime (0) принадлежит Centrifugo,
    # security (2) - ограничителям частоты.
    url: redis://messenger-redis.messenger.svc.cluster.local:6379/1
    # БД 2 - роль security: счётчики лимитов. Отдельно от кеша приложения,
    # потому что вымывание кеша не должно обнулять лимиты.
    securityUrl: redis://messenger-redis.messenger.svc.cluster.local:6379/2
  kafka:
    bootstrap: messenger-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  keycloak:
    # Внешний адрес: ровно то, что стоит в `iss` выданного токена.
    # Проверено запросом к discovery - Keycloak отдаёт свой hostname
    # независимо от того, каким путём пришёл запрос. Внутренний адрес
    # здесь означал бы, что ни один браузерный токен не проходит проверку.
    issuer: https://idp.finops.local/realms/messenger
    # Внутренний адрес: ровно то, что достижимо из пода.
    jwksUrl: http://messenger-idp-service.keycloak.svc.cluster.local:8080/realms/messenger/protocol/openid-connect/certs
    audience: messenger-api
    # Внутренний адрес, как и у ключей: обмен идёт из пода.
    tokenUrl: http://messenger-idp-service.keycloak.svc.cluster.local:8080/realms/messenger/protocol/openid-connect/token
    # Браузерный клиент. Секрета у него нет и быть не может - он живёт
    # в странице; вместо секрета PKCE.
    clientId: messenger-web
    # Корень Keycloak и реалм отдельно: административное API адресуется
    # от корня, а не от реалма.
    baseUrl: http://messenger-idp-service.keycloak.svc.cluster.local:8080
    realm: messenger
    # Secret, который заполняет сверка реалма. Значение выдал Keycloak.
    clientSecret: messenger-api-client
  centrifugo:
    apiUrl: http://messenger-centrifugo.messenger.svc.cluster.local:9000/api
    secret: messenger-centrifugo
  objectStorage:
    # Внутренний адрес: запросы сервера (проверка объекта, чтение начала
    # файла, удаление). Служба `minio` создаётся оператором MinIO.
    internalEndpoint: http://minio.messenger.svc.cluster.local:80
    # Публичный: от него считается подпись ссылок, которые получает браузер.
    publicEndpoint: https://s3.finops.local
    bucket: messenger-attachments
    # Secret с `access-key`/`secret-key` — производный от
    # `messenger-minio-env`, его делает джоб messenger-secrets-bootstrap.
    secret: messenger-minio-api

web:
  # Откуда приходит страница. Проверяется на точках обмена: cookie
  # браузер прикладывает сам, и без этой проверки чужая страница
  # инициирует обновление токена от имени вошедшего.
  origin: https://app.finops.local
  # Путь cookie обновления. Узкий намеренно: на обычные запросы API
  # браузер её не приложит, и подделка межсайтового запроса на них
  # не работает в принципе.
  authCookiePath: /api/v1/auth

priorityClasses:
  create: true
  classes:
    messenger-critical:
      value: 100000
      description: API, outbox-relay и realtime - путь сообщения
    messenger-standard:
      value: 50000
      description: уведомления, непрочитанное, веб
    messenger-background:
      value: 10000
      description: фоновая обработка, уборка, аналитика

services:
  api:
    enabled: true
    component: api
    # Секреты и адреса зависимостей. Признак задан значением у всех шести
    # нагрузок, а не только там, где он что-то меняет: умолчание у него
    # ложь, и «у web снято» не должно быть следствием забытого ключа, а
    # «у api есть» — следствием прежнего безусловного поведения шаблона.
    backendEnv: true
    # Ключи объектного хранилища: API выдаёт предподписанные ссылки и
    # проверяет загруженный объект (G4).
    objectStorage: true
    # Метрики снимаются со службы: у нагрузки есть входящие запросы.
    # Умолчание у признака — истина, поэтому true здесь нужен не для
    # работы, а чтобы снятие ключа у соседа не выглядело нормой.
    metrics: true
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-critical
    preStopSeconds: 5
    terminationGracePeriodSeconds: 30
    startupProbe:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /livez
        port: http
      periodSeconds: 60
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /readyz
        port: http
      periodSeconds: 60
      failureThreshold: 3
    http:
      port: 8080
    image:
      digest: sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  web:
    enabled: true
    component: web
    # У статики нет ни базы, ни шины, ни Keycloak: nginx отдаёт файлы, и
    # единственная его зависимость — собственный образ. Ключ стоит
    # значением, а не оставлен умолчанию: ложь здесь — утверждение
    # о нагрузке, а не следствие незаполненного поля.
    backendEnv: false
    # Метрик у статики нет: снимать нечего, и скрейп ходил бы за 404.
    # Умолчание признака — истина, поэтому ключ обязателен: забытый, он
    # отдал бы web VMServiceScrape, и заметил бы это только тот, кто
    # пошёл в хранилище за рядом, которого там нет.
    metrics: false
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-standard
    preStopSeconds: 5
    terminationGracePeriodSeconds: 30
    # Все три пробы смотрят на /healthz — статический ответ самого nginx.
    # Ни одна не ходит в /api: здоровье статики не зависит от backend,
    # и связать их значило бы гасить web при недоступном API.
    startupProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 10
      failureThreshold: 3
    livenessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 60
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      periodSeconds: 60
      failureThreshold: 3
    http:
      port: 8080
    image:
      # Второй образ — второй репозиторий: статика собирается своим
      # конвейером и живёт отдельно от API. Digest подставляет
      # scripts/promote-image.sh, сохраняя этот ключ.
      repository: ghcr.io/vigregus/messenger-web
      digest: sha256:c5c6799c2def1b925e3f11f88ecdd6e2b89c8f22ce052f04b88dd717c07736b3
    # То, что не может лежать в бандле, — и здесь лежит именно поэтому.
    #
    # Имя источника идентичности зависит от стенда, а образ у всех стендов
    # один и тот же: `DEP-001` обещает «собрано один раз, продвинуто без
    # пересборки». Вшитое в статику имя означало бы сборку на каждый стенд,
    # поэтому оно приходит томом из ConfigMap и читается до модуля приложения.
    #
    # `mountPath` — вопрос Kubernetes, `values` — то, что уезжает в браузер.
    # Это путь **файла**; каталог тома и ключ в ConfigMap выводятся из него
    # (`dir` и `base`), а не пишутся рядом: два независимо записанных значения
    # разошлись бы, и под получил бы пустой файл при зелёном рендере.
    #
    # Каталог — свой, внутри корня статики, а не сам корень: том, смонтированный
    # в корень, накрыл бы index.html.
    runtimeConfig:
      mountPath: /usr/share/nginx/html/runtime/runtime-config.js
      values:
        # Тот же адрес, что у API в `dependencies.keycloak.issuer`, и это не
        # совпадение: браузер уходит на него сам, а сервер по нему же сверяет
        # издателя токена. Разойтись они не должны — расходятся они молча.
        oidcIssuer: https://idp.finops.local/realms/messenger
        # Адрес realtime — публичный, как и issuer: на него уходит **браузер**,
        # и `.svc.cluster.local` был бы адресом, которого он не разрешает.
        # Другой origin (`app.finops.local` открывает `rt.finops.local`) здесь
        # безопасен и объясним: cookie в WebSocket не едет вовсе, а соединение
        # аутентифицируется тикетом в connect-data, который выдаёт API.
        #
        # Ключ обязателен для образа, который продвигается этим же коммитом:
        # без него клиент падает громко при загрузке — молчаливое «realtime не
        # поднялся» выглядело бы как «просто не подключилось».
        centrifugoUrl: wss://rt.finops.local/connection/websocket
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

  outbox-relay:
    enabled: true
    component: worker
    # Учётная запись Kafka: только запись в оба потока и IdempotentWrite.
    # Читать relay не умеет и не должен.
    kafkaUser: messenger-outbox
    # Ходит в базу и в шину, поэтому backend-набор ей нужен целиком;
    # у соседей ниже те же два ключа по той же причине.
    backendEnv: true
    metrics: true
    # Метрики есть, входящих запросов нет - поэтому порт только для них.
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.outbox_relay"]
    # Без http: у него нет входящих запросов, поэтому нет ни службы,
    # ни проб готовности. Живость проверяется иначе - по возрасту
    # самой старой необработанной записи, а это метрика, не проба.
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-critical
    preStopSeconds: 0
    terminationGracePeriodSeconds: 60
    image:
      digest: sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  consumer-realtime:
    enabled: true
    # Единственная учётная запись с правом на оба потока: собрать факт
    # и содержимое обратно может только тот, кому положены обе половины.
    kafkaUser: messenger-realtime
    backendEnv: true
    metrics: true
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.consumer_realtime"]
    component: worker
    replicas: 1
    minAvailable: 1
    priorityClass: messenger-critical
    preStopSeconds: 0
    # Дольше, чем у API: потребитель обязан успеть дообработать пачку
    # и зафиксировать смещение, иначе после перезапуска будет повтор.
    terminationGracePeriodSeconds: 60
    image:
      digest: sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  consumer-unread:
    # Включена коммитом продвижения, и порядок тут был не формальностью:
    # образ адресуется дайджестом, дайджест появляется только после сборки
    # этого коммита в CI, а прежний дайджест отдал бы нагрузку, в которой
    # потребителя непрочитанного ещё нет, — то есть падающую на импорте
    # модуля. Поэтому `enabled` и дайджест ставятся одним коммитом, и
    # включённой нагрузка бывает только при дайджесте, где потребитель есть.
    enabled: true
    # Учётная запись без права на содержимое: проекции непрочитанного
    # нужен факт появления сообщения, и SEC-010 держится её правами,
    # а не дисциплиной кода.
    kafkaUser: messenger-unread
    backendEnv: true
    metrics: true
    # Метрики есть, входящих запросов нет - поэтому порт только для них,
    # а пробы готовности не нужны: ради них нечего ответить.
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.consumer_unread"]
    component: worker
    replicas: 1
    minAvailable: 1
    # Не `critical`, хотя соседи по потоку им помечены. Смещение
    # потребителя лежит в Kafka, проекция производная, и потеря пода
    # стоит секунд лага, а не сообщения. Класс заведён под эти самые
    # слова в описании (`priorityClasses`, выше).
    priorityClass: messenger-standard
    preStopSeconds: 0
    # Как у соседей: потребитель обязан успеть дообработать пачку
    # и зафиксировать смещение, иначе после перезапуска будет повтор.
    terminationGracePeriodSeconds: 60
    image:
      digest: sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: "1", memory: 512Mi}

  attachment-processor:
    # G4: обработка вложений (сверка сигнатуры, сканер) и уборка
    # неприкреплённых. Нагрузка включается вместе с образом, где есть модуль
    # `messenger.workers.attachment_processor`: прежний образ упал бы на
    # импорте, как и у соседей выше.
    enabled: true
    component: worker
    # Kafka не нужна: воркер ходит только в базу и в хранилище. База и Redis
    # — весь backend-набор, как у presence-sweeper.
    backendEnv: true
    objectStorage: true
    metrics: true
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.attachment_processor"]
    replicas: 1
    minAvailable: 0
    # Ниже API и доставки: при нехватке CPU планировщик вытеснит сначала
    # обработку файлов (`03-v1-scope.md`, «лестница деградации»). Вложение
    # от этого становится ready позже, а сообщения не отстают.
    priorityClass: messenger-background
    preStopSeconds: 0
    terminationGracePeriodSeconds: 30
    image:
      # Заполняется тегом образа, в котором этот модуль уже есть.
      spec: ghcr.io/vigregus/messenger-api:9a1f3ff593e8fa9aa07a46e328cbd415aac7876e
    resources:
      requests: {cpu: 25m, memory: 128Mi}
      # 512Mi, а не 256: сканер получает файл целиком (до 25 МиБ), и запас
      # нужен под самый большой разрешённый.
      limits: {cpu: 500m, memory: 512Mi}

  presence-sweeper:
    # Включена коммитом продвижения, и порядок тут был не формальностью —
    # по той же причине, что у соседа выше: прежний дайджест отдал бы
    # нагрузку, падающую на импорте `messenger.workers.presence_sweeper`,
    # которого в том образе нет.
    enabled: true
    # Учётной записи Kafka нет, и это единственная такая нагрузка
    # мессенджера. В шину она не ходит: уборщик смотрит на собственную
    # таблицу `realtime_connections`, а не читает поток. Поэтому `SEC-010`
    # её не касается — по той же причине, по которой не касается уборки
    # мусора.
    #
    # База и Redis — весь её backend-набор: в шину уборщик не ходит.
    # Ключи стоят значением, а не полагаются на умолчание, по той же
    # причине, что и у соседей: снятый ключ обязан выглядеть снятым.
    backendEnv: true
    metrics: true
    # Метрики есть, входящих запросов нет - поэтому порт только для них,
    # а пробы готовности не нужны: ради них нечего ответить.
    metricsPort: 9100
    command: ["python", "-m", "messenger.workers.presence_sweeper"]
    component: worker
    replicas: 1
    minAvailable: 1
    # `background`, а не `standard`, как у соседей: класс заведён каркасом
    # ровно под эти слова — «фоновая обработка, уборка, аналитика» — и до
    # сих пор не имел ни одного потребителя. По существу это верно, а не
    # только по названию: уборщик не влияет на корректность присутствия
    # (оба ответа считаются по времени, а «был в сети» лежит в Postgres),
    # поэтому под нехваткой места на узле он обязан уходить первым —
    # отставшая уборка стоит лишних строк в реестре, а не статуса.
    priorityClass: messenger-background
    preStopSeconds: 0
    # Не как у потребителей: обработки пачки, которую надо доиграть,
    # у уборщика нет, и такт короче (15 с), а прерывается он по сигналу
    # (`_sleep`), а не добивается по сроку.
    terminationGracePeriodSeconds: 30
    image:
      digest: sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}

config: {}
