apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: messenger-secrets
  namespace: argocd
  annotations:
    # Волна 3: раньше хранилищ, которые эти секреты читают.
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: finops-platform
  source:
    repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
    targetRevision: HEAD
    path: gitops/04-messenger/messenger-secrets/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: messenger
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
