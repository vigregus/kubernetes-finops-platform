# docs/messenger/15-load-testing-platform.md, раздел 4 — переиспользуемый
# WorkflowTemplate, один на все нагрузочные профили (раздел 10): вызывающий
# передаёт `profile`/`users`/`target_rate`/..., а не копирует Workflow под
# каждый сценарий.
#
# DAG в `main` сейчас доходит до `prepare-conversations` (раздел 6/13) —
# preflight, заведение synthetic-пользователей в Keycloak и парные диалоги
# между ними через настоящий production-совместимый auth flow. Отдельного
# узла `prepare-auth` из раздела 6 сознательно нет: логин и создание
# диалога делит один процесс (`prepare-conversations`), а не два
# Argo-шага, — иначе access/refresh токены пришлось бы протаскивать через
# output-параметры Workflow (тот же довод, что уже был против этого в
# `provision`, см. комментарий там).
#
# Остальные узлы полного DAG раздела 6 (playwright-smoke →
# {browser-canary, k6 TestRun} → reconciliation → recovery-check →
# summarize-run) добавляются вместе с шагом, для которого они впервые
# понадобились — не заглушками, возвращающими успех без реальной работы
# (раздел 25: workflow считается `Succeeded`, только когда пройдены
# настоящие корректностные гейты). `onExit: cleanup` уже реализован
# (раздел 26 — снимает только пользователей текущего `run_id`), потому что
# оставлять synthetic-аккаунты в Keycloak между прогонами значило бы
# засорять кластер собственными тестами этого же PR.
#
# preflight сам покрыт не полностью: раздел 7 требует также записывать
# baseline ресурсов (CPU/RAM ноды, restarts подов, DB connections, Kafka lag,
# outbox backlog) — этого здесь ещё нет, поэтому чек-бокс раздела 7 в плане
# остаётся `[~]`, не `[x]`, до отдельного шага, который эти метрики снимет.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: messenger-local-capacity
  namespace: load-testing
spec:
  serviceAccountName: load-testing-workflow
  entrypoint: main
  onExit: cleanup
  arguments:
    parameters:
      # Без значения по умолчанию: раздел 5 требует уникальный run_id на
      # каждый прогон (например `local-capacity-20260928-001`), и заведение
      # его автоматически здесь скрыло бы обязанность вызывающего выбрать
      # действительно уникальное имя.
      - name: run_id
      - name: git_sha
      - name: profile
        value: messages
        enum:
          - identity
          - connections
          - messages
          - stress
          - recovery
          - mixed
          - media
      - name: users
        value: "100"
      - name: online_users
        value: "50"
      - name: target_rate
        value: "10"
      - name: duration
        value: "2m"
      - name: k6_parallelism
        value: "1"
      - name: recovery_high_rate_fraction
        value: "3"
      - name: recovery_high_duration
        value: "1m"
      # Раздел 31 — profile=media. Число пар, ведущих звонки одновременно (у
      # человека один живой звонок, поэтому нагрузка звонков растёт числом пар),
      # длительность звонка и размер текстового файла.
      - name: call_pairs
        value: "5"
      - name: call_hold_seconds
        value: "5"
      - name: file_bytes
        value: "262144"
      # Пары браузерных звонков с настоящими аудио и видео (по 2 Chromium на пару).
      - name: canary_call_pairs
        value: "2"
      - name: trace_sampling_mode
        value: capacity
        enum:
          - observability-debug
          - capacity
      - name: cleanup
        value: "true"

  templates:
    - name: main
      dag:
        tasks:
          - name: preflight-connectivity
            template: preflight-connectivity
          - name: preflight-k6-operator
            template: preflight-k6-operator
          # Раздел 9 — профиль `identity` не участвует в message-нагрузке
          # (`messages`/`connections`/`stress`/`recovery`/`mixed`): он
          # проверяет собственный поток (регистрация → письмо → ссылка →
          # verified), который специально не должен смешиваться с message
          # throughput. Поэтому основная ветка выключена условием `when`
          # ровно на границе, где до сих пор всё было общим (после
          # preflight), а не общим отдельным набором задач.
          - name: provision
            template: provision
            dependencies: [preflight-connectivity, preflight-k6-operator]
            when: "{{workflow.parameters.profile}} != identity"
          - name: prepare-conversations
            template: prepare-conversations
            dependencies: [provision]
            when: "{{workflow.parameters.profile}} != identity"
            arguments:
              parameters:
                - name: run_password
                  value: "{{tasks.provision.outputs.parameters.run_password}}"
          # Раздел 15 — до k6 benchmark два browser context должны пройти
          # production UI тем же путём, каким пойдёт настоящий пользователь
          # (то же публичное имя, тот же Origin, тот же TLS-путь через
          # Cilium Gateway), а не просто «под поднялся». `resolve-gateway-
          # address` не зависит от provision/prepare-conversations — это
          # чистая инфраструктурная развязка (какой IP у edge Gateway
          # сейчас), и её можно готовить параллельно с провижининг.
          - name: resolve-gateway-address
            template: resolve-gateway-address
            when: "{{workflow.parameters.profile}} != identity"
          - name: playwright-smoke
            template: playwright-smoke
            dependencies: [prepare-conversations, resolve-gateway-address]
            when: "{{workflow.parameters.profile}} != identity"
            arguments:
              parameters:
                - name: gateway_ip
                  value: "{{tasks.resolve-gateway-address.outputs.parameters.gateway_ip}}"
          - name: k6-load
            template: k6-load
            dependencies: [playwright-smoke]
            when: "{{workflow.parameters.profile}} != identity"
            arguments:
              parameters:
                - name: run_password
                  value: "{{tasks.provision.outputs.parameters.run_password}}"
          # Раздел 16 — browser canary работает параллельно k6 workload, не
          # до и не после него: `dependencies` — тот же playwright-smoke
          # (после него UI уже доказанно живой), не k6-load. Argo сам
          # дожидается результатов обоих раньше reconciliation — это и есть
          # «Argo Workflow должен дождаться результатов обоих» из плана,
          # выраженное структурой DAG, а не отдельной синхронизацией.
          #
          # continueOn.failed — живой дефект: Playwright здесь содержит
          # жёсткий assert (expect(failures).toBe(0)), и уже один отказавший
          # обмен из canary_pairs роняет весь Pod с exit 1. Но reconciliation
          # ниже явно спроектирован принимать canary_failures как метрику
          # (пишет её в summary.json, см. load_run_browser_canary_failures) -
          # не требовать нуля. Без continueOn обычный `dependencies:` в Argo
          # Workflows требует Succeeded, не просто завершения, и при первом
          # же ненулевом canary_failures reconciliation целиком пропускался
          # ("Omitted: depends condition not met") — то есть ИМЕННО тот
          # прогон, где деградация реально произошла и её стоило бы
          # зафиксировать в summary.json, оставался без отчёта. Output-
          # параметр canary_failures Argo сохраняет независимо от exit code
          # пода (проверено живьём) — continueOn ничего не меняет в том,
          # что именно пишется в summary, только в том, доходит ли DAG до
          # reconciliation.
          - name: browser-canary
            template: browser-canary
            dependencies: [playwright-smoke]
            when: "{{workflow.parameters.profile}} != identity"
            continueOn:
              failed: true
            arguments:
              parameters:
                - name: gateway_ip
                  value: "{{tasks.resolve-gateway-address.outputs.parameters.gateway_ip}}"
                - name: run_password
                  value: "{{tasks.provision.outputs.parameters.run_password}}"
          - name: recovery-check
            template: recovery-check
            dependencies: [k6-load]
            when: "{{workflow.parameters.profile}} == recovery"
          - name: reconciliation
            template: reconciliation
            dependencies: [k6-load, browser-canary, recovery-check]
            when: "{{workflow.parameters.profile}} != identity"
            arguments:
              parameters:
                - name: accepted_count
                  value: "{{tasks.k6-load.outputs.parameters.accepted_count}}"
                - name: canary_failures
                  value: "{{tasks.browser-canary.outputs.parameters.canary_failures}}"
                - name: recovery_seconds
                  value: "{{tasks.recovery-check.outputs.parameters.recovery_seconds}}"
                - name: backlog_drain_rate
                  value: "{{tasks.recovery-check.outputs.parameters.backlog_drain_rate}}"
          - name: identity-load
            template: identity-load
            dependencies: [preflight-connectivity, preflight-k6-operator]
            when: "{{workflow.parameters.profile}} == identity"

    # Настоящие HTTP/TCP-пробы до зависимостей Messenger — не «под в статусе
    # Running» (раздел 7 явно требует не судить по этому), а рабочий запрос
    # каждой службе. `/readyz` у Messenger API — это уже проверка Postgres
    # тем же путём, каким пойдёт прикладной запрос (см. `runtime.py`), а не
    # отдельная проверка порта.
    - name: preflight-connectivity
      container:
        image: busybox:1.36.1
        command: ["sh", "-c"]
        args:
          - |
            set -u
            fail=0

            check_http() {
              if wget -q -T 5 -O /dev/null "$2"; then
                echo "OK   $1"
              else
                echo "FAIL $1 ($2)"
                fail=1
              fi
            }

            check_tcp() {
              if nc -z -w 3 "$2" "$3"; then
                echo "OK   $1"
              else
                echo "FAIL $1 ($2:$3)"
                fail=1
              fi
            }

            check_http "Messenger API /readyz (включает Postgres)" \
              "http://api.messenger.svc.cluster.local/readyz"
            check_http "Keycloak /health/ready" \
              "http://messenger-idp-service.keycloak.svc.cluster.local:9000/health/ready"
            check_http "Centrifugo /health" \
              "http://messenger-centrifugo.messenger.svc.cluster.local:9000/health"
            check_tcp "Kafka bootstrap (plaintext, 9092)" \
              "messenger-kafka-kafka-bootstrap.kafka.svc.cluster.local" 9092
            check_http "VictoriaMetrics /health" \
              "http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428/health"

            exit "$fail"

    # k6 Operator сам по себе не выставляет HTTP-эндпоинт готовности (в
    # gitops/02-infra/k6-operator/values.yaml явно отключён ServiceMonitor,
    # отдельного metrics Service тоже нет) — доступность CRD через тот же
    # ServiceAccount, которым workflow будет заводить TestRun, доказывает то,
    # что действительно важно для следующих стадий: что API-группа `k6.io`
    # зарегистрирована и прав на неё достаточно, а не что controller-под
    # просто существует.
    - name: preflight-k6-operator
      container:
        image: rancher/kubectl:v1.31.0
        command: ["kubectl"]
        args: ["get", "testruns.k6.io", "-n", "load-testing"]

    # Раздел 8 — Keycloak Admin API заводит synthetic-пользователей с
    # именем `local-capacity-<run_id>-NNNNNN@finops.local`; для профиля
    # `identity` (раздел 9) адрес намеренно остаётся неподтверждённым, чтобы
    # тот профиль проверял настоящий поток верификации, а не заранее
    # выставленный флаг. Настоящую application-сессию (не самодельный JWT)
    # каждый synthetic-пользователь получает не здесь, а в момент, когда его
    # подхватит k6/Playwright-скрипт — тем же production-совместимым потоком
    # логина, каким пройдёт браузер, а не заранее размноженными токенами,
    # которые пришлось бы протаскивать через состояние самого Workflow.
    #
    # Пароль на run — один общий, генерируется здесь и уходит только в
    # output-параметр `run_password` (Argo хранит output в статусе Workflow,
    # но это одноразовый synthetic-fixture пароль, не боевая учётная
    # запись — в отличие от admin-пароля IdP, который скрипт читает и держит
    # только в памяти процесса, см. rbac-keycloak-admin-secret.yaml).
    - name: provision
      script:
        image: ghcr.io/vigregus/messenger-api@sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
        command: ["python"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
          - name: USERS
            value: "{{workflow.parameters.users}}"
          - name: PROFILE
            value: "{{workflow.parameters.profile}}"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
        source: |
          import asyncio
          import base64
          import os
          import secrets

          import httpx

          KEYCLOAK = "http://messenger-idp-service.keycloak.svc.cluster.local:8080"
          REALM = "messenger"
          RUN_ID = os.environ["RUN_ID"]
          USERS = int(os.environ["USERS"])
          PROFILE = os.environ["PROFILE"]
          EMAIL_VERIFIED = PROFILE != "identity"


          def read_own_secret(namespace: str, name: str) -> dict[str, str]:
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ["KUBERNETES_SERVICE_PORT"]
              token = open(
                  "/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8"
              ).read().strip()
              ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              url = f"https://{host}:{port}/api/v1/namespaces/{namespace}/secrets/{name}"
              r = httpx.get(url, headers={"Authorization": f"Bearer {token}"}, verify=ca, timeout=10.0)
              r.raise_for_status()
              return {k: base64.b64decode(v).decode() for k, v in r.json()["data"].items()}


          async def admin_token(http: httpx.AsyncClient, admin: dict[str, str]) -> str:
              r = await http.post(
                  f"{KEYCLOAK}/realms/master/protocol/openid-connect/token",
                  data={
                      "grant_type": "password",
                      "client_id": "admin-cli",
                      "username": admin["username"],
                      "password": admin["password"],
                  },
              )
              r.raise_for_status()
              return r.json()["access_token"]


          async def create_user(http: httpx.AsyncClient, token: str, login: str, password: str) -> None:
              headers = {"Authorization": f"Bearer {token}"}
              r = await http.post(
                  f"{KEYCLOAK}/admin/realms/{REALM}/users",
                  headers=headers,
                  json={
                      "username": login,
                      "email": login,
                      "emailVerified": EMAIL_VERIFIED,
                      "enabled": True,
                      "firstName": "LOCAL-CAPACITY-001",
                      "lastName": RUN_ID,
                      "requiredActions": [],
                      "credentials": [{"type": "password", "value": password, "temporary": False}],
                  },
              )
              if r.status_code == 409:
                  return
              r.raise_for_status()


          async def main() -> None:
              run_password = secrets.token_urlsafe(24)
              with open("/tmp/run-password", "w", encoding="utf-8") as f:
                  f.write(run_password)

              admin = read_own_secret("keycloak", "messenger-idp-initial-admin")
              async with httpx.AsyncClient(timeout=15.0) as http:
                  token = await admin_token(http, admin)
                  semaphore = asyncio.Semaphore(20)

                  async def one(i: int) -> None:
                      login = f"local-capacity-{RUN_ID}-{i:06d}@finops.local"
                      async with semaphore:
                          await create_user(http, token, login, run_password)

                  await asyncio.gather(*(one(i) for i in range(1, USERS + 1)))

              print(f"provisioned {USERS} synthetic users for run_id={RUN_ID} (emailVerified={EMAIL_VERIFIED})")


          asyncio.run(main())
      outputs:
        parameters:
          - name: run_password
            valueFrom:
              path: /tmp/run-password

    # Раздел 13 — до всякой нагрузки synthetic-пользователи должны иметь
    # диалоги, чтобы будущим k6/Playwright-профилям было куда слать
    # сообщения. Логин — тот же production-совместимый код+PKCE поток, что
    # проверяет `tests/integration/login_check.py`: реальная страница входа
    # Keycloak, код из редиректа, обмен через `POST /auth/callback` — не
    # самодельный JWT (раздел 8). Пользователи разбиваются на пары
    # (1,2)(3,4)...; нечётный последний пользователь остаётся без диалога —
    # это осознанный компромисс этого шага, не потерянная запись.
    - name: prepare-conversations
      inputs:
        parameters:
          - name: run_password
      script:
        image: ghcr.io/vigregus/messenger-api@sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
        command: ["python"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
          - name: USERS
            value: "{{workflow.parameters.users}}"
          - name: RUN_PASSWORD
            value: "{{inputs.parameters.run_password}}"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
        source: |
          import asyncio
          import base64
          import hashlib
          import os
          import re
          import secrets
          import uuid
          from urllib.parse import parse_qs, urlparse

          import httpx

          KEYCLOAK = "http://messenger-idp-service.keycloak.svc.cluster.local:8080"
          REALM = "messenger"
          OIDC_CLIENT_ID = "messenger-web"
          API = "http://api.messenger.svc.cluster.local"
          ORIGIN = "https://app.finops.local"
          REDIRECT = f"{ORIGIN}/callback"

          RUN_ID = os.environ["RUN_ID"]
          USERS = int(os.environ["USERS"])
          PASSWORD = os.environ["RUN_PASSWORD"]


          def pkce() -> tuple[str, str]:
              verifier = base64.urlsafe_b64encode(secrets.token_bytes(48)).rstrip(b"=").decode()
              digest = hashlib.sha256(verifier.encode()).digest()
              return verifier, base64.urlsafe_b64encode(digest).rstrip(b"=").decode()


          async def authorization_code(login: str, challenge: str) -> str | None:
              async with httpx.AsyncClient(timeout=10.0, follow_redirects=False) as browser:
                  page = await browser.get(
                      f"{KEYCLOAK}/realms/{REALM}/protocol/openid-connect/auth",
                      params={
                          "client_id": OIDC_CLIENT_ID,
                          "response_type": "code",
                          "scope": "openid",
                          "redirect_uri": REDIRECT,
                          "state": uuid.uuid4().hex,
                          "code_challenge": challenge,
                          "code_challenge_method": "S256",
                      },
                  )
                  page.raise_for_status()
                  form = re.search(r'action="([^"]+)"', page.text)
                  if not form:
                      return None
                  action = form.group(1).replace("&amp;", "&")
                  parsed = urlparse(action)
                  action = f"{KEYCLOAK}{parsed.path}" + (f"?{parsed.query}" if parsed.query else "")

                  submitted = await browser.post(
                      action,
                      data={"username": login, "password": PASSWORD},
                      cookies=page.cookies,
                      headers={"Content-Type": "application/x-www-form-urlencoded"},
                  )
                  location = submitted.headers.get("location", "")
                  return parse_qs(urlparse(location).query).get("code", [None])[0]


          async def login(http: httpx.AsyncClient, login_email: str) -> str:
              verifier, challenge = pkce()
              code = await authorization_code(login_email, challenge)
              if code is None:
                  raise RuntimeError(f"login page did not return a code for {login_email}")
              exchanged = await http.post(
                  f"{API}/auth/callback",
                  json={"code": code, "code_verifier": verifier, "redirect_uri": REDIRECT},
                  headers={"Origin": ORIGIN, "User-Agent": "load-testing/prepare-conversations"},
              )
              exchanged.raise_for_status()
              access_token = exchanged.json()["access_token"]
              return access_token


          async def user_id_of(http: httpx.AsyncClient, access_token: str) -> str:
              r = await http.get(f"{API}/me", headers={"Authorization": f"Bearer {access_token}"})
              r.raise_for_status()
              return r.json()["user_id"]


          async def ensure_conversation(http: httpx.AsyncClient, a_token: str, b_user_id: str) -> None:
              r = await http.post(
                  f"{API}/conversations",
                  json={"participant_id": b_user_id},
                  headers={"Authorization": f"Bearer {a_token}", "Origin": ORIGIN},
              )
              if r.status_code not in (200, 201):
                  r.raise_for_status()


          def is_transient(exc: Exception) -> bool:
              """Стоит ли повторить пару целиком, а не считать её отказавшей.

              Живой замер (два прогона мerged mixed-профиля подряд): при
              concurrency=10 и ~8 HTTP-вызовах на пару единичный `503` (Keycloak
              под бурстом логинов) или сетевой timeout — не редкость, и раньше
              любой такой сбой валил весь шаг целиком, хотя оставшиеся 96-100
              пар готовились штатно. `401`/`400` сюда не входят: это genuine
              отказ (неверный пароль, не тот код), retry его не почини­т, а
              только удвоит нагрузку без шанса на успех.
              """
              if isinstance(exc, (httpx.TimeoutException, httpx.ConnectError, httpx.ReadError)):
                  return True
              if isinstance(exc, httpx.HTTPStatusError):
                  return exc.response.status_code >= 500
              return False


          async def one_pair(http: httpx.AsyncClient, i: int, semaphore: asyncio.Semaphore) -> None:
              login_a = f"local-capacity-{RUN_ID}-{i:06d}@finops.local"
              login_b = f"local-capacity-{RUN_ID}-{i + 1:06d}@finops.local"
              attempts = 3
              async with semaphore:
                  for attempt in range(1, attempts + 1):
                      try:
                          token_a = await login(http, login_a)
                          token_b = await login(http, login_b)
                          user_id_b = await user_id_of(http, token_b)
                          await ensure_conversation(http, token_a, user_id_b)
                          return
                      except Exception as exc:
                          if attempt == attempts or not is_transient(exc):
                              raise
                          print(f"pair {i}/{i + 1}: transient {exc!r}, retry {attempt}/{attempts}")
                          await asyncio.sleep(0.5 * attempt)


          async def main() -> None:
              pairs = USERS // 2
              async with httpx.AsyncClient(timeout=15.0) as http:
                  semaphore = asyncio.Semaphore(10)
                  results = await asyncio.gather(
                      *(one_pair(http, 2 * p + 1, semaphore) for p in range(pairs)),
                      return_exceptions=True,
                  )
              failures = [r for r in results if isinstance(r, Exception)]
              for exc in failures:
                  print(f"pair failed: {exc}")
              print(f"prepared {pairs - len(failures)}/{pairs} conversations for run_id={RUN_ID}")
              if failures:
                  raise SystemExit(1)


          asyncio.run(main())

    # Раздел 10/12 — Argo не генерирует нагрузку сам и не плодит N копий
    # k6 Job: он заводит ровно один `TestRun` (k6 Operator CRD), а
    # распределением по `parallelism` runner'ам занимается сам оператор.
    # Скрипт берётся из ConfigMap (k6-messages-configmap.yaml) — того же
    # содержимого, что tests/load/messenger/messages.js, живьём проверенного
    # и как `k6 run` в одиночном поде, и как настоящий `TestRun` (см. историю
    # PR, открывающего этот шаг). `preflight-k6-operator` уже доказал, что
    # ServiceAccount видит CRD `k6.io`; этот шаг впервые пишет в него.
    #
    # Определение готовности — `status.stage == finished`, а pass/fail — не
    # сам факт `finished` (TestRun считается finished и при отказавшем
    # runner'е), а `status.succeeded` дочернего Job `<name>-1`: тот самый
    # Job, который реально исполнил k6 (раздел 25 — корректностные гейты
    # решают исход Workflow, не факт «что-то отработало»).
    #
    # Раздел 20 — метрики k6 (offered/accepted вплотную к HTTP-percentile,
    # dropped_iterations) до сих пор не попадали в VictoriaMetrics вообще:
    # `arguments`/`-o experimental-prometheus-rw` пишет их туда же, куда уже
    # пишет Tempo (тот же remote-write endpoint, см.
    # gitops/02-infra/observability-objects/tempo/values.yaml). `--tag
    # run_id=/git_sha=/profile=` — та самая разметка, которой разделу 20
    # не хватало для группировки: без неё k6_* метрики одного прогона
    # неотличимы от k6_* метрики другого. Экспортируется как обычный k6
    # output, а не отдельный sidecar — минимальное изменение, работающее
    # на встроенном в grafana/k6 механизме.
    - name: k6-load
      inputs:
        parameters:
          - name: run_password
      container:
        image: alpine/k8s:1.31.0
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            NAME="k6-load-{{workflow.parameters.run_id}}"

            # Раздел 18 — profile=stress использует свой сценарий
            # (ступени эскалации нагрузки, tests/load/messenger/stress.js),
            # а не messages.js с одним фиксированным rate. Раздел 17 —
            # profile=mixed добавляет к отправке сообщений ещё и receipts
            # (tests/load/messenger/mixed.js): production-трафик — это
            # всегда смесь, не только POST messages.
            PROFILE="{{workflow.parameters.profile}}"
            if [ "$PROFILE" = "stress" ]; then
              SCRIPT_CONFIGMAP="k6-stress-script"
              SCRIPT_FILE="stress.js"
            elif [ "$PROFILE" = "mixed" ]; then
              SCRIPT_CONFIGMAP="k6-mixed-script"
              SCRIPT_FILE="mixed.js"
            elif [ "$PROFILE" = "media" ]; then
              # Раздел 31 - profile=media: файлы (инициация, загрузка, обработка
              # воркером, сообщение) и сигнальная часть звонков, tests/load/
              # messenger/media.js. Аудио и видео сами не нагружаются: их ведёт
              # browser-canary настоящими звонками (canary-calls.spec.ts).
              SCRIPT_CONFIGMAP="k6-media-script"
              SCRIPT_FILE="media.js"
            elif [ "$PROFILE" = "recovery" ]; then
              # Раздел 19 - profile=recovery: контролируемый backlog
              # (stage_high), потом возврат к базовой нагрузке (stage_low),
              # tests/load/messenger/recovery.js. Восстановился ли backlog -
              # решает не k6, а отдельный шаг recovery-check ниже по DAG,
              # уже после того, как этот TestRun завершится.
              SCRIPT_CONFIGMAP="k6-recovery-script"
              SCRIPT_FILE="recovery.js"
            else
              SCRIPT_CONFIGMAP="k6-messages-script"
              SCRIPT_FILE="messages.js"
            fi

            cat > /tmp/testrun.yaml <<EOF
            apiVersion: k6.io/v1alpha1
            kind: TestRun
            metadata:
              name: ${NAME}
              namespace: load-testing
            spec:
              parallelism: {{workflow.parameters.k6_parallelism}}
              arguments: "-o experimental-prometheus-rw --tag run_id={{workflow.parameters.run_id}} --tag git_sha={{workflow.parameters.git_sha}} --tag profile={{workflow.parameters.profile}}"
              script:
                configMap:
                  name: ${SCRIPT_CONFIGMAP}
                  file: ${SCRIPT_FILE}
              runner:
                env:
                  - name: K6_PROMETHEUS_RW_SERVER_URL
                    value: "http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428/api/v1/write"
                  - name: K6_PROMETHEUS_RW_TREND_STATS
                    # Формат k6 — p с процентилем в скобках, не голое
                    # число: короткая форма ловила "unknown format" и
                    # валила runner ещё до первой итерации, TestRun не
                    # доходил до stage=started, а k6-load крутился до
                    # собственного таймаута. Найдено живым прогоном сразу
                    # после мержа #65.
                    #
                    # В этом комментарии и в значении ниже нет ни одного
                    # обратного апострофа не случайно: эта строка живёт
                    # внутри неэкранированного heredoc чуть выше по этому
                    # же шаблону (cat с двумя угловыми скобками EOF), а
                    # ash из BusyBox (alpine/k8s) раскрывает обратные
                    # апострофы как подстановку команды даже в тексте
                    # YAML-комментария внутри такого heredoc. Именно это
                    # и уронило runner первым разом: пример значения в
                    # апострофах в предыдущей редакции этого комментария
                    # ash пытался распарсить как объявление shell-функции
                    # и падал с той же ошибкой, что сам этот комментарий
                    # объяснял.
                    value: "p(95),p(99),min,max,avg"
                  - name: RUN_ID
                    value: "{{workflow.parameters.run_id}}"
                  - name: USERS
                    value: "{{workflow.parameters.users}}"
                  - name: RUN_PASSWORD
                    value: "{{inputs.parameters.run_password}}"
                  - name: TARGET_RATE
                    value: "{{workflow.parameters.target_rate}}"
                  - name: DURATION
                    value: "{{workflow.parameters.duration}}"
                  - name: HIGH_RATE_FRACTION
                    value: "{{workflow.parameters.recovery_high_rate_fraction}}"
                  - name: HIGH_DURATION
                    value: "{{workflow.parameters.recovery_high_duration}}"
                  - name: CALL_PAIRS
                    value: "{{workflow.parameters.call_pairs}}"
                  - name: CALL_HOLD_SECONDS
                    value: "{{workflow.parameters.call_hold_seconds}}"
                  - name: FILE_BYTES
                    value: "{{workflow.parameters.file_bytes}}"
            EOF

            kubectl apply -f /tmp/testrun.yaml
            trap 'kubectl delete testrun -n load-testing "$NAME" --ignore-not-found' EXIT

            echo "жду завершения TestRun/$NAME..."
            stage=""
            for i in $(seq 1 180); do
              stage="$(kubectl get testrun -n load-testing "$NAME" -o jsonpath='{.status.stage}' 2>/dev/null || true)"
              [ "$stage" = "finished" ] || [ "$stage" = "error" ] && break
              sleep 2
            done
            echo "финальный stage=$stage"

            echo "--- лог runner-Job ---"
            kubectl logs -n load-testing "job/${NAME}-1" --tail=100 2>&1 || true

            succeeded="$(kubectl get job -n load-testing "${NAME}-1" -o jsonpath='{.status.succeeded}' 2>/dev/null || echo 0)"
            if [ "$stage" != "finished" ] || [ "${succeeded:-0}" != "1" ]; then
              echo "TestRun не завершился успешно (stage=$stage, job succeeded=$succeeded)"
              exit 1
            fi
            echo "TestRun завершился успешно"

            # Раздел 13 — HTTP 200/201 не считается доказательством
            # доставки. k6 уже знает, сколько сообщений сервер принял
            # (свой собственный Counter, не догадка снаружи) — это число
            # уходит в output-параметр, и reconciliation сверяет его с тем,
            # что реально осело в Postgres.
            kubectl logs -n load-testing "job/${NAME}-1" --tail=200 > /tmp/k6-log.txt 2>&1 || true
            accepted="$(grep 'load_run_accepted_messages' /tmp/k6-log.txt | awk -F': ' '{print $2}' | awk '{print $1}')"
            echo "${accepted:-0}" > /tmp/accepted-count
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
      outputs:
        parameters:
          - name: accepted_count
            valueFrom:
              path: /tmp/accepted-count

    # Раздел 19 - recovery profile. k6-load (profile=recovery) уже создал
    # backlog (stage_high) и вернулся к базовой нагрузке (stage_low) -
    # этот шаг запускается ПОСЛЕ того, как k6-load целиком завершится, то
    # есть входящий трафик к этому моменту уже остановлен целиком (не
    # "низкий, но продолжающийся", как в буквальной формулировке раздела
    # 19 - упрощение, сделанное сознательно: параллельный запуск
    # бесконечного низкого трафика и опроса до отдельного timeout -
    # отдельная оркестрационная задача, не решаемая одним шагом с
    # ограниченной длительностью). Опрашивает VictoriaMetrics, пока
    # backlog (outbox pending + суммарный Kafka lag consumer-группы) не
    # вернётся к малому базовому значению, устойчиво держащемуся
    # несколько подряд опросов подряд (порог не "ровно ноль" - метрика
    # может на секунду мигнуть между опросами, а не реальным backlog).
    # Не проходит в MAX_WAIT_SECONDS - шаг падает: раздел 25 явно требует
    # "recovery passed where applicable" как корректностный гейт.
    - name: recovery-check
      script:
        image: ghcr.io/vigregus/messenger-api@sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
        command: ["python"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
        source: |
          import asyncio
          import os
          import time

          import httpx

          RUN_ID = os.environ["RUN_ID"]
          VM = "http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428"
          OUTBOX_BASELINE = 1
          KAFKA_LAG_BASELINE = 2
          POLL_INTERVAL_SECONDS = 3
          POLL_STABLE_SAMPLES = 3
          MAX_WAIT_SECONDS = 300


          async def vm_query(client: httpx.AsyncClient, expr: str) -> float:
              r = await client.get(f"{VM}/api/v1/query", params={"query": expr}, timeout=10.0)
              r.raise_for_status()
              result = r.json()["data"]["result"]
              return float(result[0]["value"][1]) if result else 0.0


          async def main() -> None:
              async with httpx.AsyncClient() as client:
                  start = time.monotonic()
                  initial_backlog: float | None = None
                  stable = 0

                  while True:
                      elapsed = time.monotonic() - start
                      outbox = await vm_query(
                          client, 'sum(messenger_outbox_pending{namespace="messenger"})'
                      )
                      kafka_lag = await vm_query(
                          client, 'sum(kafka_consumergroup_lag{consumergroup="messenger-realtime"})'
                      )
                      if initial_backlog is None:
                          initial_backlog = outbox
                      print(f"t={elapsed:.1f}s outbox_pending={outbox:.0f} kafka_lag={kafka_lag:.0f}")

                      if outbox <= OUTBOX_BASELINE and kafka_lag <= KAFKA_LAG_BASELINE:
                          stable += 1
                      else:
                          stable = 0

                      if stable >= POLL_STABLE_SAMPLES:
                          recovery_seconds = max(
                              elapsed - (POLL_STABLE_SAMPLES - 1) * POLL_INTERVAL_SECONDS, 0.0
                          )
                          drain_rate = (
                              initial_backlog / recovery_seconds if recovery_seconds > 0 else 0.0
                          )
                          print(
                              f"recovery: backlog вернулся к базовому уровню за {recovery_seconds:.1f}s "
                              f"(initial_backlog={initial_backlog:.0f}, drain_rate={drain_rate:.2f} msg/s), "
                              f"run_id={RUN_ID}"
                          )
                          with open("/tmp/recovery-seconds", "w", encoding="utf-8") as f:
                              f.write(f"{recovery_seconds:.1f}")
                          with open("/tmp/backlog-drain-rate", "w", encoding="utf-8") as f:
                              f.write(f"{drain_rate:.2f}")
                          return

                      if elapsed >= MAX_WAIT_SECONDS:
                          print(
                              f"recovery FAILED: backlog не вернулся к базовому уровню за "
                              f"{MAX_WAIT_SECONDS}s (последний outbox_pending={outbox:.0f}, "
                              f"kafka_lag={kafka_lag:.0f}), run_id={RUN_ID}"
                          )
                          raise SystemExit(1)

                      await asyncio.sleep(POLL_INTERVAL_SECONDS)


          asyncio.run(main())
      outputs:
        parameters:
          - name: recovery_seconds
            valueFrom:
              path: /tmp/recovery-seconds
              default: ""
          - name: backlog_drain_rate
            valueFrom:
              path: /tmp/backlog-drain-rate
              default: ""

    # Раздел 14 — REST reconciliation: не доверять только HTTP-метрикам k6.
    # `accepted` (что подтвердил API) сверяется с тем, что реально
    # persisted в Postgres для бесед этого прогона. `persisted < accepted`
    # — потеря сообщений, и это должно валить Workflow (раздел 25:
    # корректностные гейты всегда fatal), а не просто попасть в лог.
    # `persisted > accepted` — не потеря, а сигнал повторного использования
    # run_id (в тех же беседах остались сообщения от предыдущего прогона с
    # тем же именем) — предупреждение, не отказ.
    #
    # Гранулярность пока агрегатная (count vs count), не по каждому
    # client_message_id/message_id/seq, как того требует полный раздел 13:
    # k6 не может пронести per-message список через границу Job без
    # артефакт-репозитория (раздел 24, ещё не заведён) — это документированное
    # сознательное сужение, а не то, что раздел 13 сделан целиком.
    - name: reconciliation
      inputs:
        parameters:
          - name: accepted_count
          - name: canary_failures
          - name: recovery_seconds
          - name: backlog_drain_rate
      script:
        image: ghcr.io/vigregus/messenger-api@sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
        command: ["python"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
          - name: GIT_SHA
            value: "{{workflow.parameters.git_sha}}"
          - name: PROFILE
            value: "{{workflow.parameters.profile}}"
          - name: USERS
            value: "{{workflow.parameters.users}}"
          - name: ONLINE_USERS
            value: "{{workflow.parameters.online_users}}"
          - name: TARGET_RATE
            value: "{{workflow.parameters.target_rate}}"
          - name: DURATION
            value: "{{workflow.parameters.duration}}"
          - name: ACCEPTED_COUNT
            value: "{{inputs.parameters.accepted_count}}"
          - name: CANARY_FAILURES
            value: "{{inputs.parameters.canary_failures}}"
          - name: RECOVERY_SECONDS
            value: "{{inputs.parameters.recovery_seconds}}"
          - name: BACKLOG_DRAIN_RATE
            value: "{{inputs.parameters.backlog_drain_rate}}"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
        source: |
          import asyncio
          import base64
          import json
          import os

          import httpx

          from messenger.repositories.postgres import PoolSettings, create_pool

          RUN_ID = os.environ["RUN_ID"]
          GIT_SHA = os.environ["GIT_SHA"]
          PROFILE = os.environ["PROFILE"]
          DURATION = os.environ["DURATION"]
          ACCEPTED = int(os.environ["ACCEPTED_COUNT"] or "0")
          VM = "http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428"


          def read_own_secret(namespace: str, name: str) -> dict[str, str]:
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ["KUBERNETES_SERVICE_PORT"]
              token = open(
                  "/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8"
              ).read().strip()
              ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              url = f"https://{host}:{port}/api/v1/namespaces/{namespace}/secrets/{name}"
              r = httpx.get(url, headers={"Authorization": f"Bearer {token}"}, verify=ca, timeout=10.0)
              r.raise_for_status()
              return {k: base64.b64decode(v).decode() for k, v in r.json()["data"].items()}


          async def main() -> None:
              db = read_own_secret("messenger", "messenger-db-app")
              pool = await create_pool(
                  PoolSettings(
                      host="messenger-db-pool.messenger.svc.cluster.local",
                      port=5432,
                      database=db.get("dbname", "messenger"),
                      user=db["user"],
                      password=db["password"],
                      min_size=1,
                      max_size=2,
                  ),
                  application_name="load-testing-reconciliation",
              )
              try:
                  pattern = f"local-capacity-{RUN_ID}-%"
                  user_ids = [
                      r["user_id"]
                      for r in await pool.fetch(
                          "select user_id from users where email like $1", pattern
                      )
                  ]
                  if not user_ids:
                      persisted = 0
                  else:
                      conv_ids = [
                          r["conversation_id"]
                          for r in await pool.fetch(
                              "select distinct conversation_id from conversation_members "
                              "where user_id = any($1::uuid[])",
                              user_ids,
                          )
                      ]
                      persisted = (
                          await pool.fetchval(
                              "select count(*) from messages where conversation_id = any($1::uuid[])",
                              conv_ids,
                          )
                          if conv_ids
                          else 0
                      )
              finally:
                  await pool.close()

              print(f"accepted (k6/API)={ACCEPTED} persisted (Postgres)={persisted} run_id={RUN_ID}")

              # Раздел 21 — сводные load_run_* метрики этого прогона, тегированные
              # run_id/git_sha/profile, пушатся в VictoriaMetrics ещё до решения
              # pass/fail: даже упавший по корректностному гейту прогон должен
              # оставить свою сводку, иначе именно проблемные прогоны — самые
              # интересные для последующего разбора — выпадали бы из истории.
              #
              # Из полного списка раздела 21 здесь — 8 из 12: offered
              # (load_run_accepted_messages — это HTTP-подтверждённое k6,
              # "offered" отдельно не считается), persisted, missing, HTTP
              # p95/p99, delivery p95, max outbox age, max Kafka lag. Не
              # хватает received_messages/duplicate_messages (нужна WS-
              # телеметрия браузера, раздел 13 не реализован целиком),
              # recovery_seconds (раздел 19 не реализован),
              # browser_canary_failures (раздел 16 не реализован).
              async def vm_query(client: httpx.AsyncClient, expr: str) -> float:
                  r = await client.get(f"{VM}/api/v1/query", params={"query": expr}, timeout=10.0)
                  r.raise_for_status()
                  result = r.json()["data"]["result"]
                  return float(result[0]["value"][1]) if result else 0.0

              async with httpx.AsyncClient() as client:
                  http_p95 = await vm_query(
                      client,
                      f'histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{{namespace="messenger"}}[{DURATION}])))',
                  )
                  http_p99 = await vm_query(
                      client,
                      f'histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{{namespace="messenger"}}[{DURATION}])))',
                  )
                  delivery_p95 = await vm_query(
                      client,
                      f'histogram_quantile(0.95, sum by (le) (rate(messenger_message_delivery_duration_seconds_bucket{{namespace="messenger"}}[{DURATION}])))',
                  )
                  max_outbox_age = await vm_query(
                      client,
                      f'max(max_over_time(messenger_outbox_oldest_age_seconds{{namespace="messenger"}}[{DURATION}]))',
                  )
                  max_kafka_lag = await vm_query(
                      client,
                      # Обе consumer group — messenger-realtime и messenger-unread,
                      # раньше здесь считалась только первая (тот же пробел,
                      # что уже закрыт в 05 · Capacity/LT-01 Load Run для
                      # визуализации; здесь — для summary-метрики, которую
                      # сравнивает LT-02 Load Compare).
                      f'max(max_over_time(kafka_consumergroup_lag{{consumergroup=~"messenger-(realtime|unread)"}}[{DURATION}]))',
                  )

                  # Раздел про "Capacity headroom" LT-02 Load Compare — те же
                  # peak-expr, что уже проверены живьём на 05 · Capacity/LT-01
                  # Load Run (worst-pod DB pool, container="keycloak" для
                  # идентификации самого identity-сервера среди postgres/
                  # operator/reconcile-джобов того же namespace, корректная
                  # формула 5xx без clamp_min на знаменателе-ставке). [{DURATION}]
                  # — то же окно прогона, что у остальных load_run_* метрик
                  # выше, не произвольный диапазон дашборда.
                  api_cpu_peak = await vm_query(
                      client,
                      f'max(max_over_time((sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{{namespace="messenger"}}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_cpu_cores{{namespace="messenger"}}))[{DURATION}]))',
                  )
                  api_memory_peak = await vm_query(
                      client,
                      f'max(max_over_time((sum by (pod, container) (node_namespace_pod_container:container_memory_working_set_bytes{{namespace="messenger"}}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_memory_bytes{{namespace="messenger"}}))[{DURATION}]))',
                  )
                  api_db_pool_peak = await vm_query(
                      client,
                      f'max(max_over_time((sum by (pod) (messenger_db_pool_connections{{namespace="messenger",state="in_use"}}) / clamp_min(sum by (pod) (messenger_db_pool_max_connections{{namespace="messenger"}}), 1))[{DURATION}]))',
                  )
                  keycloak_cpu_peak = await vm_query(
                      client,
                      f'max(max_over_time((sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{{namespace="keycloak",container="keycloak"}}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_cpu_cores{{namespace="keycloak",container="keycloak"}}))[{DURATION}]))',
                  )
                  keycloak_db_pool_peak = await vm_query(
                      client,
                      f'max_over_time((sum(agroal_active_count{{namespace="keycloak",datasource="default"}}) / clamp_min(sum(agroal_active_count{{namespace="keycloak",datasource="default"}}) + sum(agroal_available_count{{namespace="keycloak",datasource="default"}}), 1))[{DURATION}])',
                  )
                  keycloak_p99_peak = await vm_query(
                      client,
                      f'max_over_time((histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{{namespace="keycloak",uri="/realms/{{realm}}/protocol/{{protocol}}/token"}}[5m]))))[{DURATION}])',
                  )
                  keycloak_5xx_peak = await vm_query(
                      client,
                      f'max_over_time(((sum(rate(http_server_requests_seconds_count{{namespace="keycloak",outcome="SERVER_ERROR"}}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{{namespace="keycloak"}}[5m])))[{DURATION}])',
                  )

                  missing = max(ACCEPTED - persisted, 0)
                  labels = f'run_id="{RUN_ID}",git_sha="{GIT_SHA}",profile="{PROFILE}"'
                  metric_lines = [
                      f"load_run_accepted_messages{{{labels}}} {ACCEPTED}",
                      f"load_run_persisted_messages{{{labels}}} {persisted}",
                      f"load_run_missing_messages{{{labels}}} {missing}",
                      f"load_run_http_p95_seconds{{{labels}}} {http_p95}",
                      f"load_run_http_p99_seconds{{{labels}}} {http_p99}",
                      f"load_run_delivery_p95_seconds{{{labels}}} {delivery_p95}",
                      f"load_run_max_outbox_age_seconds{{{labels}}} {max_outbox_age}",
                      f"load_run_max_kafka_lag{{{labels}}} {max_kafka_lag}",
                      f"load_run_api_cpu_peak{{{labels}}} {api_cpu_peak}",
                      f"load_run_api_memory_peak{{{labels}}} {api_memory_peak}",
                      f"load_run_api_db_pool_peak{{{labels}}} {api_db_pool_peak}",
                      f"load_run_keycloak_cpu_peak{{{labels}}} {keycloak_cpu_peak}",
                      f"load_run_keycloak_db_pool_peak{{{labels}}} {keycloak_db_pool_peak}",
                      f"load_run_keycloak_p99_peak_seconds{{{labels}}} {keycloak_p99_peak}",
                      f"load_run_keycloak_5xx_peak{{{labels}}} {keycloak_5xx_peak}",
                  ]
                  # Раздел 19 — recovery-check выполняется только для
                  # profile=recovery (DAG `when`); для остальных профилей
                  # RECOVERY_SECONDS пуст, и строка метрики не добавляется
                  # вовсе, а не пушится нулём, которого не измеряли. Тот же
                  # довод для browser_canary_failures — browser-canary
                  # доступен не для всех профилей и не для каждого исхода.
                  recovery_seconds_raw = os.environ.get("RECOVERY_SECONDS", "").strip()
                  if recovery_seconds_raw:
                      metric_lines.append(f"load_run_recovery_seconds{{{labels}}} {recovery_seconds_raw}")
                  canary_failures_for_metric = os.environ.get("CANARY_FAILURES", "").strip()
                  if canary_failures_for_metric:
                      metric_lines.append(
                          f"load_run_browser_canary_failures{{{labels}}} {canary_failures_for_metric}"
                      )
                  summary = "\n".join(metric_lines) + "\n"
                  push = await client.post(f"{VM}/api/v1/import/prometheus", content=summary, timeout=10.0)
                  push.raise_for_status()
                  pushed_count = len(metric_lines)
                  print(
                      "summary-метрики раздела 21 отправлены в VictoriaMetrics "
                      f"(load_run_* × {pushed_count}, run_id={RUN_ID})"
                  )

                  # Раздел 24 — summary.json как Argo artifact, не только
                  # Argo stdout: пишется здесь же, до решения pass/fail (тем
                  # же доводом, что и push в VictoriaMetrics чуть выше) —
                  # упавший по корректностному гейту прогон самый интересный
                  # для разбора и не должен остаться без сводки.
                  canary_failures_raw = os.environ.get("CANARY_FAILURES", "").strip()
                  backlog_drain_rate_raw = os.environ.get("BACKLOG_DRAIN_RATE", "").strip()
                  summary_doc = {
                      "run_id": RUN_ID,
                      "git_sha": GIT_SHA,
                      "profile": PROFILE,
                      "users": int(os.environ["USERS"]),
                      "online_users": int(os.environ["ONLINE_USERS"]),
                      "target_rate": int(os.environ["TARGET_RATE"]),
                      "accepted": ACCEPTED,
                      "persisted": persisted,
                      # Раздел 13 (WS-телеметрия браузера) не реализован —
                      # `null`, потому что не измерено, а не потому, что ноль.
                      "ws_received": None,
                      "missing": missing,
                      "duplicates": None,
                      "http_p95_ms": round(http_p95 * 1000, 1),
                      "http_p99_ms": round(http_p99 * 1000, 1),
                      "delivery_p95_ms": round(delivery_p95 * 1000, 1),
                      "max_kafka_lag": max_kafka_lag,
                      "max_outbox_age_ms": round(max_outbox_age * 1000, 1),
                      # `browser-canary` печатает CANARY_METRICS до своего
                      # итогового `expect(failures).toBe(0)` — доступно и на
                      # упавшем прогоне canary, но не тогда, когда canary
                      # упал раньше первого тика (signIn() и т.п.): тогда
                      # метрика не измерена вовсе, и здесь честный `null`.
                      "browser_canary_failures": int(canary_failures_raw) if canary_failures_raw else None,
                      # Раздел 19 — recovery-check выполняется только для
                      # profile=recovery; для остальных профилей честный
                      # `null` (не измерено), не 0.
                      "recovery_seconds": float(recovery_seconds_raw) if recovery_seconds_raw else None,
                      "backlog_drain_rate": float(backlog_drain_rate_raw) if backlog_drain_rate_raw else None,
                  }
                  with open("/tmp/summary.json", "w", encoding="utf-8") as f:
                      json.dump(summary_doc, f, indent=2, ensure_ascii=False)
                      f.write("\n")
                  print(f"summary.json записан (раздел 24): {summary_doc}")

              if persisted < ACCEPTED:
                  missing = ACCEPTED - persisted
                  print(f"REST reconciliation FAILED: {missing} сообщений приняты API, но не найдены в Postgres")
                  raise SystemExit(1)
              if persisted > ACCEPTED:
                  # Раздел 16 — browser-canary шлёт настоящие сообщения в те
                  # же беседы, что и k6 (те же synthetic-пользователи), но
                  # k6 о них не знает — его Counter считает только то, что
                  # отправил он сам. Живой прогон с canary дал persisted=271
                  # при accepted=239: не потеря и не переиспользование
                  # run_id, а ожидаемая разница на число canary-обменов.
                  print(
                      f"предупреждение: persisted ({persisted}) > accepted ({ACCEPTED}) — "
                      "не потеря: либо run_id переиспользован (в беседах остались "
                      "сообщения прошлого прогона), либо разница объясняется "
                      "canary-сообщениями (раздел 16, если browser-canary "
                      "участвовал в этом прогоне) — canary пишет в те же беседы, "
                      "но не учтён в accepted"
                  )
              print("REST reconciliation passed")


          asyncio.run(main())
      outputs:
        artifacts:
          # Раздел 24 — "не полагаться только на Argo stdout". Собирается
          # независимо от исхода `main()` (та же гарантия, что и у
          # output-параметров `k6-load`/`browser-canary`): файл написан до
          # корректностного гейта, так что даже провалившийся прогон
          # оставляет свою сводку.
          - name: summary
            path: /tmp/summary.json

    # Раздел 9 — профиль identity не должен заранее выставлять
    # `emailVerified=true` (в отличие от provision для остальных
    # профилей): он проверяет настоящий поток `create user → login → /me
    # email_verified=false → письмо в Mailpit → ссылка подтверждения →
    # verified → /me email_verified=true → start_conversation`, а не
    # административную подмену флага. Логика подтверждения — тот же
    # алгоритм, что уже доказан в tests/integration/verification_check.py
    # (multi-redirect confirm_email — повторный вход и «Click here to
    # proceed», которые Keycloak запрашивает по ходу), перенесённый сюда
    # самодостаточным блоком, как и остальные script-шаблоны этого
    # Workflow.
    #
    # Identity throughput умышленно не смешивается с message throughput
    # (раздел 9 требует отдельного измерения) — этот шаг не создаёт ни
    # одной беседы и не шлёт ни одного сообщения. Keycloak CPU/RAM, DB
    # pressure и Mailpit ingestion, которые раздел 9 тоже перечисляет,
    # здесь не измеряются — это метрики инфраструктуры, а не этого шага, и
    # относятся к разделу 22 (Grafana dashboards), ещё не заведённому.
    - name: identity-load
      script:
        image: ghcr.io/vigregus/messenger-api@sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
        command: ["python"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
          - name: USERS
            value: "{{workflow.parameters.users}}"
          - name: TARGET_RATE
            value: "{{workflow.parameters.target_rate}}"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
        source: |
          import asyncio
          import base64
          import hashlib
          import html
          import os
          import re
          import secrets
          import time
          import uuid
          from urllib.parse import parse_qs, urljoin, urlparse

          import httpx

          KEYCLOAK = "http://messenger-idp-service.keycloak.svc.cluster.local:8080"
          REALM = "messenger"
          CLIENT_ID = "messenger-web"
          API = "http://api.messenger.svc.cluster.local"
          ORIGIN = "https://app.finops.local"
          REDIRECT = f"{ORIGIN}/callback"
          MAILPIT = "http://messenger-mailpit-http.messenger.svc.cluster.local"

          RUN_ID = os.environ["RUN_ID"]
          USERS = int(os.environ["USERS"])
          CONCURRENCY = max(1, min(int(os.environ["TARGET_RATE"]), 20))


          def read_own_secret(namespace: str, name: str) -> dict[str, str]:
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ["KUBERNETES_SERVICE_PORT"]
              token = open(
                  "/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8"
              ).read().strip()
              ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              url = f"https://{host}:{port}/api/v1/namespaces/{namespace}/secrets/{name}"
              r = httpx.get(url, headers={"Authorization": f"Bearer {token}"}, verify=ca, timeout=10.0)
              r.raise_for_status()
              return {k: base64.b64decode(v).decode() for k, v in r.json()["data"].items()}


          def pkce() -> tuple[str, str]:
              verifier = base64.urlsafe_b64encode(secrets.token_bytes(48)).rstrip(b"=").decode()
              digest = hashlib.sha256(verifier.encode()).digest()
              return verifier, base64.urlsafe_b64encode(digest).rstrip(b"=").decode()


          async def admin_token(http: httpx.AsyncClient, admin: dict[str, str]) -> str:
              r = await http.post(
                  f"{KEYCLOAK}/realms/master/protocol/openid-connect/token",
                  data={
                      "grant_type": "password",
                      "client_id": "admin-cli",
                      "username": admin["username"],
                      "password": admin["password"],
                  },
              )
              r.raise_for_status()
              return r.json()["access_token"]


          async def create_user(http: httpx.AsyncClient, token: str, login_email: str, password: str) -> None:
              headers = {"Authorization": f"Bearer {token}"}
              r = await http.post(
                  f"{KEYCLOAK}/admin/realms/{REALM}/users",
                  headers=headers,
                  json={
                      "username": login_email,
                      "email": login_email,
                      "emailVerified": False,
                      "enabled": True,
                      "firstName": "LOCAL-CAPACITY-001",
                      "lastName": RUN_ID,
                      "requiredActions": [],
                      "credentials": [{"type": "password", "value": password, "temporary": False}],
                  },
              )
              r.raise_for_status()


          async def authorization_code(
              browser: httpx.AsyncClient, login_email: str, password: str, challenge: str
          ) -> str | None:
              page = await browser.get(
                  f"{KEYCLOAK}/realms/{REALM}/protocol/openid-connect/auth",
                  params={
                      "client_id": CLIENT_ID,
                      "response_type": "code",
                      "scope": "openid",
                      "redirect_uri": REDIRECT,
                      "state": uuid.uuid4().hex,
                      "code_challenge": challenge,
                      "code_challenge_method": "S256",
                  },
              )
              page.raise_for_status()
              form = re.search(r'action="([^"]+)"', page.text)
              if not form:
                  return None
              parsed = urlparse(form.group(1).replace("&amp;", "&"))
              action = f"{KEYCLOAK}{parsed.path}" + (f"?{parsed.query}" if parsed.query else "")
              submitted = await browser.post(
                  action,
                  data={"username": login_email, "password": password},
                  cookies=page.cookies,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              location = submitted.headers.get("location", "")
              return parse_qs(urlparse(location).query).get("code", [None])[0]


          async def login(http: httpx.AsyncClient, login_email: str, password: str) -> tuple[str, uuid.UUID] | None:
              verifier, challenge = pkce()
              async with httpx.AsyncClient(timeout=15.0, follow_redirects=False) as browser:
                  code = await authorization_code(browser, login_email, password, challenge)
              if code is None:
                  return None
              device = uuid.uuid4()
              r = await http.post(
                  f"{API}/auth/callback",
                  json={
                      "code": code,
                      "code_verifier": verifier,
                      "redirect_uri": REDIRECT,
                      "device_id": str(device),
                  },
                  headers={"Origin": ORIGIN},
              )
              if r.status_code != 200:
                  return None
              return r.json()["access_token"], device


          async def wait_for_message(http: httpx.AsyncClient, address: str) -> dict | None:
              for _ in range(30):
                  r = await http.get(f"{MAILPIT}/api/v1/messages", params={"limit": 100})
                  r.raise_for_status()
                  for message in r.json().get("messages", []):
                      if any(rec.get("Address") == address for rec in message.get("To", [])):
                          return message
                  await asyncio.sleep(0.5)
              return None


          async def confirmation_link(http: httpx.AsyncClient, message_id: str) -> str | None:
              r = await http.get(f"{MAILPIT}/api/v1/message/{message_id}")
              r.raise_for_status()
              body = r.json().get("HTML", "") + "\n" + r.json().get("Text", "")
              candidates = re.findall(r'https?://[^"<>\s]+', html.unescape(body))
              return next((u for u in candidates if "login-actions/action-token" in u), None)


          def internal_link(external: str) -> str:
              parsed = urlparse(external)
              return f"{KEYCLOAK}{parsed.path}" + (f"?{parsed.query}" if parsed.query else "")


          def page_text(markup: str) -> str:
              markup = re.sub(r"<(script|style)[^>]*>.*?</\1>", " ", markup, flags=re.S | re.I)
              without_links = re.sub(r'href="[^"]+"', 'href="…"', markup)
              return " ".join(re.sub(r"<[^>]+>", " ", without_links).split())[:500]


          async def confirm_email(link: str, login_email: str, password: str) -> httpx.Response:
              async with httpx.AsyncClient(timeout=15.0, follow_redirects=False) as browser:
                  response = await browser.get(internal_link(link))
                  for _ in range(8):
                      if response.status_code in (301, 302, 303, 307, 308):
                          location = response.headers.get("location")
                          if not location:
                              return response
                          target = urljoin(str(response.url), html.unescape(location))
                          parsed = urlparse(target)
                          if parsed.path.startswith(f"/realms/{REALM}/"):
                              response = await browser.get(internal_link(target))
                              continue
                          return response
                      form = re.search(r'<form[^>]+action="([^"]+)"', response.text)
                      if form:
                          action = internal_link(html.unescape(form.group(1)))
                          response = await browser.post(
                              action,
                              data={"username": login_email, "password": password},
                              headers={"Content-Type": "application/x-www-form-urlencoded"},
                          )
                          continue
                      proceed = next(
                          (
                              href
                              for href, label in re.findall(
                                  r'<a[^>]+href="([^"]+)"[^>]*>(.*?)</a>',
                                  response.text,
                                  flags=re.S | re.I,
                              )
                              if "proceed" in page_text(label).lower()
                          ),
                          None,
                      )
                      if proceed:
                          response = await browser.get(internal_link(html.unescape(proceed)))
                          continue
                      return response
                  return response


          async def one_identity(http: httpx.AsyncClient, admin_tok: str, index: int, results: list[dict]) -> None:
              email = f"local-capacity-{RUN_ID}-identity-{index:06d}@finops.local"
              password = secrets.token_urlsafe(24)
              record: dict = {"email": email, "error": None}
              try:
                  t0 = time.monotonic()
                  await create_user(http, admin_tok, email, password)
                  record["register_s"] = time.monotonic() - t0

                  t1 = time.monotonic()
                  first = await login(http, email, password)
                  if first is None:
                      raise RuntimeError("первый логин (до подтверждения) не выдал токен")
                  access, device = first
                  record["login1_s"] = time.monotonic() - t1

                  headers = {"Authorization": f"Bearer {access}", "X-Device-Id": str(device)}
                  me = await http.get(f"{API}/me", headers=headers)
                  me.raise_for_status()
                  if me.json().get("email_verified") is not False:
                      raise RuntimeError(f"/me не показал email_verified=false: {me.text[:200]}")

                  t2 = time.monotonic()
                  message = await wait_for_message(http, email)
                  if message is None:
                      raise RuntimeError("письмо не дошло до Mailpit")
                  link = await confirmation_link(http, message["ID"])
                  if link is None:
                      raise RuntimeError("в письме нет ссылки подтверждения")
                  followed = await confirm_email(link, email, password)
                  if followed.status_code not in (200, 302, 303):
                      raise RuntimeError(f"подтверждение отказало: {followed.status_code}")
                  record["verify_s"] = time.monotonic() - t2

                  t3 = time.monotonic()
                  second = await login(http, email, password)
                  if second is None:
                      raise RuntimeError("логин после подтверждения не выдал токен")
                  access2, device2 = second
                  record["login2_s"] = time.monotonic() - t3

                  headers2 = {"Authorization": f"Bearer {access2}", "X-Device-Id": str(device2)}
                  me2 = await http.get(f"{API}/me", headers=headers2)
                  me2.raise_for_status()
                  body2 = me2.json()
                  if body2.get("email_verified") is not True or "start_conversation" not in (
                      body2.get("capabilities") or []
                  ):
                      raise RuntimeError(f"после подтверждения не выданы полные capabilities: {me2.text[:200]}")
              except Exception as exc:
                  record["error"] = str(exc)
              results.append(record)


          def p95(values: list[float]) -> float:
              if not values:
                  return 0.0
              ordered = sorted(values)
              idx = min(len(ordered) - 1, int(len(ordered) * 0.95))
              return ordered[idx]


          async def main() -> None:
              admin = read_own_secret("keycloak", "messenger-idp-initial-admin")
              results: list[dict] = []
              async with httpx.AsyncClient(timeout=15.0) as http:
                  admin_tok = await admin_token(http, admin)
                  semaphore = asyncio.Semaphore(CONCURRENCY)

                  async def bound(i: int) -> None:
                      async with semaphore:
                          await one_identity(http, admin_tok, i, results)

                  started = time.monotonic()
                  await asyncio.gather(*(bound(i) for i in range(1, USERS + 1)))
                  elapsed = max(time.monotonic() - started, 0.001)

              ok = [r for r in results if r["error"] is None]
              failed = [r for r in results if r["error"] is not None]

              print(f"identity-load: {len(ok)}/{USERS} identities прошли create→login→verify→login за {elapsed:.1f}s")
              print(f"registrations/s={len(results) / elapsed:.2f} verifications/s={len(ok) / elapsed:.2f}")
              print(f"login latency p95 (до подтверждения)={p95([r['login1_s'] for r in ok]):.3f}s")
              print(f"verification latency p95 (письмо→ссылка→подтверждено)={p95([r['verify_s'] for r in ok]):.3f}s")
              print(f"login latency p95 (после подтверждения)={p95([r['login2_s'] for r in ok]):.3f}s")
              print(f"errors={len(failed)}")
              for r in failed[:20]:
                  print(f"  ошибка {r['email']}: {r['error']}")

              if failed:
                  raise SystemExit(1)


          asyncio.run(main())

    # Раздел 15 — IP Cilium Gateway (namespace edge) читается на каждый
    # прогон, а не зашивается в манифест: адрес выдаёт minikube и он не
    # гарантированно стабилен между пересозданиями стенда. Только `get`
    # одного named Gateway — см. rbac-edge-gateway.yaml.
    - name: resolve-gateway-address
      container:
        # alpine/k8s, не rancher/kubectl: тому, что ниже, нужен `sh`, а
        # rancher/kubectl — минимальный образ без shell вовсе (в
        # preflight-k6-operator это не всплывало, потому что там `command`
        # без shell вызывает kubectl напрямую). Обнаружено живым прогоном:
        # "failed to find name in PATH: exec: sh: executable file not found".
        image: alpine/k8s:1.31.0
        command: ["sh", "-c"]
        args:
          - |
            set -eu
            kubectl get gateway -n edge edge -o jsonpath='{.status.addresses[0].value}' > /tmp/gateway-ip
            echo "edge Gateway IP: $(cat /tmp/gateway-ip)"
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 200m, memory: 128Mi}
      outputs:
        parameters:
          - name: gateway_ip
            valueFrom:
              path: /tmp/gateway-ip

    # Раздел 15 — до k6 benchmark два browser context должны пройти
    # production UI production-путём (то же публичное имя, тот же Origin,
    # та же цепочка TLS/Gateway, какой пойдёт настоящий браузер), иначе
    # нет смысла измерять performance системы, уже находящейся в broken
    # state.
    #
    # Переиспользован уже готовый и живо проверенный оркестратор
    # `scripts/web-e2e-fixture.sh` без изменения его логики — вместо
    # собственной копии auth/PKCE/cleanup, которая рано или поздно
    # разошлась бы с оригиналом. Из его собственных Playwright-проектов
    # здесь запускается только `acceptance` (спека g3-005: вход, список
    # бесед, восстановление состояния после перезагрузки) — `--project`
    # пробрасывается скриптом как есть (см. `set -- test "$@"` в нём).
    # g3-006/g3-007 сознательно не запускаются здесь: это полноценная
    # browser-приёмка на 6–15 минут каждая, а не smoke-гейт перед
    # benchmark — раздел 16 (browser canary) описывает похожую, но
    # отдельную и лёгкую параллельную проверку, которой пока нет.
    #
    # `app.finops.local`/`idp.finops.local` изнутри кластера не
    # резолвятся сами — тем же принципом, что и у самого скрипта («ни
    # одного .svc.cluster.local, ни одного tunnel»), сюда добавлен
    # `hostAliases`, указывающий эти публичные имена на IP edge Gateway:
    # тот же путь, каким идёт браузер снаружи, а не обходной внутренний.
    - name: playwright-smoke
      inputs:
        parameters:
          - name: gateway_ip
      hostAliases:
        - ip: "{{inputs.parameters.gateway_ip}}"
          hostnames: ["app.finops.local", "idp.finops.local", "rt.finops.local"]
      # `git`/`kubectl` берутся готовыми образами через initContainers, а не
      # ставятся внутрь playwright-образа на каждый прогон (`apt-get` внутри
      # Ubuntu noble работал бы, но медленнее и менее предсказуемо, чем два
      # уже проверенных в этом Workflow образа: rancher/kubectl — тем же,
      # каким пользуются preflight-k6-operator/k6-load/resolve-gateway-
      # address).
      volumes:
        - name: repo
          emptyDir: {}
        - name: kubectl-bin
          emptyDir: {}
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              git clone --quiet https://github.com/vigregus/kubernetes-finops-platform.git /repo
              cd /repo
              git checkout --quiet "{{workflow.parameters.git_sha}}"
          volumeMounts:
            - name: repo
              mountPath: /repo
        - name: kubectl-bin
          # alpine/k8s, не rancher/kubectl — тому нужен shell, см. тот же
          # разбор в resolve-gateway-address выше.
          image: alpine/k8s:1.31.0
          command: ["sh", "-c"]
          args:
            - "cp \"$(command -v kubectl)\" /kubectl-bin/kubectl"
          volumeMounts:
            - name: kubectl-bin
              mountPath: /kubectl-bin
      container:
        image: mcr.microsoft.com/playwright:v1.63.0-noble
        command: ["bash", "-c"]
        env:
          - name: PATH
            value: "/kubectl-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          - name: KEYCLOAK_NAMESPACE
            value: keycloak
          - name: KEYCLOAK_ADMIN_SECRET
            value: messenger-idp-initial-admin
          - name: NAMESPACE
            value: messenger
          - name: DB_POD
            value: messenger-db-1
          - name: DB_CONTAINER
            value: postgres
        volumeMounts:
          - name: repo
            mountPath: /repo
          - name: kubectl-bin
            mountPath: /kubectl-bin
        args:
          - |
            set -eu
            cd /repo/apps/web
            npm ci --no-audit --no-fund
            cd /repo
            bash scripts/web-e2e-fixture.sh --project=acceptance
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "2", memory: 2Gi}

    # Раздел 16 — небольшой browser canary параллельно k6 workload: 1–5
    # пар живых Chromium-контекстов, каждая периодически шлёт уникальный
    # текст и проверяет, что партнёр видит его без перезагрузки (реальный
    # WS через Centrifugo), а затем получает ответ тем же путём. k6 меряет
    # throughput через HTTP, reconciliation сверяет Postgres — ни один из
    # них не свидетель того, что реальный браузер с реальным соединением
    # видит сообщения в момент нагрузки; canary — этот свидетель.
    #
    # tests/e2e/canary.spec.ts переиспользует уже готовых synthetic-
    # пользователей и их беседы (provision/prepare-conversations) — своих
    # учётных записей не заводит и потому не нуждается в RBAC на Keycloak/
    # Postgres, которые нужны playwright-smoke: DB_POD/kubectl здесь не
    # используются вовсе.
    - name: browser-canary
      inputs:
        parameters:
          - name: gateway_ip
          - name: run_password
      hostAliases:
        - ip: "{{inputs.parameters.gateway_ip}}"
          hostnames: ["app.finops.local", "idp.finops.local", "rt.finops.local"]
      volumes:
        - name: repo
          emptyDir: {}
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              git clone --quiet https://github.com/vigregus/kubernetes-finops-platform.git /repo
              cd /repo
              git checkout --quiet "{{workflow.parameters.git_sha}}"
          volumeMounts:
            - name: repo
              mountPath: /repo
      container:
        image: mcr.microsoft.com/playwright:v1.63.0-noble
        command: ["bash", "-c"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
          - name: RUN_PASSWORD
            value: "{{inputs.parameters.run_password}}"
          - name: USERS
            value: "{{workflow.parameters.users}}"
          - name: DURATION
            value: "{{workflow.parameters.duration}}"
          - name: E2E_BASE_URL
            value: "https://app.finops.local"
          - name: E2E_IDP_ORIGIN
            value: "https://idp.finops.local"
          - name: E2E_STATE_FILE
            value: "/tmp/canary-state.json"
        volumeMounts:
          - name: repo
            mountPath: /repo
        args:
          - |
            set -eu

            # CANARY_PAIRS — не выше 5 (раздел 16: "не тысячи Chromium"), не
            # выше того, сколько пар prepare-conversations реально завёл
            # (USERS/2), и не ниже 1.
            PAIRS=$(( USERS / 2 ))
            [ "$PAIRS" -gt 5 ] && PAIRS=5
            [ "$PAIRS" -lt 1 ] && PAIRS=1
            export CANARY_PAIRS="$PAIRS"

            # DURATION — тот же k6-style формат ("2m", "30s"), что и у
            # k6-load: canary работает весь k6-прогон, не дольше и не
            # короче, поэтому окно должно совпасть, а не подбираться
            # отдельным параметром Workflow.
            case "$DURATION" in
              *ms) SECONDS=$(( ${DURATION%ms} / 1000 )) ;;
              *s) SECONDS=${DURATION%s} ;;
              *m) SECONDS=$(( ${DURATION%m} * 60 )) ;;
              *h) SECONDS=$(( ${DURATION%h} * 3600 )) ;;
              *) echo "неизвестный формат DURATION: $DURATION" >&2; exit 1 ;;
            esac
            export CANARY_DURATION_SECONDS="$SECONDS"

            echo "browser-canary: $CANARY_PAIRS пар(ы), ${CANARY_DURATION_SECONDS}s"

            cd /repo/apps/web
            npm ci --no-audit --no-fund

            # Раздел 24 — summary.json прогона несёт browser_canary_failures,
            # а не только Argo stdout. `CANARY_METRICS` печатается спекой
            # (canary.spec.ts) ДО итогового `expect(failures).toBe(0)`, то
            # есть доступен и на упавшем прогоне — но не тогда, когда сам
            # canary упал раньше (например, signIn() бросил до первого
            # тика): в этом случае честнее оставить output-параметр пустым,
            # чем подставить 0, которого не измерили.
            set +e

            # Раздел 31 — profile=media: к текстовому canary добавляются настоящие
            # звонки с аудио и видео (canary-calls.spec.ts). Они идут **параллельно**
            # текстовому и k6, а не после: текстовый canary обходит пары по очереди и
            # сам занимает окно целиком. Свой каталог результатов (`--output`): два
            # запуска Playwright в одном каталоге стирают артефакты друг друга.
            CALLS_PID=""
            if [ "{{workflow.parameters.profile}}" = "media" ]; then
              export CALL_PAIRS="{{workflow.parameters.call_pairs}}"
              export CANARY_CALL_HOLD_SECONDS="{{workflow.parameters.call_hold_seconds}}"
              export CANARY_CALL_PAIRS="{{workflow.parameters.canary_call_pairs}}"
              echo "browser-canary: звонки, $CANARY_CALL_PAIRS пар(ы)"
              ( npx playwright test --project=canary-calls --output=/tmp/pw-calls \
                  >/tmp/canary-calls-output.txt 2>&1; echo $? >/tmp/canary-calls-status ) &
              CALLS_PID=$!
            fi

            npx playwright test --project=canary 2>&1 | tee /tmp/canary-output.txt
            status="${PIPESTATUS[0]}"

            if [ -n "$CALLS_PID" ]; then
              wait "$CALLS_PID"
              cat /tmp/canary-calls-output.txt
              grep -E 'CANARY_CALLS_METRICS ' /tmp/canary-calls-output.txt | tail -1 || true
              calls_status="$(cat /tmp/canary-calls-status 2>/dev/null || echo 1)"
              [ "$calls_status" -ne 0 ] && status="$calls_status"
            fi
            set -e
            # [0-9]+ (grep -E), не [0-9]* - на упавшем тесте Playwright печатает
            # исходный код строки ассерта в error-context, а он буквально содержит
            # `console.log(\`CANARY_METRICS failures=${failures}...\`)`: ту же
            # фразу, но с шаблонной переменной вместо числа. С [0-9]* (ноль цифр
            # допустим) это тоже совпадение - пустое, без единой цифры после "=" -
            # и оно идёт в выводе ПОСЛЕ настоящей строки с реальным числом, то
            # есть именно его забирает `tail -1`. Итог был обратным замыслу
            # комментария выше: не "честно оставить пустым, когда правда
            # неизвестна", а "затереть известное число пустым" - ровно на упавших
            # прогонах, где реальное falures=N важнее всего. Найдено на живом
            # прогоне (verify-limits-220413): canary.spec.ts напечатал
            # "failures=21", а в summary.json долетел browser_canary_failures=None.
            grep -oE 'CANARY_METRICS failures=[0-9]+' /tmp/canary-output.txt | tail -1 |
              grep -o '[0-9]*$' > /tmp/canary-failures || true
            exit "$status"
        # Лимит с запасом под profile=media: четыре Chromium с фейковым видео
        # (две пары) тяжелее текстового canary.
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {cpu: "3", memory: 3Gi}
      outputs:
        parameters:
          - name: canary_failures
            valueFrom:
              path: /tmp/canary-failures
              default: ""

    # Раздел 26 — cleanup выполняется как `onExit`, независимо от исхода
    # Workflow (в том числе после Failed/Error), и снимает только
    # пользователей текущего `run_id` — по точному совпадению префикса
    # логина, не widecard DELETE по шаблону письма. `cleanup=false`
    # оставляет synthetic-аккаунты нетронутыми — сознательный выбор
    # вызывающего (например, чтобы руками посмотреть на них после прогона),
    # а не сбой уборки.
    - name: cleanup
      script:
        image: ghcr.io/vigregus/messenger-api@sha256:36e63da2032997821e84f3993abd988ebf837d5f58c7d61f6e3a7351f0e3d8ce
        command: ["python"]
        env:
          - name: RUN_ID
            value: "{{workflow.parameters.run_id}}"
          - name: CLEANUP
            value: "{{workflow.parameters.cleanup}}"
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
        source: |
          import asyncio
          import base64
          import os

          import httpx

          from messenger.repositories.postgres import PoolSettings, create_pool

          KEYCLOAK = "http://messenger-idp-service.keycloak.svc.cluster.local:8080"
          REALM = "messenger"
          RUN_ID = os.environ["RUN_ID"]
          CLEANUP = os.environ.get("CLEANUP", "true")


          def read_own_secret(namespace: str, name: str) -> dict[str, str]:
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ["KUBERNETES_SERVICE_PORT"]
              token = open(
                  "/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8"
              ).read().strip()
              ca = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
              url = f"https://{host}:{port}/api/v1/namespaces/{namespace}/secrets/{name}"
              r = httpx.get(url, headers={"Authorization": f"Bearer {token}"}, verify=ca, timeout=10.0)
              r.raise_for_status()
              return {k: base64.b64decode(v).decode() for k, v in r.json()["data"].items()}


          async def admin_token(http: httpx.AsyncClient, admin: dict[str, str]) -> str:
              r = await http.post(
                  f"{KEYCLOAK}/realms/master/protocol/openid-connect/token",
                  data={
                      "grant_type": "password",
                      "client_id": "admin-cli",
                      "username": admin["username"],
                      "password": admin["password"],
                  },
              )
              r.raise_for_status()
              return r.json()["access_token"]


          async def main() -> None:
              if CLEANUP != "true":
                  print(f"cleanup=false — synthetic users for run_id={RUN_ID} оставлены как есть")
                  return

              admin = read_own_secret("keycloak", "messenger-idp-initial-admin")
              prefix = f"local-capacity-{RUN_ID}-"
              removed = 0

              async with httpx.AsyncClient(timeout=15.0) as http:
                  token = await admin_token(http, admin)
                  headers = {"Authorization": f"Bearer {token}"}
                  first = 0
                  while True:
                      r = await http.get(
                          f"{KEYCLOAK}/admin/realms/{REALM}/users",
                          headers=headers,
                          params={"username": prefix, "first": first, "max": 100},
                      )
                      r.raise_for_status()
                      page = r.json()
                      if not page:
                          break
                      for user in page:
                          if not user["username"].startswith(prefix):
                              continue
                          d = await http.delete(
                              f"{KEYCLOAK}/admin/realms/{REALM}/users/{user['id']}", headers=headers
                          )
                          if d.status_code not in (204, 404):
                              d.raise_for_status()
                          removed += 1
                      first += len(page)

              print(f"cleanup удалил {removed} synthetic-пользователей Keycloak для run_id={RUN_ID}")

              # Раздел 26 требует снимать не только Keycloak-аккаунт, но и то,
              # что он успел оставить в messenger: строку в users (заводится
              # на первый логин), diалоги/сообщения prepare-conversations и
              # k6-load, сессии/устройства. Keycloak и messenger — разные
              # системы с разным жизненным циклом: удаление в одной не
              # каскадирует в другую, и без этого блока Postgres копил бы
              # синтетические данные вечно (найдено живьём: 1325 строк
              # users после серии прогонов при разработке этого шаблона).
              db = read_own_secret("messenger", "messenger-db-app")
              pool = await create_pool(
                  PoolSettings(
                      host="messenger-db-pool.messenger.svc.cluster.local",
                      port=5432,
                      database=db.get("dbname", "messenger"),
                      user=db["user"],
                      password=db["password"],
                      min_size=1,
                      max_size=2,
                  ),
                  application_name="load-testing-cleanup",
              )
              try:
                  # `email LIKE` здесь безопасен как run-scoped фильтр: адрес
                  # уже содержит run_id целиком (та же схема именования, что
                  # у Keycloak username выше), а не общий префикс вида
                  # 'load-%', который раздел 26 явно запрещает — такой задел
                  # бы чужие прогоны.
                  pattern = f"local-capacity-{RUN_ID}-%"
                  async with pool.acquire() as conn:
                      async with conn.transaction():
                          user_ids = [
                              r["user_id"]
                              for r in await conn.fetch(
                                  "select user_id from users where email like $1", pattern
                              )
                          ]
                          if not user_ids:
                              removed_users = 0
                          else:
                              conv_ids = [
                                  r["conversation_id"]
                                  for r in await conn.fetch(
                                      "select distinct conversation_id from conversation_members "
                                      "where user_id = any($1::uuid[])",
                                      user_ids,
                                  )
                              ]
                              # Дети раньше родителей — сознательно последовательные
                              # execute, а не один составной CTE-запрос: порядок
                              # здесь важнее компактности, и явный порядок не зависит
                              # от того, какие FK в этой схеме объявлены RESTRICT,
                              # а какие CASCADE.
                              await conn.execute(
                                  "delete from unread_projection where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              await conn.execute(
                                  "delete from unread_offsets where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              await conn.execute(
                                  "delete from read_states where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              # Раздел 31 — profile=media оставляет звонки (их сигналы и
                              # участники уходят каскадом) и вложения: те и другие держат
                              # ссылки на сообщения и пользователей, поэтому идут раньше
                              # них. Объекты в хранилище здесь не удаляются (у шага нет
                              # доступа к MinIO): строки уходят, файлы остаются до уборки
                              # хранилища; размер файла в профиле задан параметром.
                              await conn.execute(
                                  "delete from calls where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              await conn.execute(
                                  "delete from attachments where uploader_id = any($1::uuid[])",
                                  user_ids,
                              )
                              await conn.execute(
                                  "delete from messages where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              await conn.execute(
                                  "delete from conversation_members where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              await conn.execute(
                                  "delete from conversations where conversation_id = any($1::uuid[])",
                                  conv_ids,
                              )
                              await conn.execute(
                                  "delete from realtime_connections where user_id = any($1::uuid[])",
                                  user_ids,
                              )
                              await conn.execute(
                                  "delete from sessions where user_id = any($1::uuid[])", user_ids
                              )
                              await conn.execute(
                                  "delete from devices where user_id = any($1::uuid[])", user_ids
                              )
                              await conn.execute(
                                  "delete from blocks where blocker_id = any($1::uuid[]) "
                                  "or blocked_id = any($1::uuid[])",
                                  user_ids,
                              )
                              await conn.execute(
                                  "delete from users where user_id = any($1::uuid[])", user_ids
                              )
                              removed_users = len(user_ids)
              finally:
                  await pool.close()
              print(f"cleanup удалил {removed_users} synthetic-пользователей messenger (Postgres) для run_id={RUN_ID}")


          asyncio.run(main())
