# Раздел 24 плана (docs/messenger/15-load-testing-platform.md) — Argo
# artifact repository. Отдельный bootstrap SA/Job, не расширение прав
# `load-testing-workflow`: та явно объявляет "Secret — только читается"
# (rbac.yaml) — workflow сам ничего не пишет. Тот же приём, что
# messenger-realm-reconcile у Keycloak (messenger-keycloak/manifests/
# reconcile.yaml): узкий одноразовый bootstrap отдельной учётной записью,
# не постоянное расширение прав исполнителя воркфлоу.
#
# Джоб копирует root-креды MinIO (messenger-minio-env, namespace
# messenger) в секрет load-testing-minio-artifact-repo (namespace
# load-testing) под именами ключей, которые ждёт artifactRepository
# Argo Workflows (values.yaml, gitops/02-infra/argo-workflows). Root, не
# отдельный IAM-пользователь/policy на один бакет: тот же сознательный
# компромисс, что уже в tenant.yaml — на однонодовом локальном стенде
# заводить mc-провижининг отдельного пользователя ради одного CI-бакета
# не оправдано, и это указано явно, а не скрыто.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: load-testing-artifact-repo-bootstrap
  namespace: load-testing
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-testing-artifact-repo-bootstrap
  namespace: messenger
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["messenger-minio-env"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-testing-artifact-repo-bootstrap
  namespace: messenger
subjects:
  - kind: ServiceAccount
    name: load-testing-artifact-repo-bootstrap
    namespace: load-testing
roleRef:
  kind: Role
  name: load-testing-artifact-repo-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-testing-artifact-repo-bootstrap
  namespace: load-testing
rules:
  # create+patch на весь ресурс, не resourceNames: create не может назвать
  # ресурс, которого ещё нет — тот же довод, что у Keycloak reconcile.yaml
  # про секрет messenger-api-client в namespace messenger.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-testing-artifact-repo-bootstrap
  namespace: load-testing
subjects:
  - kind: ServiceAccount
    name: load-testing-artifact-repo-bootstrap
    namespace: load-testing
roleRef:
  kind: Role
  name: load-testing-artifact-repo-bootstrap
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: load-testing-artifact-repo-bootstrap
  namespace: load-testing
  annotations:
    # Тот же хук, что у messenger-realm-reconcile: поля Job неизменяемы,
    # обычный ресурс упал бы на втором синке.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: load-testing-artifact-repo-bootstrap
        app.kubernetes.io/component: bootstrap
        finops.internal/product: messenger
        finops.internal/team: platform-engineering
        finops.internal/environment: local
        finops.internal/component: load-testing
    spec:
      restartPolicy: Never
      serviceAccountName: load-testing-artifact-repo-bootstrap
      containers:
        - name: bootstrap
          image: bitnami/kubectl:1.31
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # config.env — файл для оператора MinIO в формате shell-
              # export'ов (messenger-secrets/manifests/bootstrap.yaml), не
              # обычные env-переменные пода — разбирается grep/cut, не
              # source: секрет не должен исполняться как код.
              RAW=$(kubectl -n messenger get secret messenger-minio-env -o jsonpath='{.data.config\.env}' | base64 -d)
              USER=$(echo "$RAW" | grep MINIO_ROOT_USER | cut -d= -f2)
              PASSWORD=$(echo "$RAW" | grep MINIO_ROOT_PASSWORD | cut -d= -f2)
              [ -n "$USER" ] && [ -n "$PASSWORD" ] || {
                echo "не удалось разобрать messenger-minio-env" >&2; exit 1; }

              kubectl -n load-testing create secret generic load-testing-minio-artifact-repo \
                --from-literal=accesskey="$USER" \
                --from-literal=secretkey="$PASSWORD" \
                --dry-run=client -o yaml | kubectl apply -f - >/dev/null
              echo "load-testing-minio-artifact-repo: учётные данные перенесены"
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
