# docs/messenger/15-load-testing-platform.md, раздел 8 — provisioning читает
# initial-admin секрет Keycloak (`messenger-idp-initial-admin`, namespace
# `keycloak`), тот же, которым уже пользуется `scripts/web-e2e-fixture.sh`.
# Секрет живёт не в `load-testing`, поэтому namespace-scoped Role оттуда
# (`rbac.yaml`) его не достаёт — нужен отдельный Role в namespace `keycloak`,
# и он называет ровно один секрет по имени (`resourceNames`), а не весь
# ресурс `secrets` целиком.
#
# Пароль этого секрета — реальная (не synthetic-fixture) учётная запись
# администратора Keycloak. `provision`/`cleanup` читают его напрямую через
# Kubernetes API изнутри своего Python-процесса и используют только в
# памяти — ни как Argo output/input parameter, ни в лог, ни в файл: они
# наблюдаемы через `kubectl get workflow -o yaml`, и настоящий admin-пароль
# туда попадать не должен (synthetic run-пароль — другое дело, он
# одноразовый и снимается вместе с run_id).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-testing-read-idp-admin-secret
  namespace: keycloak
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["messenger-idp-initial-admin"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-testing-workflow-read-idp-admin-secret
  namespace: keycloak
subjects:
  - kind: ServiceAccount
    name: load-testing-workflow
    namespace: load-testing
roleRef:
  kind: Role
  name: load-testing-read-idp-admin-secret
  apiGroup: rbac.authorization.k8s.io
