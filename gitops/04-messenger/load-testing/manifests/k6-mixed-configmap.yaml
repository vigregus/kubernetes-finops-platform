# Раздел 17 плана (docs/messenger/15-load-testing-platform.md) — профиль
# `mixed`. Тот же стопгэп, что и k6-messages-configmap.yaml/
# k6-stress-configmap.yaml: содержимое — точная копия
# tests/load/messenger/mixed.js и lib/auth.js, синхронизация ручная до
# раздела 24 (Argo artifacts). auth.js здесь дублирует остальные
# k6-*-configmap.yaml байт-в-байт по той же причине: k6 Operator
# монтирует script.configMap одной директорией на TestRun, общий
# ConfigMap для нескольких скриптов не годится.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-mixed-script
  namespace: load-testing
data:
  mixed.js: |
    import http from 'k6/http';
    import crypto from 'k6/crypto';
    import { check } from 'k6';
    import { Counter, Trend } from 'k6/metrics';

    import { login, authHeaders, API } from './auth.js';

    // Профиль `mixed` (docs/messenger/15-load-testing-platform.md, раздел 17)
    // — не только `POST messages`: часть клиентов генерирует receipts
    // (delivered_seq/read_seq), потому что этот путь нагружает DB/unread
    // projection/realtime publication по-другому, чем просто запись
    // сообщения, и production-трафик — это всегда смесь, а не только отправка.
    //
    // Два независимых k6-сценария вместо одного с ветвлением внутри
    // итерации: у k6 каждый сценарий выделяет свои VU от 1, поэтому "VU 1
    // сценария messages" и "VU 1 сценария receipts" — разные synthetic-
    // пользователи по построению. Пары (1,2)(3,4)... — те же, что уже завела
    // prepare-conversations: нечётный номер пары шлёт сообщения, чётный —
    // квитирует.

    const RUN_ID = __ENV.RUN_ID;
    const USERS = parseInt(__ENV.USERS || '10', 10);
    const RUN_PASSWORD = __ENV.RUN_PASSWORD;
    const TARGET_RATE = parseInt(__ENV.TARGET_RATE || '10', 10);
    const DURATION = __ENV.DURATION || '30s';
    // Receipts — не отдельный параметр Workflow: доля от того же target_rate,
    // как и просит раздел 17 ("часть клиентов"), не отдельно настраиваемый
    // поток.
    const RECEIPT_RATE = Math.max(1, Math.round(TARGET_RATE * 0.5));
    const PAIRS = Math.max(1, Math.floor(USERS / 2));

    const accepted = new Counter('load_run_accepted_messages');
    const offered = new Counter('load_run_offered_messages');
    const sendDuration = new Trend('load_run_send_duration_ms', true);
    const receiptsAccepted = new Counter('load_run_accepted_receipts');
    const receiptsOffered = new Counter('load_run_offered_receipts');
    const receiptDuration = new Trend('load_run_receipt_duration_ms', true);

    export const options = {
      scenarios: {
        messages: {
          executor: 'constant-arrival-rate',
          rate: TARGET_RATE,
          timeUnit: '1s',
          duration: DURATION,
          preAllocatedVUs: Math.max(TARGET_RATE * 2, 2),
          maxVUs: Math.max(TARGET_RATE * 4, 4),
          exec: 'sendMessage',
        },
        receipts: {
          executor: 'constant-arrival-rate',
          rate: RECEIPT_RATE,
          timeUnit: '1s',
          duration: DURATION,
          preAllocatedVUs: Math.max(RECEIPT_RATE * 2, 2),
          maxVUs: Math.max(RECEIPT_RATE * 4, 4),
          exec: 'sendReceipt',
        },
      },
    };

    function uuidv4() {
      const bytes = new Uint8Array(crypto.randomBytes(16));
      bytes[6] = (bytes[6] & 0x0f) | 0x40;
      bytes[8] = (bytes[8] & 0x3f) | 0x80;
      const hex = Array.from(bytes)
        .map((x) => x.toString(16).padStart(2, '0'))
        .join('');
      return `${hex.slice(0, 8)}-${hex.slice(8, 12)}-${hex.slice(12, 16)}-${hex.slice(16, 20)}-${hex.slice(20)}`;
    }

    // Логин кэшируется на VU (один поход за прогон), а список бесед — нет: у
    // receipts значение имеет именно текущий seq, и кэшировать его означало
    // бы слать одну и ту же квитанцию всю длительность прогона, а не отражать
    // движение реальной переписки во время нагрузки.
    let cachedToken = null;

    function loginForPair(offsetFromPairStart) {
      if (cachedToken) return cachedToken;
      const pair = ((__VU - 1) % PAIRS) + 1;
      const index = pair * 2 - 1 + offsetFromPairStart;
      const email = `local-capacity-${RUN_ID}-${String(index).padStart(6, '0')}@finops.local`;
      cachedToken = login(email, RUN_PASSWORD);
      return cachedToken;
    }

    const senderLoginOdd = () => loginForPair(0);
    const senderLoginEven = () => loginForPair(1);

    function firstConversation(token) {
      const r = http.get(`${API}/conversations`, { headers: authHeaders(token) });
      if (r.status !== 200) {
        throw new Error(`не удалось получить список бесед: ${r.status} ${r.body}`);
      }
      const items = JSON.parse(r.body).items || [];
      if (items.length === 0) {
        throw new Error('у пользователя нет ни одной беседы — prepare-conversations не отработал для него');
      }
      return items[0];
    }

    export function sendMessage() {
      const token = senderLoginOdd();
      const conversationId = firstConversation(token).conversation_id;

      offered.add(1);
      const start = Date.now();
      const res = http.post(
        `${API}/conversations/${conversationId}/messages`,
        JSON.stringify({
          client_message_id: uuidv4(),
          type: 'text',
          payload: { text: `load-testing-mixed ${RUN_ID} ${Date.now()}` },
          attachment_ids: [],
        }),
        { headers: authHeaders(token) },
      );
      sendDuration.add(Date.now() - start);

      const ok = check(res, {
        'сообщение принято (200/201)': (r) => r.status === 200 || r.status === 201,
      });
      if (ok) {
        accepted.add(1);
      }
    }

    export function sendReceipt() {
      const token = senderLoginEven();
      const conversation = firstConversation(token);
      const conversationId = conversation.conversation_id;
      const seq = conversation.last_message ? conversation.last_message.seq : 0;

      receiptsOffered.add(1);
      const start = Date.now();
      const res = http.post(
        `${API}/conversations/${conversationId}/receipts`,
        JSON.stringify({ delivered_seq: seq, read_seq: seq }),
        { headers: authHeaders(token) },
      );
      receiptDuration.add(Date.now() - start);

      const ok = check(res, {
        'квитанция принята (200)': (r) => r.status === 200,
      });
      if (ok) {
        receiptsAccepted.add(1);
      }
    }
  auth.js: |
    import http from 'k6/http';
    import encoding from 'k6/encoding';
    import crypto from 'k6/crypto';

    // Тот же production-совместимый code+PKCE поток, что проверяет
    // tests/integration/login_check.py и уже используют provision/
    // prepare-conversations (Python-версия того же алгоритма, в
    // gitops/04-messenger/load-testing/manifests/workflow-template.yaml) —
    // не самодельный JWT (docs/messenger/15-load-testing-platform.md, раздел 8).
    export const KEYCLOAK = 'http://messenger-idp-service.keycloak.svc.cluster.local:8080';
    export const REALM = 'messenger';
    export const CLIENT_ID = 'messenger-web';
    export const API = 'http://api.messenger.svc.cluster.local';
    export const ORIGIN = 'https://app.finops.local';
    export const REDIRECT = `${ORIGIN}/callback`;

    function pkce() {
      const verifierBytes = crypto.randomBytes(48);
      const verifier = encoding.b64encode(verifierBytes, 'rawurl');
      const digestBinary = crypto.sha256(verifier, 'binary');
      const challenge = encoding.b64encode(digestBinary, 'rawurl');
      return { verifier, challenge };
    }

    // `URL`/`URLSearchParams` — не везде доступны в k6 JS-рантайме,
    // поэтому разбор строки запроса и извлечение `action="..."` — ручные
    // регулярки, а не встроенный парсер, как в Python-версии этого потока.
    function queryParam(qs, name) {
      const re = new RegExp(`[?&]${name}=([^&]*)`);
      const m = qs.match(re);
      return m ? decodeURIComponent(m[1]) : null;
    }

    function pathAndQuery(url) {
      const idx = url.indexOf('/', url.indexOf('://') + 3);
      return idx === -1 ? '' : url.slice(idx);
    }

    /**
     * Логинит одного synthetic-пользователя и возвращает access_token.
     * Бросает исключение на любом отклонении от happy path — вызывающий
     * решает, ловить его или дать k6 засчитать это как ошибку итерации.
     */
    export function login(email, password) {
      // Не __VU/__ITER: login() зовётся и из setup() (stress.js) — контекста
      // без VU, где __ITER не определена (ReferenceError). state — непрозрачная
      // anti-replay строка, ей нужна только уникальность в пределах прогона.
      const state = `${encodeURIComponent(email)}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
      const { verifier, challenge } = pkce();

      // Свой cookie jar на каждый вызов — не общий VU-jar по умолчанию.
      // Живой дефект (верификация §18, прогон stress-probe4): setup()
      // логинит нескольких пользователей последовательно в одном VU-
      // контексте, и без изолированного jar кука второго логина утекла
      // бы из первого — Keycloak узнал бы уже вошедшего и увёл сразу в
      // callback чужим кодом, минуя форму.
      const jar = new http.CookieJar();

      const authUrl =
        `${KEYCLOAK}/realms/${REALM}/protocol/openid-connect/auth?` +
        `client_id=${CLIENT_ID}&response_type=code&scope=openid&` +
        `redirect_uri=${encodeURIComponent(REDIRECT)}&state=${state}&` +
        `code_challenge=${challenge}&code_challenge_method=S256`;

      const page = http.get(authUrl, { jar });
      if (page.status !== 200) {
        throw new Error(`страница входа вернула ${page.status} для ${email}`);
      }
      const formMatch = page.body.match(/action="([^"]+)"/);
      if (!formMatch) {
        throw new Error(`форма входа не найдена для ${email}`);
      }
      // Keycloak строит абсолютную ссылку на свой внешний hostname
      // (idp.finops.local), которого изнутри кластера нет — переписываем
      // источник на внутренний, как и login_check.py.
      const action = `${KEYCLOAK}${pathAndQuery(formMatch[1].replace(/&amp;/g, '&'))}`;

      const submitted = http.post(
        action,
        { username: email, password: password },
        { redirects: 0, jar },
      );
      const location = submitted.headers['Location'] || submitted.headers['location'];
      if (!location) {
        throw new Error(`форма входа не перенаправила для ${email} (status ${submitted.status})`);
      }
      const code = queryParam(location, 'code');
      if (!code) {
        throw new Error(`в перенаправлении нет code для ${email}`);
      }

      const exchanged = http.post(
        `${API}/auth/callback`,
        JSON.stringify({ code, code_verifier: verifier, redirect_uri: REDIRECT }),
        { headers: { 'Content-Type': 'application/json', Origin: ORIGIN } },
      );
      if (exchanged.status !== 200) {
        throw new Error(`обмен кода отказал для ${email}: ${exchanged.status} ${exchanged.body}`);
      }
      return JSON.parse(exchanged.body).access_token;
    }

    export function authHeaders(token) {
      return { Authorization: `Bearer ${token}`, Origin: ORIGIN, 'Content-Type': 'application/json' };
    }
