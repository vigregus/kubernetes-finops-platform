# docs/messenger/15-load-testing-platform.md, раздел 26 — cleanup должен
# снимать не только Keycloak-аккаунты, но и то, что они успели оставить в
# messenger: users/sessions/devices/conversations/messages. Для этого
# нужны те же креды, которыми ходит само приложение — секрет
# `messenger-db-app` (CNPG, `kubernetes.io/basic-auth`), namespace
# `messenger`. Тот же принцип, что и в rbac-keycloak-admin-secret.yaml:
# `get` ровно на один секрет по имени (`resourceNames`), не на весь
# ресурс `secrets` в чужом namespace, и пароль читается только в память
# Python-процесса — никогда не уходит в Argo output/лог/файл.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: load-testing-read-messenger-db-secret
  namespace: messenger
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["messenger-db-app"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: load-testing-workflow-read-messenger-db-secret
  namespace: messenger
subjects:
  - kind: ServiceAccount
    name: load-testing-workflow
    namespace: load-testing
roleRef:
  kind: Role
  name: load-testing-read-messenger-db-secret
  apiGroup: rbac.authorization.k8s.io
