# Учётные данные Kafka в namespace приложения.
#
# KafkaUser живёт там же, где кластер, и оператор кладёт пароль в Secret
# в namespace kafka. Нагрузки мессенджера работают в messenger, а секреты
# через границу namespace не видны - значит, значение надо перенести.
#
# Перенос, а не генерация: пароль выдаёт оператор Strimzi, он же его
# меняет при пересоздании пользователя. Своё значение здесь означало бы
# два источника истины и расхождение при первой же ротации.
#
# Джоб идемпотентен и переносит только тех пользователей, чьи нагрузки
# живут в messenger. Учётная запись проверки связности сюда не попадает:
# smoke запускает поды в namespace kafka и читает секрет там же.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: messenger-kafka-credentials
  namespace: messenger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: messenger-kafka-credentials
  namespace: kafka
rules:
  # Только чтение и только там, где секреты рождаются.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: messenger-kafka-credentials
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: messenger-kafka-credentials
subjects:
  - kind: ServiceAccount
    name: messenger-kafka-credentials
    namespace: messenger
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: messenger-kafka-credentials
  namespace: messenger
rules:
  # patch - потому что `kubectl apply` обновляет патчем; без него джоб
  # создаёт секрет в первый раз и падает во второй, то есть ровно тогда,
  # когда пароль сменился и перенос нужен.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: messenger-kafka-credentials
  namespace: messenger
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: messenger-kafka-credentials
subjects:
  - kind: ServiceAccount
    name: messenger-kafka-credentials
    namespace: messenger
---
apiVersion: batch/v1
kind: Job
metadata:
  name: messenger-kafka-credentials
  namespace: messenger
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # После KafkaUser: переносить нечего, пока оператор не создал секрет.
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: messenger-kafka-credentials
        app.kubernetes.io/component: bootstrap
        finops.internal/product: messenger
        finops.internal/team: platform-engineering
        finops.internal/environment: local
        finops.internal/component: messaging
    spec:
      restartPolicy: Never
      serviceAccountName: messenger-kafka-credentials
      containers:
        - name: copy
          image: alpine/k8s:1.34.1
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              for user in messenger-outbox messenger-realtime messenger-notifications; do
                # Оператор создаёт секрет не мгновенно: ждём, а не падаем
                # на первой же попытке - иначе синк выглядит сломанным
                # там, где всё просто ещё не готово.
                ok=0
                for _ in $(seq 1 30); do
                  if kubectl -n kafka get secret "$user" >/dev/null 2>&1; then ok=1; break; fi
                  sleep 2
                done
                [ "$ok" = "1" ] || { echo "секрета $user в namespace kafka нет" >&2; exit 1; }

                pw="$(kubectl -n kafka get secret "$user" -o jsonpath='{.data.password}')"
                [ -n "$pw" ] || { echo "у $user пустой пароль" >&2; exit 1; }

                # Значение переносится как есть, в base64, и уходит через
                # stdin: в аргументах команды оно было бы видно в списке
                # процессов контейнера.
                kubectl apply -f - >/dev/null <<EOF
              apiVersion: v1
              kind: Secret
              metadata:
                name: $user
                namespace: messenger
                labels:
                  finops.internal/product: messenger
                  finops.internal/component: messaging
              type: Opaque
              data:
                password: $pw
              EOF
                echo "$user: перенесён"
              done
