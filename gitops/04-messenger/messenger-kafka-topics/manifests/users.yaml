    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource: {type: topic, name: messenger.events.v1}
        operations: [Read, Describe]
      - resource: {type: topic, name: messenger.content.v1}
        operations: [Read, Describe]
      - resource: {type: group, name: messenger-realtime}
