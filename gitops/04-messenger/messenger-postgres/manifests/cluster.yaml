apiVersion: postgresql.cnpg.io/v1
kind: Cluster

metadata:
  name: messenger-db
  namespace: messenger

  labels:
    app.kubernetes.io/name: messenger-db
    app.kubernetes.io/component: database
    finops.internal/product: messenger
    finops.internal/team: platform-engineering
    finops.internal/environment: local
    finops.internal/component: database

spec:
  # Локальное окружение не пытается быть HA - у него другая задача:
  # корректность потока сообщений. Кворумная синхронная репликация,
  # описанная в архитектуре, относится к stage и проду.
  instances: 1

  bootstrap:
    initdb:
      database: messenger
      owner: messenger

      # Сравнение строк по байтам, а не по локали.
      # Сортировка сообщений в беседе идёт по conversation_seq,
      # а не по тексту, зато поведение индексов перестаёт зависеть
      # от того, с какой локалью собран образ.
      localeCollate: C
      localeCType: C

  postgresql:
    # pg_stat_statements собирает агрегированную статистику всех
    # нормализованных SQL statements.
    #
    # shared_preload_libraries управляется CNPG отдельным полем:
    # попытка положить его в parameters отвергается webhook'ом
    # как fixed configuration.
    shared_preload_libraries:
      - pg_stat_statements

    parameters:
      max_connections: "200"

      # Конкретные SQL executions медленнее 200 ms попадают
      # в PostgreSQL log.
      #
      # Дальше существующий Promtail pipeline извлекает:
      #   duration_ms
      #   trace_id
      #   sql
      #
      # Поэтому:
      #   pg_stat_statements -> агрегаты всех запросов
      #   PostgreSQL logs    -> конкретные медленные запросы
      log_min_duration_statement: "200"

      # Позволяет отличать ожидание row/table lock от просто
      # медленного CPU/storage execution.
      log_lock_waits: "on"

  # User-defined metrics exported from pg_stat_statements.
  #
  # ConfigMap lives in the same namespace and is automatically
  # reloaded because it carries cnpg.io/reload.
  monitoring:
    customQueriesConfigMap:
      - name: messenger-db-query-stats
        key: queries

  storage:
    size: 2Gi

  # Метки CNPG сам на поды не переносит - без этого блока
  # workload выпадет из FinOps-разбивки по продукту.
  inheritedMetadata:
    labels:
      finops.internal/product: messenger
      finops.internal/team: platform-engineering
      finops.internal/environment: local
      finops.internal/component: database

  resources:
    requests:
      cpu: 100m
      memory: 256Mi

    limits:
      cpu: "1"
      memory: 1Gi

  # Секрет с паролем роли messenger оператор создаёт сам:
  # messenger-db-app:
  #   host
  #   port
  #   dbname
  #   user
  #   password
  #   uri
  #
  # Приложение читает его, а не хранит пароль в values.
  enableSuperuserAccess: false