apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: messenger-db
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger-db
    app.kubernetes.io/component: database
    finops.internal/product: messenger
    finops.internal/team: platform-engineering
    finops.internal/environment: local
    finops.internal/component: database
spec:
  # Локальное окружение не пытается быть HA - у него другая задача:
  # корректность потока сообщений. Кворумная синхронная репликация,
  # описанная в архитектуре, относится к stage и проду.
  instances: 1

  bootstrap:
    initdb:
      database: messenger
      owner: messenger
      # Сравнение строк по байтам, а не по локали. Сортировка сообщений
      # в беседе идёт по conversation_seq, а не по тексту, зато поведение
      # индексов перестаёт зависеть от того, с какой локалью собран образ.
      localeCollate: C
      localeCType: C

  postgresql:
    # Источник данных для «медленных запросов» на дашбордах: без него видно
    # только, что база загружена, но не чем именно. Отдельным полем, а не
    # в parameters: shared_preload_libraries управляет сам CNPG, и попытка
    # задать её как параметр отвергается вебхуком как fixed configuration.
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      max_connections: "200"
      # Без этого Postgres не пишет ни строки о конкретном медленном
      # запросе - pg_stat_statements выше даёт только агрегат по
      # нормализованному тексту, без привязки к моменту и без trace_id.
      # 200мс - ниже целевой задержки коммита сообщения (99.95% ≤ 1с,
      # messenger_message_commit_duration_seconds), чтобы ловить именно
      # то, что реально угрожает этому SLO, а не весь трафик.
      #
      # promtail уже разбирает такие строки (../../../02-infra/
      # observability-objects/promtail/values.yaml, app="postgresql") -
      # тот регэксп до сих пор был наполовину простаивающим именно
      # потому, что этот параметр нигде не был включён.
      log_min_duration_statement: "200"
      # Отдельно от log_min_duration_statement: `membership.check`
      # (repositories/messages.py, lock_active_conversation) - это
      # SELECT ... FOR UPDATE, блокировка строки беседы. Без
      # log_lock_waits ожидание чужой блокировки неотличимо от медленного
      # диска ни в логе, ни в спане (docs/messenger/06-observability.md,
      # «Чего в этих спанах нет»).
      log_lock_waits: "on"

  storage:
    size: 2Gi

  # Метки CNPG сам на поды не переносит - без этого блока и поды, и сервисы
  # выпадут из разбивки затрат по продукту, ради которой вся платформа и есть.
  inheritedMetadata:
    labels:
      finops.internal/product: messenger
      finops.internal/team: platform-engineering
      finops.internal/environment: local
      finops.internal/component: database

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # Секрет с паролем роли messenger оператор создаёт сам:
  # messenger-db-app (host, port, dbname, user, password, uri).
  # Приложение читает его, а не хранит пароль в values.
  enableSuperuserAccess: false
