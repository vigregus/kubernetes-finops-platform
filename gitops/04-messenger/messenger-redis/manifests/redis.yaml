# Архитектура различает три роли Redis - realtime (брокер Centrifugo, history,
# presence), app-cache (профили, метаданные бесед, членство) и security
# (лимиты частоты, попытки входа). В проде это три ElastiCache: у них разная
# критичность и разный радиус поражения. Локально это один экземпляр и три
# номера БД - ровно то, что записано в таблице окружений.
#
#   DB 0   realtime
#   DB 1   app-cache
#   DB 2   security
#
# Разделение по номеру БД слабее, чем по экземпляру: общий процесс, общая
# память, общий FLUSHALL. Оно держит только одну гарантию - что приложение
# не перепутает ключи ролей, - и этого для локальной разработки достаточно.
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: Redis
metadata:
  name: messenger-redis
  namespace: messenger
  labels:
    app.kubernetes.io/name: messenger-redis
    app.kubernetes.io/component: cache
    finops.internal/product: messenger
    finops.internal/team: platform-engineering
    finops.internal/environment: local
    finops.internal/component: cache
spec:
  kubernetesConfig:
    image: quay.io/opstree/redis:v7.2.3
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  redisConfig:
    additionalRedisConfig: messenger-redis-config

  # Проверки Redis оператор по умолчанию строит так: `redis-cli -h $(hostname)
  # ping` с таймаутом 1 с и тремя провалами. Имя пода — это DNS, и на узле,
  # который подтормаживает, проверка не укладывалась в секунду; а при замирании
  # узла целиком проваливались три подряд. Итог: 36 перезапусков за неделю, хотя
  # сам Redis простаивал (7 МиБ). Здесь: адрес без DNS (`127.0.0.1`), таймаут
  # 5 с, а живость терпит около двух минут (12 провалов по 10 с).
  livenessProbe:
    exec:
      command:
        - sh
        - -ec
        - 'RESP="$(redis-cli -h 127.0.0.1 -p ${REDIS_PORT} ping)"; [ "$RESP" = "PONG" ]'
    initialDelaySeconds: 1
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 12
    successThreshold: 1
  readinessProbe:
    exec:
      command:
        - sh
        - -ec
        - 'RESP="$(redis-cli -h 127.0.0.1 -p ${REDIS_PORT} ping)"; [ "$RESP" = "PONG" ]'
    initialDelaySeconds: 1
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    successThreshold: 1

  # До этого Redis не наблюдался вообще: ни memory/evictions/ops/clients,
  # ни keyspace hit-rate — только слово "Redis" в карте дашбордов. Оператор
  # заводит sidecar с oliver006/redis_exporter сам, порт 9121 — снимает его
  # gitops/04-messenger/messenger-redis/manifests/pod-scrape.yaml.
  redisExporter:
    enabled: true
    image: oliver006/redis_exporter:v1.62.0
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi

  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: messenger-redis-config
  namespace: messenger
data:
  # volatile-lru, а не allkeys-lru: вытесняются только ключи с TTL, то есть
  # ровно класс кеша. Ключи realtime без TTL - presence и history Centrifugo -
  # при заполнении памяти остаются, и переполнение проявляется ошибкой записи,
  # а не тихой потерей присутствия.
  #
  # В проде этого компромисса нет: там у каждой роли свой экземпляр и своя
  # политика.
  redis-additional.conf: |
    maxmemory-policy volatile-lru
    appendonly no
    save ""
