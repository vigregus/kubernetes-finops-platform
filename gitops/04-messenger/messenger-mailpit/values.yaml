# Приёмник почты, а не служба рассылки. AUTH-006 требует подтверждения адреса,
# то есть письмо должно быть отправлено и прочитано. Без локального стока этот
# тест упирается во внешнего провайдера: письма уходят настоящим людям,
# автотест не может их прочитать, а разработка без интернета не работает.
#
# Mailpit принимает SMTP и ничего никуда не пересылает. Письмо видно
# в веб-интерфейсе и доступно через HTTP API - именно поэтому по нему
# можно писать автотест на подтверждение адреса.
replicaCount: 1

podLabels:
  finops.internal/product: messenger
  finops.internal/team: platform-engineering
  finops.internal/environment: local
  finops.internal/component: mail-sink

# Пресет чарта запрашивает больше, чем нужно стоку писем на одном узле.
resourcesPreset: none
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

service:
  smtp:
    # 1025, а не 25: порты ниже 1024 требуют прав, которых у пода нет,
    # и контейнер Mailpit слушает 1025 внутри.
    port: 1025
