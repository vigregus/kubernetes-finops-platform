apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finops-platform
  namespace: argocd
spec:
  description: GitOps project for kubernetes-finops-platform resources
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
