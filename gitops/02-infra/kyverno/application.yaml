apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: finops-platform
  sources:
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://kyverno.github.io/kyverno/
      chart: kyverno
      targetRevision: 3.5.3
      helm:
        valueFiles:
          - $values/gitops/02-infra/kyverno/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: governance-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
