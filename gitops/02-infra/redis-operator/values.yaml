# Третий оператор данных в платформе, рядом с CNPG и Strimzi. Он даёт тот же
# профит, что и они: форма артефакта одна локально и в проде. Локально это
# standalone Redis (CRD Redis), в проде - RedisReplication + RedisSentinel,
# и переход между ними не переписывает деплой, а меняет CR.

redisOperator:
  # Пусто = смотреть все namespace. Оператор один на кластер, а CR живут
  # в namespace своих приложений; ограничивать его собственным namespace
  # означало бы по оператору на каждое приложение.
  watchNamespace: ""
  # Вебхук нужен только для masterSlaveAntiAffinity в репликации. Локально
  # реплик нет, а включённый вебхук - это ещё и сертификат, и точка отказа
  # на пути создания любого Redis.
  webhook: false

# Чарт по умолчанию просит 500m CPU на оператор, который почти всё время спит.
# На одноузловом стенде это заметная доля бюджета, поэтому request опущен;
# limit оставлен, чтобы всплеск реконсиляции не съел узел.
resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 500Mi

replicas: 1
