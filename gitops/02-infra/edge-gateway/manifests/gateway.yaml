# The edge, served by the cilium-envoy DaemonSet that was already running for
# L7 network policy. No new deployment: that is the whole point of using the
# CNI's gateway rather than a second ingress controller.
#
# It ran beside ingress-nginx while the two were compared on the same load
# profile; nginx lost on CPU and p95 and has since been removed, so this is
# now the only way into the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: edge
  namespace: edge
  labels:
    finops.internal/product: platform
    finops.internal/team: platform-engineering
    finops.internal/environment: prod
    finops.internal/component: api-gateway
    finops.internal/cost-center: platform-infra
    finops.internal/owner: platform-team
spec:
  gatewayClassName: cilium
  listeners:
    # Plain HTTP is kept, and kept useless on purpose: every route attached to
    # it answers a redirect. Closing port 80 outright would turn a
    # http:// bookmark into a connection refused rather than a redirect.
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.finops.local"
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.finops.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: edge-tls
      allowedRoutes:
        # Routes may live in the namespaces that own the services they point
        # at, which is the division Gateway API exists for: the platform owns
        # the listener and the certificate, each team owns its own routing.
        namespaces:
          from: All
