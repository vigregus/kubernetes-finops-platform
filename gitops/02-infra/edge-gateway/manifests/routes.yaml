# Routing rules, as data rather than as annotations.
#
# This is the practical difference from the ingress-nginx setup they replace.
# There, the same behaviour needs nginx.ingress.kubernetes.io/* annotations -
# free-form strings validated by nothing, whose meaning is specific to one
# controller. Here matching is a typed field: a wrong key is rejected by the
# API server rather than silently ignored at runtime.
#
# Rules are evaluated by specificity, not by order in the file: a longer path
# prefix wins over a shorter one regardless of where it appears. That is
# Gateway API's rule, and it removes the ordering bugs that ingress path lists
# are prone to.

# --- redirect every plain-HTTP request ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  namespace: edge
spec:
  parentRefs:
    - name: edge
      # Bound to the HTTP listener only. Without sectionName this route would
      # also attach to the HTTPS listener and redirect it to itself.
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            # 301, not 302: the redirect is permanent and browsers should stop
            # asking. A 302 here means every client keeps making two requests
            # forever, which on this stand would double the measured rps.
            statusCode: 301
---
# --- the shop ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shop
  namespace: prod
  labels:
    finops.internal/product: commerce
    finops.internal/team: payments
    finops.internal/environment: prod
    finops.internal/component: api-gateway
    finops.internal/cost-center: commerce
    finops.internal/owner: payments-team
spec:
  parentRefs:
    - name: edge
      namespace: edge
      sectionName: https
  hostnames:
    - shop.finops.local
  rules:
    # A header-matched rule, which is how a canary is steered before any
    # traffic is split by weight: send yourself to the new version, confirm it
    # works, then move percentages. Both backends are the same service today -
    # the shape is what matters, and the weight is the only line that changes.
    - matches:
        - path:
            type: PathPrefix
            value: /checkout
          headers:
            - name: x-canary
              value: "true"
      backendRefs:
        - name: checkout
          port: 80
          weight: 100

    - matches:
        - path:
            type: PathPrefix
            value: /checkout
      backendRefs:
        - name: checkout
          port: 80
          weight: 100
      filters:
        # Proof, in a response header, of which gateway served the request.
        # With nginx and Cilium both answering during the migration, "which
        # one did I just measure" otherwise has no answer at the client.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: x-served-by
                value: cilium-gateway

    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: x-served-by
                value: cilium-gateway
---
# --- analytics, on its own hostname ---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: analytics
  namespace: prod
  labels:
    finops.internal/product: insights
    finops.internal/team: data
    finops.internal/environment: prod
    finops.internal/component: api-gateway
    finops.internal/cost-center: insights
    finops.internal/owner: data-team
spec:
  parentRefs:
    - name: edge
      namespace: edge
      sectionName: https
  hostnames:
    - analytics.finops.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: analytics
          port: 80
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: x-served-by
                value: cilium-gateway
