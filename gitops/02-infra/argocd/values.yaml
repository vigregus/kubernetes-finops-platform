# ArgoCD не GitOps-managed этим репозиторием: установлен вручную через
# `helm install argocd argo/argo-cd -n argocd` (chart argo-cd-10.4.0,
# без values — helm get values argocd показывает "null"). Это классическая
# курица-и-яйцо: сам себя через собственный Application он развернуть не
# может, поэтому его bootstrap живёт вне gitops/ — см. Makefile, цель
# bootstrap (хотя её текущая реализация ставит через голый install.yaml,
# а не Helm — расхождение с тем, что реально стоит в кластере; не
# исправлялось здесь намеренно, отдельная задача).
#
# Этот файл НЕ применяется автоматически ничем. Он существует, чтобы
# `server.insecure` не потерялся при следующем `helm upgrade` — до этого
# коммита флаг был выставлен только live-патчем ConfigMap
# argocd-cmd-params-cm, а Helm при upgrade перезаписывает весь рендер
# чарта (в отличие от аддитивного kubectl apply), то есть живой патч
# пережил бы что угодно кроме именно helm upgrade — ровно того случая,
# для которого этот файл и нужен.
#
# Зачем сам флаг: argocd-server без --insecure сам держит TLS на 8080
# (Service-порты http:80 и https:443 оба ведут туда) и редиректит
# обычный HTTP на https, не читая X-Forwarded-Proto без этого флага —
# проверено живьём (307 что с заголовком, что без). Cilium Gateway
# (gitops/02-infra/platform-access/manifests/httproute-argocd.yaml)
# сам терминирует TLS и форвардит backend'ам обычным HTTP — без
# --insecure это бесконечный редирект.
#
# Применить при следующем upgrade:
#   helm upgrade argocd argo/argo-cd -n argocd -f gitops/02-infra/argocd/values.yaml
configs:
  params:
    server.insecure: "true"

# controller - это application-controller: он держит в памяти полное
# дерево live-ресурсов каждого Application и пересчитывает diff при
# каждом sync. Без лимитов он один съедает CPU-бюджет единственного
# узла ровно тогда, когда это больнее всего: сразу после merge-triggered
# sync `messenger-load-testing`/`grafana-dashboards`, впритык к старту
# нагрузочного теста - того самого, который уже показал перегрузку узла
# по CPU (node_cpu_seconds_total доходил до 96-99% во время прогона,
# см. gitops/04-messenger/load-testing). Live-замер в покое (kubectl
# top): 988Mi RAM / 25m CPU - limits ниже взяты с запасом под всплеск
# синка, а не под это значение в покое.
controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
