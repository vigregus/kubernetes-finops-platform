controller:
  # LoadBalancer would need `minikube tunnel` running in the background -
  # NodePort keeps this reproducible with just `kubectl`/Argo CD, no extra
  # standing process. Reach it via `minikube service -n ingress-nginx
  # ingress-nginx-controller --url` or `kubectl port-forward`.
  service:
    type: NodePort
  config:
    # ingress-nginx bundles the nginx OpenTelemetry module - this makes it
    # the actual trace origin for anything hitting it without an existing
    # traceparent header (e.g. k6), and forwards/continues one for anything
    # that already has it. See apps/checkout and apps/analytics: both
    # extract() the incoming context instead of always starting a new root
    # span, so this is picked up automatically once wired.
    enable-opentelemetry: "true"
    opentelemetry-trust-incoming-span: "true"
    otlp-collector-host: "tempo-local.observability.svc.cluster.local"
    otlp-collector-port: "4317"
    otel-service-name: "ingress-nginx"
    # Default access log format has no trace_id at all, so the ingress hop
    # was invisible to trace-to-logs correlation. JSON (not plain text) so
    # VictoriaLogs auto-parses it and promotes trace_id to a real field,
    # same as apps/checkout and apps/analytics's own JSON log lines -
    # otherwise this would only be full-text searchable, not field-matchable
    # by the query in gitops/02-infra/observability-objects/datasources/tempo.yaml.
    # VictoriaLogs' JSON auto-parser requires the primary text field to be
    # named "_msg" specifically (see apps/*/app.py log_json) - without it,
    # every line here was dropped as "missing _msg field" despite having
    # trace_id right there in the same JSON object.
    # _msg is a full combined-log-style line (client IP, request, status,
    # which upstream pod it was proxied to, timing) so it reads like a
    # real access log at a glance in the Logs panel, which only renders
    # _msg inline - remote_addr/upstream_addr etc. below are kept as
    # separate fields too so they're still queryable/filterable on their
    # own, not just visible in this string.
    log-format-escape-json: "true"
    # No literal quotes around $request here (even though that would read
    # closer to a classic combined log) - nginx's escape=json modifier
    # only JSON-escapes variable substitutions, not literal characters
    # written into the format string, so a hand-written `"` around a
    # variable comes out unescaped and breaks the JSON structure.
    log-format-upstream: '{"_msg": "$remote_addr - $request $status $body_bytes_sent -> upstream=$upstream_addr ($upstream_status) in ${request_time}s", "time": "$time_iso8601", "remote_addr": "$remote_addr", "status": "$status", "request_time": "$request_time", "upstream_addr": "$upstream_addr", "upstream_status": "$upstream_status", "host": "$host", "trace_id": "$opentelemetry_trace_id"}'
  # Exposes the controller's own request-rate/latency/error metrics
  # (nginx_ingress_controller_*) on a separate :10254 service - without
  # this the ingress hop is only visible as traces/access-log lines, with
  # no RPS/latency/error dashboard for the entry point itself. Scraped by
  # gitops/02-infra/ingress-nginx/manifests/service-scrape.yaml.
  metrics:
    enabled: true
