apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: finops-platform
  sources:
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      path: gitops/02-infra/cnpg-operator/manifests
      directory:
        recurse: true
    - repoURL: https://cloudnative-pg.github.io/charts
      chart: cloudnative-pg
      targetRevision: 0.29.0
      helm:
        releaseName: cnpg
        valueFiles:
          - $values/gitops/02-infra/cnpg-operator/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    # Ambient снят: mesh в окружении разработки не используется. Комментарий
    # ниже описывал, зачем оператору была нужна идентичность при STRICT —
    # это остаётся верным для прода и вернётся вместе с ним.
    #
    # Оператор обращается к каждому экземпляру Postgres напрямую на порт 8000
    # (/pg/status). При STRICT-политике такой вызов извне mesh не несёт
    # идентичности и отвергается на транспорте — на Cluster это выглядит как
    # "Instance Status Extraction Error: HTTP communication issue".
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
