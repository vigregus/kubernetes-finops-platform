tempo:
  # 72h, а не 24h. Раньше это было короче, чем retentionPeriod
  # VictoriaLogs (7d, см. ../victoria-logs/values.yaml) - расследование,
  # начатое позже суток после события (обычный случай: жалоба дошла не
  # сразу), находило нужный лог, а переход "View trace" вёл в пустоту
  # без объяснения. 72h - не полное совпадение с 7d логов: трейсы
  # тяжелее логов на единицу времени, и синтетический трафик (100%
  # трассируется) утроил бы объём при полных 7d. 72h - ближайший
  # разумный компромисс: закрывает "на следующий день" и "после
  # выходных", не закрывает "через неделю" - для этого нужен отдельный
  # source of truth, а не увеличение TTL здесь.
  retention: 72h
  # Только OTLP. Jaeger и Zipkin, включённые чартом по умолчанию, убраны
  # намеренно: ими никто не пользуется, а открытый порт — это поверхность,
  # которую никто не собирался обслуживать.
  #
  # Здесь же исправление записи: сначала я решил, что OTLP в Tempo не включён,
  # и что это и есть причина сброса соединений. Это было неверно — OTLP был
  # настроен с самого начала. Настоящей причиной оказалось ambient: поды
  # остались помеченными как включённые в mesh, но перенаправление у них не
  # восстановилось после перезапуска кластера.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  metricsGenerator:
    # Without this, Tempo's metrics-generator never starts - "Service Graph"
    # and TraceQL metrics queries (`{...} | rate() by (...)`) fail with
    # "error finding generators: empty ring", since single-binary Tempo
    # still routes those through the generator component's ring.
    enabled: true
    remoteWriteUrl: "http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428/api/v1/write"
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
persistence:
  enabled: true
  # 15Gi, а не 5Gi: retention вырос втрое (24h -> 72h), объём на диске
  # растёт вместе с ним при том же входящем потоке.
  size: 15Gi
