tempo:
  retention: 24h
  # Только OTLP. Jaeger и Zipkin, включённые чартом по умолчанию, убраны
  # намеренно: ими никто не пользуется, а открытый порт — это поверхность,
  # которую никто не собирался обслуживать.
  #
  # Здесь же исправление записи: сначала я решил, что OTLP в Tempo не включён,
  # и что это и есть причина сброса соединений. Это было неверно — OTLP был
  # настроен с самого начала. Настоящей причиной оказалось ambient: поды
  # остались помеченными как включённые в mesh, но перенаправление у них не
  # восстановилось после перезапуска кластера.
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
  metricsGenerator:
    # Without this, Tempo's metrics-generator never starts - "Service Graph"
    # and TraceQL metrics queries (`{...} | rate() by (...)`) fail with
    # "error finding generators: empty ring", since single-binary Tempo
    # still routes those through the generator component's ring.
    enabled: true
    remoteWriteUrl: "http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428/api/v1/write"
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks
persistence:
  enabled: true
  size: 5Gi
