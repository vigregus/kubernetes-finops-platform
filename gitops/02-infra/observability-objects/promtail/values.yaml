config:
  clients:
    # `_msg_field` перечисляет поля, из которых берётся текст записи,
    # в порядке предпочтения. Без него VictoriaLogs ищет только `_msg`,
    # а JSON-журналы половины платформы кладут текст в `msg` или
    # `message` - и вместо содержимого в хранилище оседает подсказка
    # «missing _msg field; see ...». Измерено до правки: так терялся
    # текст 20 тысяч записей в час - argocd-notifications, falco, etcd,
    # apiserver, CNPG, Centrifugo.
    #
    # Наши сервисы пишут `_msg` и потому стоят первыми: их формат
    # не должен зависеть от того, что делают соседи. `output` в конце -
    # это Falco: он называет текст события именно так.
    - url: http://vl-local-victoria-logs-single-server.observability.svc.cluster.local:9428/insert/loki/api/v1/push?_msg_field=_msg,msg,message,output
  snippets:
    # Одноразовые поды проверок в хранилище журналов не попадают.
    #
    # Две причины, и вторая хуже первой. Первая: вывод проверок - текст
    # для человека, с цветовыми кодами терминала, и в хранилище он лежит
    # как `\u001b[32m✓\u001b[0m`, то есть как данные, которых никто
    # не искал. Сервисы пишут строгий конверт JSON, и смешивать их
    # с этим значит потерять единый формат, ради которого конверт заведён.
    #
    # Вторая: имя такого пода содержит отметку времени, поэтому каждый
    # прогон заводит **новый поток**. Измерено на живом хранилище: из 56
    # значений метки `app` в namespace messenger за сутки 44 были
    # одноразовыми подами проверок. Это та же болезнь, что высокая
    # кардинальность в метриках, только в журналах: поиск по `app`
    # перестаёт быть полезным.
    #
    # Отбор по метке, а не по имени: имя - соглашение, которое однажды
    # изменят, а метку скрипт ставит намеренно.
    extraRelabelConfigs:
      - source_labels: [__meta_kubernetes_pod_label_finops_internal_component]
        regex: test
        action: drop
    # this cluster's kubelet runs the docker (cri-dockerd) runtime, whose
    # log files are JSON lines, not the CRI plaintext format the chart
    # defaults to - without this override every log line lands in _msg
    # as an unparsed JSON blob.
    pipelineStages:
      - docker: {}
      # CNPG's instance manager already wraps every Postgres log line
      # (including the log_statement/log_min_duration_statement output
      # from charts/app1/templates/postgres.yaml) as JSON on stdout - but
      # its top-level field is "msg":"record", not "_msg", so VictoriaLogs
      # was dropping every line as "missing _msg field", and the real SQL
      # plus the trace_id SQL comment were buried unindexed inside the
      # nested record.message string. This rewrites the shipped line to
      # the actual SQL text (so it reads like a log, not a JSON dump) and
      # promotes trace_id/duration_ms out of that string into real fields,
      # matching how the app's own JSON logs already work.
      - match:
          selector: '{app="postgresql"}'
          stages:
            - json:
                expressions:
                  record_message: record.message
                  severity: record.error_severity
            - regex:
                source: record_message
                # (?s) so that . matches newlines. Without it this whole
                # expression failed on any multi-line statement: Postgres logs
                # the SQL exactly as it was sent, so a statement written across
                # several lines puts a newline straight after "statement: ",
                # (?P<sql>.*) could not cross it, the anchor never matched, and
                # *no* fields were extracted - duration_ms and trace_id both
                # lost. The failure was invisible in the worst way: single-line
                # statements kept working, so the pipeline looked fine while
                # silently dropping the durations of exactly the long, complex
                # queries anyone would build a slow-query panel to find. Caught
                # by running a deliberate 21-second query and finding it in the
                # text but absent from every numeric filter.
                expression: '(?s)^(?:duration: (?P<duration_ms>[0-9.]+) ms\s+)?statement: (?:/\* trace_id=(?P<trace_id>[a-f0-9]{32}) \*/ )?(?P<sql>.*)$'
            - template:
                source: level
                template: '{{ ToLower .severity }}'
            - labels:
                trace_id:
                duration_ms:
                level:
            - output:
                source: record_message
