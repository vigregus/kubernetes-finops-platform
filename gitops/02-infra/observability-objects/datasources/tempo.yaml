apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  datasource:
    uid: tempo
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo-local.observability.svc.cluster.local:3200
    jsonData:
      # У мессенджера на одно сообщение — три отдельные трассы (запрос
      # API, отправитель outbox, потребитель realtime), связанные не
      # общим trace_id, а атрибутом `messaging.message.id`
      # (docs/messenger/06-observability.md, "Три трассы, а не одна").
      # Этот конфиг раньше был унаследован от checkout/analytics (одна
      # трасса на сервис) и искал логи только по trace_id того спана,
      # с которого кликнули, - переход из `kafka.produce` в outbox-relay
      # находил логи только этого сервиса, никогда не consumer-realtime
      # той же доставки. `tags` ниже строит запрос по `message_id`
      # вместо trace_id: он есть на корневом спане API (его туда кладёт
      # `tracing.set_anchor_attribute` после создания сообщения,
      # apps/messenger/messenger/api/main.py) и на `kafka.produce`/
      # `centrifugo.publish` — то есть ровно на тех спанах, с которых
      # реально начинают расследование конкретного сообщения.
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        tags:
          - key: messaging.message.id
            value: message_id
