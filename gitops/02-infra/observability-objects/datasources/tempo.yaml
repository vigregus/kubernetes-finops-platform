apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  datasource:
    uid: tempo
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo-local.observability.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: victorialogs
        spanStartTimeShift: "-2m"
        spanEndTimeShift: "2m"
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        # apps/checkout and apps/analytics print a JSON line with trace_id
        # on every request (see app.py). VictoriaLogs auto-parses JSON log
        # lines and promotes trace_id to a real field (confirmed via
        # `trace_id:"<id>"` matching entries from both services), so this
        # queries the field directly rather than full-text searching _msg.
        query: '_time:5m trace_id:"${__trace.traceId}"'
