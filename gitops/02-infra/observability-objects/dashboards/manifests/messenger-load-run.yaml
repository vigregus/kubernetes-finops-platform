apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-load-run
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-load-run",
      "title": "LT-01 · Load Run",
      "description": "docs/messenger/15-load-testing-platform.md, раздел 22 (Messenger / Load Run) — один прогон LOCAL-CAPACITY-001, выбранный временным диапазоном дашборда (startedAt/finishedAt, которые Argo Workflow печатает в выводе), а не готовым фильтром по run_id: ни одна метрика здесь не несёт label run_id/git_sha/profile. Переименован из «03 · Load Run» в «LT-01 · Load Run» — старый номер конфликтовал с «03 · API — RED» (два разных дашборда под одной цифрой), нагрузочные дашборды теперь отдельная группа LT-01/LT-02, не в общей нумерации 01-08. Капасити-сигналы ниже (Compute/Keycloak) используют тот факт, что диапазон дашборда = окно прогона: max_over_time(...[$__range:]) честно берёт пик именно за это окно, а не за произвольные 'last 30m' — то, что уже есть на 05 · Capacity, здесь имеет дополнительный смысл, потому что диапазон уже и есть прогон.",
      "tags": ["messenger", "load-testing"],
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "time": { "from": "now-15m", "to": "now" },
      "links": [
        { "title": "05 · Capacity — USE", "type": "link", "url": "/d/messenger-capacity", "icon": "dashboard" },
        { "title": "06 · Identity — Keycloak", "type": "link", "url": "/d/messenger-identity-keycloak", "icon": "dashboard" },
        { "title": "LT-02 · Load Compare", "type": "link", "url": "/d/messenger-load-compare", "icon": "dashboard" }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(messenger_message_send_operations_total, namespace)",
            "current": { "text": "messenger", "value": "messenger" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Как читать",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "Временной диапазон дашборда = окно прогона: возьмите `startedAt`/`finishedAt` из `kubectl get wf -n load-testing <имя>` или из вывода `scripts/load-testing-run.sh` и выставьте его сверху. Та же логика работает в обратную сторону для секции **Capacity**: её `peak` — это `max_over_time(...[$__range:])`, то есть максимум именно за выставленный диапазон, не за произвольное 'last N'. **Чего здесь всё ещё нет и почему**: offered/accepted/dropped_iterations из k6 — k6 не пишет метрики в VictoriaMetrics (раздел 20, не реализовано); Playwright canary — раздел 16 не реализован; разбивка по `run_id`/`git_sha`/`profile` в панелях Throughput/Latency/Backlog — ни одна из этих метрик не несёт этих label (сравнение по `run_id` — на LT-02 · Load Compare, через отдельные `load_run_*` метрики из шага `reconciliation`); `accepted`/`persisted` из reconciliation смотрите в логе шага `reconciliation` того же Workflow (`kubectl logs`) — раздел 14."
          }
        },
        {
          "id": 2,
          "type": "row",
          "title": "Throughput",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 3 }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Отправка сообщений: success vs failure",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "sum by (result) (rate(messenger_message_send_operations_total{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "HTTP запросов в секунду (API), по route",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "sum by (route) (rate(http_requests_total{namespace=~\"$namespace\"}[1m]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "row",
          "title": "Latency",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 11 }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "HTTP request duration: p50 / p95 / p99",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 12 },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[1m])))", "legendFormat": "p50" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[1m])))", "legendFormat": "p95" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[1m])))", "legendFormat": "p99" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "T_commit p99 (API → Postgres)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 12 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[1m])))" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "T_delivery p99 (WS, приближение occurred_at → Centrifugo)",
          "description": "Не ack браузера получателя — телеметрии браузера ещё нет (см. также messenger-messaging-pipeline).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 12 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_delivery_duration_seconds_bucket{namespace=~\"$namespace\"}[1m])))" }
          ]
        },
        {
          "id": 9,
          "type": "row",
          "title": "Backlog: outbox и Kafka",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Outbox: pending (шт.)",
          "description": "Разнесено с oldest age рядом: штуки и секунды на одной оси взаимно маскировали друг друга — тот же фикс, что уже сделан в 05 · Capacity.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 20 },
          "targets": [
            { "expr": "sum(messenger_outbox_pending{namespace=~\"$namespace\"})" }
          ]
        },
        {
          "id": 25,
          "type": "timeseries",
          "title": "Outbox: oldest age (с)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 20 },
          "targets": [
            { "expr": "max(messenger_outbox_oldest_age_seconds{namespace=~\"$namespace\"})" }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Kafka consumer lag, по топику и группе",
          "description": "Обе consumer group — messenger-realtime и messenger-unread, раньше здесь была видна только первая (тот же пробел, что уже закрыт в 05 · Capacity).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 20 },
          "targets": [
            {
              "expr": "sum by (consumergroup, topic) (kafka_consumergroup_lag{consumergroup=~\"messenger-(realtime|unread)\"})",
              "legendFormat": "{{consumergroup}} / {{topic}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "row",
          "title": "Capacity (peak за это окно)",
          "description": "Отвечает на вопрос плана: «почему именно здесь находится knee/collapse?» — peak за выставленный диапазон (он же окно прогона), не current. Та же конструкция max_over_time(...[$__range:]), что на 05 · Capacity, но здесь $__range имеет прямой смысл «во время этого теста», не произвольный last-N.",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "API CPU peak",
          "description": "topk(1, max_over_time(...)) — худший под API за время прогона, с именем. Та же recording rule, что в Compute на 05 · Capacity.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 28 },
          "targets": [
            {
              "instant": true,
              "expr": "topk(1, max_over_time((sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_cpu_cores{namespace=~\"$namespace\"}))[$__range:]))",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "stat",
          "title": "API Memory peak",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 0.95 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 28 },
          "targets": [
            {
              "instant": true,
              "expr": "topk(1, max_over_time((sum by (pod, container) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_memory_bytes{namespace=~\"$namespace\"}))[$__range:]))",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "stat",
          "title": "API DB pool peak",
          "description": "Worst pod, не агрегат по репликам — тот же фикс, что в 05 · Capacity #105 (api-1 10/10 + api-2 0/10 не маскируются под 50%).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 28 },
          "targets": [
            {
              "instant": true,
              "expr": "topk(1, max_over_time((sum by (pod) (messenger_db_pool_connections{namespace=~\"$namespace\",state=\"in_use\"}) / clamp_min(sum by (pod) (messenger_db_pool_max_connections{namespace=~\"$namespace\"}), 1))[$__range:]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 16,
          "type": "stat",
          "title": "Kafka max lag (worst group)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 100 },
                { "color": "red", "value": 1000 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 28 },
          "targets": [
            {
              "instant": true,
              "expr": "topk(1, max_over_time((sum by (consumergroup) (kafka_consumergroup_lag{consumergroup=~\"messenger-(realtime|unread)\"}))[$__range:]))",
              "legendFormat": "{{consumergroup}}"
            }
          ]
        },
        {
          "id": 17,
          "type": "stat",
          "title": "Keycloak CPU peak",
          "description": "container=\"keycloak\" — сам identity-сервер, не postgres/operator/reconcile-джобы того же namespace (та же оговорка, что в 05 · Capacity #105).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "textMode": "value_and_name", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 32 },
          "targets": [
            {
              "instant": true,
              "expr": "topk(1, max_over_time((sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=\"keycloak\",container=\"keycloak\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_cpu_cores{namespace=\"keycloak\",container=\"keycloak\"}))[$__range:]))",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 18,
          "type": "stat",
          "title": "Keycloak DB pool peak",
          "description": "active / (active + available) — доля занятых из уже открытых, не из poolMaxSize (та же оговорка, что в 05 · Capacity #105).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 32 },
          "targets": [
            { "expr": "max_over_time((sum(agroal_active_count{namespace=\"keycloak\",datasource=\"default\"}) / clamp_min(sum(agroal_active_count{namespace=\"keycloak\",datasource=\"default\"}) + sum(agroal_available_count{namespace=\"keycloak\",datasource=\"default\"}), 1))[$__range:])" }
          ]
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Keycloak p99 peak",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 1 },
                { "color": "red", "value": 3 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 32 },
          "targets": [
            { "expr": "max_over_time((histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{namespace=\"keycloak\",uri=\"/realms/{realm}/protocol/{protocol}/token\"}[5m]))))[$__range:])" }
          ]
        },
        {
          "id": 20,
          "type": "stat",
          "title": "Keycloak 5xx peak",
          "description": "Та же P0-формула, что исправлена на 05 · Capacity #105: or vector(0), без clamp_min на знаменателе-ставке (clamp_min на rate занижает процент при низком трафике).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "noValue": "N/A",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.01 },
                { "color": "red", "value": 0.05 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 32 },
          "targets": [
            { "expr": "max_over_time(((sum(rate(http_server_requests_seconds_count{namespace=\"keycloak\",outcome=\"SERVER_ERROR\"}[5m])) or vector(0)) / sum(rate(http_server_requests_seconds_count{namespace=\"keycloak\"}[5m])))[$__range:])" }
          ]
        }
      ]
    }
