apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: application-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "application-overview",
      "title": "Application Overview",
      "description": "Traffic, latency, errors, resource usage, and ownership context for checkout/analytics.",
      "tags": [
        "application-overview",
        "finops"
      ],
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "query": "label_values(http_requests_total{job=~\"checkout|analytics\"}, namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Ownership",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "table",
          "title": "Workload ownership",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "kube_pod_labels{namespace=~\"$namespace\", label_app_kubernetes_io_name=~\"checkout|analytics\"}",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Value": true,
                  "__name__": true,
                  "cluster": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "prometheus": true,
                  "service": true,
                  "uid": true,
                  "label_pod_template_hash": true
                },
                "indexByName": {},
                "renameByName": {
                  "label_app_kubernetes_io_name": "workload",
                  "label_app_kubernetes_io_component": "component",
                  "label_finops_internal_product": "product",
                  "label_finops_internal_team": "team",
                  "label_finops_internal_environment": "environment",
                  "label_finops_internal_component": "finops_component"
                }
              }
            }
          ]
        },
        {
          "id": 3,
          "type": "row",
          "title": "Traffic and errors",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 7
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Request rate by workload and status",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "links": [
                {
                  "title": "View logs (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bnamespace%3D%5C%22${__field.labels.namespace}%5C%22%7D%20app%3A~%5C%22${__field.labels.job}%5C%22%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_start"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_end"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum by (job, status, namespace) (rate(http_requests_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{job}} {{status}}"
            }
          ],
          "transformations": [
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "-",
                  "right": "300000"
                },
                "alias": "window_start",
                "replaceFields": false
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "+",
                  "right": "300000"
                },
                "alias": "window_end",
                "replaceFields": false
              }
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Error rate (%) by workload",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "links": [
                {
                  "title": "View logs (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bnamespace%3D%5C%22${__field.labels.namespace}%5C%22%7D%20app%3A~%5C%22${__field.labels.job}%5C%22%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                },
                {
                  "title": "View traces (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bresource.service.name%3D%5C%22${__field.labels.job}%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_start"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_end"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "targets": [
            {
              "expr": "100 * sum by (job, namespace) (rate(http_requests_total{namespace=~\"$namespace\", status=\"500\"}[5m])) / sum by (job, namespace) (rate(http_requests_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{job}}"
            }
          ],
          "transformations": [
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "-",
                  "right": "300000"
                },
                "alias": "window_start",
                "replaceFields": false
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "+",
                  "right": "300000"
                },
                "alias": "window_end",
                "replaceFields": false
              }
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Latency",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "p50 / p95 / p99 latency by workload",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "links": [
                {
                  "title": "View logs (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bnamespace%3D%5C%22${__field.labels.namespace}%5C%22%7D%20app%3A~%5C%22${__field.labels.job}%5C%22%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                },
                {
                  "title": "View traces (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22tempo%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22queryType%22%3A%22traceql%22%2C%22query%22%3A%22%7Bresource.service.name%3D%5C%22${__field.labels.job}%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_start"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_end"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (job, namespace, le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "{{job}} p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (job, namespace, le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "{{job}} p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (job, namespace, le) (rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "{{job}} p99"
            }
          ],
          "transformations": [
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "-",
                  "right": "300000"
                },
                "alias": "window_start",
                "replaceFields": false
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "+",
                  "right": "300000"
                },
                "alias": "window_end",
                "replaceFields": false
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "Resource usage",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU usage vs requested",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "links": [
                {
                  "title": "View logs (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bnamespace%3D%5C%22${__field.labels.namespace}%5C%22%2Cpod%3D~%5C%22${__field.labels.pod}%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_start"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_end"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 26
          },
          "targets": [
            {
              "expr": "node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\", pod=~\"checkout.*|analytics.*\"}",
              "legendFormat": "{{namespace}}/{{pod}} used"
            },
            {
              "expr": "sum by (namespace, pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"checkout.*|analytics.*\", resource=\"cpu\"})",
              "legendFormat": "{{namespace}}/{{pod}} requested"
            }
          ],
          "transformations": [
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "-",
                  "right": "300000"
                },
                "alias": "window_start",
                "replaceFields": false
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "+",
                  "right": "300000"
                },
                "alias": "window_end",
                "replaceFields": false
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Memory usage vs requested",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "links": [
                {
                  "title": "View logs (+/-5m)",
                  "url": "/explore?schemaVersion=1&panes=%7B%22e1w%22%3A%7B%22datasource%22%3A%22victorialogs%22%2C%22queries%22%3A%5B%7B%22refId%22%3A%22A%22%2C%22expr%22%3A%22%7Bnamespace%3D%5C%22${__field.labels.namespace}%5C%22%2Cpod%3D~%5C%22${__field.labels.pod}%5C%22%7D%22%7D%5D%2C%22range%22%3A%7B%22from%22%3A%22${__data.fields.window_start}%22%2C%22to%22%3A%22${__data.fields.window_end}%22%7D%7D%7D&orgId=1",
                  "targetBlank": true
                }
              ]
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_start"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "window_end"
                },
                "properties": [
                  {
                    "id": "custom.hideFrom",
                    "value": {
                      "viz": true,
                      "legend": true,
                      "tooltip": true
                    }
                  },
                  {
                    "id": "unit",
                    "value": "none"
                  },
                  {
                    "id": "decimals",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 26
          },
          "targets": [
            {
              "expr": "node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\", pod=~\"checkout.*|analytics.*\"}",
              "legendFormat": "{{namespace}}/{{pod}} used"
            },
            {
              "expr": "sum by (namespace, pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", pod=~\"checkout.*|analytics.*\", resource=\"memory\"})",
              "legendFormat": "{{namespace}}/{{pod}} requested"
            }
          ],
          "transformations": [
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "-",
                  "right": "300000"
                },
                "alias": "window_start",
                "replaceFields": false
              }
            },
            {
              "id": "calculateField",
              "options": {
                "mode": "binary",
                "binary": {
                  "left": "Time",
                  "operator": "+",
                  "right": "300000"
                },
                "alias": "window_end",
                "replaceFields": false
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "logs",
          "title": "Recent logs",
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "victorialogs"
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 34
          },
          "targets": [
            {
              "expr": "{namespace=~\"$namespace\"} app:~\"checkout|analytics\""
            }
          ]
        },
        {
          "id": 12,
          "type": "row",
          "title": "Response cache",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 42
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Cache hit ratio",
          "description": "Hits and cached absences over all cache lookups. A ratio pinned at 100% means the working set is smaller than the cache and nothing is being measured; pinned at 0% means access is uniform over too large a key space. The interesting configurations sit in between.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 43
          },
          "targets": [
            {
              "expr": "100 * sum by (job, namespace) (rate(cache_requests_total{namespace=~\"$namespace\",result=~\"hit|negative\"}[5m])) / clamp_min(sum by (job, namespace) (rate(cache_requests_total{namespace=~\"$namespace\"}[5m])), 0.001)",
              "legendFormat": "{{job}}"
            }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Cache lookups by outcome",
          "description": "miss = this caller loaded from Postgres; waited = single-flight, another caller was already loading; negative = a cached absence; bypass = the deliberately-slow path, which skips the cache so it still produces a real Postgres slow-query line.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 25,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 43
          },
          "targets": [
            {
              "expr": "sum by (result, namespace) (rate(cache_requests_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Postgres queries vs cache lookups",
          "description": "What the cache is actually buying: the gap between lookups served and queries the database still had to answer. This is the line that turns a cache setting into a database sizing decision.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 51
          },
          "targets": [
            {
              "expr": "sum by (namespace) (rate(cache_requests_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "cache lookups"
            },
            {
              "expr": "sum by (namespace) (rate(db_query_duration_seconds_count{namespace=~\"$namespace\",job=\"checkout\"}[5m]))",
              "legendFormat": "postgres queries"
            }
          ]
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Warm state and keys loaded",
          "description": "cache_warm_complete drops to 0 while a pod is warming, during which it stays unready on purpose - an unwarmed pod would send its first traffic straight to Postgres, so scaling out would briefly raise database load rather than relieve it.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 51
          },
          "targets": [
            {
              "expr": "sum by (pod) (cache_warmed_keys{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} warmed keys"
            },
            {
              "expr": "sum by (pod) (cache_warm_complete{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} warm complete"
            }
          ]
        },
        {
          "id": 116,
          "type": "row",
          "title": "External API (payment gateway)",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 59
          },
          "panels": []
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Gateway calls by outcome",
          "description": "Outcomes of checkout's calls to the payment gateway, as the *caller* sees them. declined is a business answer and is not a failure; timeout and unreachable are. Before this dependency existed the gateway was a coin flip inside the process, so none of these outcomes could occur and the circuit breaker had nothing to break on.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 60
          },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(external_api_requests_total{namespace=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Gateway call latency (caller side)",
          "description": "Measured by checkout around the whole call, so it includes connect, the gateway's own time and any retry. Read it against the 2s read timeout: p99 approaching that line is what turns into the timeout series on the left.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 60
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(external_api_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(external_api_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(external_api_duration_seconds_bucket{namespace=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "Caller timeouts vs gateway hangs",
          "description": "The same event from both ends, and they do not have to agree. The gateway counts a request it deliberately never answered; the caller counts a deadline it gave up on. A remote dependency has no idea it timed out - only the client does - so a gap between these two lines is the honest picture, not a bug in either counter.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 68
          },
          "targets": [
            {
              "expr": "sum(rate(external_api_requests_total{namespace=~\"$namespace\",outcome=~\"timeout|unreachable\"}[$__rate_interval]))",
              "legendFormat": "caller: timeout/unreachable"
            },
            {
              "expr": "sum(rate(gateway_requests_total{outcome=\"hung\"}[$__rate_interval]))",
              "legendFormat": "gateway: hung"
            },
            {
              "expr": "sum(rate(gateway_requests_total{outcome=\"error\"}[$__rate_interval]))",
              "legendFormat": "gateway: 5xx"
            }
          ]
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Circuit breaker state",
          "description": "0 closed, 1 half-open, 2 open. The gateway breaker opens on real failures only - a declined card is neutral to it, because tripping on declines would fail every subsequent order against a gateway that is working exactly as intended.",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 20,
                "lineInterpolation": "stepAfter"
              },
              "min": 0,
              "max": 2
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 68
          },
          "targets": [
            {
              "expr": "dependency_circuit_state{namespace=~\"$namespace\"}",
              "legendFormat": "{{job}} / {{dependency}}"
            }
          ]
        }
      ]
    }
