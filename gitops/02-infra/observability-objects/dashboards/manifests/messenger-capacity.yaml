apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-capacity
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-capacity",
      "title": "05 · Capacity — USE",
      "description": "USE (Utilization/Saturation/Errors, Brendan Gregg) поперёк компонентов на одном экране: отвечает «во что мы упираемся», а не «где тормозит» (02 · Journey) и не «есть ли проблема у пользователя» (01 · SLO). Current saturation и Compute остаются раскрытыми по умолчанию, остальные секции — collapsed: раскрывать по конкретному подозрению (например Redis memory % ушёл в красное), а не листать десятки графиков.",
      "tags": ["messenger", "use", "capacity"],
      "schemaVersion": 39,
      "version": 5,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "links": [
        { "title": "01 · SLO Overview", "type": "link", "url": "/d/messenger-slo-overview", "icon": "dashboard" },
        { "title": "02 · Message Journey", "type": "link", "url": "/d/messenger-messaging-pipeline", "icon": "dashboard" },
        { "title": "03 · API — RED", "type": "link", "url": "/d/messenger-api-red", "icon": "dashboard" },
        { "title": "04 · Realtime — Centrifugo", "type": "link", "url": "/d/messenger-realtime", "icon": "dashboard" }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(messenger_db_pool_connections, namespace)",
            "current": { "text": "messenger", "value": "messenger" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 27,
          "type": "row",
          "title": "Current saturation",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 28,
          "type": "stat",
          "title": "CPU max %",
          "description": "Максимум CPU/limit % среди всех pod+container namespace. Один перегруженный под виден здесь раньше, чем на любом агрегате.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "targets": [
            { "expr": "max(sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_cpu_cores{namespace=~\"$namespace\"}))" }
          ]
        },
        {
          "id": 29,
          "type": "stat",
          "title": "Memory max %",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 0.95 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "targets": [
            { "expr": "max(sum by (pod, container) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_memory_bytes{namespace=~\"$namespace\"}))" }
          ]
        },
        {
          "id": 30,
          "type": "stat",
          "title": "API DB pool %",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "targets": [
            { "expr": "max(sum by (service) (messenger_db_pool_connections{namespace=~\"$namespace\",state=\"in_use\"}) / clamp_min(sum by (service) (messenger_db_pool_max_connections{namespace=~\"$namespace\"}), 1))" }
          ]
        },
        {
          "id": 31,
          "type": "stat",
          "title": "Redis memory %",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "targets": [
            { "expr": "max(redis_memory_used_bytes{namespace=~\"$namespace\"}) / clamp_min(max(namespace_pod_container:container_resource_limits_memory_bytes{namespace=~\"$namespace\",container=\"messenger-redis\"}), 1)" }
          ]
        },
        {
          "id": 32,
          "type": "stat",
          "title": "Kafka consumer lag",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 100 },
                { "color": "red", "value": 1000 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "targets": [
            { "expr": "sum(kafka_consumergroup_lag{consumergroup=\"messenger-realtime\"})" }
          ]
        },
        {
          "id": 33,
          "type": "stat",
          "title": "Outbox oldest age",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 60 },
                { "color": "red", "value": 900 }
              ]}
            }
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "targets": [
            { "expr": "max(messenger_outbox_oldest_age_seconds{namespace=~\"$namespace\"})" }
          ]
        },
        {
          "id": 1,
          "type": "row",
          "title": "Compute",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU by pod (cores)",
          "description": "node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate — repo-local recording rule (container-resource-usage.yaml). По pod+container, не агрегат по container: при нескольких репликах sum by (container) прятал бы перекос — «api = 1.0 cores» могло значить одна реплика на 0.9, другая на 0.1.",
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "CPU / limit % by pod",
          "description": "0.8 cores само по себе ничего не говорит: при limit=1 это 80%, при limit=250m — 320% (throttling). namespace_pod_container:container_resource_limits_cpu_cores — repo-local recording rule поверх kube_pod_container_resource_limits (rules/pod-capacity-signals.yaml).",
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "expr": "sum by (pod, container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_cpu_cores{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Memory working set by pod",
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "expr": "sum by (pod, container) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Memory / limit % by pod",
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 },
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 0.95 }
              ]}
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "expr": "sum by (pod, container) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"}) / sum by (pod, container) (namespace_pod_container:container_resource_limits_memory_bytes{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Restarts by pod (Errors)",
          "description": "namespace_pod_container:container_restarts_total — счётчик из kube-state-metrics, растёт скачком на каждый рестарт. Плоская линия — здоровый под, ступенька — событие, которое стоит сопоставить с логами/событиями Kubernetes.",
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 0, "pointSize": 4 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 22 },
          "targets": [
            {
              "expr": "max by (pod, container) (namespace_pod_container:container_restarts_total{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "OOMKilled by pod (Errors)",
          "description": "namespace_pod_container:container_last_terminated_oomkilled — 1, если ПОСЛЕДНЕЕ завершение контейнера было по OOM. Флаг истории, не текущего момента: держится и после того, как под уже перезапустился и работает нормально — сопоставлять с restarts выше по времени.",
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1, "custom": { "lineWidth": 2, "fillOpacity": 0, "pointSize": 4 } } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 22 },
          "targets": [
            {
              "expr": "max by (pod, container) (namespace_pod_container:container_last_terminated_oomkilled{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}} / {{container}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "PostgreSQL — API DB pool",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 30 },
          "panels": [
            {
              "id": 9,
              "type": "timeseries",
              "title": "API DB pool: in_use vs idle vs max",
              "description": "messenger_db_pool_connections снимается Runtime/check_readiness — это в первую очередь API-процесс. Воркеры (consumer-realtime, outbox-relay, consumer-unread, presence-sweeper) держат собственные Postgres-соединения без такой же pool-телеметрии — «API pool healthy» здесь не означает здоровье пулов воркеров (см. панель ℹ Scope внизу дашборда).",
              "options": {
                "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
                "tooltip": { "mode": "multi", "sort": "desc" }
              },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
              "gridPos": { "h": 8, "w": 18, "x": 0, "y": 31 },
              "targets": [
                { "expr": "sum by (service, state) (messenger_db_pool_connections{namespace=~\"$namespace\"})", "legendFormat": "{{service}} {{state}}" },
                { "expr": "sum by (service) (messenger_db_pool_max_connections{namespace=~\"$namespace\"})", "legendFormat": "{{service}} max" }
              ]
            },
            {
              "id": 10,
              "type": "bargauge",
              "title": "API DB pool saturation: in_use / max",
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "options": {
                "orientation": "horizontal",
                "displayMode": "gradient",
                "showUnfilled": true,
                "reduceOptions": { "calcs": ["lastNotNull"] }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit", "max": 1, "min": 0,
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 0.7 },
                    { "color": "red", "value": 0.9 }
                  ]}
                }
              },
              "gridPos": { "h": 8, "w": 6, "x": 18, "y": 31 },
              "targets": [
                { "expr": "sum by (service) (messenger_db_pool_connections{namespace=~\"$namespace\",state=\"in_use\"}) / clamp_min(sum by (service) (messenger_db_pool_max_connections{namespace=~\"$namespace\"}), 1)", "legendFormat": "{{service}}" }
              ]
            }
          ]
        },
        {
          "id": 11,
          "type": "row",
          "title": "Redis",
          "collapsed": true,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "panels": [
            {
              "id": 12,
              "type": "timeseries",
              "title": "Memory: used / RSS / container limit",
              "description": "redis_config_maxmemory=0 — Redis сам не имеет memory ceiling (только maxmemory-policy volatile-lru без числа), поэтому volatile-lru почти не защищает от OOMKill: раньше, чем Redis начнёт вытеснять ключи с TTL, cgroup может убить процесс по container limit. Задать явный Redis maxmemory ниже container limit (~400-430Mi, headroom под allocator/connections/exporter) — отдельная задача.",
              "options": {
                "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
                "tooltip": { "mode": "multi", "sort": "desc" }
              },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
              "gridPos": { "h": 8, "w": 18, "x": 0, "y": 40 },
              "targets": [
                { "expr": "max(redis_memory_used_bytes{namespace=~\"$namespace\"})", "legendFormat": "used" },
                { "expr": "max(redis_memory_used_rss_bytes{namespace=~\"$namespace\"})", "legendFormat": "RSS" },
                { "expr": "max(namespace_pod_container:container_resource_limits_memory_bytes{namespace=~\"$namespace\",container=\"messenger-redis\"})", "legendFormat": "container limit" }
              ]
            },
            {
              "id": 13,
              "type": "bargauge",
              "title": "Memory used / container limit %",
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "options": {
                "orientation": "horizontal",
                "displayMode": "gradient",
                "showUnfilled": true,
                "reduceOptions": { "calcs": ["lastNotNull"] }
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "thresholds": { "mode": "absolute", "steps": [
                    { "color": "green", "value": null },
                    { "color": "yellow", "value": 0.7 },
                    { "color": "red", "value": 0.9 }
                  ]}
                }
              },
              "gridPos": { "h": 8, "w": 6, "x": 18, "y": 40 },
              "targets": [
                { "expr": "max(redis_memory_used_bytes{namespace=~\"$namespace\"}) / clamp_min(max(namespace_pod_container:container_resource_limits_memory_bytes{namespace=~\"$namespace\",container=\"messenger-redis\"}), 1)" }
              ]
            },
            {
              "id": 14,
              "type": "timeseries",
              "title": "Commands/sec",
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
              "gridPos": { "h": 7, "w": 8, "x": 0, "y": 48 },
              "targets": [
                { "expr": "sum(rate(redis_commands_processed_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "commands/s" }
              ]
            },
            {
              "id": 34,
              "type": "timeseries",
              "title": "Evictions & rejected connections/sec",
              "description": "Разнесено с commands/sec: на одной оси с ~10-50k commands/s эти редкие события были неразличимы визуально, даже когда реально росли.",
              "options": {
                "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
                "tooltip": { "mode": "multi", "sort": "desc" }
              },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "unit": "ops", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
              "gridPos": { "h": 7, "w": 8, "x": 8, "y": 48 },
              "targets": [
                { "expr": "sum(rate(redis_evicted_keys_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "evicted/s" },
                { "expr": "sum(rate(redis_rejected_connections_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "rejected connections/s" }
              ]
            },
            {
              "id": 35,
              "type": "timeseries",
              "title": "Keyspace hit ratio",
              "description": "Разнесено с «connected/blocked clients»: count (десятки) и ratio (0..1) на одной оси взаимно искажали друг друга.",
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "unit": "percentunit", "max": 1, "min": 0, "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
              "gridPos": { "h": 7, "w": 8, "x": 16, "y": 48 },
              "targets": [
                { "expr": "sum(rate(redis_keyspace_hits_total{namespace=~\"$namespace\"}[5m])) / clamp_min(sum(rate(redis_keyspace_hits_total{namespace=~\"$namespace\"}[5m])) + sum(rate(redis_keyspace_misses_total{namespace=~\"$namespace\"}[5m])), 0.001)" }
              ]
            },
            {
              "id": 15,
              "type": "timeseries",
              "title": "Connected / blocked clients",
              "options": {
                "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
                "tooltip": { "mode": "multi", "sort": "desc" }
              },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
              "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
              "gridPos": { "h": 7, "w": 12, "x": 0, "y": 55 },
              "targets": [
                { "expr": "max(redis_connected_clients{namespace=~\"$namespace\"})", "legendFormat": "connected clients" },
                { "expr": "max(redis_blocked_clients{namespace=~\"$namespace\"})", "legendFormat": "blocked clients" }
              ]
            },
            {
              "id": 16,
              "type": "timeseries",
              "title": "Command latency p99 (top offending commands)",
              "description": "redis_latency_percentiles_usec{cmd,quantile} — готовый percentile из Redis LATENCY HISTOGRAM, не собственная гистограмма экспортёра. Единицы — микросекунды.",
              "options": {
                "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max"] },
                "tooltip": { "mode": "multi", "sort": "desc" }
              },
              "datasource": { "type": "prometheus", "uid": "victoriametrics" },
