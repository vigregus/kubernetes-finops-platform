apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-capacity
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-capacity",
      "title": "05 · Capacity — USE",
      "description": "USE (Utilization/Saturation/Errors, Brendan Gregg) поперёк компонентов на одном экране: отвечает 'во что мы упираемся', а не 'где тормозит' (02 · Journey) и не 'есть ли проблема у пользователя' (01 · SLO). Ревью PR #73 указал, что первая версия этого дашборда не была USE-дашбордом (не было CPU/RAM ни у одного workload, не было Redis вовсе) — здесь это исправлено тем, что уже реально снимается: container-resource-usage.yaml (repo-local recording rules) и redis_exporter sidecar.",
      "tags": ["messenger", "use", "capacity"],
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(messenger_db_pool_connections, namespace)",
            "current": { "text": "messenger", "value": "messenger" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Compute — CPU / RAM по контейнеру",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "CPU по контейнеру (cores)",
          "description": "node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate — repo-local recording rule (gitops/02-infra/observability-objects/victoria-stack/rules/container-resource-usage.yaml), не сырой cAdvisor: обычные /metrics/cadvisor labels на этом Minikube не по контейнерам, это уже исправлено записью правила. api/outbox-relay/consumer-realtime/consumer-unread/presence-sweeper — воркеры, которые при messaging-нагрузке могут упереться раньше API.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum by (container) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate{namespace=~\"$namespace\"})",
              "legendFormat": "{{container}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Memory working set по контейнеру",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 1 },
          "targets": [
            {
              "expr": "sum by (container) (node_namespace_pod_container:container_memory_working_set_bytes{namespace=~\"$namespace\"})",
              "legendFormat": "{{container}}"
            }
          ]
        },
        {
          "id": 4,
          "type": "row",
          "title": "Postgres — DB pool (Utilization / Saturation)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "DB pool: in_use vs idle vs max, по сервису",
          "description": "messenger_db_pool_connections{state}/messenger_db_pool_max_connections. Очередь на соединение — первое, что упирается при росте нагрузки, раньше, чем сама база (docs 06-observability.md, telemetry/metrics.py). PgBouncer/postgres-exporter-уровня метрик (server-side pool, active/waiting backends) здесь по-прежнему нет — см. текстовую панель внизу.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 10 },
          "targets": [
            { "expr": "sum by (service, state) (messenger_db_pool_connections{namespace=~\"$namespace\"})", "legendFormat": "{{service}} {{state}}" },
            { "expr": "sum by (service) (messenger_db_pool_max_connections{namespace=~\"$namespace\"})", "legendFormat": "{{service}} max" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "DB pool saturation: in_use / max",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "max": 1, "min": 0,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 10 },
          "targets": [
            { "expr": "sum by (service) (messenger_db_pool_connections{namespace=~\"$namespace\",state=\"in_use\"}) / clamp_min(sum by (service) (messenger_db_pool_max_connections{namespace=~\"$namespace\"}), 1)", "legendFormat": "{{service}}" }
          ]
        },
        {
          "id": 7,
          "type": "row",
          "title": "Redis (Utilization / Saturation / Errors)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memory: used / RSS",
          "description": "redis_config_maxmemory=0 в этом кластере (не выставлен явный лимит, только maxmemory-policy volatile-lru) — % от лимита не построить честно; используемая память сравнивается с лимитом контейнера (512Mi) на панели CPU/RAM выше (container=messenger-redis).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 19 },
          "targets": [
            { "expr": "max(redis_memory_used_bytes{namespace=~\"$namespace\"})", "legendFormat": "used" },
            { "expr": "max(redis_memory_used_rss_bytes{namespace=~\"$namespace\"})", "legendFormat": "RSS" }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Ops/sec и evictions/sec",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "ops" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 19 },
          "targets": [
            { "expr": "sum(rate(redis_commands_processed_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "commands/s" },
            { "expr": "sum(rate(redis_evicted_keys_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "evicted/s" },
            { "expr": "sum(rate(redis_rejected_connections_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "rejected connections/s" }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Connected / blocked clients, keyspace hit ratio",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
          "targets": [
            { "expr": "max(redis_connected_clients{namespace=~\"$namespace\"})", "legendFormat": "connected clients" },
            { "expr": "max(redis_blocked_clients{namespace=~\"$namespace\"})", "legendFormat": "blocked clients" },
            { "expr": "sum(rate(redis_keyspace_hits_total{namespace=~\"$namespace\"}[5m])) / clamp_min(sum(rate(redis_keyspace_hits_total{namespace=~\"$namespace\"}[5m])) + sum(rate(redis_keyspace_misses_total{namespace=~\"$namespace\"}[5m])), 0.001)", "legendFormat": "hit ratio (0..1, правая ось смыслом)" }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Command latency p99 (по команде, худшие)",
          "description": "redis_latency_percentiles_usec{cmd,quantile} — готовый percentile из Redis LATENCY HISTOGRAM, не собственная гистограмма экспортёра. Единицы — микросекунды.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "µs" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
          "targets": [
            {
              "expr": "topk(5, max by (cmd) (redis_latency_percentiles_usec{namespace=~\"$namespace\",quantile=\"99\"}))",
              "legendFormat": "{{cmd}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "row",
          "title": "Kafka (Utilization / Saturation)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 35 }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Consumer group lag (сообщений)",
          "description": "kafka_consumergroup_lag (kafka-exporter). Лаг в сообщениях, не в секундах — раздел 20/§3.B доков просит именно возраст в секундах (messenger_outbox_oldest_age_seconds ниже), но за самой Kafka-очередью следим тем, что реально снимается. Без фильтра по $namespace: kafka-exporter скрейпится в namespace kafka, не messenger — та же причина, по которой workflow-template.yaml (§20 load-testing) фильтрует эту метрику по consumergroup, а не по namespace.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "targets": [
            { "expr": "sum by (consumergroup, topic) (kafka_consumergroup_lag{consumergroup=\"messenger-realtime\"})", "legendFormat": "{{consumergroup}} / {{topic}}" }
          ]
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Under-replicated partitions (Errors)",
          "description": "kafka_topic_partition_under_replicated_partition — партиция, не догнавшая ISR: раннее предупреждение о деградации кластера ещё до реального лага потребителя. Без фильтра по $namespace по той же причине, что и лаг выше.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "targets": [
            { "expr": "sum(kafka_topic_partition_under_replicated_partition{topic=~\"messenger[.].+\"})", "legendFormat": "under-replicated" }
          ]
        },
        {
          "id": 15,
          "type": "row",
          "title": "Outbox (Saturation)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 44 }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Outbox: длина очереди и возраст самой старой записи",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": {} },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 45 },
          "targets": [
            { "expr": "sum(messenger_outbox_pending{namespace=~\"$namespace\"})", "legendFormat": "pending (шт.)" },
            { "expr": "max(messenger_outbox_oldest_age_seconds{namespace=~\"$namespace\"})", "legendFormat": "oldest age (с)" }
          ]
        },
        {
          "id": 17,
          "type": "row",
          "title": "Centrifugo (Utilization)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 53 }
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Connections по подам — перекос балансировки",
          "description": "Та же панель, что на 04 · Realtime: здесь она значит другое — не 'сколько всего', а 'равномерно ли распределено', то есть Utilization отдельного пода, а не суммарная аудитория.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 54 },
          "targets": [
            { "expr": "sum by (pod) (centrifugo_node_num_clients{namespace=~\"$namespace\"})", "legendFormat": "{{pod}}" }
          ]
        },
        {
          "id": 19,
          "type": "row",
          "title": "Зависимости (Errors)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 62 }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Готовность зависимостей (0/1)",
          "description": "messenger_dependency_up{service,dependency}: 0 или 1 без градаций — 'наполовину доступна' это отдельные метрики задержки/ошибок (docs 06-observability.md, часть 3.A). Список зависимостей — тот, что реально проверяет каждый сервис сам; это не полная карта межсервисных связей.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short", "min": 0, "max": 1 } },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 63 },
          "targets": [
            { "expr": "min by (service, dependency) (messenger_dependency_up{namespace=~\"$namespace\"})", "legendFormat": "{{service}} → {{dependency}}" }
          ]
        },
        {
          "id": 21,
          "type": "text",
          "title": "Чего здесь всё ещё намеренно нет",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 71 },
          "options": {
            "mode": "markdown",
            "content": "**CPU/RAM по контейнеру теперь есть** (панели выше, через repo-local recording rule container-resource-usage.yaml) — предыдущая версия дашборда объясняла их отсутствие тем, что check-dashboards.py не может подтвердить vendor cAdvisor; ревью PR #73 верно указало, что это была ошибка приоритетов (checker не должен диктовать архитектуру observability), а не факт отсутствия данных: recording rule — repo-local манифест, `covers()` подтверждает его тем же механизмом, что и любой другой.\n\n**PgBouncer/postgres-exporter-уровня метрики** (server-side pool occupancy, active/waiting backends, replication lag, WAL) — по-прежнему не построены: это метрики отдельных vendor-экспортёров без repo-local recording rule, тот же класс проблемы, что был у CPU/RAM до этого коммита, но ещё не решённый для Postgres. Community-дашборды `postgres.yaml`/`cnpg-pgbouncer.yaml` остаются единственным источником для них.\n\n**Kafka broker-level CPU/disk/network** (не per-topic-partition) — kafka-exporter в этом кластере не отдаёт broker resource-метрики, только consumer/topic-уровень (lag, under-replicated, offsets).\n\n**R_healthy/R_knee/R_collapse** (§18 плана нагрузочного тестирования) — этот дашборд даёт сырые ряды для визуальной классификации во время benchmark, но не автоматическую классификацию: план прямо требует не сворачивать три режима в одно число."
          }
        }
      ]
    }
