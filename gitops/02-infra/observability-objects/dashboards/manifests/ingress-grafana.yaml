# Gives Grafana a real, stable hostname - same *.finops.local convention as
# checkout/analytics/opencost - so alert annotations and dashboard data
# links (see victoria-stack/rules/messenger-slo.yaml) can carry an absolute
# URL that works from outside a browser session already pointed at
# a kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.finops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-local-service
                port:
                  number: 3000
