apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-load-compare
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-load-compare",
      "title": "LT-02 · Load Compare",
      "description": "docs/messenger/15-load-testing-platform.md, раздел 22 (Messenger / Load Compare) и раздел 28 (сравнение прогонов) — выбор двух конкретных прогонов по run_id, а не offset-приближение. Раздел 20 разметил k6-метрики и summary (раздел 21, load_run_*) лейблами run_id/git_sha/profile — этого хватает, чтобы сравнивать конкретный commit A с конкретным commit B по имени, как и требует раздел 28, а не по времени. Живо проверено: два прогона подряд с разными run_id, оба выбираются в переменных ниже. Переименован из «04 · Load Compare» — старый номер конфликтовал с «04 · Realtime», нагрузочные дашборды теперь отдельная группа LT-01/LT-02. Capacity headroom (новая секция) — одинаковый throughput между current и baseline ещё не значит «не стало хуже»: новый commit мог прийти к тому же числу сообщений/сек заметно ближе к пределу ресурсов.",
      "tags": ["messenger", "load-testing"],
      "schemaVersion": 39,
      "version": 2,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "run_id_current",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(load_run_accepted_messages, run_id)",
            "refresh": 2,
            "sort": 2
          },
          {
            "name": "run_id_baseline",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(load_run_accepted_messages, run_id)",
            "refresh": 2,
            "sort": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "Как читать",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 0 },
          "options": {
            "mode": "markdown",
            "content": "Выберите `run_id_current` и `run_id_baseline` в переменных сверху — оба списка приходят из `label_values(load_run_accepted_messages, run_id)`, то есть из прогонов, у которых шаг `reconciliation` (раздел 21) успел отправить сводку в VictoriaMetrics. Временной диапазон дашборда влияет только на то, какие `run_id` видны в списке (данные читаются `label_values` за это окно) — сами метрики ниже не зависят от диапазона, они читаются как последнее значение по `run_id`, а не агрегатом за период. **Чего здесь нет**: `duplicate_messages` (нужна per-message correlation из раздела 13, не реализована целиком), `recovery` (раздел 19 не реализован), автоматический вердикт «лучше/хуже» — числа рядом, сравнение на глаз, как и просит раздел 22 (никакого единственного числа вместо трёх режимов — раздел 18)."
          }
        },
        {
          "id": 2,
          "type": "row",
          "title": "Throughput и корректность",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 3 }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Accepted — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 4 },
          "targets": [{ "expr": "load_run_accepted_messages{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Accepted — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 4 },
          "targets": [{ "expr": "load_run_accepted_messages{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Persisted — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 4 },
          "targets": [{ "expr": "load_run_persisted_messages{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Persisted — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 4 },
          "targets": [{ "expr": "load_run_persisted_messages{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Missing — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 4 },
          "targets": [{ "expr": "load_run_missing_messages{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Missing — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 4 },
          "targets": [{ "expr": "load_run_missing_messages{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 9,
          "type": "row",
          "title": "Latency",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 9 }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "HTTP p95 — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 10 },
          "targets": [{ "expr": "load_run_http_p95_seconds{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 11,
          "type": "stat",
          "title": "HTTP p95 — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 10 },
          "targets": [{ "expr": "load_run_http_p95_seconds{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 12,
          "type": "stat",
          "title": "HTTP p99 — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 10 },
          "targets": [{ "expr": "load_run_http_p99_seconds{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "HTTP p99 — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 10 },
          "targets": [{ "expr": "load_run_http_p99_seconds{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 14,
          "type": "stat",
          "title": "WS delivery p95 — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 10 },
          "targets": [{ "expr": "load_run_delivery_p95_seconds{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 15,
          "type": "stat",
          "title": "WS delivery p95 — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 10 },
          "targets": [{ "expr": "load_run_delivery_p95_seconds{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 16,
          "type": "row",
          "title": "Backlog",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 }
        },
        {
          "id": 17,
          "type": "stat",
          "title": "Max outbox age — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 16 },
          "targets": [{ "expr": "load_run_max_outbox_age_seconds{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 18,
          "type": "stat",
          "title": "Max outbox age — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 16 },
          "targets": [{ "expr": "load_run_max_outbox_age_seconds{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 19,
          "type": "stat",
          "title": "Max Kafka lag — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 16 },
          "targets": [{ "expr": "load_run_max_kafka_lag{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 20,
          "type": "stat",
          "title": "Max Kafka lag — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 16 },
          "targets": [{ "expr": "load_run_max_kafka_lag{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 21,
          "type": "row",
          "title": "Capacity headroom",
          "description": "Если baseline и current показывают одинаковый throughput, это ещё не значит, что новый commit не стал хуже: он мог прийти к тому же числу сообщений/сек заметно ближе к пределу (выше CPU/DB pool), просто предел ещё не задет. load_run_*_peak — те же peak-expr, что уже на 05 · Capacity/LT-01 Load Run, пушатся шагом reconciliation с теми же run_id/git_sha/profile, что и остальные load_run_* метрики этого дашборда.",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }
        },
        {
          "id": 22,
          "type": "stat",
          "title": "API CPU peak — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 22 },
          "targets": [{ "expr": "load_run_api_cpu_peak{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 23,
          "type": "stat",
          "title": "API CPU peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 22 },
          "targets": [{ "expr": "load_run_api_cpu_peak{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 24,
          "type": "stat",
          "title": "API Memory peak — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 0.95 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 22 },
          "targets": [{ "expr": "load_run_api_memory_peak{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 25,
          "type": "stat",
          "title": "API Memory peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 22 },
          "targets": [{ "expr": "load_run_api_memory_peak{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 26,
          "type": "stat",
          "title": "API DB pool peak — current",
          "description": "Worst pod за время прогона, не агрегат по репликам (тот же фикс, что в 05 · Capacity #105).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 22 },
          "targets": [{ "expr": "load_run_api_db_pool_peak{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 27,
          "type": "stat",
          "title": "API DB pool peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 22 },
          "targets": [{ "expr": "load_run_api_db_pool_peak{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 28,
          "type": "stat",
          "title": "Keycloak CPU peak — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.8 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 27 },
          "targets": [{ "expr": "load_run_keycloak_cpu_peak{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 29,
          "type": "stat",
          "title": "Keycloak CPU peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 27 },
          "targets": [{ "expr": "load_run_keycloak_cpu_peak{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 30,
          "type": "stat",
          "title": "Keycloak DB pool peak — current",
          "description": "active / (active + available), не доля от poolMaxSize (та же оговорка, что в 05 · Capacity #105).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 0.9 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 27 },
          "targets": [{ "expr": "load_run_keycloak_db_pool_peak{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 31,
          "type": "stat",
          "title": "Keycloak DB pool peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 27 },
          "targets": [{ "expr": "load_run_keycloak_db_pool_peak{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 32,
          "type": "stat",
          "title": "Keycloak p99 peak — current",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 1 },
                { "color": "red", "value": 3 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 27 },
          "targets": [{ "expr": "load_run_keycloak_p99_peak_seconds{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 33,
          "type": "stat",
          "title": "Keycloak p99 peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 27 },
          "targets": [{ "expr": "load_run_keycloak_p99_peak_seconds{run_id=\"$run_id_baseline\"}" }]
        },
        {
          "id": 34,
          "type": "stat",
          "title": "Keycloak 5xx peak — current",
          "description": "Та же P0-формула, что исправлена в 05 · Capacity #105: or vector(0), без clamp_min на знаменателе-ставке.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "noValue": "N/A",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.01 },
                { "color": "red", "value": 0.05 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 32 },
          "targets": [{ "expr": "load_run_keycloak_5xx_peak{run_id=\"$run_id_current\"}" }]
        },
        {
          "id": 35,
          "type": "stat",
          "title": "Keycloak 5xx peak — baseline",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "percentunit", "noValue": "N/A" } },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 32 },
          "targets": [{ "expr": "load_run_keycloak_5xx_peak{run_id=\"$run_id_baseline\"}" }]
        }
      ]
    }
