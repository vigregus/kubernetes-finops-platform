apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-slo-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-slo-overview",
      "title": "01 · Messenger SLO Overview",
      "description": "docs/messenger/06-observability.md, часть 5 - главный дашборд, читается за десять секунд: строка 1 отвечает \"проблема есть?\", остальное - \"где она?\". Ссылка из victoria-stack/rules/messenger-slo.yaml (dashboard_url) ведёт сюда по этому uid.",
      "tags": ["messenger", "slo"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(messenger_message_send_operations_total, namespace)",
            "current": { "text": "messenger", "value": "messenger" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Строка 1 — проблема есть?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Доступность записи сообщения (30д)",
          "description": "SLO \"Запись сообщения\": коммит состоялся, NOT_A_MEMBER исключён из счёта (докc, часть 1, каталог SLI). Числитель/знаменатель - messenger_message_send_operations_total.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0.995, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "yellow", "value": 0.999 },
                { "color": "green", "value": 0.9995 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum(rate(messenger_message_send_operations_total{namespace=~\"$namespace\",result=\"success\"}[30d])) / clamp_min(sum(rate(messenger_message_send_operations_total{namespace=~\"$namespace\"}[30d])), 0.001)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p99 T_commit",
          "description": "Цель ≤ 1с (SLO \"Запись сообщения\").",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p99 T_delivery (приближение)",
          "description": "occurred_at -> публикация в Centrifugo, не ack браузера получателя (телеметрии браузера ещё нет, G3). Диагностика, не полноценный SLI - см. messenger-slo.yaml, MessageDeliveryHighLatencyP99Approx.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_delivery_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))"
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Остаток бюджета ошибок (30д, SLO 99.95%)",
          "description": "1 - (фактическая доля отказов / допустимая по SLO). Ниже нуля - бюджет месяца уже исчерпан.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "yellow", "value": 0.2 },
                { "color": "green", "value": 0.5 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 6, "x": 18, "y": 1 },
          "targets": [
            {
              "expr": "1 - ((1 - (sum(rate(messenger_message_send_operations_total{namespace=~\"$namespace\",result=\"success\"}[30d])) / clamp_min(sum(rate(messenger_message_send_operations_total{namespace=~\"$namespace\"}[30d])), 0.001))) / (1 - 0.9995))"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Строка 2 — где именно?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Темп записи: success vs failed",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "targets": [
            {
              "expr": "sum by (result) (rate(messenger_message_send_operations_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "T_commit: p50 / p95 / p99",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "HTTP 5xx / 4xx rate (API)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "targets": [
            {
              "expr": "sum by (status_class) (rate(http_requests_total{namespace=~\"$namespace\",status_class=~\"4xx|5xx\"}[5m]))",
              "legendFormat": "{{status_class}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Возраст самой старой записи outbox",
          "description": "Возраст важнее длины очереди (докc, часть 3.B): порог по возрасту не меняется при росте нагрузки.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "expr": "max(messenger_outbox_oldest_age_seconds{namespace=~\"$namespace\"})"
            }
          ]
        }
      ]
    }
