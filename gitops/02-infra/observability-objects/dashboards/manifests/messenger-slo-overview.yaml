apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-slo-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-slo-overview",
      "title": "01 · Messenger SLO Overview",
      "description": "docs/messenger/06-observability.md, часть 5 - главный дашборд, читается за десять секунд: строка 1 отвечает \"проблема есть?\", остальное - \"где она?\". Ссылка из victoria-stack/rules/messenger-slo.yaml (dashboard_url) ведёт сюда по этому uid — uid НЕ менять при редактировании.",
      "tags": ["messenger", "slo"],
      "schemaVersion": 39,
      "version": 3,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "links": [
        { "title": "02 · Message Journey", "type": "link", "url": "/d/messenger-messaging-pipeline", "icon": "dashboard" },
        { "title": "03 · API — RED", "type": "link", "url": "/d/messenger-api-red", "icon": "dashboard" },
        { "title": "04 · Realtime — Centrifugo", "type": "link", "url": "/d/messenger-realtime", "icon": "dashboard" },
        { "title": "05 · Capacity — USE", "type": "link", "url": "/d/messenger-capacity", "icon": "dashboard" }
      ],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(messenger_message_send_operations_total, namespace)",
            "current": { "text": "messenger", "value": "messenger" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Row 1 — is there a problem?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Send SLO (30d)",
          "description": "SLI «Запись сообщения» из docs/messenger/06-observability.md: годным считается коммит, который И состоялся, И уложился в ≤1с — не просто отношение success/failed. NOT_A_MEMBER исключён из счёта (не является измеряемой попыткой). le=\"1.0\", не \"1\" - именно так prometheus_client экспортирует boundary у дефолтного бакета (проверено живьём по http_request_duration_seconds_bucket). Знаменатель ограничен result=~\"success|failed\", чтобы не подмешивать долитый в 30-дневное окно исторический unlabeled ряд той же гистограммы (до этого PR у неё не было метки result). При отсутствии трафика за 30д - N/A; при ненулевом трафике без единого успеха - честный 0% через `or vector(0)`, а не ложный N/A от пустого числителя.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0.995, "max": 1, "noValue": "N/A",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "yellow", "value": 0.999 },
                { "color": "green", "value": 0.9995 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "(sum(rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\",result=\"success\",le=\"1.0\"}[30d])) or vector(0)) / sum(rate(messenger_message_commit_duration_seconds_count{namespace=~\"$namespace\",result=~\"success|failed\"}[30d]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p99 T_commit",
          "description": "Цель ≤ 1с (SLO «Запись сообщения»).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.7 },
                { "color": "red", "value": 1 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "p99 T_delivery (approx)",
          "description": "occurred_at → публикация в Centrifugo, не ack браузера получателя (телеметрии браузера ещё нет, G3). Диагностика, не полноценный SLI — см. messenger-slo.yaml, MessageDeliveryHighLatencyP99Approx.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_delivery_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))"
            }
          ]
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Msg/sec (accepted)",
          "description": "Текущая полезная нагрузка: «проблема есть?» неполно без «сколько вообще сейчас происходит».",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
          "targets": [
            { "expr": "sum(rate(messenger_message_send_operations_total{namespace=~\"$namespace\",result=\"success\"}[5m]))" }
          ]
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Online users",
          "description": "messenger_presence_online_users — та же метрика, что на 04 · Realtime. Контекст аудитории прямо на первом экране.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
          "targets": [
            { "expr": "max(messenger_presence_online_users{namespace=~\"$namespace\"})" }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Error budget remaining (30d)",
          "description": "1 − (фактическая доля отказов SLI / допустимая по SLO 99.95%). Тот же SLI, что и Send SLO — коммит И ≤1с. Ниже нуля — бюджет месяца уже исчерпан. N/A без трафика за 30д.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "noValue": "N/A",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "yellow", "value": 0.2 },
                { "color": "green", "value": 0.5 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "targets": [
            {
              "expr": "1 - ((1 - ((sum(rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\",result=\"success\",le=\"1.0\"}[30d])) or vector(0)) / sum(rate(messenger_message_commit_duration_seconds_count{namespace=~\"$namespace\",result=~\"success|failed\"}[30d])))) / (1 - 0.9995))"
            }
          ]
        },
        {
          "id": 6,
          "type": "row",
          "title": "Row 2 — where exactly?",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Write rate: success vs failed",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "success" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "green" } } ] },
              { "matcher": { "id": "byName", "options": "failed" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 7 },
          "targets": [
            {
              "expr": "sum by (result) (rate(messenger_message_send_operations_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{result}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "T_commit: p50 / p95 / p99",
          "description": "Цветовая конвенция пакета: p50 приглушённый, p95 сильнее, p99 самый насыщенный — та же семантика на 02/03.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "p50" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "light-blue" } } ] },
              { "matcher": { "id": "byName", "options": "p95" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "blue" } } ] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "dark-blue" } } ] }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "HTTP 5xx / 4xx rate (API)",
          "description": "route!~\"/metrics|/livez|/readyz\" исключает scrape и kubelet-пробы: /readyz отдаёт 503 при недоступном Postgres и без фильтра искажал бы этот график.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "4xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "targets": [
            {
              "expr": "sum by (status_class) (rate(http_requests_total{namespace=~\"$namespace\",route!~\"/metrics|/livez|/readyz\",status_class=~\"4xx|5xx\"}[5m]))",
              "legendFormat": "{{status_class}}"
            }
          ]
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Outbox oldest record age",
          "description": "Возраст важнее длины очереди: порог по возрасту не меняется при росте нагрузки.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "targets": [
            {
              "expr": "max(messenger_outbox_oldest_age_seconds{namespace=~\"$namespace\"})"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "HTTP requests/sec (API)",
          "description": "Панель выше отвечает, какая доля запросов — ошибки; эта — сколько всего приходит. Тот же probe-фильтр.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": { "defaults": { "unit": "reqps", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "targets": [
            {
              "expr": "sum by (route) (rate(http_requests_total{namespace=~\"$namespace\",route!~\"/metrics|/livez|/readyz\"}[5m]))",
              "legendFormat": "{{route}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "bargauge",
          "title": "WebSocket connections by pod",
          "description": "Разрез по подам обязателен: десять подов и триста тысяч соединений в среднем выглядят благополучно, даже если один под держит сто тысяч. Ranking читается быстрее line chart с десятью накладывающимися сериями.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "targets": [
            {
              "expr": "sum by (pod) (centrifugo_node_num_clients{namespace=~\"$namespace\"})",
              "legendFormat": "{{pod}}"
            }
          ]
        }
      ]
    }
