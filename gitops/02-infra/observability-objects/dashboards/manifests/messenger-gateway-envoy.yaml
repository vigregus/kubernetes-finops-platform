apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-gateway-envoy
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-gateway-envoy",
      "title": "08 · Gateway — Envoy",
      "description": "Слой, которого не было ни на одном из 01-05: между клиентом и приложением стоит Cilium Gateway (Envoy), и 03 · API — RED видит только FastAPI application layer, не сам шлюз (см. description 03). Источник - envoy_* метрики с cilium-envoy:9964 (VMPodScrape gitops/02-infra/cilium-observability/manifests/envoy-scrape.yaml). Без per-request Host-заголовка в стандартных Envoy stats: 'по бэкенду' здесь - по Envoy cluster (namespace_service_port), не по домену напрямую, но в этом кластере это одно и то же 1:1 - у каждого backend Service ровно один HTTPRoute.",
      "tags": ["messenger", "gateway", "envoy"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "links": [
        { "title": "01 · SLO Overview", "type": "link", "url": "/d/messenger-slo-overview", "icon": "dashboard" },
        { "title": "03 · API — RED", "type": "link", "url": "/d/messenger-api-red", "icon": "dashboard" },
        { "title": "05 · Capacity — USE", "type": "link", "url": "/d/messenger-capacity", "icon": "dashboard" },
        { "title": "Deep-dive: Envoy / Overview", "type": "link", "url": "/d/envoy-overview", "icon": "external link" },
        { "title": "Deep-dive: Envoy / Upstream", "type": "link", "url": "/d/envoy-upstream", "icon": "external link" }
      ],
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Gateway RED",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "RPS",
          "description": "listener-secure (443) + listener-insecure (80, только redirect на HTTPS). Не application RPS с 03 — это включает ВСЕ backend-ы за шлюзом (Grafana, ArgoCD, Hubble и т.д.), не только messenger API.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 5, "w": 4, "x": 0, "y": 1 },
          "targets": [
            { "expr": "sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"}[5m]))" }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Success rate",
          "description": "(1xx+2xx+3xx) / all. N/A без трафика, честный 0% при трафике без единого успеха (or vector(0), тот же принцип, что в 03/04/05).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "noValue": "N/A",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "yellow", "value": 0.95 },
                { "color": "green", "value": 0.99 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 4, "y": 1 },
          "targets": [
            { "expr": "(sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\",envoy_response_code_class=~\"1|2|3\"}[5m])) or vector(0)) / sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"}[5m]))" }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "4xx %",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "noValue": "N/A" } },
          "gridPos": { "h": 5, "w": 4, "x": 8, "y": 1 },
          "targets": [
            { "expr": "(sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\",envoy_response_code_class=\"4\"}[5m])) or vector(0)) / sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"}[5m]))" }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "5xx %",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "noValue": "N/A",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.01 },
                { "color": "red", "value": 0.05 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 12, "y": 1 },
          "targets": [
            { "expr": "(sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\",envoy_response_code_class=\"5\"}[5m])) or vector(0)) / sum(rate(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"}[5m]))" }
          ]
        },
        {
          "id": 6,
          "type": "stat",
          "title": "p95",
          "description": "envoy_http_downstream_rq_time — в миллисекундах у Envoy по умолчанию, не в секундах (в отличие от наших собственных gистограмм).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 300 },
                { "color": "red", "value": 700 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 16, "y": 1 },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(envoy_http_downstream_rq_time_bucket{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"}[5m])))" }
          ]
        },
        {
          "id": 7,
          "type": "stat",
          "title": "p99",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": { "graphMode": "area", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 500 },
                { "color": "red", "value": 1000 }
              ]}
            }
          },
          "gridPos": { "h": 5, "w": 4, "x": 20, "y": 1 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(envoy_http_downstream_rq_time_bucket{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"}[5m])))" }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "Connections",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 6 }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Active downstream connections",
          "description": "Клиент ↔ Gateway. listener-secure + listener-insecure.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "short", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 7 },
          "targets": [
            { "expr": "sum(envoy_http_downstream_cx_active{envoy_http_conn_manager_prefix=~\"listener-secure|listener-insecure\"})" }
          ]
        },
        {
          "id": 10,
          "type": "bargauge",
          "title": "Active upstream connections by backend",
          "description": "Gateway ↔ backend Service. Ranking по клиентам шлюза читается быстрее, чем 15 накладывающихся line chart.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 7 },
          "targets": [
            {
              "expr": "label_replace(sum by (envoy_cluster_name) (envoy_cluster_upstream_cx_active{envoy_cluster_name=~\"edge/.*\"}), \"backend\", \"$1\", \"envoy_cluster_name\", \"edge/cilium-gateway-edge/(.*)\")",
              "legendFormat": "{{backend}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Upstream connect failures / timeouts",
          "description": "Gateway не смог достучаться до backend Pod'а — сетевой отказ или backend не отвечает на приёме соединения, до HTTP-уровня.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": {
            "defaults": { "unit": "cps", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "connect failed" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } } ] },
              { "matcher": { "id": "byName", "options": "connect timeout" }, "properties": [ { "id": "color", "value": { "mode": "fixed", "fixedColor": "red" } } ] }
            ]
          },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 14 },
          "targets": [
            { "expr": "sum(rate(envoy_cluster_upstream_cx_connect_fail{envoy_cluster_name=~\"edge/.*\"}[5m]))", "legendFormat": "connect failed" },
            { "expr": "sum(rate(envoy_cluster_upstream_cx_connect_timeout{envoy_cluster_name=~\"edge/.*\"}[5m]))", "legendFormat": "connect timeout" }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Upstream resets",
          "description": "Backend оборвал уже установленное соединение посреди запроса (rx) или Gateway оборвал сам (tx) — не то же самое, что connect failure выше (там соединение вообще не установилось).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": { "defaults": { "unit": "cps", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 14 },
          "targets": [
            { "expr": "sum(rate(envoy_cluster_upstream_rq_rx_reset{envoy_cluster_name=~\"edge/.*\"}[5m]))", "legendFormat": "rx reset (backend closed)" },
            { "expr": "sum(rate(envoy_cluster_upstream_rq_tx_reset{envoy_cluster_name=~\"edge/.*\"}[5m]))", "legendFormat": "tx reset (gateway closed)" }
          ]
        },
        {
          "id": 13,
          "type": "row",
          "title": "By backend",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 21 }
        },
        {
          "id": 14,
          "type": "table",
          "title": "Backends",
          "description": "Одна строка на Envoy cluster (namespace_service_port за шлюзом) — в этом кластере 1:1 с HTTPRoute/доменом. Отсортировано по p99. Не top-N: показаны все backend-ы, у которых сейчас есть маршрут.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "sortBy": [ { "displayName": "p99", "desc": true } ]
          },
          "transformations": [
            { "id": "merge", "options": {} },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "envoy_cluster_name": true },
                "indexByName": {},
                "renameByName": {
                  "backend": "Backend",
                  "Value #A": "RPS",
                  "Value #B": "Success",
                  "Value #C": "4xx",
                  "Value #D": "5xx",
                  "Value #E": "p99"
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": { "custom": { "align": "auto", "filterable": true } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "RPS" }, "properties": [ { "id": "unit", "value": "reqps" }, { "id": "custom.width", "value": 100 } ] },
              { "matcher": { "id": "byName", "options": "Success" }, "properties": [ { "id": "unit", "value": "percentunit" }, { "id": "custom.width", "value": 100 }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 0.95 }, { "color": "green", "value": 0.99 } ] } }, { "id": "custom.cellOptions", "value": { "type": "color-background" } } ] },
              { "matcher": { "id": "byName", "options": "4xx" }, "properties": [ { "id": "unit", "value": "percentunit" }, { "id": "custom.width", "value": 90 } ] },
              { "matcher": { "id": "byName", "options": "5xx" }, "properties": [ { "id": "unit", "value": "percentunit" }, { "id": "custom.width", "value": 90 }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.01 }, { "color": "red", "value": 0.05 } ] } }, { "id": "custom.cellOptions", "value": { "type": "color-background" } } ] },
              { "matcher": { "id": "byName", "options": "p99" }, "properties": [ { "id": "unit", "value": "ms" }, { "id": "custom.width", "value": 100 }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 500 }, { "color": "red", "value": 1000 } ] } }, { "id": "custom.cellOptions", "value": { "type": "color-background" } } ] }
            ]
          },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 22 },
          "targets": [
            { "refId": "A", "format": "table", "instant": true, "expr": "label_replace(sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])), \"backend\", \"$1\", \"envoy_cluster_name\", \"edge/cilium-gateway-edge/(.*)\")" },
            { "refId": "B", "format": "table", "instant": true, "expr": "label_replace((sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\",envoy_response_code_class=~\"1|2|3\"}[5m])) or (0 * sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])))) / sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])), \"backend\", \"$1\", \"envoy_cluster_name\", \"edge/cilium-gateway-edge/(.*)\")" },
            { "refId": "C", "format": "table", "instant": true, "expr": "label_replace((sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\",envoy_response_code_class=\"4\"}[5m])) or (0 * sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])))) / sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])), \"backend\", \"$1\", \"envoy_cluster_name\", \"edge/cilium-gateway-edge/(.*)\")" },
            { "refId": "D", "format": "table", "instant": true, "expr": "label_replace((sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\",envoy_response_code_class=\"5\"}[5m])) or (0 * sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])))) / sum by (envoy_cluster_name) (rate(envoy_cluster_upstream_rq_xx{envoy_cluster_name=~\"edge/.*\"}[5m])), \"backend\", \"$1\", \"envoy_cluster_name\", \"edge/cilium-gateway-edge/(.*)\")" },
            { "refId": "E", "format": "table", "instant": true, "expr": "label_replace(histogram_quantile(0.99, sum by (le, envoy_cluster_name) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=~\"edge/.*\"}[5m]))), \"backend\", \"$1\", \"envoy_cluster_name\", \"edge/cilium-gateway-edge/(.*)\")" }
          ]
        },
        {
          "id": 15,
          "type": "row",
          "title": "Gateway overhead — API backend only",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 32 }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Gateway p99 vs API p99 (messenger API backend)",
          "description": "Две разные меры одного и того же трафика, не одна и та же панель дважды. Gateway p99 — envoy_cluster_upstream_rq_time для backend-а edge/cilium-gateway-edge/messenger_api_80: с точки зрения Envoy, от отправки запроса апстриму до получения ответа (сеть + обработка приложением). API p99 — с 03 · API — RED, http_request_duration_seconds внутри самого FastAPI: только обработка, без сетевого прыжка Gateway→Pod. Устойчивый разрыв Gateway выше API — сетевой/TLS-overhead самого шлюза; Gateway ниже API — тоже нормально: два независимых семпла p99 по разным окнам не обязаны совпадать. Единицы разные: Gateway — ms, API — s (переведено к общей оси ниже).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "options": {
            "legend": { "displayMode": "table", "placement": "bottom", "calcs": ["last", "max", "mean"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "fieldConfig": { "defaults": { "unit": "ms", "custom": { "lineWidth": 2, "fillOpacity": 10, "pointSize": 0 } } },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 33 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le) (rate(envoy_cluster_upstream_rq_time_bucket{envoy_cluster_name=\"edge/cilium-gateway-edge/messenger_api_80\"}[5m])))",
              "legendFormat": "Gateway p99"
            },
            {
              "expr": "1000 * histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=~\"messenger\",route!~\"/metrics|/livez|/readyz\"}[5m])))",
              "legendFormat": "API p99"
            }
          ]
        }
      ]
    }
