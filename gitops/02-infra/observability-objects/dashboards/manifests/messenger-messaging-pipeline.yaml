apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: messenger-messaging-pipeline
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "messenger-messaging-pipeline",
      "title": "02 · Messaging Pipeline",
      "description": "docs/messenger/06-observability.md, часть 1: разбивка сквозного пути сообщения по стадиям (T_commit/T_outbox/T_kafka/T_consumer/T_realtime), а не суммарное 'p99 доставки 8с' без ответа, где именно эти секунды потеряны.",
      "tags": ["messenger", "pipeline"],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "victoriametrics" },
            "query": "label_values(messenger_message_send_operations_total, namespace)",
            "current": { "text": "messenger", "value": "messenger" },
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Стадии: API → outbox → Kafka → consumer → Centrifugo",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "text",
          "title": "Как читать",
          "gridPos": { "h": 3, "w": 24, "x": 0, "y": 1 },
          "options": {
            "mode": "markdown",
            "content": "t1 T_commit (API/Postgres) → t2 T_outbox (аренда outbox-relay) → t3 T_kafka (публикация брокеру) → t4 T_consumer (обработка пачки consumer-realtime) → t5 T_realtime (публикация в Centrifugo). T_delivery (панель ниже) — приближение от occurred_at до Centrifugo, не ack браузера (телеметрии браузера ещё нет, G3)."
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "T_commit p99 (API → Postgres)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 4 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_commit_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "T_outbox p99 (аренда пачки)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 4 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_outbox_claim_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "T_kafka p99 (публикация брокеру)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 4 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_outbox_kafka_publish_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "T_consumer p99 (обработка пачки)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 11 },
          "targets": [
            {
              "expr": "histogram_quantile(0.99, sum by (le, consumer) (rate(messenger_consumer_processing_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))",
              "legendFormat": "{{consumer}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "T_realtime p99 (публикация в Centrifugo)",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 11 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_realtime_publish_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))" }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "T_delivery p99 (приближение, occurred_at → Centrifugo)",
          "description": "Не t7 из документа - подтверждение браузера Б. См. текстовую панель выше.",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 11 },
          "targets": [
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(messenger_message_delivery_duration_seconds_bucket{namespace=~\"$namespace\"}[5m])))" }
          ]
        },
        {
          "id": 9,
          "type": "row",
          "title": "Исходы по стадиям",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 18 }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "outbox: события по исходу",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 19 },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(messenger_outbox_events_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "realtime: доставка по исходу",
          "description": "duplicate - не отказ, а доказательство того, что дедупликация работает (at-least-once транспорт).",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": { "unit": "reqps" } },
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 19 },
          "targets": [
            {
              "expr": "sum by (outcome) (rate(messenger_realtime_delivery_total{namespace=~\"$namespace\"}[5m]))",
              "legendFormat": "{{outcome}}"
            }
          ]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Очередь outbox: длина и возраст самой старой записи",
          "datasource": { "type": "prometheus", "uid": "victoriametrics" },
          "fieldConfig": { "defaults": {} },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 26 },
          "targets": [
            {
              "expr": "sum(messenger_outbox_pending{namespace=~\"$namespace\"})",
              "legendFormat": "pending (шт.)"
            },
            {
              "expr": "max(messenger_outbox_oldest_age_seconds{namespace=~\"$namespace\"})",
              "legendFormat": "oldest age (с)"
            }
          ]
        }
      ]
    }
