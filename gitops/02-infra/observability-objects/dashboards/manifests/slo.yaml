apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: slo
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "uid": "slo-error-budget",
      "title": "SLO and error budget",
      "description": "Availability and latency SLIs, the 30-day budget they spend, and multiwindow burn rates in the SRE workbook's shape. Load-test traffic is included on purpose: on this stand it is the only traffic there is.",
      "tags": [
        "slo",
        "sre",
        "finops"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "query": "label_values(http_requests_total, namespace)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "prod",
              "value": "prod"
            }
          },
          {
            "name": "service",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "victoriametrics"
            },
            "query": "label_values(http_requests_total, job)",
            "refresh": 2,
            "includeAll": true,
            "multi": true,
            "current": {
              "text": "checkout",
              "value": "checkout"
            }
          },
          {
            "name": "slo_availability",
            "type": "custom",
            "label": "Availability objective",
            "query": "0.99,0.995,0.999,0.9995",
            "current": {
              "text": "0.995",
              "value": "0.995"
            },
            "options": [
              {
                "text": "0.99",
                "value": "0.99",
                "selected": false
              },
              {
                "text": "0.995",
                "value": "0.995",
                "selected": true
              },
              {
                "text": "0.999",
                "value": "0.999",
                "selected": false
              },
              {
                "text": "0.9995",
                "value": "0.9995",
                "selected": false
              }
            ]
          }
        ]
      },
      "panels": [
        {
          "type": "text",
          "title": "How these numbers are defined",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "options": {
            "mode": "markdown",
            "content": "**Valid events** are the requests this service is answerable for: `200`, `402`, `429`, `5xx`. `402` is a *good* event: the payment gateway declined the charge, the service handled that answer correctly, and the caller got a correct response. It used to be returned as `500`, which put a normal commercial outcome in the same bucket as a crash and - at the injected rate of 2% - capped this SLI at ~98% by construction, so a 99.9% target was unreachable by any strategy. `400`/`404` are excluded - they are correct answers to malformed or absent ids, and counting them would make the SLI track how much bad input arrives rather than how well the service works.\n\n**`429` counts as a failure.** Shedding is the service behaving correctly, but the user still was not served - and that is the pressure that turns \"we are shedding\" into \"we need capacity\". It has two sources: refused at admission (`MAX_IN_FLIGHT`, never reaches the handler) and refused at the connection pool (`PoolBusy`, after the request has already spent its CPU). The second is the more expensive kind. *Broken vs overloaded* keeps causes apart.\n\n**Load-test traffic is included.** Every request here comes from a deliberate run; excluding it would leave nothing to measure.\n\n**Latency is measured over served requests only** (`status=\"200\"`), and `402` is deliberately left out of it: a decline is raised before the order is written, so it returns fast without doing the work whose latency this measures, and counting it would flatter p95. A 429 answered in 2ms is not evidence of speed. Budget window is 30d, matching metric retention."
          },
          "id": 1
        },
        {
          "type": "stat",
          "title": "Availability SLI (30d)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Served / (served + refused + failed) across the budget window.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 4,
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.99
                  },
                  {
                    "color": "green",
                    "value": 0.995
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[30d]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[30d])), 0.001)",
              "legendFormat": "availability"
            }
          ],
          "id": 2
        },
        {
          "type": "stat",
          "title": "Latency SLI (30d, under 500ms)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Proportion of served requests faster than 500ms.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 6,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 4,
              "min": 0,
              "max": 1,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.98
                  },
                  {
                    "color": "green",
                    "value": 0.99
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "value",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\",job=~\"$service\",status=\"200\",le=\"0.5\"}[30d]))) / clamp_min(sum(rate(http_request_duration_seconds_count{namespace=~\"$namespace\",job=~\"$service\",status=\"200\"}[30d])), 0.001)",
              "legendFormat": "latency"
            }
          ],
          "id": 3
        },
        {
          "type": "gauge",
          "title": "Error budget remaining",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Share of the 30-day availability allowance still unspent.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 12,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 3,
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.25
                  },
                  {
                    "color": "green",
                    "value": 0.5
                  }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "clamp_min(1 - ((1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[30d]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[30d])), 0.001))) / (1 - $slo_availability)), 0)",
              "legendFormat": "remaining"
            }
          ],
          "id": 4
        },
        {
          "type": "stat",
          "title": "Burn rate (1h)",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "1 spends the budget exactly over 30 days; 14.4 spends all of it in about 50 hours.",
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 18,
            "y": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 2,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "graphMode": "area",
            "colorMode": "background",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          },
          "targets": [
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[1h]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[1h])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "1h"
            }
          ],
          "id": 5
        },
        {
          "type": "timeseries",
          "title": "Multiwindow burn rate",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "The workbook's alerting shape: a fast and a slow window must both be burning before anything pages, so a brief spike does not wake anyone and a slow leak is not missed. 14.4 and 6 page; 3 and 1 raise a ticket.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 11
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 5,
                "thresholdsStyle": {
                  "mode": "dashed"
                }
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "transparent",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 6
                  },
                  {
                    "color": "red",
                    "value": 14.4
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            }
          },
          "targets": [
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[5m]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[5m])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "5m"
            },
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[1h]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[1h])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "1h"
            },
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[6h]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[6h])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "6h"
            },
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[24h]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[24h])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "24h"
            },
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[3d]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[3d])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "3d"
            }
          ],
          "id": 6
        },
        {
          "type": "timeseries",
          "title": "Broken vs overloaded",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Both spend the same budget and the remedies are opposite: 5xx means fix a fault, 429 means add capacity or shed earlier. One merged 'errors' line is how an overload gets debugged as a bug.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 12,
            "y": 11
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 25,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"5..\"}[5m]))",
              "legendFormat": "failed (5xx)"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=\"429\"}[5m]))",
              "legendFormat": "refused (429)"
            },
            {
              "expr": "sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=\"200\"}[5m]))",
              "legendFormat": "served (200)"
            }
          ],
          "id": 7
        },
        {
          "type": "timeseries",
          "title": "SLI against objective",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0.9,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 8
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[1h]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[1h])), 0.001)",
              "legendFormat": "availability (1h)"
            },
            {
              "expr": "(sum(rate(http_request_duration_seconds_bucket{namespace=~\"$namespace\",job=~\"$service\",status=\"200\",le=\"0.5\"}[1h]))) / clamp_min(sum(rate(http_request_duration_seconds_count{namespace=~\"$namespace\",job=~\"$service\",status=\"200\"}[1h])), 0.001)",
              "legendFormat": "latency (1h)"
            },
            {
              "expr": "$slo_availability",
              "legendFormat": "objective"
            }
          ],
          "id": 8
        },
        {
          "type": "timeseries",
          "title": "Budget consumed",
          "datasource": {
            "type": "prometheus",
            "uid": "victoriametrics"
          },
          "description": "Fraction of the 30-day allowance spent. Crossing 1 means the objective was missed for this window - a decision input, not a disaster: the signal to stop shipping risk and spend on reliability instead.",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 15
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "expr": "(1 - ((sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402\"}[30d]))) / clamp_min(sum(rate(http_requests_total{namespace=~\"$namespace\",job=~\"$service\",status=~\"200|402|429|5..\"}[30d])), 0.001))) / (1 - $slo_availability)",
              "legendFormat": "consumed"
            }
          ],
          "id": 9
        }
      ]
    }
