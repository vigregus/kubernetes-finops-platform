server:
  # 30d, а не 7d - единый срок на все потоки, поднятый до нижней границы,
  # приемлемой для `security`/`audit`. По контракту телеметрии
  # (docs/messenger/06-observability.md, "Потоки журналов разделены")
  # у application/access/security/audit обязаны быть РАЗНЫЕ сроки -
  # это по-прежнему не сделано, и вот почему не сделано здесь же заодно:
  #
  #   - однопроцессный VictoriaLogs (см. `server:` - один релиз, один
  #     StatefulSet) не даёт retention на поток/лейбл: `-retentionPeriod`
  #     общий на весь инстанс;
  #   - Promtail одним набором `clients` физически не умеет "эту строку
  #     в одно хранилище, ту - в другое": клиенты получают одинаковый
  #     поток целиком, а не выборку по `log_stream`
  #     (см. ../promtail/values.yaml, единственный `clients[0].url`);
  #   - честный способ - второй, отдельный VictoriaLogs с длинным
  #     retention и второй Promtail (или второй набор pipelineStages
  #     с `drop` по всему, кроме security/audit), оба со своим Argo CD
  #     Application. Это отдельная инфраструктурная единица, а не правка
  #     значения здесь, и вносить её вслепую, без стенда для проверки
  #     relabel-правил, - больше риска, чем пользы за один присест.
  #
  # Поднятый до 30d единый срок - явный, названный компромисс на время
  # до этой работы: короче, чем полноценный audit-retention, но не
  # рвёт `security` через неделю, как было раньше.
  retentionPeriod: "30d"
  persistentVolume:
    enabled: true
    # 20Gi вслед за retention: было 5Gi под 7d, тот же профиль нагрузки
    # на ~30d - грубо тот же порядок, что и рост здесь.
    size: 20Gi
