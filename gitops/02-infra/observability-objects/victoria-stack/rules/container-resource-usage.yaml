apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: container-resource-usage-metrics-path-fix
  namespace: observability
  labels:
    app.kubernetes.io/name: victoria-metrics-k8s-stack
spec:
  groups:
    - name: k8s.rules.container-resource-usage-metrics-path-fix
      interval: 20s
      rules:
        # Same record names as the upstream kube-prometheus rules
        # (k8s-rules-container-cpu-usage-seconds-total / -memory-working-set-bytes),
        # disabled in victoria-stack/values.yaml because this cluster's kubelet only
        # emits per-container container/image labels via metrics_path=/metrics/resource,
        # not the usual /metrics/cadvisor.
        - record: node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m
          expr: |
            sum(rate(container_cpu_usage_seconds_total{job="kubelet",metrics_path="/metrics/resource",container!=""}[5m])) by(cluster,namespace,pod,container)
            * on(cluster,namespace,pod) group_left(node) topk(1,
              max(kube_pod_info{node!=""}) by(cluster,namespace,pod,node)
            ) by(cluster,namespace,pod)
        - record: node_namespace_pod_container:container_memory_working_set_bytes
          expr: |
            container_memory_working_set_bytes{job="kubelet",metrics_path="/metrics/resource",container!=""}
            * on(cluster,namespace,pod) group_left(node) topk(1,
              max(kube_pod_info{node!=""}) by(cluster,namespace,pod,node)
            ) by(cluster,namespace,pod)
