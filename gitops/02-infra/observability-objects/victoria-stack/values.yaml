argocdReleaseOverride: vm-local
grafana:
  enabled: false
defaultDashboards:
  enabled: false
alertmanager:
  enabled: true
defaultRules:
  enabled: true
  rules:
    # minikube's kubelet only exposes per-container cAdvisor metrics
    # (metrics_path=/metrics/cadvisor) at the node level, without
    # container/image labels - the upstream rules never match any
    # series here. cpu/memory-working-set are replaced with corrected
    # versions in ./rules/ that read metrics_path=/metrics/resource
    # instead, which does carry per-container labels on this cluster.
    # cache/rss/swap have no equivalent on /metrics/resource, so they
    # stay disabled rather than silently evaluating to nothing.
    node_namespace_pod_container:container_cpu_usage_seconds_total:sum_irate:
      enabled: false
    node_namespace_pod_container:container_memory_working_set_bytes:
      enabled: false
    node_namespace_pod_container:container_memory_cache:
      enabled: false
    node_namespace_pod_container:container_memory_rss:
      enabled: false
    node_namespace_pod_container:container_memory_swap:
      enabled: false
kubelet:
  vmScrapes:
    resources:
      spec:
        # Standard dashboards (dotdc "Pods" view) query
        # container_cpu_usage_seconds_total{image!=""} directly rather than
        # through a recording rule. This cluster's /metrics/resource endpoint
        # (unlike /metrics/cadvisor, see defaultRules.rules above) carries
        # namespace/pod/container labels but never an image label, so those
        # panels would stay empty. Stamping a constant image label onto every
        # sample from this target satisfies the image!="" filter without
        # fabricating a value that would be mistaken for a real image ref.
        relabelConfigs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - sourceLabels: [__metrics_path__]
            targetLabel: metrics_path
          - targetLabel: job
            replacement: kubelet
          - targetLabel: image
            replacement: "unavailable (metrics_path=/metrics/resource has no image label on this cluster)"
vmsingle:
  enabled: true
  spec:
    # 30d so a conventional 30-day error budget window is actually
    # computable. At the current ingest this is ~2.2GB against the 10Gi claim
    # below, so no volume change is needed here - on a real cluster the
    # retention window and the disk bill move together, which is the tradeoff
    # this number represents.
    retentionPeriod: "30d"
    replicaCount: 1
    storage:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
vmagent:
  enabled: true
  spec:
    selectAllByDefault: true
    scrapeInterval: 20s
    externalLabels:
      cluster: local-v1
    # Основной контейнер vmagent получает resources по чартовому
    # useDefaultResources - под лимитом он уже. config-reloader рядом с ним
    # его не наследует (это отдельный sidecar-контейнер того же CR) и был
    # без limits вовсе - live kubectl top: 10m/25Mi. То же верно для
    # vmalert/vmalertmanager ниже: у всех трёх один и тот же sidecar.
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        cpu: 100m
        memory: 64Mi
# vmalert/vmalertmanager не были объявлены в этом файле вовсе - чарт включает
# их по умолчанию (enabled: true), а их CR создаёт тот же config-reloader
# sidecar без limits, что и у vmagent выше.
vmalert:
  spec:
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        cpu: 100m
        memory: 64Mi
vmalertmanager:
  spec:
    configReloaderResources:
      requests:
        cpu: 10m
        memory: 25Mi
      limits:
        cpu: 100m
        memory: 64Mi
# Сам контроллер VictoriaMetrics Operator - без него никто не создаёт
# VMAgent/VMAlert/VMAlertmanager/VMSingle из CR выше. Live kubectl top:
# 15m/108Mi.
victoria-metrics-operator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
kube-state-metrics:
  enabled: true
  # Live kubectl top: 12m/145Mi.
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  rbac:
    extraRules:
      - apiGroups: ["autoscaling.k8s.io"]
        resources: ["verticalpodautoscalers"]
        verbs: ["list", "watch"]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: autoscaling.k8s.io
              version: v1
              kind: VerticalPodAutoscaler
            labelsFromPath:
              verticalpodautoscaler: [metadata, name]
              namespace: [metadata, namespace]
              target_kind: [spec, targetRef, kind]
              target_name: [spec, targetRef, name]
            metrics:
              - name: vpa_status_recommendation_cpu_cores
                help: "Goldilocks/VPA recommended CPU request, in cores"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, cpu]
              - name: vpa_status_recommendation_memory_bytes
                help: "Goldilocks/VPA recommended memory request, in bytes"
                each:
                  type: Gauge
                  gauge:
                    path: [status, recommendation, containerRecommendations]
                    labelsFromPath:
                      container: [containerName]
                    valueFrom: [target, memory]
prometheus-node-exporter:
  enabled: true
  # Live kubectl top: 10m/25Mi.
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
