apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    # Before Cilium re-syncs with gatewayAPI enabled: the operator decides
    # whether to create the GatewayClass by looking for these CRDs, so a
    # Cilium that syncs first simply finds nothing and creates none.
    argocd.argoproj.io/sync-wave: "-3"
spec:
  project: finops-platform
  source:
    repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
    targetRevision: HEAD
    path: gitops/02-infra/gateway-api/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      # prune off, like the CNI. Removing CRDs deletes every Gateway and
      # HTTPRoute in the cluster with them, and on a transient diff that would
      # take the ingress path down with no way to notice before it happened.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      # The CRDs exceed the annotation size limit that client-side apply uses
      # to store last-applied-configuration.
      - Replace=false
