# Cilium as CNI, with Hubble for flow visibility.
#
# Bootstrap note: this one component cannot be installed by Argo CD from
# nothing, because Argo CD's own pods need a CNI before they can start. It is
# brought up once by hand (see docs/local-setup.md) and then adopted here, so
# that from the second minute of the cluster's life its configuration is
# declarative and drift-corrected like everything else.
#
# Why it belongs in this repository at all, under ADR 0002: its cost is real,
# it scales per node rather than per pod, and Hubble is what makes
# service-to-service traffic visible - which in a cloud is a billed quantity
# that usually only shows up on the invoice.

cni:
  # Cilium declares itself the only CNI by default and removes other CNI
  # configurations from the node. Istio's ambient mode installs istio-cni as a
  # chained plugin to redirect pod traffic into ztunnel - with exclusive left
  # on, Cilium deletes that config and ambient silently captures nothing,
  # which looks like a broken mesh rather than a CNI ownership fight.
  exclusive: false

kubeProxyReplacement: true
k8sServiceHost: 192.168.49.2
k8sServicePort: 8443

operator:
  replicas: 1
  podLabels:
    app.kubernetes.io/name: cilium-operator
    app.kubernetes.io/component: platform
    finops.internal/product: platform
    finops.internal/team: platform-engineering
    finops.internal/environment: prod
    finops.internal/component: platform

# Without these the agent's own consumption lands in untracked overhead, and
# the cost-allocation model in the design has nothing to join on.
podLabels:
  app.kubernetes.io/name: cilium
  app.kubernetes.io/component: platform
  finops.internal/product: platform
  finops.internal/team: platform-engineering
  finops.internal/environment: prod
  finops.internal/component: platform

hubble:
  enabled: true
  relay:
    enabled: true
    podLabels:
      app.kubernetes.io/name: hubble-relay
      app.kubernetes.io/component: platform
      finops.internal/product: platform
      finops.internal/team: platform-engineering
      finops.internal/environment: prod
      finops.internal/component: platform
  ui:
    enabled: true
    podLabels:
      app.kubernetes.io/name: hubble-ui
      app.kubernetes.io/component: platform
      finops.internal/product: platform
      finops.internal/team: platform-engineering
      finops.internal/environment: prod
      finops.internal/component: platform
  metrics:
    enableOpenMetrics: true
    # httpV2 and flow carry the per-service traffic volumes that the cost
    # model needs in order to charge network overhead to whoever generates it.
    enabled:
      - dns
      - drop
      - tcp
      - flow
      - port-distribution
      - httpV2
