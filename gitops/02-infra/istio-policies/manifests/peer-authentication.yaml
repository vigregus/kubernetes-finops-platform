# STRICT mTLS for prod.
#
# Enrolling a namespace in ambient only makes mTLS *available*: ztunnel will
# still accept a plaintext connection from anything without an identity, so
# before this, encryption was a property of some traffic rather than a
# guarantee. This is what turns it into one - every inbound connection to a
# prod workload must now present a SPIFFE identity or be refused.
#
# Deliberately not applied to ingress-nginx, even though that namespace is in
# the mesh. It is the edge: its inbound traffic arrives from outside the
# cluster and has no identity by definition, so STRICT there would reject the
# very requests the stand exists to serve. It is enrolled so that its traffic
# *onward* into prod is encrypted, which is the half that can be.
#
# Health probes are not affected: kubelet reaches the pod from the node
# without an identity, and ztunnel exempts that path. If that were wrong the
# symptom would be unmissable - every pod in prod would go NotReady at once -
# which is why this is applied to one namespace first rather than everywhere.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: prod-strict
  namespace: prod
  labels:
    finops.internal/product: platform
    finops.internal/team: platform-engineering
    finops.internal/environment: prod
    finops.internal/component: service-mesh
    finops.internal/cost-center: platform-infra
    finops.internal/owner: platform-team
spec:
  mtls:
    mode: STRICT
