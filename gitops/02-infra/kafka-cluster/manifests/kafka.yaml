# Кластер переименован из orders-kafka: заказов больше нет, демо checkout и
# analytics снято вместе с namespace dev/stage/prod. Хранилище ephemeral и
# потребителей у orders-* не осталось, так что переименование ничего не теряет,
# а имя перестаёт называть домен, которого нет.
#
# Кластер платформенный и остаётся здесь, во 02-infra. Топики принадлежат
# продукту и живут в gitops/04-messenger - это та же граница, что между
# оператором CNPG и Cluster мессенджера.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: kafka
  labels:
    strimzi.io/cluster: messenger-kafka
    finops.internal/product: platform
    finops.internal/team: platform-engineering
    finops.internal/environment: local
    finops.internal/component: platform
spec:
  # Локально одна нода совмещает роли контроллера и брокера. В архитектуре
  # прода контроллеры KRaft вынесены в отдельный кворум из трёх - отказ
  # брокера не должен быть одновременно отказом управляющего слоя.
  replicas: 1
  roles:
    - controller
    - broker
  # Постоянный том, а не ephemeral. Оператор предупреждал прямым текстом:
  # «A Kafka cluster with a single broker node and ephemeral storage will
  # lose topic messages after any restart or rolling update», и для G2 это
  # не предупреждение, а отмена проверки: выход гейта — «убить relay после
  # публикации в Kafka, получатель видит сообщение ровно один раз», а на
  # эфемерном диске любой перезапуск брокера стирает топик вместе
  # с доказательством.
  #
  # Том переживает пересоздание пода и удаление кластера: deleteClaim:
  # false — та же политика, что у `make local-down`, где данные остаются,
  # пока не попросили WIPE=1.
  storage:
    type: persistent-claim
    # Столько же, сколько у Tempo: недельное хранение на игрушечном
    # объёме, плюс запас на __consumer_offsets и журналы транзакций.
    size: 5Gi
    deleteClaim: false
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: messenger-kafka
  namespace: kafka
  labels:
    finops.internal/product: platform
    finops.internal/team: platform-engineering
    finops.internal/environment: local
    finops.internal/component: platform
spec:
  kafka:
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    # ACL включаются до появления первого потребителя. Иначе разделённые
    # топики защищают только от случайного чтения: скомпрометированный
    # consumer-unread всё равно смог бы подключиться к топику с текстом.
    authorization:
      type: simple
    config:
      # RF=1 и minISR=1 - следствие одного брокера, а не выбор. Профиль
      # прода (RF=3, minISR=2, acks=all, unclean.leader.election=false)
      # проверяется на stage, где зон три.
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      # Идемпотентный продюсер обязателен на всех окружениях: без него
      # повтор отправки из outbox создаёт дубль в топике, и дедупликация
      # по event_id остаётся единственной защитой.
      enable.idempotence: "true"
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Без этого экспортёра нигде нет метрики отставания consumer group, то есть
  # застрявший потребитель невидим, пока кто-то ниже по течению не заметит
  # устаревшие данные. Для мессенджера это отставание доставки сообщений.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
