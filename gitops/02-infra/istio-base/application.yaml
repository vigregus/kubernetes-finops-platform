apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: finops-platform
  sources:
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: base
      targetRevision: 1.30.4
      helm:
        releaseName: istio-base
        valueFiles:
          - $values/gitops/02-infra/istio-base/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  # istiod's own validationController rewrites failurePolicy on this webhook
  # once it is serving, flipping Ignore to Fail so that a broken control plane
  # cannot let invalid config through. The chart ships the pre-flip value, so
  # Argo would report this application OutOfSync forever and selfHeal would
  # fight istiod over the field on every reconcile.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: istiod-default-validator
      jsonPointers:
        - /webhooks/0/failurePolicy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
