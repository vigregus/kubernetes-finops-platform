# Найдено аудитом всех ArgoCD Applications (см. docs/messenger/06-observability.md).
# goldilocks-dashboard — веб-панель Goldilocks с рекомендациями по
# resource requests/limits (на базе VPA), задеплоена (Application
# goldilocks), но без внешнего роута.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: goldilocks
  namespace: finops-system
  labels:
    app.kubernetes.io/name: goldilocks-dashboard
spec:
  hostnames:
    - goldilocks.finops.local
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: edge
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: goldilocks-dashboard
          port: 80
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
