# Найдено аудитом всех ArgoCD Applications (см. docs/messenger/06-observability.md).
# vmsingle — сам движок VictoriaMetrics, отдаёт встроенный vmui
# (/vmui/) для прямых PromQL-запросов, минуя Grafana. vmagent/vmalert/
# alertmanager из того же стека уже получили роуты в этом каталоге —
# для консистентности добавлен и он, хотя большинство запросов и так
# идут через Grafana datasource.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vmsingle
  namespace: observability
  labels:
    app.kubernetes.io/name: vmsingle
spec:
  hostnames:
    - vmsingle.finops.local
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: edge
      sectionName: https
  rules:
    - backendRefs:
        - group: ""
          kind: Service
          name: vmsingle-vm-local-victoria-metrics-k8s-stack
          port: 8428
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
