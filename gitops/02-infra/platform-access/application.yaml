# Внутренние платформенные UI (ArgoCD, Argo Workflows, VictoriaMetrics
# vmagent/vmalert/vmalertmanager) через тот же Cilium Gateway, что уже
# обслуживает app/idp/rt/mail/s3/grafana.finops.local — не отдельные
# port-forward на каждый сервис. Ни один из этих сервисов не управляется
# этим репозиторием целиком (ArgoCD и Argo Workflows ставятся напрямую из
# upstream install.yaml через `make bootstrap`, VictoriaMetrics stack —
# отдельным Application victoria-stack) — здесь только маршрутизация
# доступа, а не владение самими сервисами.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-access
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: finops-platform
  source:
    repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
    targetRevision: HEAD
    path: gitops/02-infra/platform-access/manifests
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
