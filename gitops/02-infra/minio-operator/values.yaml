operator:
  # Чарт по умолчанию ставит две реплики - разумно там, где зон несколько.
  # На одном узле вторая реплика не добавляет доступности, а лидер всё равно
  # один: это просто второй под в очереди за теми же ядрами.
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
