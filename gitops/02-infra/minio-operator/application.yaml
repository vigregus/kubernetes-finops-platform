apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: finops-platform
  sources:
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      ref: values
    # Чарт называется operator, а не minio-operator: под старым именем в том же
    # репозитории лежит заброшенная ветка 4.3.7 от 2022 года. Индекс отдаёт оба,
    # и выбрать не тот легко.
    - repoURL: https://operator.min.io/
      chart: operator
      targetRevision: 7.1.1
      helm:
        releaseName: minio-operator
        valueFiles:
          - $values/gitops/02-infra/minio-operator/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: minio-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
