# Коллектор OTel: приёмник трасс от сервисов.
#
# Только трассы. Метрики снимаются опросом (vmagent ходит за /metrics),
# журналы пишутся в stdout и собираются promtail — это записано в контракте
# телеметрии как модель, а не как предпочтение: и то, и другое переживает
# недоступность хранилища, а отправка через коллектор — нет.
#
# Зачем коллектор вообще, если Tempo и так принимает OTLP: пачки, выборка
# и единственное место, где меняется получатель. Без него адрес Tempo
# оказывается зашит в каждый сервис.

mode: deployment
# Одна реплика - не экономия, а условие работы хвостовой выборки: её
# состояние живёт в памяти процесса и привязано к `trace_id`, поэтому
# спаны одной трассы обязаны попасть в один и тот же под. При двух
# репликах отправки разойдутся по подам, решение будет принято
# по половине спанов, и произойдёт это молча: трасса просто окажется
# короче, чем была.
#
# Число реплик увеличивается только вместе с `loadbalancing` exporter
# с `routing_key: traceID` - он и есть то, что закрепляет трассу
# за подом. Просто поднять replicaCount нельзя.
replicaCount: 1

image:
  repository: otel/opentelemetry-collector-contrib

# Чарт по умолчанию включает приёмники, которых здесь не будет: jaeger,
# zipkin, prometheus. Лишний открытый порт — это поверхность, которую
# никто не собирался обслуживать.
presets:
  logsCollection:
    enabled: false
  kubernetesAttributes:
    enabled: true

config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

  processors:
    # Порядок блоков здесь совпадает с порядком в конвейере: он не
    # произволен, и это объяснено ниже.
    #
    # Предел, после которого коллектор начинает отбрасывать, а не расти.
    # Коллектор, съевший память узла, уносит с собой не только трассы.
    memory_limiter:
      check_interval: 1s
      limit_percentage: 80
      spike_limit_percentage: 25

    # Хвостовая выборка: решение принимается по завершённой трассе, а не
    # по её началу. Головная выборка физически не может знать про ошибку,
    # которой в момент решения ещё не случилось, поэтому сервис отправляет
    # всё, а что хранить - решается здесь.
    #
    # Цена названа в документации процессора прямо: он держит спаны всех
    # незавершённых трасс, поэтому расход памяти пропорционален приёму,
    # а не доле хранения - снижение процента в `sample-rest` памяти
    # не уменьшает. Отсюда короткое `decision_wait`: удержать решение
    # дольше незачем ровно потому, что корни трасс короткие - пачка
    # отправителя, пачка потребителя, запрос API. Оставайся граница outbox
    # внутри одной трассы, ожидание пришлось бы растягивать на время
    # лежания записи в очереди, то есть на минуты.
    tail_sampling:
      decision_wait: 5s
      # Потолок числа трасс в памяти. Целевые 2 500 отправок в секунду
      # при пяти секундах ожидания - около 13 000 трасс; потолок вчетверо
      # выше, чтобы всплеск не вытеснял из буфера ещё не решённые трассы
      # (вытесненные считает otelcol_processor_tail_sampling_sampling_trace_dropped_too_early).
      num_traces: 50000
      # Подсказка для размеров структур, а не предел: по ней процессор
      # заранее разводит буферы.
      expected_new_traces_per_sec: 2500
      policies:
        # Ошибки хранятся целиком - и это главный довод за хвостовую
        # выборку вообще. Признак общий у всех трёх трасс одного сообщения,
        # поэтому удержатся либо все три, либо ни одной, и ссылка между
        # ними не останется висячей.
        - name: errors
          type: status_code
          status_code:
            status_codes: [ERROR]

        # Медленные - и порог разный для разных стадий конвейера.
        # Разделение обязательно: `kafka.consume` включает ожидание пустого
        # опроса (около секунды), поэтому длинная трасса у потребителя -
        # это норма, а не признак беды. Общий порог удерживал бы почти
        # каждую пачку, выборка выродилась бы в "хранить всё", а память
        # уходила бы на пустые опросы - то есть ровно туда, куда смотреть
        # никто не пойдёт.
        #
        # Признак и порог соединяются через `and`: политика задержки
        # не умеет смотреть на атрибуты, а политика атрибута - на время.
        - name: slow-api
          type: and
          and:
            and_sub_policy:
              - name: stage-api
                type: string_attribute
                string_attribute:
                  key: messaging.pipeline.stage
                  values: [api]
              - name: api-over-500ms
                type: latency
                latency:
                  threshold_ms: 500
        - name: slow-pipeline
          type: and
          and:
            and_sub_policy:
              - name: stage-pipeline
                type: string_attribute
                string_attribute:
                  key: messaging.pipeline.stage
                  values: [relay, realtime]
              - name: pipeline-over-3s
                type: latency
                latency:
                  threshold_ms: 3000

        # Остальное - единицы процентов, тот же порядок величины, что
        # стоял в головной выборке сервиса. Дисциплина объёма осталась,
        # но переехала сюда: сервис теперь не решает, что хранить.
        - name: sample-rest
          type: probabilistic
          probabilistic:
            sampling_percentage: 5

    # Пачками, а не по одной: экспорт на каждый span сделал бы
    # наблюдаемость заметной статьёй в задержке запроса.
    # После выборки: отправлять то, что решено не хранить, незачем.
    batch:
      timeout: 5s
      send_batch_size: 512

  exporters:
    otlp/tempo:
      endpoint: tempo-local.observability.svc.cluster.local:4317
      tls:
        insecure: true
      # Очередь ограничена и не хранится на диске: потеря телеметрии
      # допустима, потеря сообщения из-за телеметрии — нет. Переполнение
      # очереди обязано означать выброшенные трассы, а не задержку
      # отправителя.
      sending_queue:
        enabled: true
        queue_size: 1000

  service:
    telemetry:
      metrics:
        # Свои метрики коллектор отдаёт на опрос — той же моделью,
        # что и все остальные.
        readers:
          - pull:
              exporter:
                prometheus:
                  host: 0.0.0.0
                  port: 8888
    pipelines:
      traces:
        receivers: [otlp]
        # Порядок обязателен и вот почему: `memory_limiter` первым - иначе
        # предел памяти не остановит рост буфера нерешённых трасс, ведь
        # самая тяжёлая часть конвейера стоит после него; `tail_sampling`
        # до `batch` - иначе решение принималось бы уже по отправленному.
        processors: [memory_limiter, tail_sampling, batch]
        exporters: [otlp/tempo]
      # Конвейеры метрик и журналов отключены: они идут другими путями.
      metrics: null
      logs: null

ports:
  jaeger-compact: {enabled: false}
  jaeger-thrift: {enabled: false}
  jaeger-grpc: {enabled: false}
  zipkin: {enabled: false}
  # Выключен по умолчанию в чарте - комментарий там же говорит прямо:
  # "you need to enable the port in order to use ... PodMonitor". Без
  # этого порт 8888 (service.telemetry.metrics выше) нигде не объявлен
  # в спеке пода, а VMPodScrape (manifests/pod-scrape.yaml, portNumber:
  # 8888) фильтрует цели ровно по объявленным containerPort - Kubernetes
  # SD с role: pod перечисляет по одной цели на каждый ЗАЯВЛЕННЫЙ порт,
  # и без объявления строки для 8888 просто не существует: не "цель
  # найдена и отброшена", а "перечислять было нечего". Отсюда
  # `up{job="observability/otel-collector"}` молчал, даже когда
  # VMPodScrape существовал и был Synced.
  metrics:
    enabled: true
    containerPort: 8888
    servicePort: 8888
    protocol: TCP

podLabels:
  finops.internal/product: platform
  finops.internal/team: platform-engineering
  finops.internal/environment: local
  finops.internal/component: observability

resources:
  requests:
    cpu: 25m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
