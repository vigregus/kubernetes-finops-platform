apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana-local
  namespace: observability
  labels:
    dashboards: "grafana-local"
spec:
  config:
    security:
      admin_user: admin
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  datasource:
    name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://vmsingle-vm-local.observability.svc.cluster.local:8429
    isDefault: true
    jsonData:
      timeInterval: "20s"
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victorialogs
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  datasource:
    name: VictoriaLogs
    type: victoriametrics-logs-datasource
    access: proxy
    url: http://vl-local-victoria-logs-single-server.observability.svc.cluster.local:9428
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  datasource:
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo-local.observability.svc.cluster.local:3100
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: application-overview
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "title": "Application Overview",
      "description": "Placeholder dashboard for workload traffic, latency, errors, and resource usage.",
      "tags": ["application-overview", "finops"],
      "schemaVersion": 39,
      "version": 1
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: kubernetes-capacity
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "title": "Kubernetes Capacity",
      "description": "Placeholder dashboard for requests, limits, utilization, and saturation.",
      "tags": ["kubernetes-capacity", "finops"],
      "schemaVersion": 39,
      "version": 1
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: finops
  namespace: observability
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana-local"
  json: |
    {
      "title": "FinOps",
      "description": "Placeholder dashboard for modeled cost, allocation, and cost per 1M requests.",
      "tags": ["finops", "unit-economics"],
      "schemaVersion": 39,
      "version": 1
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-release-notes
  namespace: observability
data:
  component: victoriametrics
  purpose: metrics-storage-and-query
  next_step: managed through external Helm chart plus Git-hosted values
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victorialogs-release-notes
  namespace: observability
data:
  component: victorialogs
  purpose: logs-ingestion-and-search
  next_step: managed through external Helm chart plus Git-hosted values
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-release-notes
  namespace: observability
data:
  component: tempo
  purpose: traces-storage-and-query
  next_step: managed through external Helm chart plus Git-hosted values
