# Namespaces the platform owns.
#
# dev, stage and prod are gone: they existed for the checkout/analytics demo,
# which has been retired. The messenger brings its own namespaces, and putting
# them back now would create empty shells that Kyverno still checks and
# dashboards still query.
#
# observability keeps the ambient label; prod's enrolment went with prod.
namespaces:
- name: argocd
- name: observability
  labels:
    istio.io/dataplane-mode: ambient
- name: finops-system
- name: governance-system
