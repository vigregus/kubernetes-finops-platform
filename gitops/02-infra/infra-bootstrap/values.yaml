# Namespaces the platform owns.
#
# dev, stage and prod are gone: they existed for the checkout/analytics demo,
# which has been retired. The messenger brings its own namespaces, and putting
# them back now would create empty shells that Kyverno still checks and
# dashboards still query.
#
# observability keeps the ambient label; prod's enrolment went with prod.
#
# messenger is the first of those namespaces. It is deliberately NOT enrolled
# in ambient yet: mesh identity belongs to the security gate, and enrolling it
# now would put an mTLS tunnel between every operator and its own data plane
# before a single message has been stored - a failure mode that would surface
# as "Postgres unreachable" during the first bring-up.
namespaces:
- name: argocd
- name: observability
  labels:
    istio.io/dataplane-mode: ambient
- name: finops-system
- name: governance-system
- name: messenger
