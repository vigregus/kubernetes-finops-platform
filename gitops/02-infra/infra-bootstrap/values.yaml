namespaces:
  - name: argocd
  - name: observability
  - name: finops-system
  - name: governance-system
  - name: dev
    labels:
      finops.internal/environment: dev
      goldilocks.fairwinds.com/enabled: "true"
  - name: stage
    labels:
      finops.internal/environment: stage
      goldilocks.fairwinds.com/enabled: "true"
  - name: prod
    labels:
      finops.internal/environment: prod
      goldilocks.fairwinds.com/enabled: "true"
      # Enrolled in the ambient mesh. prod only, deliberately: stage and dev
      # stay outside it so the mesh's own cost and latency can be read as the
      # difference between two otherwise identical environments rather than
      # taken on faith from a vendor benchmark.
      #
      # ambient captures traffic at the node (ztunnel) rather than by injecting
      # a sidecar, so no pod here gains a container and no workload's own
      # resource accounting changes - which is what keeps the per-workload cost
      # numbers comparable across the enrollment boundary. The mesh's cost
      # lands in istio-system instead, where ADR 0002 says platform overhead
      # belongs.
      # Temporarily off while the no-mesh baseline is measured. Toggling this
      # label is the whole enrolment mechanism in ambient - no pod spec
      # changes, no sidecar to add or remove - which is exactly what makes the
      # mesh's cost measurable as an A/B rather than argued from a datasheet.
      # istio.io/dataplane-mode: ambient
