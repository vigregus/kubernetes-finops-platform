# The opencost-ui sidecar container (port 9090) is OpenCost's own
# standard cost-allocation dashboard - it was running but unreachable,
# with nothing pointing traffic at it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opencost
  namespace: finops-system
spec:
  ingressClassName: nginx
  rules:
    - host: opencost.finops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opencost
                port:
                  number: 9090
