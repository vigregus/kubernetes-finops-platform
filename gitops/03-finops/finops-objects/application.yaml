apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: finops-objects
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: finops-platform
  sources:
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      path: charts/finops-objects
      helm:
        valueFiles:
          - $values/gitops/03-finops/finops-objects/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: finops-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
