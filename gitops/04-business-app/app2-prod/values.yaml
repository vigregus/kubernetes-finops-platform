name: analytics
namespace: prod
labels:
  app.kubernetes.io/name: analytics
  app.kubernetes.io/component: api
  finops.internal/product: insights
  finops.internal/team: data-platform
  finops.internal/environment: prod
  finops.internal/component: application
replicas: 2
image: analytics:local
containerPort: 8080
servicePort: 80
env:
  OTEL_SERVICE_NAME: analytics
  LATENCY_MS_MEAN: "90"
  LATENCY_MS_JITTER: "30"
  ERROR_RATE: "0.01"
  WORK_ITERATIONS: "300000"
  BATCH_ROWS: "5000"
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 700m
    memory: 768Mi
