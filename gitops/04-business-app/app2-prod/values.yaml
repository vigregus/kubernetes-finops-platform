name: analytics
namespace: prod
labels:
  app.kubernetes.io/name: analytics
  app.kubernetes.io/component: api
  finops.internal/product: insights
  finops.internal/team: data-platform
  finops.internal/environment: prod
  finops.internal/component: application
replicas: 2
image: analytics:local
containerPort: 8080
servicePort: 80
terminationGracePeriodSeconds: 45
preStopSleepSeconds: 5
env:
  OTEL_SERVICE_NAME: analytics
  ERROR_RATE: "0.01"

  WEB_CONCURRENCY: "1"
  GUNICORN_WORKER_CLASS: gevent
  WORKER_CONNECTIONS: "1000"
  MAX_IN_FLIGHT: "32"

  # Heavier CPU per request than checkout, on purpose: the point of the stand
  # is that the tiers do not look alike to a rightsizing decision. IO figures
  # carry over from the previous LATENCY_MS_MEAN/JITTER so the existing k6
  # threshold (p95 < 750ms) still means the same thing.
  PROFILE_ANALYTICS_CPU_MS: "7"
  PROFILE_ANALYTICS_IO_MS: "90"
  PROFILE_ANALYTICS_IO_JITTER_MS: "30"
  PROFILE_ANALYTICS_MEM_MB: "2"

  DB_POOL_MIN: "1"
  DB_POOL_MAX: "8"
  DB_STATEMENT_TIMEOUT_MS: "5000"
  REDIS_POOL_MAX: "32"
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 700m
    memory: 768Mi
ingressHost: analytics.finops.local

# The consumer, scaled independently of the API. Its CPU profile is the
# heaviest in the stand and it tolerates latency, which is what makes it the
# natural subject for queue-lag scaling and, later, for spot capacity.
worker:
  replicas: 1
  metricsPort: 9090
  terminationGracePeriodSeconds: 60
  env:
    PROFILE_BATCH_CPU_MS: "25"
    PROFILE_BATCH_MEM_MB: "8"
    KAFKA_CONSUME_BATCH: "100"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

postgres:
  clusterName: analytics-events-db
  instances: 1
  storageSize: 5Gi
  database: analytics
  owner: analytics
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
kafka:
  bootstrapServers: orders-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: orders-prod
  consumerGroup: analytics-prod
