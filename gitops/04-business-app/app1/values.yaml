name: checkout
namespace: prod
labels:
  app.kubernetes.io/name: checkout
  app.kubernetes.io/component: api
  finops.internal/product: commerce
  finops.internal/team: payments
  finops.internal/environment: prod
  finops.internal/component: application
replicas: 2
image: checkout:local
containerPort: 8080
servicePort: 80
# Must leave room for preStop plus gunicorn's graceful_timeout.
terminationGracePeriodSeconds: 45
preStopSleepSeconds: 5
env:
  LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: checkout
  ERROR_RATE: "0.02"

  # Serving runtime. One process plus gevent keeps the ordinary Prometheus
  # registry, which is what allows exemplars (a p99 point linking to its
  # trace). Raising WEB_CONCURRENCY switches to multiprocess metrics and
  # drops exemplars - see apps/common/gunicorn_conf.py. Both are legitimate
  # configurations to compare; the default keeps the traces.
  WEB_CONCURRENCY: "1"
  GUNICORN_WORKER_CLASS: gevent
  WORKER_CONNECTIONS: "1000"

  # Concurrency cap past which requests are rejected outright. This is the
  # knob that gives the pod a measurable saturation point instead of an
  # unbounded queue; the stress load profile is what calibrates it.
  MAX_IN_FLIGHT: "48"

  # Per-request resource shape, in milliseconds. Replaces WORK_ITERATIONS,
  # which burned a fixed iteration count and therefore cost different CPU on
  # different nodes. 3ms is roughly what the previous 150000 iterations cost
  # on this cluster, so behaviour carries over; the IO figures match the
  # previous LATENCY_MS_MEAN/JITTER so existing k6 thresholds still apply.
  PROFILE_CHECKOUT_CPU_MS: "3"
  PROFILE_CHECKOUT_IO_MS: "40"
  PROFILE_CHECKOUT_IO_JITTER_MS: "15"
  PROFILE_LOOKUP_CPU_MS: "1"
  PROFILE_LOOKUP_IO_MS: "5"
  PROFILE_LOOKUP_IO_JITTER_MS: "2"

  # Connection pools. The effective ceiling is pods x WEB_CONCURRENCY x
  # DB_POOL_MAX, which is why this stays small until PgBouncer is in front.
  DB_POOL_MIN: "1"
  DB_POOL_MAX: "16"
  DB_STATEMENT_TIMEOUT_MS: "5000"
  DB_ACQUIRE_TIMEOUT_MS: "250"
  REDIS_POOL_MAX: "32"

  # Response cache. Hit ratio is the lever that decides how much database the
  # read path actually needs, so these are experiment knobs, not constants.
  CACHE_TTL_S: "60"
  CACHE_NEGATIVE_TTL_S: "10"
  CACHE_JITTER_RATIO: "0.2"
  # Warm before readiness: a cold pod sends its first traffic to Postgres, so
  # scaling out would briefly raise database load instead of relieving it.
  # Set false to measure exactly that.
  CACHE_WARM_ON_START: "true"
  CACHE_WARM_KEYS: "500"

  KAFKA_LINGER_MS: "20"
  KAFKA_COMPRESSION: lz4
resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
ingressHost: checkout.finops.local
postgres:
  clusterName: checkout-db
  instances: 1
  storageSize: 1Gi
  database: checkout
  owner: checkout
  # PgBouncer in transaction mode. default_pool_size is the number of
  # server-side connections it multiplexes every client onto, which is
  # what decouples the connection count from the replica count.
  pooler:
    instances: 1
    defaultPoolSize: "25"
    maxClientConn: "500"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
redis:
  image: redis:7-alpine
  # Deliberately smaller than the load generator's KEY_SPACE so the cache
  # evicts and hit ratio is something a strategy can move.
  maxmemory: 64mb
  maxmemoryPolicy: allkeys-lru
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
kafka:
  bootstrapServers: orders-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: orders-prod
