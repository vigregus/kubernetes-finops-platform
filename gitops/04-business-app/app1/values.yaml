name: checkout
namespace: prod
labels:
  app.kubernetes.io/name: checkout
  app.kubernetes.io/component: api
  finops.internal/product: commerce
  finops.internal/team: payments
  finops.internal/environment: prod
  finops.internal/component: application
replicas: 2
image: checkout:local
containerPort: 8080
servicePort: 80
env:
  OTEL_SERVICE_NAME: checkout
  LATENCY_MS_MEAN: "40"
  LATENCY_MS_JITTER: "15"
  ERROR_RATE: "0.02"
  WORK_ITERATIONS: "150000"
resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
ingressHost: checkout.finops.local
postgres:
  clusterName: checkout-db
  instances: 1
  storageSize: 1Gi
  database: checkout
  owner: checkout
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
kafka:
  bootstrapServers: orders-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: orders-prod
