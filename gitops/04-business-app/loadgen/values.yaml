name: loadgen
namespace: loadgen
labels:
  app.kubernetes.io/name: loadgen
  app.kubernetes.io/component: loadgen
  finops.internal/product: platform
  finops.internal/team: platform-engineering
  finops.internal/environment: prod
  finops.internal/component: platform
image: grafana/k6:0.54.0

# Defaults for a run created from the CronJob template. The experiment runner
# overrides these per variant; changing them here changes what an unqualified
# `kubectl create job --from=cronjob/loadgen` does.
profile: baseline
rpsTarget: "50"
duration: 5m

# How many distinct orders the run circulates through, and how hard access
# concentrates on the hot end. Together these decide whether caching is
# measurable at all: a tiny key space gives ~100% hit ratio by construction,
# a uniform draw over a large one gives ~0%. Both are equally uninformative.
keySpace: "50000"
accessSkew: "3"

# Through the Cilium gateway, which is now the only entry point -
# ingress-nginx was retired after the two were measured side by side on this
# same profile: same throughput, 13% lower p95 and roughly half the CPU, while
# additionally terminating TLS that nginx was not doing.
#
# https, and the URL keeps the real hostname rather than an address, because
# the gateway selects its TLS filter chain by SNI - and SNI comes from the URL,
# not from a Host header. `resolve` then maps that name onto the node, the
# equivalent of curl --resolve.
target: https://shop.finops.local
host: shop.finops.local
analyticsHost: analytics.finops.local
# The node's address. Hardcoded because this cluster has no load balancer and
# no DNS for *.finops.local; on EKS this becomes the load balancer's name and
# `resolve` goes away entirely.
resolve: "shop.finops.local:192.168.49.2,analytics.finops.local:192.168.49.2"

remoteWriteUrl: http://vmsingle-vm-local-victoria-metrics-k8s-stack.observability.svc.cluster.local:8428/api/v1/write
trendStats: "p(50),p(95),p(99),avg,max"

ttlSecondsAfterFinished: 3600

# Pinned to its own node once the cluster is multi-node (phase 3). Empty here
# because the current cluster has a single node and a nodeSelector that
# matches nothing would leave every run Pending.
nodeSelector: {}

resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 1Gi
