name: checkout
namespace: stage
labels:
  app.kubernetes.io/name: checkout
  app.kubernetes.io/component: api
  finops.internal/product: commerce
  finops.internal/team: payments
  finops.internal/environment: stage
  finops.internal/component: application
replicas: 1
image: checkout:local
containerPort: 8080
servicePort: 80
env:
  OTEL_SERVICE_NAME: checkout
  LATENCY_MS_MEAN: "40"
  LATENCY_MS_JITTER: "15"
  ERROR_RATE: "0.02"
  WORK_ITERATIONS: "150000"
resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
ingressHost: checkout-stage.finops.local
