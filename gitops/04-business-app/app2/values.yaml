name: analytics
namespace: stage
labels:
  app.kubernetes.io/name: analytics
  app.kubernetes.io/component: api
  finops.internal/product: insights
  finops.internal/team: data-platform
  finops.internal/environment: stage
  finops.internal/component: application
replicas: 1
image: analytics:local
containerPort: 8080
servicePort: 80
terminationGracePeriodSeconds: 45
preStopSleepSeconds: 5
env:
  LOG_LEVEL: INFO
  OTEL_SERVICE_NAME: analytics
  ERROR_RATE: "0.01"

  WEB_CONCURRENCY: "1"
  GUNICORN_WORKER_CLASS: gevent
  WORKER_CONNECTIONS: "1000"
  MAX_IN_FLIGHT: "48"

  PROFILE_ANALYTICS_CPU_MS: "7"
  PROFILE_ANALYTICS_IO_MS: "90"
  PROFILE_ANALYTICS_IO_JITTER_MS: "30"
  PROFILE_ANALYTICS_MEM_MB: "2"

  DB_POOL_MIN: "1"
  DB_POOL_MAX: "16"
  DB_STATEMENT_TIMEOUT_MS: "5000"
  DB_ACQUIRE_TIMEOUT_MS: "250"
  REDIS_POOL_MAX: "32"
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 700m
    memory: 768Mi
ingressHost: analytics-stage.finops.local

worker:
  replicas: 1
  metricsPort: 9090
  terminationGracePeriodSeconds: 60
  env:
    PROFILE_BATCH_CPU_MS: "25"
    PROFILE_BATCH_MEM_MB: "8"
    KAFKA_CONSUME_BATCH: "100"
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 768Mi

postgres:
  clusterName: analytics-events-db-stage
  instances: 1
  storageSize: 1Gi
  database: analytics
  owner: analytics
  # PgBouncer in transaction mode. default_pool_size is the number of
  # server-side connections it multiplexes every client onto, which is
  # what decouples the connection count from the replica count.
  pooler:
    instances: 1
    defaultPoolSize: \"10\"
    maxClientConn: \"500\"
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 300m
        memory: 128Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
kafka:
  bootstrapServers: orders-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: orders-stage
  consumerGroup: analytics-stage
