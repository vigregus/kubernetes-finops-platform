name: analytics
namespace: stage
labels:
  app.kubernetes.io/name: analytics
  app.kubernetes.io/component: api
  finops.internal/product: insights
  finops.internal/team: data-platform
  finops.internal/environment: stage
  finops.internal/component: application
replicas: 1
image: analytics:local
containerPort: 8080
servicePort: 80
env:
  OTEL_SERVICE_NAME: analytics
  LATENCY_MS_MEAN: "90"
  LATENCY_MS_JITTER: "30"
  ERROR_RATE: "0.01"
  WORK_ITERATIONS: "300000"
  BATCH_ROWS: "5000"
resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 700m
    memory: 768Mi
ingressHost: analytics-stage.finops.local
redis:
  image: redis:7-alpine
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
kafka:
  bootstrapServers: orders-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
  topic: orders-stage
  consumerGroup: analytics-stage
