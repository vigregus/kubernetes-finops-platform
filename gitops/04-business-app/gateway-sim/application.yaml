apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-sim
  namespace: argocd
  annotations:
    # Before the workloads that call it, so a fresh cluster does not spend its
    # first minutes with checkout's breaker open against a gateway that simply
    # has not been deployed yet.
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: finops-platform
  sources:
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/vigregus/kubernetes-finops-platform.git
      targetRevision: HEAD
      path: charts/gateway-sim
      helm:
        valueFiles:
          - $values/gitops/04-business-app/gateway-sim/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: external
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace is created here rather than in infra-bootstrap's list,
      # and carries no istio.io/dataplane-mode label - staying outside the mesh
      # is the point, not an oversight.
      - CreateNamespace=true
      - ServerSideApply=true
