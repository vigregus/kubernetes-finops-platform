{{- if .Values.redis }}
{{- $redisLabels := merge (dict "app.kubernetes.io/name" (printf "%s-redis" .Values.name) "app.kubernetes.io/component" "cache") .Values.labels }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $redisLabels | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-redis
  template:
    metadata:
      labels:
{{ toYaml $redisLabels | indent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
        # redis:7-alpine exposes no metrics of its own (no INFO-over-HTTP,
        # no built-in exporter) - without this sidecar, cache hit/miss
        # rate, memory usage, and connected clients never reach
        # VictoriaMetrics despite Redis being a cost-attributed component.
        - name: redis-exporter
          image: oliver006/redis_exporter:v1.66.0-alpine
          ports:
            - name: metrics
              containerPort: 9121
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $redisLabels | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: metrics
      port: 9121
      targetPort: 9121
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ .Values.name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $redisLabels | indent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-redis
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
{{- end }}
