{{- if .Values.worker }}
{{- $workerLabels := merge (dict "app.kubernetes.io/name" (printf "%s-worker" .Values.name) "app.kubernetes.io/component" "worker" "finops.internal/component" "worker") .Values.labels }}
# The Kafka consumer as its own Deployment, from the same image as the API.
#
# It used to be a daemon thread inside the Flask process, which meant the
# queue could never be scaled independently of HTTP traffic and the cost of
# asynchronous processing could not be separated from the cost of serving
# requests - usually the larger of the two. Under gunicorn that arrangement
# also breaks outright: the module is imported per worker, so WEB_CONCURRENCY=4
# would quietly run four consumers in one pod.
#
# app.kubernetes.io/name deliberately differs from the API's, so these pods do
# not match the API Service's selector - the same label-collision trap that
# previously pulled the Postgres container into checkout's VPA recommendation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-worker
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $workerLabels | indent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-worker
  template:
    metadata:
      labels:
{{ toYaml $workerLabels | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.name }}
      # Long enough to finish the in-flight batch and commit its offsets;
      # anything killed before that commit is redelivered to another replica
      # on the next rebalance.
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds | default 60 }}
      containers:
        - name: worker
          image: {{ .Values.image }}
          imagePullPolicy: Never
          command: ["python", "worker.py"]
          ports:
            - name: metrics
              containerPort: {{ .Values.worker.metricsPort | default 9090 }}
          env:
            - name: WORKER_METRICS_PORT
              value: {{ .Values.worker.metricsPort | default 9090 | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.Version | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ index .Values.labels "finops.internal/environment" | quote }}
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- range $key, $value := .Values.worker.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- if .Values.redis }}
            - name: REDIS_URL
              value: "redis://{{ .Values.name }}-redis.{{ .Values.namespace }}.svc.cluster.local:6379/0"
{{- end }}
{{- if .Values.postgres }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName }}-app
                  key: uri
            - name: DATABASE_NAME
              value: {{ .Values.postgres.database | quote }}
{{- end }}
{{- if .Values.kafka }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.kafka.consumerGroup | quote }}
{{- end }}
          # TCP rather than HTTP: this process serves no application traffic,
          # only its own metrics endpoint, so "is the port open" is the whole
          # of what a probe can honestly assert here.
          livenessProbe:
            tcpSocket:
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.worker.resources | indent 12 }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ .Values.name }}-worker
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $workerLabels | indent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-worker
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
{{- end }}
