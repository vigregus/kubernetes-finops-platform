{{- if .Values.postgres }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgres.clusterName }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  # Without this, CNPG's operator creates the instance pods (and their
  # PVCs) with only its own cnpg.io/* labels - none of the
  # finops.internal/* ownership labels on this Cluster resource
  # propagate down automatically. That silently drops Postgres - the
  # single most expensive component here - out of every cost-by-product/
  # cost-by-team query, which all join on kube_pod_labels.
  #
  # Only the finops.internal/* keys, deliberately not the full
  # .Values.labels map: that also carries app.kubernetes.io/name
  # (="checkout") and app.kubernetes.io/component (="api"), which are
  # the checkout Deployment's *own* pod selector - copying them onto
  # the Postgres pod made it match that selector too, so its own VPA
  # recommendation silently mixed in the Postgres container's usage
  # alongside the real checkout replicas (verified via
  # kube_customresource_vpa_status_recommendation_cpu_cores - the
  # goldilocks-checkout VPA had a "postgres" container entry that had
  # no business being there).
  inheritedMetadata:
    labels:
      finops.internal/product: {{ index .Values.labels "finops.internal/product" | quote }}
      finops.internal/team: {{ index .Values.labels "finops.internal/team" | quote }}
      finops.internal/environment: {{ index .Values.labels "finops.internal/environment" | quote }}
      finops.internal/component: {{ index .Values.labels "finops.internal/component" | quote }}
  instances: {{ .Values.postgres.instances }}
  storage:
    size: {{ .Values.postgres.storageSize }}
  postgresql:
    # pg_stat_statements: per-statement counts and cumulative execution time,
    # which is what turns "slow queries" from a log line you happen to notice
    # into an aggregate you can rank. The log already flags anything over
    # 200ms, but a query taking 20ms ten thousand times a minute costs more
    # than one taking 300ms twice and never appears there at all.
    #
    # Changing this restarts the instances - it is a preload library, so it
    # cannot be enabled on a running postmaster.
    shared_preload_libraries:
      - pg_stat_statements
    parameters:
      # Off by default in Postgres - without this, no query ever shows up
      # in the pod's own logs regardless of how well the app's own
      # tracing/logging is wired up. 'mod' covers the INSERT the app does
      # per order (see apps/checkout/app.py persist_order), not read-only
      # traffic, to keep the volume reasonable.
      log_statement: "mod"
      # A real prod Postgres doesn't log_statement=all/mod at scale - it
      # flags *slow* queries instead. Both coexist here: log_statement
      # keeps every write greppable by trace_id for this demo's traffic
      # volume, log_min_duration_statement is the actual prod pattern
      # (statements over 200ms get a duration-tagged log line regardless
      # of log_statement, so a real slow query wouldn't just blend in).
      log_min_duration_statement: "200"
  # Without this reference the ConfigMap above is inert - CNPG only runs
  # custom queries a Cluster explicitly points at. The default built-in
  # queries stay on; this adds to them rather than replacing them.
  monitoring:
    customQueriesConfigMap:
      - name: {{ .Values.postgres.clusterName }}-monitoring-queries
        key: queries
  bootstrap:
    initdb:
      database: {{ .Values.postgres.database }}
      owner: {{ .Values.postgres.owner }}
  resources:
{{ toYaml .Values.postgres.resources | indent 4 }}
---
# CNPG runs a metrics exporter on every instance pod by default (port
# "metrics", the cnpg-default-monitoring queries) - it just isn't scraped
# by anything without this, so connections/cache-hit-ratio/replication
# lag/transaction rate never reach VictoriaMetrics.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ .Values.postgres.clusterName }}-metrics
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: {{ .Values.postgres.clusterName }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      # CNPG's own "cluster" label (the CNPG Cluster name, e.g.
      # "checkout-db") collides with the "cluster" external_label every
      # scrape target gets stamped with (our whole environment
      # identifier, "local-v1" - see gitops/03-finops/opencost/manifests/
      # service-scrape.yaml for the same collision with OpenCost's own
      # metrics). Without honorLabels, VictoriaMetrics keeps the
      # external one and renames CNPG's to exported_cluster - the
      # official CloudNativePG dashboard's $cluster variable then finds
      # only "local-v1", not a real CNPG cluster name, and every panel
      # depending on it (which is most of them) comes back empty.
      honorLabels: true
      # The upstream CNPG community dashboards select on cnpg_cluster,
      # cnpg_pooler and instance_role. None of those exist on a scrape by
      # default: Kubernetes pod labels do not become metric labels unless
      # relabeled, and the sanitised forms (cnpg_io_cluster) are not what the
      # dashboards ask for. Without this every panel renders "No data" while
      # the series sit in the database - the same mismatch that left the
      # Cilium dashboard blank.
      #
      # cnpg_pooler is what separates the PgBouncer pods from the Postgres
      # instances, which this one selector deliberately scrapes together:
      # pooler pods carry cnpg.io/cluster too.
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cnpg_cluster
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_poolerName]
          targetLabel: cnpg_pooler
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
          targetLabel: instance_role
---
# pg_stat_statements exposed as metrics.
#
# The name of the top-level key below becomes the metric prefix: CNPG exports
# these as cnpg_query_stats_*, which is exactly what the CNPG / PgBouncer
# dashboard's Query Latency and Query Throughput panels query.
#
# Statements are bucketed read/write/other rather than exported one series per
# statement. pg_stat_statements tracks thousands of normalised queries, and one
# metric series per query would be a cardinality bomb in a database meant to
# stay cheap - three series answers "are reads or writes getting slower", which
# is the question the panels ask.
#
# Mean latency is deliberately not computed here. Both columns are COUNTERs and
# the dashboard divides rate(total_exec_time_ms) by rate(calls), so the average
# is over the chart's window rather than over all time since the last reset -
# an all-time average moves so slowly it hides the incident you are looking for.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.postgres.clusterName }}-monitoring-queries
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
    # CNPG watches for this label and reloads the instances when the ConfigMap
    # changes, so editing the query does not need a restart.
    cnpg.io/reload: "true"
data:
  queries: |
    query_stats:
      query: |
        SELECT
          CASE
            WHEN query ILIKE 'select%' THEN 'read'
            WHEN query ~* '^(insert|update|delete)' THEN 'write'
            ELSE 'other'
          END AS op,
          sum(calls)::bigint AS calls,
          sum(total_exec_time) AS total_exec_time_ms,
          sum(rows)::bigint AS rows
        FROM pg_stat_statements
        WHERE dbid = (SELECT oid FROM pg_database WHERE datname = current_database())
        GROUP BY 1
      metrics:
        - op:
            usage: "LABEL"
            description: "Statement class derived from the normalised query text"
        - calls:
            usage: "COUNTER"
            description: "Cumulative statement executions"
        - total_exec_time_ms:
            usage: "COUNTER"
            description: "Cumulative statement execution time in milliseconds"
        - rows:
            usage: "COUNTER"
            description: "Cumulative rows processed by the statements"
      target_databases:
        - {{ .Values.postgres.database }}
---
# The extension itself, declared rather than created by hand.
#
# pg_stat_statements collects instance-wide, but its reading view only exists
# in databases where the extension was created - and the exporter queries it
# from the application database (target_databases above). Without this the
# custom query errors on every scrape and the metric is simply absent, which
# looks identical to "no traffic".
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: {{ .Values.postgres.clusterName }}-{{ .Values.postgres.database }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  cluster:
    name: {{ .Values.postgres.clusterName }}
  name: {{ .Values.postgres.database }}
  owner: {{ .Values.postgres.owner }}
  ensure: present
  # retain, not delete: this object exists to add an extension to a database
  # that initdb already created and the application depends on. Reclaiming it
  # would drop the data along with the extension.
  databaseReclaimPolicy: retain
  extensions:
    - name: pg_stat_statements
      ensure: present
{{- end }}
{{- if and .Values.postgres .Values.postgres.pooler }}
---
# PgBouncer in front of the cluster.
#
# Without it the connection ceiling is pods x WEB_CONCURRENCY x DB_POOL_MAX,
# which scales with the deployment rather than with the database: at eight
# checkout pods that is 128 connections against a default max_connections of
# 100, so scaling out would fail on connections long before CPU - and every
# autoscaling experiment would be measuring the wrong limit.
#
# transaction mode, not session: a connection is returned to the pool at the
# end of each transaction, which is what lets a small server-side pool serve
# a much larger set of clients. It is only safe because nothing here relies on
# session state - psycopg2 does not use server-side prepared statements by
# default, and statement_timeout is applied with SET LOCAL inside the
# transaction rather than as a startup parameter PgBouncer would reject
# (see apps/common/db.py).
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: {{ .Values.postgres.clusterName }}-pooler
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  cluster:
    name: {{ .Values.postgres.clusterName }}
  instances: {{ .Values.postgres.pooler.instances | default 1 }}
  type: rw
  template:
    metadata:
      labels:
{{ toYaml .Values.labels | indent 8 }}
    spec:
      containers:
        - name: pgbouncer
          resources:
{{ toYaml .Values.postgres.pooler.resources | indent 12 }}
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: {{ .Values.postgres.pooler.maxClientConn | default "500" | quote }}
      default_pool_size: {{ .Values.postgres.pooler.defaultPoolSize | default "25" | quote }}
{{- end }}
