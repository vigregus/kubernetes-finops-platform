apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
{{ toYaml .Values.labels | indent 8 }}
    spec:
      serviceAccountName: {{ .Values.name }}
      # Must exceed preStop + gunicorn's graceful_timeout, or Kubernetes
      # SIGKILLs mid-drain and every scale-in event shows up as 5xx - which
      # would penalise whichever autoscaling strategy scales most often.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      volumes:
        # Only used when WEB_CONCURRENCY > 1, where prometheus_client
        # aggregates per-worker mmap files (see apps/common/gunicorn_conf.py).
        - name: prometheus-multiproc
          emptyDir: {}
      containers:
        - name: {{ .Values.name }}
          image: {{ .Values.image }}
          # Local v1 has no registry for this image - it only ever exists
          # in minikube's local image cache (scripts/build-workload-images.sh).
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            - name: PORT
              value: {{ .Values.containerPort | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.Version | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ index .Values.labels "finops.internal/environment" | quote }}
            # Downward API, not a hardcoded value - lets a trace/log line
            # be pinned to the exact pod that produced it (see
            # apps/checkout/app.py resource attributes) without a
            # separate trip to kubectl.
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: K8S_NAMESPACE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
{{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
{{- end }}
{{- if .Values.postgres }}
{{- if .Values.postgres.pooler }}
            # Through PgBouncer, not the cluster's own rw service. The
            # credentials still come from the cluster secret - only the host
            # changes - which is why the DSN is assembled from parts rather
            # than taken from the secret's prebuilt `uri`.
            - name: DB_HOST
              value: {{ .Values.postgres.clusterName }}-pooler.{{ .Values.namespace }}.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName }}-app
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName }}-app
                  key: password
            - name: DB_NAME
              value: {{ .Values.postgres.database | quote }}
{{- else }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.clusterName }}-app
                  key: uri
{{- end }}
            - name: DATABASE_NAME
              value: {{ .Values.postgres.database | quote }}
{{- end }}
{{- if .Values.redis }}
            - name: REDIS_URL
              value: "redis://{{ .Values.name }}-redis.{{ .Values.namespace }}.svc.cluster.local:6379/0"
{{- end }}
{{- if .Values.kafka }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
{{- end }}
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus
          lifecycle:
            preStop:
              exec:
                # Endpoints are removed asynchronously, so without this pause
                # the process stops accepting while kube-proxy is still
                # sending it traffic - the requests that lose that race are
                # indistinguishable from real errors in an experiment result.
                command: ["/bin/sh", "-c", "sleep {{ .Values.preStopSleepSeconds | default 5 }}"]
          # Readiness reports dependencies; liveness deliberately does not.
          # A liveness probe that fails when Postgres is slow restarts every
          # healthy pod exactly when the database can least afford it.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: {{ .Values.servicePort }}
      targetPort: {{ .Values.containerPort }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
