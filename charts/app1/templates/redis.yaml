{{- if .Values.redis }}
{{- $redisLabels := merge (dict "app.kubernetes.io/name" (printf "%s-redis" .Values.name) "app.kubernetes.io/component" "cache") .Values.labels }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $redisLabels | indent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}-redis
  template:
    metadata:
      labels:
{{ toYaml $redisLabels | indent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
{{ toYaml .Values.redis.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}-redis
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml $redisLabels | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
{{- end }}
