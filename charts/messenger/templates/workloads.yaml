{{/*
Один шаблон на все нагрузки. API, веб и потребители отличаются значениями,
а не кодом чарта: копия шаблона на каждый сервис расходится через полгода,
и тогда «почему у consumer нет preStop» становится вопросом археологии.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $ctx := dict "root" $ "svc" $svc "name" $name "component" $svc.component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      {{- include "messenger.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "messenger.labels" $ctx | nindent 8 }}
      annotations:
        # Пересоздать поды при изменении конфигурации: ConfigMap
        # монтируется, но процесс её не перечитывает.
        checksum/config: {{ toYaml $.Values.config | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      priorityClassName: {{ $svc.priorityClass }}
      # Столько же, сколько preStop плюс запас на долгие запросы.
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "messenger.image" $ctx }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          {{- with $svc.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- if and (not $svc.http) $svc.metricsPort }}
          ports:
            - name: metrics
              containerPort: {{ $svc.metricsPort }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- if $svc.http }}
          ports:
            - name: http
              containerPort: {{ $svc.http.port }}
          {{- end }}
          env:
            - name: SERVICE_NAME
              value: {{ $name }}
            - name: ENVIRONMENT
              value: {{ $.Values.ownership.environment }}
            # Версия обязана быть в каждой строке журнала: без неё
            # «когда это началось» не связать с выкаткой.
            - name: SERVICE_VERSION
              value: {{ include "messenger.version" $ctx | quote }}
            {{- with $svc.metricsPort }}
            - name: METRICS_PORT
              value: {{ . | quote }}
            {{- end }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.telemetry.otlpEndpoint | quote }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ $.Values.telemetry.traceSampleRatio | quote }}
            # Пароль приходит из секрета, который создал оператор CNPG.
            # В values его нет и не будет.
            - name: DATABASE_HOST
              value: {{ $.Values.dependencies.postgres.host | quote }}
            - name: DATABASE_NAME
              value: {{ $.Values.dependencies.postgres.database | quote }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dependencies.postgres.secret }}
                  key: username
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dependencies.postgres.secret }}
                  key: password
            - name: REDIS_URL
              value: {{ $.Values.dependencies.redis.url | quote }}
            - name: KAFKA_BOOTSTRAP
              value: {{ $.Values.dependencies.kafka.bootstrap | quote }}
            {{- with $svc.kafkaUser }}
            # Учётные данные Kafka выдаются только тем нагрузкам, которым
            # они нужны. Брокер требует SCRAM, у каждой роли свой
            # пользователь и свои ACL: продюсер outbox не должен уметь
            # читать, а потребитель непрочитанных - видеть содержимое.
            # Секрет переносит джоб messenger-kafka-credentials: оператор
            # Strimzi кладёт его в namespace kafka, а нагрузки живут здесь.
            - name: KAFKA_USERNAME
              value: {{ . | quote }}
            - name: KAFKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: password
            {{- end }}
            # Издатель и адрес ключей — разные адреса, и это не небрежность.
            # В токене стоит внешний издатель: Keycloak строит метаданные
            # от своего hostname, каким бы путём ни пришёл запрос. Ходить
            # за ключами по этому же адресу изнутри нечем — имя не
            # резолвится, а сертификат от локального центра.
            - name: OIDC_ISSUER
              value: {{ $.Values.dependencies.keycloak.issuer | quote }}
            - name: OIDC_JWKS_URL
              value: {{ $.Values.dependencies.keycloak.jwksUrl | quote }}
            # Кто здесь ресурсный сервер. Без сверки с `aud` токен любого
            # другого клиента того же реалма открывает наше API.
            - name: OIDC_AUDIENCE
              value: {{ $.Values.dependencies.keycloak.audience | quote }}
            # Обмен кода на токены делает сервер, а не браузер: только так
            # токен обновления попадает в cookie HttpOnly (ADR 0005).
            # Клиент тот же, что у страницы, — публичный, с PKCE.
            - name: OIDC_TOKEN_URL
              value: {{ $.Values.dependencies.keycloak.tokenUrl | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $.Values.dependencies.keycloak.clientId | quote }}
            # Источник, которому позволено обращаться к точкам обмена,
            # и путь cookie. Cookie браузер прикладывает сам, поэтому
            # источник проверяется — WEBSEC-003.
            - name: WEB_ORIGIN
              value: {{ $.Values.web.origin | quote }}
            - name: AUTH_COOKIE_PATH
              value: {{ $.Values.web.authCookiePath | quote }}
            # Административное API реалма: повторная отправка письма
            # о подтверждении, дальше — выход везде и отключение учётной
            # записи. Секрет выдал сам Keycloak, сверка реалма положила
            # его в Secret; в git его нет ни в каком виде.
            - name: KEYCLOAK_URL
              value: {{ $.Values.dependencies.keycloak.baseUrl | quote }}
            - name: KEYCLOAK_REALM
              value: {{ $.Values.dependencies.keycloak.realm | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dependencies.keycloak.clientSecret }}
                  key: client-secret
            # БД 2 — роль security. Счётчики лимитов не должны вымываться
            # вместе с кешем приложения, поэтому адрес отдельный.
            - name: REDIS_SECURITY_URL
              value: {{ $.Values.dependencies.redis.securityUrl | quote }}
            - name: CENTRIFUGO_API_URL
              value: {{ $.Values.dependencies.centrifugo.apiUrl | quote }}
            - name: CENTRIFUGO_HTTP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dependencies.centrifugo.secret }}
                  key: CENTRIFUGO_HTTP_API_KEY
            # Ключ подписи connect-токена. Тот же, что держит Centrifugo
            # в token_hmac_secret_key, — иначе выданный токен не примется.
            - name: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.dependencies.centrifugo.secret }}
                  key: CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY
            {{- with $svc.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if $svc.http }}
          # Готовность и живость - разные вопросы. Живость: процесс не
          # завис. Готовность: зависимости отвечают. Один и тот же
          # обработчик на оба означает, что под с мёртвым пулом соединений
          # продолжает принимать трафик, пока kubelet его не убьёт.
          readinessProbe:
            httpGet:
              path: {{ $svc.readinessProbe.httpGet.path }}
              port: {{ $svc.readinessProbe.httpGet.port }}
            periodSeconds: {{ $svc.readinessProbe.periodSeconds }}
            failureThreshold: {{ $svc.readinessProbe.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ $svc.livenessProbe.httpGet.path }}
              port: {{ $svc.livenessProbe.httpGet.port }}
            periodSeconds: {{ $svc.livenessProbe.periodSeconds }}
            failureThreshold: {{ $svc.livenessProbe.failureThreshold }}
          startupProbe:
            httpGet:
              path: {{ $svc.startupProbe.httpGet.path }}
              port: {{ $svc.startupProbe.httpGet.port }}
            periodSeconds: {{ $svc.startupProbe.periodSeconds }}
            # 90 секунд на старт. Отдельная проба нужна, чтобы медленный
            # запуск не выглядел как зависание и не перезапускался по кругу.
            failureThreshold: {{ $svc.startupProbe.failureThreshold }}
          lifecycle:
            preStop:
              exec:
                # Пауза, чтобы под успел исчезнуть из endpoints до того,
                # как процесс начнёт останавливаться. Без неё каждое
                # уменьшение числа реплик даёт всплеск ошибок, и он
                # загрязняет измерение любого автомасштабирования.
                command: ["sleep", "{{ $svc.preStopSeconds }}"]
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          volumeMounts:
            # Корень только для чтения, поэтому временные файлы - явный том.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
# Токен не монтируется: сервисы мессенджера не обращаются к API Kubernetes.
# Смонтированный токен - это учётные данные в поде, которые никому не нужны.
automountServiceAccountToken: false
{{- if $svc.http }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "messenger.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Метрика, которую никто не снимает, не метрика. Первая редакция оставила
# /metrics на поде и посчитала возможность наблюдаемой - в VictoriaMetrics
# при этом не было ни одного ряда, и это выяснилось только запросом
# к хранилищу, а не чтением YAML.
#
# Отдельного порта метрик нет намеренно: он потребовал бы второго слушателя
# и своей политики доступа, а /metrics и так закрыт снаружи - наружу ходит
# только маршрут шлюза.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "messenger.selectorLabels" $ctx | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      # Реже, чем проба готовности: снимок состояния, а не событие.
      # Отказ виден по dependency_up на следующем снятии, а мгновенную
      # реакцию даёт проба, а не метрика.
      interval: 30s
      # Метка `service` принадлежит метрике, а не открытию цели.
      # Без этого vmagent добавляет свою `service` из имени службы
      # Kubernetes, а родную переименовывает в `exported_service` -
      # и `sum by (service)` начинает считать не то, что написано
      # в контракте телеметрии. Проверено запросом к VictoriaMetrics:
      # до этой строки в ответе были обе метки сразу.
      honorLabels: true
{{- end }}
{{- if and (not $svc.http) $svc.metricsPort }}
---
# У фонового процесса нет службы, поэтому и снимать метрики надо с пода.
# Без этого блока отправитель остаётся невидимым: пробы готовности у него
# нет по замыслу, и единственный признак жизни - возраст самой старой
# неотправленной записи, то есть метрика.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "messenger.selectorLabels" $ctx | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      honorLabels: true
{{- end }}
{{- if gt (int $svc.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
spec:
  # minAvailable, а не maxUnavailable: при одной реплике maxUnavailable: 1
  # разрешает снять единственный под, то есть бюджет ничего не защищает.
  minAvailable: {{ $svc.minAvailable }}
  selector:
    matchLabels:
      {{- include "messenger.selectorLabels" $ctx | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
