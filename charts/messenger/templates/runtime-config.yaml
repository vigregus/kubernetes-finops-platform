{{/*
Конфигурация окружения для нагрузок, которые её требуют.

Она вынесена из образа не ради удобства, а потому что `DEP-001` обещает
другое: «собрано один раз, продвинуто без пересборки». У статики веба имя
источника идентичности зависит от стенда — в stage один IdP, в проде другой, —
и пока оно вшито в бандл, второго стенда без второй сборки не бывает. Значит
имя приходит рядом с образом: ConfigMap, том, файл.

Тот же приём понадобится любой следующей нагрузке с окруженческим значением,
поэтому шаблон общий, а не написан под `web`.

Два ключа в `runtimeConfig` разделены по принадлежности, и это не формальность:
`mountPath` — вопрос Kubernetes, `values` — то, что уезжает в браузер. Слей их
в одну карту, и `mountPath` однажды оказался бы внутри конфигурации приложения,
где ему нечего делать.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.runtimeConfig }}
{{- $ctx := dict "root" $ "svc" $svc "name" $name "component" $svc.component }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-runtime
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "messenger.labels" $ctx | nindent 4 }}
# Ключ — базовое имя пути монтирования, и он не повторяет его, а выведен из
# него: `data` и `subPath` тома обязаны совпасть, а два независимо записанных
# значения однажды разойдутся, и под получит пустой файл с чужим именем —
# при зелёном рендере и живых пробах.
data:
  {{ base $svc.runtimeConfig.mountPath }}: |
    {{- /* Значение подставляется через `toJson`, а не склейкой строки: адрес
           приходит из values, и кавычка или перевод строки в нём сломали бы
           файл, который браузер разберёт как скрипт. */}}
    window.__MESSENGER_RUNTIME_CONFIG__ = Object.freeze({{ $svc.runtimeConfig.values | toJson }});
{{- end }}
{{- end }}
