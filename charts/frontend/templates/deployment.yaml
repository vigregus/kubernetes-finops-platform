apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.name }}-html
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
data:
  index.html: |
{{ .Files.Get "files/index.html" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.name }}
  template:
    metadata:
      labels:
{{ toYaml .Values.labels | indent 8 }}
    spec:
      containers:
        # Stock nginx:alpine serving a ConfigMap-mounted static file - no
        # Dockerfile/build step needed for a single HTML page with no
        # dependencies (see charts/frontend/files/index.html for why it
        # deliberately has none).
        - name: {{ .Values.name }}
          image: {{ .Values.image }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: html
          configMap:
            name: {{ .Values.name }}-html
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
{{ toYaml .Values.labels | indent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ .Values.name }}
  ports:
    - name: http
      port: 80
      targetPort: 80
